<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGNREGA / PMAY-G — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette lifted verbatim from ai_query.html so the two pages read as one
     product: light purple surfaces, dark-purple navigation, Inter throughout. */
  :root {
    --p-50:#FBF7FF; --p-100:#F4EBFC; --p-200:#E5D2F6; --p-300:#CFA8EE;
    --p-400:#B27FE0; --p-500:#9558CF; --p-600:#7C3FBF; --p-700:#5C2D91;
    --p-800:#3E1F66; --p-900:#241038;
    --ink:#1A1626; --ink-1:#1A1626; --ink-2:#534B68; --ink-3:#857E96; --line:#E8DEF4;
    --bg:#FAF9FC; --surface:#FFFFFF; --hover:#F4EBFC;
    --teal:#0F766E; --teal-bg:#D6F0EC;
    --amber:#9A6700; --amber-bg:#FBF0DE;
    --green:#15803D; --green-bg:#DCFCE7;
    --red:#B91C1C; --red-bg:#FEE2E2;
    /* aliases kept so existing markup classes need no renaming */
    --muted:var(--ink-3); --accent:var(--p-600);
    --ok:var(--green); --bad:var(--red); --warn:var(--amber);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink)}
  a{color:var(--p-600)}

  /* ---- Top bar: white surface with the product's brand mark ---- */
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;
    background:var(--surface);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;color:var(--ink-1)}
  header .who{margin-left:auto;color:var(--ink-3);font-size:13px}
  .brand-logo{width:30px;height:30px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,#C586D7 0%,#7C3FBF 100%);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff}

  /* ---- Controls ---- */
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-1);padding:7px 12px;border-radius:8px;transition:background .15s,border-color .15s}
  button:hover{background:var(--hover);border-color:var(--p-300)}
  button.primary{background:linear-gradient(135deg,var(--p-600),var(--p-700));
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 2px 8px rgba(124,63,191,0.28)}
  button.primary:hover{filter:brightness(1.06)}
  button.danger{border-color:#F3C8C8;color:var(--red);background:var(--surface)}
  button.danger:hover{background:var(--red-bg);border-color:var(--red)}
  input,select{font:inherit;background:var(--surface);border:1px solid var(--line);
    color:var(--ink-1);padding:8px 10px;border-radius:8px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--p-400);box-shadow:0 0 0 3px rgba(178,127,224,.18)}
  label{display:block;font-size:12px;color:var(--ink-3);margin:8px 0 3px;font-weight:500}

  /* ---- Shell: dark purple nav rail, matching the chat sidebar ---- */
  .wrap{display:flex;min-height:calc(100vh - 55px)}
  nav{width:186px;flex-shrink:0;padding:12px 8px;
    background:linear-gradient(180deg,var(--p-900) 0%,var(--p-800) 100%);
    border-right:1px solid var(--p-900)}
  nav a{display:block;padding:8px 12px;margin:1px 0;border-radius:6px;
    color:rgba(255,255,255,.82);text-decoration:none;font-size:13.5px;transition:background .15s}
  nav a:hover{background:rgba(255,255,255,.08);color:#fff}
  nav a.active{background:rgba(197,134,215,.22);color:#fff;font-weight:500}
  main{flex:1;padding:22px;overflow:auto;min-width:0}

  /* ---- Cards & tables ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(36,16,56,.05)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink-3);font-weight:600;position:sticky;top:0;background:var(--p-50);
    font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tbody tr:hover{background:var(--p-50)}

  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;
    border:1px solid var(--line);font-weight:500}
  .tag.ok{color:var(--green);border-color:#BBE8CB;background:var(--green-bg)}
  .tag.bad{color:var(--red);border-color:#F3C8C8;background:var(--red-bg)}
  .stat{font-size:26px;font-weight:700;color:var(--p-700)}
  .muted{color:var(--ink-3)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:820px){ .grid4{grid-template-columns:repeat(2,1fr)} }

  .login{max-width:360px;margin:9vh auto}
  .err{color:var(--red);font-size:13px;min-height:18px}
  .scroll{max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--p-50);
    border:1px solid var(--line);padding:11px;border-radius:8px;font-size:12px;color:var(--ink-2)}
  .hide{display:none}
</style>
</head>
<body>

<div id="loginView" class="hide">
  <div class="login card">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:16px">
      <div class="brand-logo">M</div>
      <div>
        <h1 style="margin:0;font-size:16px">Admin Console</h1>
        <div class="muted" style="font-size:12px">Megh One AI · MGNREGA / PMAY-G</div>
      </div>
    </div>
    <label>Username</label><input id="u" autocomplete="username">
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="primary" style="flex:1" onclick="doLogin()">Sign in</button>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="muted" style="font-size:12px;margin-top:10px">
      First run: <code>POST /api/auth/bootstrap</code> to create a super_admin, or use the
      seeded <code>superadmin / CHANGE_ME</code>.
    </div>
  </div>
</div>

<div id="appView" class="hide">
  <header>
    <div class="brand-logo">M</div>
    <h1>Megh One AI · Admin Console</h1>
    <span class="who" id="who"></span>
    <button class="primary" onclick="goToChat()" title="Return to the chat console">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"
           style="width:14px;height:14px;vertical-align:-2px;margin-right:6px">
        <path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path>
      </svg>Back to chat
    </button>
  </header>
  <div class="wrap">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
const API = ""; // same origin
// Single sign-on across the two pages: prefer a token stored by this console,
// otherwise adopt the chat console's (same origin, same issuer, same format).
// boot() still calls /api/auth/me, so an adopted token that is stale or lacks
// the admin role falls through to the sign-in form as before.
let TOKEN = localStorage.getItem("megh_admin_jwt")
         || localStorage.getItem("megh_jwt")
         || "";
let ME = null;
let SIGNED_IN = false;   // true once boot() has confirmed a session

async function api(path, opts={}){
  const r = await fetch(API+path, {
    ...opts,
    headers:{ "Content-Type":"application/json",
      ...(TOKEN?{"Authorization":"Bearer "+TOKEN}:{}), ...(opts.headers||{}) }
  });
  if(r.status===401){
    // While still probing stored sessions at startup, let the caller decide;
    // only tear down the UI for a 401 during normal use.
    if (SIGNED_IN) { TOKEN=""; localStorage.removeItem("megh_admin_jwt"); showLogin(); }
    throw new Error("unauthorized");
  }
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail || JSON.stringify(body));
  return body;
}
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTs = s => s ? new Date(s).toLocaleString() : "";
// "active" = signed in: the backend's is_logged_in is TRUE when the user's most
// recent auth event is a login (/api/auth/login) rather than a logout
// (/api/auth/logout). Deactivated accounts are always "no".
const isOnline = u => !!u.is_active && !!u.is_logged_in;

async function doLogin(){
  const el = document.getElementById("loginErr"); el.textContent="";
  try{
    const b = await api("/api/auth/login",{method:"POST",body:JSON.stringify({
      username:document.getElementById("u").value.trim(),
      password:document.getElementById("p").value })});
    TOKEN=b.access_token; localStorage.setItem("megh_admin_jwt",TOKEN);
    await boot();
  }catch(e){ el.textContent = e.message; }
}
function logout(){ api("/api/auth/logout",{method:"POST"}).catch(()=>{});
  SIGNED_IN=false; TOKEN=""; localStorage.removeItem("megh_admin_jwt"); showLogin(); }
/* The admin console and the chat console are separate pages with separate
   sessions; this just navigates, it does not sign anyone out. */
function goToChat(){ window.location.href = "/megh-chat"; }

function showLogin(){ document.getElementById("appView").classList.add("hide");
  document.getElementById("loginView").classList.remove("hide"); }

const TABS = [
  ["overview","Overview"], ["users","Users"], ["logins","Login events"],
  ["conversations","Conversations"], ["audit","Query audit"],
];
function renderNav(active){
  document.getElementById("nav").innerHTML = TABS
    .map(([k,label])=>`<a href="#${k}" class="${k===active?'active':''}">${label}</a>`).join("");
}

async function boot(){
  ME = await api("/api/auth/me");
  ME.is_super = ME.role === "super_admin";
  // Adopted from the chat console: give this console its own copy, so signing
  // out of one page does not take the other down with it.
  if (TOKEN && !localStorage.getItem("megh_admin_jwt")) {
    localStorage.setItem("megh_admin_jwt", TOKEN);
  }
  document.getElementById("who").textContent =
    `${ME.username} · ${ME.role} · ${ME.tenant? ME.tenant.name : "—"}`;
  const ADMIN_ROLES = ["admin", "tenant_admin", "super_admin"];
  if (!ADMIN_ROLES.includes(ME.role)) {
    // Valid session, but not an admin one: every panel would 403.
    alert("Your account does not have administrator access.");
    location.href = "/megh-chat";
    return;
  }
  SIGNED_IN = true;
  document.getElementById("loginView").classList.add("hide");
  document.getElementById("appView").classList.remove("hide");
  route();
}
window.addEventListener("hashchange", route);
function route(){
  const tab = (location.hash.replace("#","") || "overview");
  renderNav(tab);
  ({overview,users,logins,conversations,audit}[tab]||overview)();
}

// ── Overview ──────────────────────────────────────────────
async function overview(){
  const m = document.getElementById("main");
  m.innerHTML = `<div class="card"><div class="muted">loading…</div></div>`;
  const s = await api("/admin/stats");
  m.innerHTML = `
   <div class="grid4">
     <div class="card"><div class="muted">Queries</div><div class="stat">${s.queries??0}</div></div>
     <div class="card"><div class="muted">Denied</div><div class="stat" style="color:var(--bad)">${s.denied??0}</div></div>
     <div class="card"><div class="muted">Active officers</div><div class="stat">${s.active_users??0}</div></div>
     <div class="card"><div class="muted">Conversations</div><div class="stat">${s.conversations??0}</div></div>
   </div>
   <div class="card"><b>Recent logins</b><div id="ov_log" class="scroll" style="margin-top:8px"></div></div>`;
  const l = await api("/admin/logins?limit=15");
  document.getElementById("ov_log").innerHTML = logTable(l.events);
}

// ── Users ─────────────────────────────────────────────────
let ROLES = null;
async function users(){
  const m = document.getElementById("main");
  m.innerHTML = `<div class="card"><div class="muted">loading…</div></div>`;
  if(!ROLES) ROLES = (await api("/admin/roles")).roles;
  const {users} = await api("/admin/users");
  // Roles not offered when creating a user: tenant_admin/admin are unused
  // (super_admin covers admin duties), analyst/public are system fallbacks.
  const HIDDEN_ROLES = new Set(["tenant_admin", "admin", "analyst", "public"]);
  const roleOpts = Object.keys(ROLES).filter(r=>!HIDDEN_ROLES.has(r))
    .map(r=>`<option>${r}</option>`).join("");
  m.innerHTML = `
   <div class="card">
     <b>Create officer / admin</b>
     <div class="muted" style="font-size:12px;margin-top:4px">All fields marked <span style="color:var(--red)">*</span> are required.</div>
     <div class="row" style="margin-top:8px">
       <div><label>Username <span style="color:var(--red)">*</span></label><input id="nu_user"></div>
       <div><label>Name <span style="color:var(--red)">*</span></label><input id="nu_name"></div>
       <div><label>Password <span style="color:var(--red)">*</span></label><input id="nu_pass" type="text" placeholder="min 8 characters"></div>
       <div><label>Role <span style="color:var(--red)">*</span></label><select id="nu_role">${roleOpts}</select></div>
     </div>
     <div class="row">
       <div><label>Districts (comma, UPPERCASE) <span style="color:var(--red)">*</span></label><input id="nu_dist" placeholder="WEST GARO HILLS"></div>
       <div><label>Blocks (comma) <span style="color:var(--red)">*</span></label><input id="nu_block"></div>
       <div><label>Schemes (comma) <span style="color:var(--red)">*</span></label><input id="nu_sch" placeholder="MGNREGA, PMAY-G"></div>
       ${ME.is_super?`<div><label>Tenant id</label><input id="nu_tid" placeholder="(caller tenant)"></div>`:""}
     </div>
     <div style="margin-top:10px"><button class="primary" onclick="createUser()">Create</button>
       <span class="err" id="nu_err"></span></div>
   </div>
   <div class="card"><b>Users (${users.length})</b>
     <div class="scroll" style="margin-top:8px">
     <table><thead><tr><th>id</th><th>username</th><th>name</th><th>role</th>
       <th>districts</th><th>schemes</th><th>active</th><th>last login</th><th></th></tr></thead><tbody>
     ${users.map(u=>`<tr>
        <td>${u.user_id}</td><td>${esc(u.username)}</td><td>${esc(u.name)}</td>
        <td>${esc(u.role)}</td><td>${(u.districts||[]).join(", ")}</td>
        <td>${(u.schemes||[]).join(", ")}</td>
        <td><span class="tag ${isOnline(u)?'ok':'bad'}">${isOnline(u)?'yes':'no'}</span></td>
        <td class="muted">${fmtTs(u.last_login_at)}</td>
        <td><button class="danger" onclick="deactivate(${u.user_id})">Deactivate</button>
            <button onclick="resetPw(${u.user_id})">Reset pw</button>
            ${ME.is_super?`<button class="danger" onclick="deleteUser(${u.user_id},'${esc(u.username).replace(/'/g,"&#39;")}')">Delete</button>`:""}</td></tr>`).join("")}
     </tbody></table></div></div>`;
}
function csv(id){ const v=document.getElementById(id).value.trim();
  return v? v.split(",").map(s=>s.trim()).filter(Boolean) : null; }
async function createUser(){
  const err=document.getElementById("nu_err"); err.textContent="";
  const body={ username:document.getElementById("nu_user").value.trim(),
    name:document.getElementById("nu_name").value.trim(),
    password:document.getElementById("nu_pass").value,
    role:document.getElementById("nu_role").value,
    districts:csv("nu_dist"), blocks:csv("nu_block"), schemes:csv("nu_sch") };
  // Every field is mandatory. Tenant id is the one exception — it defaults to
  // the caller's tenant when left blank.
  const missing=[];
  if(!body.username) missing.push("Username");
  if(!body.name) missing.push("Name");
  if(!body.password) missing.push("Password");
  if(!body.role) missing.push("Role");
  if(!body.districts) missing.push("Districts");
  if(!body.blocks) missing.push("Blocks");
  if(!body.schemes) missing.push("Schemes");
  if(missing.length){ err.textContent="Required: "+missing.join(", "); return; }
  if(body.password.length<8){ err.textContent="Password must be at least 8 characters"; return; }
  const tid=document.getElementById("nu_tid"); if(tid && tid.value.trim()) body.tenant_id=+tid.value.trim();
  try{ await api("/admin/users",{method:"POST",body:JSON.stringify(body)}); users(); }
  catch(e){ err.textContent=e.message; }
}
async function deactivate(id){ if(!confirm("Deactivate user "+id+"?"))return;
  await api("/admin/users/"+id,{method:"DELETE"}); users(); }
async function deleteUser(id,uname){
  if(!confirm("Permanently DELETE user "+id+" ("+uname+")?\n\nThis removes the account for good. Their past login/audit history stays but shows no linked account. This cannot be undone."))return;
  if(prompt('Type the username to confirm deletion:')!==uname){ alert("Username did not match — nothing deleted."); return; }
  await api("/admin/users/"+id+"?hard=true",{method:"DELETE"}); users();
}
async function resetPw(id){ const p=prompt("New password (min 8 chars):"); if(!p)return;
  await api("/admin/users/"+id,{method:"PATCH",body:JSON.stringify({password:p})});
  alert("Password updated"); }

// ── Login events ──────────────────────────────────────────
function logTable(evs){
  return `<table><thead><tr><th>time</th><th>event</th><th>user</th><th>ok</th><th>ip</th><th>detail</th></tr></thead><tbody>
   ${evs.map(e=>`<tr><td class="muted">${fmtTs(e.created_at)}</td><td>${esc(e.event)}</td>
     <td>${esc(e.username)}</td><td><span class="tag ${e.ok?'ok':'bad'}">${e.ok?'ok':'fail'}</span></td>
     <td class="muted">${esc(e.ip)}</td><td class="muted">${esc(e.detail)}</td></tr>`).join("")}
   </tbody></table>`;
}
async function logins(){
  const m=document.getElementById("main");
  m.innerHTML=`<div class="card"><b>Login events</b><div id="lg" class="scroll" style="margin-top:8px">loading…</div></div>`;
  const l=await api("/admin/logins?limit=300");
  document.getElementById("lg").innerHTML=logTable(l.events);
}

// ── Conversations ─────────────────────────────────────────
async function conversations(){
  const m=document.getElementById("main");
  m.innerHTML=`<div class="card"><b>Officer conversations</b>
     <div class="scroll" style="margin-top:8px" id="cv">loading…</div></div>
     <div class="card hide" id="cvDetail"></div>`;
  const {conversations}=await api("/admin/conversations?limit=200");
  document.getElementById("cv").innerHTML=`<table><thead><tr><th>started</th><th>last</th>
    <th>officer</th><th>turns</th><th>title</th><th></th></tr></thead><tbody>
   ${conversations.map(c=>`<tr><td class="muted">${fmtTs(c.started_at)}</td>
     <td class="muted">${fmtTs(c.last_at)}</td><td>${esc(c.username||c.user_id)}</td>
     <td>${c.turn_count}</td><td>${esc(c.title)}</td>
     <td><button onclick="convDetail(${c.conv_id})">Open</button></td></tr>`).join("")}
   </tbody></table>`;
}
async function convDetail(id){
  const d=document.getElementById("cvDetail"); d.classList.remove("hide");
  d.innerHTML="loading…";
  const {turns}=await api("/admin/conversations/"+id);
  d.innerHTML=`<b>Conversation #${id}</b> — ${turns.length} turns
   ${turns.map(t=>`<div style="margin:10px 0;border-left:2px solid var(--line);padding-left:10px">
     <div><b>Q:</b> ${esc(t.question)} ${t.rewritten_question?`<span class="muted">→ ${esc(t.rewritten_question)}</span>`:""}</div>
     <div><b>A:</b> ${esc(t.answer)}</div>
     <div class="muted">${esc(t.route)} · ${t.allowed?"allowed":"<span class='tag bad'>denied: "+esc(t.denied_by)+"</span>"} ·
        ${t.row_count??"–"} rows · ${Math.round(t.latency_ms||0)} ms</div>
     ${t.sql?`<pre>${esc(t.sql)}</pre>`:""}</div>`).join("")}`;
}

// ── Audit ─────────────────────────────────────────────────
async function audit(){
  const m=document.getElementById("main");
  m.innerHTML=`<div class="card">
    <b>Query audit</b>
    <label style="display:inline-block;margin-left:10px"><input type="checkbox" id="denChk" style="width:auto" onchange="audit()"> denied only</label>
    <div id="ad" class="scroll" style="margin-top:8px">loading…</div></div>`;
  const den = document.getElementById("denChk") && document.getElementById("denChk").checked;
  const {records}=await api("/admin/audit?limit=400"+(den?"&denied_only=true":""));
  document.getElementById("ad").innerHTML=`<table><thead><tr><th>time</th><th>officer</th>
     <th>question</th><th>route</th><th>grain</th><th>schemes</th><th>rows</th><th>ms</th><th>result</th></tr></thead><tbody>
   ${records.map(r=>`<tr><td class="muted">${fmtTs(r.created_at)}</td><td>${esc(r.username)}</td>
     <td>${esc(r.question)}</td><td>${esc(r.route)}</td><td>${esc(r.granularity)}</td>
     <td>${(r.schemes||[]).join(", ")}</td><td>${r.row_count??""}</td><td>${Math.round(r.latency_ms||0)}</td>
     <td>${r.allowed?"<span class='tag ok'>ok</span>":"<span class='tag bad'>denied: "+esc(r.denied_by)+"</span>"}</td></tr>`).join("")}
   </tbody></table>`;
}

// ── init ─────────────────────────────────────────────────
(async () => {
  // Try every session we might already have, newest-preferred: this console's
  // own token, then the chat console's. A stale one is discarded rather than
  // blocking the next candidate — otherwise an expired admin token would force
  // a sign-in even though a perfectly good chat session exists.
  const candidates = [
    localStorage.getItem("megh_admin_jwt"),
    localStorage.getItem("megh_jwt"),
  ].filter(Boolean);

  for (const t of candidates) {
    TOKEN = t;
    try {
      await boot();
      return;                       // signed in — nothing more to do
    } catch (e) {
      // Invalid/expired: drop it so it cannot block the next candidate.
      if (t === localStorage.getItem("megh_admin_jwt")) {
        localStorage.removeItem("megh_admin_jwt");
      }
      if (t === localStorage.getItem("megh_jwt")) {
        localStorage.removeItem("megh_jwt");
      }
    }
  }
  TOKEN = "";
  showLogin();
})();
document.getElementById("p").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
</script>
</body>
