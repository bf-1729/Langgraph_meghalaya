# ─────────────────────────────────────────────────────────────────────────────
# ModSecurity v3 engine configuration for nlp-service.
#
# This is the upstream "modsecurity.conf-recommended" (from the libmodsecurity
# source tree) with only the deviations this service needs. When you upgrade
# libmodsecurity, diff the new recommended file against this and re-apply the
# marked changes.
#
#   CHANGED-FOR-MEGH markers show every deviation from upstream defaults.
# ─────────────────────────────────────────────────────────────────────────────

# -- Rule engine ------------------------------------------------------------
# CHANGED-FOR-MEGH: staged rollout — start in DetectionOnly (log, never block).
# Flip to `On` only after the audit log has been quiet of false positives on
# real traffic for a few days. See README "Cutover".
SecRuleEngine DetectionOnly

# -- Request body handling ------------------------------------------------------
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512
# CHANGED-FOR-MEGH: /api/query and friends send JSON — make sure the JSON body
# processor is picked from the Content-Type (this is upstream default, kept
# explicit for clarity).
SecRule REQUEST_HEADERS:Content-Type "(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# -- Response body handling ------------------------------------------------------
SecResponseBodyAccess Off

# -- Filesystem / tmp ---------------------------------------------------------
SecTmpDir /tmp/
SecDataDir /tmp/

# -- Audit logging ----------------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
# CHANGED-FOR-MEGH: dedicated file, rotated by logrotate (see README).
SecAuditLog /var/log/nginx/modsec_audit.log

# -- Miscellaneous --------------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127
SecStatusEngine Off

# -- PCRE limits (raise a little; the CRS is regex-heavy) ---------------------
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
