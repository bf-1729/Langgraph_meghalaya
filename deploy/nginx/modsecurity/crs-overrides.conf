# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS rule EXCLUSIONS for nlp-service.
#
# Loaded LAST (after crs/rules/*.conf) so these can reference CRS rule ids.
#
# Why this file exists
# --------------------
# /api/query and /api/query/transcribe carry FREE-FORM NATURAL LANGUAGE from
# officers ("show the DROP in MGNREGA expenditure", "DELETE-heavy districts",
# "houses where status = completed", "what's the UNION territory equivalent").
# The SQLi (942xxx), XSS (941xxx), RCE (932xxx) and generic (930xxx/933xxx/934xxx)
# rule families pattern-match those keywords and would block legitimate
# questions. The application has its own hard guarantees on this input:
#   * the LLM-generated SQL is validated read-only + single-statement in app/db.py
#   * the DB connection is a SELECT-only role
#   * the question field is length-capped and control-char-stripped in the app
# so relaxing the CRS *for the question field on those two paths only* is a
# considered trade-off, not a blanket disable.
#
# Everything else — /admin, /api/auth, /api/history, /static, the portal — keeps
# the FULL rule set. Keep these exclusions as narrow as the false positives
# require; add new ones with a one-line comment saying which request triggered.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. /api/query (JSON body: {"question": "...", "session_id": "..."}) ──────
#    Drop the injection/attack rule families for the `question` argument only.
#    ARGS.question / ARGS:question covers the JSON-decoded field; we also clear
#    the request-body-as-whole target so the phrase inside the raw JSON does not
#    trip via REQUEST_BODY.
SecRule REQUEST_URI "@beginsWith /api/query" \
    "id:1000100,\
     phase:1,\
     pass,\
     nolog,\
     t:none,\
     ctl:ruleRemoveTargetById=930100-934999;ARGS:question,\
     ctl:ruleRemoveTargetById=941100-941999;ARGS:question,\
     ctl:ruleRemoveTargetById=942100-942999;ARGS:question,\
     ctl:ruleRemoveTargetById=943100-943999;ARGS:question,\
     ctl:ruleRemoveTargetById=944100-944999;ARGS:question,\
     ctl:ruleRemoveTargetById=930100-934999;ARGS:json.question,\
     ctl:ruleRemoveTargetById=941100-941999;ARGS:json.question,\
     ctl:ruleRemoveTargetById=942100-942999;ARGS:json.question,\
     ctl:ruleRemoveTargetById=943100-943999;ARGS:json.question,\
     ctl:ruleRemoveTargetById=944100-944999;ARGS:json.question"

# ── 2. /api/query — SQLi/keyword rules that inspect REQUEST_BODY wholesale ──
#    These have no per-arg target to strip, so remove them by id on this path.
#    920273 (invalid chars very strict), 942440 (SQL comment sequence),
#    942330/942360 (classic SQLi probes), 941340 — all common NL false hits.
SecRule REQUEST_URI "@beginsWith /api/query" \
    "id:1000110,\
     phase:1,\
     pass,\
     nolog,\
     t:none,\
     ctl:ruleRemoveById=942440,\
     ctl:ruleRemoveById=942330,\
     ctl:ruleRemoveById=942360,\
     ctl:ruleRemoveById=942100,\
     ctl:ruleRemoveById=941340,\
     ctl:ruleRemoveById=920273"

# ── 3. /api/query/transcribe (multipart audio upload) ──────────────────────
#    Allow the binary body and a larger size; keep the rest of the rule set.
SecRule REQUEST_URI "@beginsWith /api/query/transcribe" \
    "id:1000120,\
     phase:1,\
     pass,\
     nolog,\
     t:none,\
     ctl:ruleRemoveById=200002,\
     ctl:ruleRemoveById=200003,\
     ctl:ruleRemoveById=920420,\
     ctl:ruleRemoveById=922100"

# ── 4. Static UI assets — the 2 MB portal HTML has inline handlers/JSON that
#    trip XSS/byte-range rules; it is our own file, served read-only. ────────
SecRule REQUEST_URI "@beginsWith /static/" \
    "id:1000130,\
     phase:1,\
     pass,\
     nolog,\
     t:none,\
     ctl:ruleRemoveById=941100-941999,\
     ctl:ruleRemoveById=920330"

# ── 5. Known-safe headers the app sets/consumes ───────────────────────────
#    X-Session-Id / X-Request-ID are app-controlled ids; X-Metrics-Token is a
#    shared secret — none should be run through the CRS arg rules.
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_HEADERS:X-Session-Id"
SecRuleUpdateTargetByTag "attack-xss"  "!REQUEST_HEADERS:X-Session-Id"
