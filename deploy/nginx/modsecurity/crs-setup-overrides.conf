# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS setup overrides for nlp-service.
#
# Loaded AFTER crs/crs-setup.conf, BEFORE the rule files. Only put
# scoring / mode knobs here; per-rule exclusions go in crs-overrides.conf.
# ─────────────────────────────────────────────────────────────────────────────

# Paranoia level 1 — the default. It is the right starting point for an app that
# takes free-form natural-language input; PL2+ flags ordinary English prose.
# Raise to 2 only after PL1 has been clean on real traffic and you have budget
# to tune the new false positives.
SecAction \
    "id:900000,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:tx.blocking_paranoia_level=1,\
     setvar:tx.detection_paranoia_level=1"

# Anomaly-scoring mode (CRS default). A request accumulates a score from the
# rules it trips and is actioned once it crosses the threshold — this is what
# lets us keep individual noisy rules on but tolerate a single weak hit.
SecAction \
    "id:900010,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:tx.inbound_anomaly_score_threshold=5,\
     setvar:tx.outbound_anomaly_score_threshold=4"

# Sampling off — inspect every request.
SecAction \
    "id:900400,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:tx.sampling_percentage=100"

# Allowed HTTP methods — the API uses these five.
SecAction \
    "id:900200,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:'tx.allowed_methods=GET HEAD POST PATCH DELETE OPTIONS'"

# Allowed request content types — JSON for the API, form/multipart for the
# audio upload, plus the browser forms.
SecAction \
    "id:900220,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml|'"
