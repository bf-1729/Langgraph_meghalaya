# ─────────────────────────────────────────────────────────────────────────────
# ModSecurity entry point — referenced from nginx-nlpservice.conf via
#   modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
#
# Load order matters:
#   1. engine config (modsecurity.conf)      — engine mode, body parsing, logging
#   2. CRS setup + our setup overrides       — paranoia level, anomaly scoring
#   3. CRS rules                             — the actual detections
#   4. our rule overrides (crs-overrides)    — false-positive exclusions, MUST
#                                              come AFTER the CRS rule files
#
# See deploy/nginx/modsecurity/README.md for install + rollout.
# ─────────────────────────────────────────────────────────────────────────────

Include /etc/nginx/modsecurity/modsecurity.conf

Include /etc/nginx/modsecurity/crs/crs-setup.conf
Include /etc/nginx/modsecurity/crs-setup-overrides.conf

Include /etc/nginx/modsecurity/crs/rules/*.conf

Include /etc/nginx/modsecurity/crs-overrides.conf
