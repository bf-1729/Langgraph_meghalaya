# ─────────────────────────────────────────────────────────────────────────────
# nginx in front of nlp-service (MGNREGA + PMAY-G, megh_db + Qdrant).
#
# Single upstream, no per-scheme routing — scheme selection happens inside the
# pipeline (classify_scheme), not at the URL level. The service also serves the
# portal + chat console itself, so nginx just forwards everything.
#
# Upstream: 127.0.0.1:8300 (matches deploy/systemd/megh-nlpservice.service).
#
# Two application VMs sit behind the ESDS vFirewall; run this config on each and
# let the firewall/LB spread traffic. Capacity target: 20-40 concurrent, 100-200
# DAU — see docs/ARCHITECTURE.md.
#
# OWASP hardening lives here AND in the app (defence in depth) — see
# docs/SECURITY.md. This file adds: TLS + HSTS, edge security headers, per-IP
# request/connection limits, body + timeout caps, dotfile blocking, admin/metrics
# IP-allowlisting, real client IP recovery, and the hook for ModSecurity + the
# OWASP Core Rule Set (deploy/nginx/modsecurity/).
#
# PLACEHOLDERS to set per environment are marked  # <<SET>> .
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate / connection limit zones (http{} context — put in nginx.conf or an
#    http-level conf.d/ file if this file is included inside a server{} only) ──
limit_req_zone  $binary_remote_addr  zone=api_rl:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=login_rl:10m rate=1r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

# ── Trust the vFirewall / load balancer for X-Forwarded-For, so $remote_addr
#    (and the app's client IP) is the real client, not the LB. ──
set_real_ip_from  10.0.0.0/8;        # <<SET>> vFirewall / LB subnet(s)
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ── :80 — redirect everything to HTTPS ──────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let certbot's HTTP-01 challenge through before the redirect, if used.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ── :443 — the service ─────────────────────────────────────────────────────
server {
    # nginx >= 1.25.1 prefers a separate `http2 on;`; `listen … http2` still
    # works there (with a deprecation notice) and is the only form on the 1.18
    # that ships with Ubuntu 22.04 — so keep it on the listen line.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;                   # <<SET>> real FQDN once a domain exists

    # ── TLS (A02) ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/tls/megh-fullchain.pem;   # <<SET>>
    ssl_certificate_key /etc/nginx/tls/megh-privkey.pem;      # <<SET>>
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MEGH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling — needs a resolver and a cert chain that supports it.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;   # <<SET>> internal resolver
    resolver_timeout    5s;

    server_tokens off;

    # ── Edge security headers (A05) — mirror app/middleware/security_headers.py
    #    so error pages nginx serves itself (413/429/502) are covered too.
    #    `always` = send them on non-2xx responses as well. ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── Body size + timeouts (A04) ────────────────────────────────────────
    client_max_body_size    256k;    # default; the transcribe route overrides below
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;
    keepalive_timeout       65s;

    # A query fans out to several sequential model calls plus a DB / Qdrant hop —
    # keep this above the sum of the per-model timeouts in .env so nginx is never
    # the first to give up.
    proxy_read_timeout    120s;
    proxy_connect_timeout 15s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Per-IP concurrent connection cap (slow-loris / scraper brake).
    limit_conn conn_per_ip 40;

    # ── ModSecurity + OWASP CRS (A03) — see deploy/nginx/modsecurity/README.md.
    #    Ships in DetectionOnly mode (SecRuleEngine in modsecurity.conf). Enable
    #    once libmodsecurity3 + libnginx-mod-http-modsecurity are installed and
    #    the CRS is laid down under /etc/nginx/modsecurity/. ──
    # modsecurity      on;
    # modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    # ── Never serve dotfiles (.env, .git, …) even if one lands in a web root ──
    location ~ /\.(?!well-known/) { deny all; }

    # ── Admin console + API: restrict to office networks ──────────────────
    location /admin {
        # allow 203.0.113.0/24;   # <<SET>> office / VPN CIDR(s)
        # deny  all;
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }
    location = /admin-ui {
        # allow 203.0.113.0/24;   # <<SET>>
        # deny  all;
        proxy_pass http://127.0.0.1:8300;
    }

    # ── Operational metrics: token-gated in the app, IP-gated here too ────
    location = /metrics {
        # allow 203.0.113.0/24;   # <<SET>> monitoring host(s)
        # deny  all;
        proxy_pass http://127.0.0.1:8300;
    }

    # ── Auth: strict brute-force brake in front of the app's own throttle ──
    location = /api/auth/login {
        limit_req  zone=login_rl burst=5 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://127.0.0.1:8300;
    }

    # ── KB rebuild is expensive — keep it on the tight budget ─────────────
    location /api/rag/ {
        limit_req zone=login_rl burst=2 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # ── Voice upload — the one large-body route ───────────────────────────
    location = /api/query/transcribe {
        client_max_body_size 12m;
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # ── Everything else under /api/ ──────────────────────────────────────
    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    location = /health { proxy_pass http://127.0.0.1:8300; }

    # Portal (/), chat console (/ai-query), and static assets (/static/…).
    location / {
        limit_req zone=api_rl burst=30 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }
}
