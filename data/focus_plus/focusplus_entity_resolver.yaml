  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: >
      Title Case in dim_geography.lgd_village_name. UNLIKE district and block, the village
      name is NOT uppercased in the curated layer.
    distinct_names_in_scheme: 3659
    distinct_codes_in_scheme: 3221
    distinct_names_raw_in_source: 4574
    name_count_note: >
      The raw source carries 4,574 distinct village strings, but 1,353 of them appear on
      rows with no village code and cannot be resolved to a geography at all. 3,659
      distinct names map onto 3,221 codes - fewer codes than names, because the source
      spells some villages more than one way.
    integrity: >
      The code is the reliable key; the NAME is not. 186 names are shared by two or more
      different villages within this scheme.
    sql_predicate_preferred: "village_code = <code>"
    sql_predicate_fallback: "lgd_village_name = '<canonical>'"
    counting_villages: >
      Use COUNT(DISTINCT village_code), never COUNT(DISTINCT name). Across dim_geography
      345 village names are shared; within Focus Plus 186 are.

    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their
         district and block. Ask which one.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.

    unmapped_rows:
      critical: true
      count: 102923
      share: 26.7%
      by_batch: { "93K": 102916, "12.5K": 7 }
      text: >
        102,923 SOURCE ROWS CARRY NO VILLAGE CODE, while fact.geography_key is NOT NULL.
        How they resolved at ingest is UNKNOWN - quarantined, or mapped to a placeholder
        geography. Establish this before publishing any village- or block-level figure.
        Until it is settled, a village breakdown covers at most 73.3% of payments and the
        answer must say so.

    ward_names:
      count_rows: 777
      note: >
        Some village strings are urban wards carrying a ward prefix and suffix, such as
        "1-Williamnagar (Mb) - Ward No.1". dim_geography holds 164 wards alongside 7,200
        villages and marks them entity_type = 'Ward'. Resolve them, but check entity_type
        before describing a result as village-level, and never mix wards silently into a
        "top villages" ranking.

    numeric_prefix_names:
      count: 137
      examples: ["10 Adugre", "10 Ganchigre", "12 Rongrenggre", "1-Ward No. 1",
                 "1-Laitumkhrah - Ward No.1", "5 Mile"]
      rule: >
        These are NAMES, not codes. A village code in this dataset is an integer with no
        letters, spaces or hyphens. Never strip the leading digits to "correct" the name.

    excluded_values:
      - value: "Nan"
        records: 636
        reason: Null written out as text by the source export. Never resolve or suggest it.
      - value: ""
        records: 103
        reason: Empty village name.
      - value: "  "
        records: 1
        reason: Whitespace-only village name.

    ambiguity:
      shared_names: 186
      detail: >
        186 village names are used by two or more physically different villages within
        Focus Plus. Village name alone is NEVER a key.
      resolve_by_district: 121
      resolve_by_block: 65
      resolve_by_block_note: >
        For these 65 the copies all sit in ONE district, so naming the district does not
        narrow anything - ask for the block, or take the code.
