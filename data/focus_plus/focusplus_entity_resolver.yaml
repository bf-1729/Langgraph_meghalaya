  # ---- person attributes - 12.5K COHORT ONLY ----------------------------
  # Every dimension below is NULL on all 373,144 legacy rows. A breakdown by
  # any of them describes 3.2% of the scheme. State the cohort and the
  # denominator, every time.
  gender:
    column: gender
    stored_case: Title Case - stored exactly as shown
    distinct: 2
    closed_set: true
    cohort_scope: registration
    coverage:
      critical: true
      populated_rows: 12527
      null_rows: 373144
      share: 3.2%
      text: >
        NULL on every legacy row. A gender split is NOT a Focus Plus scheme figure and
        must never be presented as one. NULL here means "not collected for this cohort",
        not "unknown individual" - do not render it as an Other or Unspecified category.
    sql_predicate: "gender = '<canonical>'"
    scheme_note: >
      Focus Plus is the ONLY scheme in megh_db with a real gender column. PMAY has
      house_alloted_to, which is an allotment category, not gender. Never map one onto the
      other, and never answer a Focus Plus gender question from PMAY vocabulary.
    values:
    - canonical: "Female"
      records: 10263
      aliases: [female, women, woman, girls, ladies, f, women members, female members]
    - canonical: "Male"
      records: 2264
      aliases: [male, men, man, boys, m, male members]
    derived_groups:
      women:
        members: [Female]
        records: 10263
        aliases: [women, woman, female, female beneficiaries, women beneficiaries]
        note: >
          Simpler than PMAY, where "women" spans four Woman-* categories. Here it is one
          stored value. The complication is coverage, not category - 10,263 of 12,527
          registrations, and nothing at all for the 373,144 legacy payments.

  occupation:
    column: occupation
    stored_case: Title Case - stored exactly as shown
    distinct: 7
    closed_set: true
    cohort_scope: registration
    coverage:
      critical: true
      populated_rows: 12527
      null_rows: 373144
      share: 3.2%
    sql_predicate: "occupation = '<canonical>'"
    values:
    - canonical: "Farmer"
      records: 8533
      aliases: [farmer, farmers, farming, cultivator, cultivators, agriculture,
                agriculturist, krishak]
      note: >
        The plurality but NOT the whole - 68% of the covered rows. "How many farmers" must
        not be silently answered as "how many beneficiaries". See overloaded_terms.farmers.
    - canonical: "Unemployed"
      records: 2494
      aliases: [unemployed, jobless, no occupation, not employed, without work]
    - canonical: "Others"
      records: 904
      aliases: [other, others, other occupation, miscellaneous]
      note: A real stored category, not a null placeholder. Do not merge it with NULL.
    - canonical: "Business"
      records: 296
      aliases: [business, businessman, businesswoman, trader, self employed,
                self-employed, shopkeeper, entrepreneur]
    - canonical: "Private Employee"
      records: 194
      aliases: [private employee, private sector, private job, private service, employee]
    - canonical: "Student"
      records: 83
      aliases: [student, students, studying, scholar]
    - canonical: "Government Employee"
      records: 23
      aliases: [government employee, govt employee, government service, govt service,
                public servant, government job, sarkari]
      note: n=23. Small enough that a percentage over it is thin - state the denominator.

  focus_status:
    column: focus_status
    stored_case: Title Case - stored exactly as shown
    distinct: 3
    closed_set: observed - NOT a controlled list
    cohort_scope: registration
    coverage:
      critical: true
      populated_rows: 12527
      null_rows: 373144
      share: 3.2%
    not_a_dimension:
      critical: true
      text: >
        THERE IS NO dim_focus_plus_status AND NO ROLL-UP FLAG. Nothing here corresponds to
        PMAY's is_completed or is_in_progress. This is an uncontrolled varchar on the
        fact. ENUMERATE WITH SELECT DISTINCT BEFORE WRITING ANY FILTER - the three values
        below are a source-file observation, not a constraint, and a fourth may exist in
        megh_db.
    not_a_payment_flag:
      critical: true
      text: >
        'Approved' describes an APPLICATION, not a disbursement, and every row carrying it
        is in the cohort that has NOT been paid. Reading it as "paid" inverts the answer.
        See overloaded_terms.paid.
    sql_predicate: "focus_status = '<canonical>'"
    values:
    - canonical: "Pending"
      records: 11812
      aliases: [pending, awaiting, in process, under process, not yet approved,
                awaiting approval]
    - canonical: "Approved"
      records: 714
      aliases: [approved, accepted, cleared, sanctioned]
      note: >
        The word "sanctioned" is a PMAY status vocabulary item. Accept it as an alias here
        but never carry PMAY's sanctioned-amount or sanction-date readings across - Focus
        Plus has neither column.
    - canonical: "Rejected"
      records: 1
      singleton: true
      aliases: [rejected, denied, refused, declined]
      note: >
        EXACTLY 1 RECORD. Include it in totals, but never present it as a meaningful
        category, a percentage or a trend without saying n=1.

  verification_status:
    column: verification_status
    stored_case: Title Case - stored exactly as shown
    distinct: 1
    cohort_scope: registration
    coverage:
      populated_rows: 12527
      null_rows: 373144
      share: 3.2%
    zero_discriminating_power:
      critical: true
      text: >
        EVERY POPULATED ROW READS 'Approved'. Filtering on this column changes nothing and
        grouping by it returns one row. If the user asks to split or filter by
        verification, say it has a single value rather than returning a one-row breakdown
        that looks like an answer. Enumerate with SELECT DISTINCT before trusting even
        this - it is a source-file observation.
    sql_predicate: "verification_status = '<canonical>'"
    values:
    - canonical: "Approved"
      records: 12527
      aliases: [verified, approved, verification approved, checked]

  # ---- identifiers - resolvable only in the narrowest sense -------------
  identifiers:
    critical: true
    policy: >
      Focus Plus is the only person-level fact in megh_db. Rule 7 of
      SCHEMA_FOR_DEVELOPERS.md governs everything below. The resolver's job for these is
      to RECOGNISE the entity type and hand back a `refused` or `not_found` contract - not
      to find the person.
    member_id:
      column: member_id
      pii: true
      resolvable: false
      output_contract: refused
      reason: privacy
      distinct_in_source: 12527
      nulls: 373144
      rules:
      - Never fuzzy-match, never suggest near-matches - a near-match of a person id is
        itself a leak.
      - Never emit into a SELECT list, an export or a vector-store payload.
      - The only permitted use is inside COUNT(DISTINCT member_id).
      - "COUNT(DISTINCT member_id) covers the 12.5K cohort ONLY. It is not the scheme
        beneficiary total. See overloaded_terms.beneficiaries."
    pincode:
      column: pincode
      pii: true
      resolvable: false
      output_contract: refused
      reason: privacy
      populated_rows: 12520
      rules:
      - Person locality. Never emit into an answer or an export.
      - Never SUM or AVG - a pincode is not a number in any arithmetic sense.
      - Populated on 3.2% of rows. It is not a usable geography column - use village_code.
    source_sl_no:
      column: source_sl_no
      pii: false
      resolvable: true
      distinct_by_batch: { "93K": 93286, "12.5K": 12527 }
      cross_batch_overlap: 0
      rules:
      - "A FILE SERIAL, NOT A PERSON KEY. It is the closest available proxy for a legacy
        beneficiary now that epic_id is gone, and it must be described as a serial
        whenever it is used to count people."
      - Unique per beneficiary WITHIN a batch; repeats once per tranche.
      - The two batches do not overlap on it, so (batch_label, source_sl_no) is stable.
      - Never SUM or AVG.
    dropped_at_ingest:
      critical: true
      columns: [epic_id, beneficiary_name, mobile_number, status]
      behaviour: >
        These are not in the curated layer. A span that resolves to one of them returns
        `not_found` with reason not_held - never a guess, never a partial match, and never
        an offer to search a different column that does not exist either.
      epic_id_note: >
        THE CONSEQUENTIAL LOSS. 93,286 distinct EPIC ids in the source, and the only
        identifier the legacy cohort had. Its format is three letters plus seven digits,
        with the first three letters being the assembly constituency code - which is why
        losing it also removes the AC-code route to constituency questions. 111 EPIC ids
        appeared in BOTH cohorts, an overlap that can no longer be measured.

# ---------------------------------------------------------------------------
measure_vocabulary:
  amount_disbursed:
    column: amount_disbursed
    aliases: [amount, amount disbursed, disbursement, disbursed amount, payment, paid,
              money paid, money disbursed, DBT amount, funds, funds disbursed, spend,
              total spend, expenditure, payout]
    aggregate: SUM(amount_disbursed)
    distinct_values: 2
    values: { 5000: 93286, 2500: 292385 }
    nulls: 0
    zero_rows: 0
    total_in_source: 1197392500
    unit: unverified
    unit_authority: curated.dim_scheme.money_unit
    verified_in_db: false
    critical:
      text: >
        THE UNIT IS UNVERIFIED AND THIS IS THE HIGHEST-PRIORITY UNKNOWN IN THE PARTITION.
        Read curated.dim_scheme.money_unit for the Focus Plus row before formatting or
        converting. Source values of 5000 and 2500 corroborate rupees but do not settle
        it; three units are already live in megh_db. If dim_scheme does not answer, report
        the figure as stored and say the unit is unconfirmed.
    two_rate_finding:
      critical: true
      text: >
        ONLY TWO VALUES EXIST, AND THEY BELONG TO DIFFERENT TRANCHES - 5000 in Tranch 1
        (FY 2022-23) and 2500 in every later tranche. Consequences the generator must
        respect:
          - AVG(amount_disbursed) is a MIX RATIO between tranche types, not an
            entitlement. Never present it as "the average payment".
          - A per-member figure is the total divided by a member count, and which member
            count is meant must be settled first.
          - The use-case workbook assumes a flat 5000 throughout and is WRONG. A query
            for "payments that are not 5000" returns 292,385 rows - three quarters of the
            data - and that is correct, not an anomaly.
          - Ranking districts by amount is nearly the same as ranking by payment count,
            differing only through each district's tranche mix.
    not_available:
      columns: [sanctioned_amount, amount_released, amount_pending, target, budget,
                allocation, administrative_expenditure]
      note: >
        Focus Plus holds ONE money column. Never borrow a money column from PMAY or
        MGNREGA to fill a gap, and never derive a pending or sanctioned figure.

  payment_count:
    aliases: [payments, disbursements, transactions, how many payments, number of
              payments, count of payments]
    aggregate: COUNT(*)
    default: true
    mandatory_filter: none
    critical: >
      ONE ROW IS ONE PAYMENT, NOT ONE PERSON. A legacy member appears on four rows. Every
      COUNT(*) answer must say it is a payment count. And note there is NO mandatory
      filter on this partition - do not carry PMAY's WHERE NOT is_placeholder across.

  member_count:
    aliases: [members, people, persons, individuals, distinct members, unique members,
              how many members]
    aggregate: COUNT(DISTINCT member_id)
    cohort_scope: registration
    critical: >
      COVERS THE 12.5K COHORT ONLY - member_id is NULL on all 373,144 legacy rows. This is
      NOT the scheme beneficiary total, and presenting it as one is the most dangerous
      single error available in this schema. For a legacy count use
      COUNT(DISTINCT source_sl_no) with batch_label = '93K', and say it is a file serial.

  village_count:
    aliases: [villages, how many villages, number of villages, distinct villages]
    aggregate: COUNT(DISTINCT village_code)
    critical: >
      Count by CODE, never by name. 186 village names in this scheme are shared by more
      than one village, and 345 are shared across dim_geography.

  district_count:
    aliases: [districts, how many districts, number of districts, coverage]
    aggregate: COUNT(DISTINCT lgd_district)
    note: >
      12 for the scheme, 6 for the 12.5K cohort. "Coverage" in the count sense is
      answerable; coverage as a PERCENTAGE is not - no eligible-population denominator is
      held anywhere in megh_db.

  derived:
    amount_per_member:
      formula: "SUM(amount_disbursed) / COUNT(DISTINCT <the agreed member key>)"
      note: >
        Settle the member key first - see overloaded_terms.beneficiaries. Never compute it
        as AVG(amount_disbursed).
    payments_per_member:
      formula: "COUNT(*) / COUNT(DISTINCT <the agreed member key>)"
      note: >
        Approximately 4 for the legacy cohort by construction and exactly 1 for the
        registration cohort. Rarely an interesting number - it restates the grain.
    not_derivable:
      critical: true
      items:
      - { metric: coverage_rate, reason: no eligible-population denominator is held }
      - { metric: beneficiary_density, reason: no population figures }
      - { metric: account_ifsc_analysis, reason: no account number or IFSC column exists }
      - { metric: monthly_trend, reason: no date column exists }
      - { metric: unpaid_backlog_exact, reason: "the cross-cohort overlap needs epic_id, which was dropped" }

