# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many focus plus payments in WGH"
  resolve:
  - { text: WGH, type: district, canonical: West Garo Hills, lgd_code: 278,
      matched_by: 4_acronym }
  - { text: "how many payments", type: measure, canonical: "COUNT(*)" }
  sql: "SELECT COUNT(*) FROM curated.v_focus_plus WHERE lgd_district = 'WEST GARO HILLS';"
  expected: 126259
  note: District is stored UPPERCASE - emit the uppercase literal, not the Title Case form.

- user: "how many beneficiaries are there in focus plus"
  resolve:
  - { text: beneficiaries, type: overloaded, reading: AMBIGUOUS }
  action: ask
  question: >
    Payments made (385,671), members with an ID (12,527, the newer batch only), or the
    93,286 legacy paid members - which the database can no longer count directly?
  note: >
    THE MOST IMPORTANT EXAMPLE IN THIS FILE. Do not answer with a single number. The three
    readings differ by an order of magnitude and the third is not derivable at all.

- user: "how many women got focus plus"
  resolve:
  - { text: women, type: gender, canonical: Female, cohort_scope: registration }
  sql: "SELECT COUNT(*) FROM curated.v_focus_plus WHERE batch_label = '12.5K' AND gender = 'Female';"
  expected: 10263
  note: >
    MUST be stated as covering the newer registration batch only - 12,527 of 385,671
    records. The 373,144 legacy payments have no gender recorded at all.

- user: "focus plus disbursement trend over time"
  resolve:
  - { text: "trend over time", type: measure, reading: TIME_SERIES }
  action: ask
  question: >
    Focus Plus holds only two financial years, 2022-23 and 2025-26, with a three-year gap.
    Shall I show the two side by side, or break it down by batch and tranche?
  note: A line drawn through the gap would be a fabrication. There is no date column.

- user: "show me tranche 2 in august"
  resolve:
  - { text: "tranche 2", type: tranche_label, canonical: "Tranch 2 - August",
      matched_by: 2_alias }
  - { text: august, type: none, action: absorbed_into_label }
  sql: "SELECT COUNT(*) FROM curated.v_focus_plus WHERE tranche_label = 'Tranch 2 - August';"
  expected: 93286
  note: >
    "August" is part of the stored label, not a date filter. Do not emit a month
    predicate - there is no date column to filter.

- user: "paid vs unpaid in East Garo Hills"
  resolve:
  - { text: "East Garo Hills", type: district, canonical: East Garo Hills, lgd_code: 273 }
  - { text: "paid vs unpaid", type: overloaded, reading: batch_label, inference: true }
  sql: |
    SELECT COUNT(*) FILTER (WHERE batch_label = '93K')   AS legacy_paid_payments,
           COUNT(*) FILTER (WHERE batch_label = '12.5K') AS newer_registrations
    FROM curated.v_focus_plus
    WHERE lgd_district = 'EAST GARO HILLS';
  expected: { legacy_paid_payments: 39100, newer_registrations: 1604 }
  note: >
    The answer MUST say the paid/unpaid split is inferred from the batch, not read from a
    status column. No column encodes payment.

- user: "which bank pays the most focus plus beneficiaries"
  resolve:
  - { text: bank, type: column, canonical: bank_name_raw }
  sql: |
    SELECT bank_name_raw,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY bank_name_raw
    ORDER BY payments DESC
    LIMIT 1;
  expected: { bank_name_raw: State Bank of India, payments: 258744, amount_raw: 808575000 }
  note: >
    "Beneficiaries" is read as payments (rule 6) and labelled as such. bank_name_raw is
    not withheld - it is on curated.v_focus_plus and is not an identifier. Only account
    number / IFSC questions still refuse (not_held, no such column exists anywhere).

- user: "is EPIC FTB0593681 a focus plus beneficiary"
  resolve:
  - { text: FTB0593681, type: dropped_column, canonical: epic_id }
  action: refused
  reason: not_held
  message: >
    EPIC ID is not held in the database - it was dropped at ingest. Separately, rule 7
    forbids a person lookup against this fact. Do not offer member_id as a substitute and
    do not list near-matches.

- user: "top 5 blocks by focus plus payments"
  resolve:
  - { text: "top 5", type: measure, canonical: "ORDER BY ... DESC LIMIT 5" }
  - { text: blocks, type: block, canonical: GROUP BY lgd_block }
  sql: |
    SELECT lgd_block, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
    GROUP BY lgd_block
    ORDER BY payments DESC
    LIMIT 5;
  expected: [Tikrikilla 30122, Selsella 29024, Zikzak 23208, Nongstoin 22000, Rongram 20613]
  note: >
    Source counts, folded. If a query returns 'Tikrikilla' and 'Tikrikilla ' as two rows,
    the trailing-space artefact survived ingest - see dimensions.block.

- user: "asimgre village payments"
  resolve:
  - { text: asimgre, type: village, status: ambiguous }
  candidates: 6 codes across East Garo Hills, South Garo Hills, South West Garo Hills and West Garo Hills
  action: ask
  question: "There are 6 villages called Asimgre. Which district - East Garo Hills, South Garo Hills, South West Garo Hills or West Garo Hills?"
  note: Resolve on village_code, never the name. See village.ambiguity.registry.

- user: "average focus plus payment"
  resolve:
  - { text: "average payment", type: measure, reading: AVG_IS_MISLEADING }
  action: ask
  question: >
    The payment is not one figure - Tranch 1 paid 5,000 and the later tranches 2,500. Did
    you mean the total divided by the number of members, or the breakdown by tranche?
  note: >
    AVG(amount_disbursed) returns a mix ratio between two tranche rates, not an
    entitlement. The use-case workbook's "5,000 (flat)" answer is wrong.

- user: "how many members in the 12.5k batch are farmers"
  resolve:
  - { text: "12.5k", type: batch_label, canonical: "12.5K", matched_by: 2_alias }
  - { text: farmers, type: occupation, canonical: Farmer }
  sql: "SELECT COUNT(*) FROM curated.v_focus_plus WHERE batch_label = '12.5K' AND occupation = 'Farmer';"
  expected: 8533
  note: >
    Cohort explicitly named by the user, so no assumption is needed - but the answer
    should still note this is 68% of that batch and that the legacy batch has no
    occupation recorded.

