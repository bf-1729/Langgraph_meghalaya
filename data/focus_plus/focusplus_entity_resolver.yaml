resolver_version: '1.0'
resolver_name: focusplus_entity_resolver
display_name: Focus Plus Entity Resolver (Meghalaya) - curated star schema
generated_from:
- datasets/Focus+/Focus Plus Master.csv
- datasets/Focus+/Copy of Megh One AI - FOCUS+ NLP Use Cases.xlsx
- SCHEMA_FOR_DEVELOPERS.md (live information_schema extract, 2026-09-02)
generated_on: '2026-09-03'
companion_schema: focusplus_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-09-03 - WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Focus Plus was loaded straight into curated on 2026-09-02. There is no
# flat-table ancestor and no migration to record.
#
# THE CATALOGUES BELOW RESOLVE TO dim_geography VALUES, NOT TO THE RAW CSV.
# That distinction matters more here than it did for PMAY, because the source
# is dirty in ways the ingest is expected to have cleaned:
#   - 26 of 77 raw block strings carry a TRAILING SPACE, always on the 12.5K
#     batch. Folded, there are 51 distinct blocks, of which 50 are real.
#   - The literal string 'Nan' appears as a block (4 rows) and as a village
#     name (636 rows). It is a null written out as text, not a place.
#   - 103 rows carry an empty village name and 4 carry no district.
# The canonical forms below are the FOLDED, cleaned values. If a query against
# megh_db returns a trailing-space or 'Nan' value, the ingest did not clean it
# and this file must be revised.
#
# All record counts, distinct counts and value distributions are from the
# source CSV (2026-09-03) and have NOT been verified against megh_db.
# ===========================================================================

description: >
  Value-level entity resolution for the Focus Plus NLP-to-SQL bot. This file answers
  exactly one question: the user typed some text - which stored database value did they
  mean? It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: focus_plus
  display_name: Focus Plus
  full_name: Focus Plus
  state: Meghalaya
  aliases: ["Focus Plus", "Focus+", "FOCUS+", "FocusPlus", "Focus-Plus", "focus plus",
            "focusplus", "Focus Plus scheme", "FOCUS PLUS",
            "focus plus payment", "focus plus DBT", "farmer support scheme"]
  bare_focus_note: >
    The bare word "focus" is a scheme alias but is also ordinary English. Treat it as the
    scheme only when it appears alongside scheme vocabulary - payment, disbursement,
    tranche, batch, member, beneficiary - or when Focus Plus is already the active scheme.
  not_aliases: ["Ginger Mission", "FOCUS scheme of another state", "PG-FOCUS"]
  not_aliases_note: >
    PG-FOCUS appears in the use-case workbook glossary as a producer-group type prefix.
    Producer groups do not exist in this data - do not resolve it as a scheme alias or as
    anything else. Ginger Mission is a different dataset and is not in megh_db.

tables:
  payments: curated.v_focus_plus                  # primary query surface, 23 columns
  fact: curated.fact_focus_plus_disbursement      # underlying fact, 22 columns - DO NOT QUERY
  scheme_dim: curated.dim_scheme                  # authority on the money unit
  cross_scheme_money: curated.v_cross_scheme_money_district_year
  cross_scheme_coverage: curated.v_cross_scheme_village_coverage

dataset_shape:
  grain: one row per disbursement - one payment, to one member, in one tranche
  row_count: unverified_in_db
  row_count_note: The source CSV held 385671 rows. The curated count is unmeasured.
  single_table: false
  person_level: true
  emits_no_joins: >
    curated.v_focus_plus already pre-joins dim_year and dim_geography, so the generator
    emits WHERE and GROUP BY only. dim_scheme is read separately for the money unit -
    v_focus_plus does not expose scheme_key. See focusplus_foreign_key_augmentation.yaml.
  two_cohorts:
    critical: true
    text: >
      THE SINGLE MOST IMPORTANT FACT ABOUT THIS DATASET, AND IT IS INVISIBLE IN THE DDL.
      batch_label splits the fact into two cohorts of different grain and different column
      coverage. Resolving an entity is not enough - the cohort has to be resolved too.
      See dimensions.batch_label.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because block and
    village names collide - see cross_dimension_collisions. Try: financial_year ->
    batch_label -> tranche_label -> district -> block -> village -> gender ->
    occupation -> focus_status -> verification_status -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_cohort: >
    Decide which cohort the question is about BEFORE emitting SQL. If the resolved
    entities include any person attribute, the answer is the 12.5K cohort only.
  step_5_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_6_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "lgd_district and lgd_block are stored UPPERCASE in dim_geography.
    lgd_village_name keeps its stored mixed case. Always compare case-folded, and emit
    the form the column actually stores."
  - Villages are resolved by village_code, never by name alone. 186 village names in
    this scheme are shared by two or more different villages.
  - "District and block have NO CODE COLUMN in the curated layer. A user who supplies an
    LGD district code can be resolved to the NAME using the catalogue below, but the code
    itself can never appear in a WHERE clause."
  - "PERSON IDENTIFIERS ARE NOT RESOLVABLE. member_id and pincode are PII, and
    beneficiary_name, epic_id and mobile_number were dropped at ingest. A person lookup
    returns not-held or refused - never a guess, and never a partial match."
  - "THERE IS NO MANDATORY PREDICATE. Do not carry PMAY's WHERE NOT is_placeholder into
    a Focus Plus query - the column does not exist and the query will fail."
  - "batch_label is a cohort, not a size. Six columns are populated on the 12.5K cohort
    only - 3.2% of rows. Resolve the cohort before answering anything that touches them."
  - "tranche_label is NOT time. The month words inside the labels are label text. Never
    order by it as a series, and never resolve a month name to a tranche."
  - The word amount is single-valued here but its UNIT is unverified. Read
    curated.dim_scheme.money_unit before formatting. See measure_vocabulary.
  - "Paid versus unpaid is encoded in NO column. batch_label is the only available
    reading and it is an inference. See overloaded_terms.paid."
  - NULL is missing, never zero, and on the person columns it means "not collected for
    this cohort" rather than "unknown individual".
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a district, block, village, occupation or status.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - strip trailing qualifier words: BLOCK, DISTRICT, VILLAGE, C&RD, MUNICIPAL BOARD, MB
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  trailing_space_rule:
    critical: true
    text: >
      TRIM IS NOT OPTIONAL FOR THIS SCHEME. 26 of the 77 raw block strings in the source
      differ from another only by a trailing space, and the spaced variant is always the
      12.5K cohort. Folding without a trim splits every one of those blocks in two and
      silently halves the answer.
  null_text_rule: >
    The literal strings 'Nan', 'nan', 'NaN', 'NULL' and the empty string are NOT values.
    They are nulls written out as text by the source export. Never resolve them, never
    offer them as a suggestion, and never present them as a place.
  numeric_ids: >
    village_code is an integer. Cast user-typed codes with int() and strip any trailing
    .0 before comparing.
  village_prefix_rule: >
    137 village names in the source begin with a digit - "10 Adugre", "1-Williamnagar
    (Mb) - Ward No.1". These are names, not codes. A village code in this dataset is an
    integer with no letters, spaces or hyphens.

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts only - do not invent them for blocks }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

pipeline_exclusions:
  critical: true
  never_fuzzy_match:
  - member_id
  - pincode
  reason: >
    These are person identifiers. A fuzzy match on an identifier returns the wrong human
    being. They are resolved by exact match or not at all - and rule 7 forbids emitting
    either into an answer regardless, so the only legitimate use is COUNT(DISTINCT).

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [Laskein, Thadlaskein]          # two different West Jaintia Hills blocks
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]          # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]         # East Khasi Hills vs West Khasi Hills
  - [Mawshynrut, Mawsynram]
  - [Mawpat, Mawphlang]             # two different East Khasi Hills blocks
  - [Mawphlang, Mawpat]
  - [Rongram, Rongara]              # West Garo Hills vs South Garo Hills
  - [Rongara, Rongram]
  - [Rerapara, Resubelpara]         # South West Garo Hills vs North Garo Hills
  - [Umling, Umsning]               # two different Ri Bhoi blocks
  - [Umsning, Umling]
  - [Baghmara, "Baghmara-Municipal Board"]        # C&RD block vs municipal board
  - [Resubelpara, "Resubelpara-Municipal Board"]
  - [Approved, Pending]             # focus_status values
  - [Male, Female]
  - ["93K", "12.5K"]                # batch labels - never fuzzy, they are exact tokens
  municipal_board_note: >
    Five municipal boards share a stem with a C&RD block - Baghmara, Resubelpara, Tura,
    Williamnagar and Shillong. They are DIFFERENT places at a different entity_type. A
    bare stem resolves to the C&RD block; the municipal board requires the user to say
    "municipal board", "MB", "town" or "ward".

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | village | batch_label | tranche_label |
                 financial_year | gender | occupation | focus_status |
                 verification_status | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    lgd_code: <code, geography only>
    cohort_scope: <both | legacy | registration - set whenever the value implies one>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, lgd_code, district, block } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the Focus Plus data.
  refused:
    status: refused
    entity_type: person_identifier | withheld_column
    user_text: <verbatim span>
    reason: privacy | not_held
    message: >
      A fourth shape PMAY does not have. Used when the span resolves to a real person
      (member_id / pincode / a name) or to an account number / IFSC, none of which
      exist as a queryable identifier here. bank_name_raw is NOT this case - it is a
      bank name, not a person, and resolves normally. Say the data cannot be shown,
      offer the aggregate, and do not list candidates - listing near-matches of a
      person identifier is itself a leak.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to a cohort rather than a column.
    Getting these wrong produces a confidently wrong answer, so they are listed explicitly.

  beneficiaries:
    critical: true
    readings:
    - { means: "COUNT(*)", when: "default - but it is a PAYMENT count, not a person count" }
    - { means: "COUNT(DISTINCT member_id)", when: "the user means people AND the 12.5K cohort is in scope" }
    - { means: "93,286 legacy paid members", when: "the user means the figure published in the use-case workbook" }
    default: ask which. The three numbers differ by an order of magnitude.
    note:
      critical: true
      text: >
        The third reading IS NOT DERIVABLE FROM megh_db. It came from epic_id, which was
        dropped at ingest, and member_id is NULL on all 373,144 legacy rows. Never present
        COUNT(DISTINCT member_id) as the scheme beneficiary total - it silently answers
        for 3.2% of the data. COUNT(DISTINCT source_sl_no) per batch is the closest proxy
        and it is a file serial, not a person key. Say so when using it.

  paid:
    critical: true
    readings:
    - { means: "batch_label = '93K'", when: "the user means members who have received money" }
    - { means: "focus_status = 'Approved'", when: "NEVER - this is the trap" }
    default: batch_label, stated as an inference.
    note: >
      NO COLUMN ENCODES PAYMENT. `status` was the constant '106' and was dropped at
      ingest. verification_status is 'Approved' on every populated row. focus_status
      describes an APPLICATION and exists only on the 12.5K cohort - the cohort that has
      NOT been paid. Reading 'Approved' as 'paid' inverts the answer.

  unpaid:
    readings:
    - { means: "batch_label = '12.5K'", when: default }
    note: >
      An estimate, not a count. 111 epic_ids appear in BOTH cohorts in the source - people
      already paid who registered again - so 12,527 overstates the backlog. epic_id is
      gone, so the overlap cannot be detected in megh_db at all. Say so.

  amount:
    readings:
    - { means: "SUM(amount_disbursed)", when: default - it is the only money column }
    unit_warning:
      critical: true
      text: >
        Unlike PMAY, WHICH column is never in doubt; the UNIT is. amount_disbursed is a
        bare numeric with no documented unit and no known precision. Read
        curated.dim_scheme.money_unit for the Focus Plus row before formatting. Source
        values of 5000 and 2500 corroborate rupees but do not settle it.

  approved:
    readings:
    - { means: "focus_status = 'Approved'", when: "the user is asking about applications" }
    - { means: "verification_status = 'Approved'", when: "the user says verified or verification" }
    default: focus_status, and say it means the registration was approved, not paid.
    note: >
      verification_status is 'Approved' on every one of the 12,527 populated rows, so
      filtering on it changes nothing. Say it has one value rather than returning a
      one-row breakdown that looks like an answer.

  farmers:
    readings:
    - { means: "occupation = 'Farmer'", when: "the user means the recorded occupation" }
    - { means: "COUNT(*) over the whole scheme", when: "the user is using it loosely for beneficiaries" }
    default: ask. The two are far apart, and occupation covers 3.2% of rows.

  batch:
    readings:
    - { means: "batch_label", when: "the user means the 93K or 12.5K cohort - almost always" }
    - { means: "fact.batch_id", when: "NEVER for a user question - it is a load-audit uuid" }
    default: batch_label. Do not expose batch_id.

  tranche:
    readings:
    - { means: "tranche_label", when: always }
    note: >
      Stored as "Tranch", not "Tranche". Accept both spellings on input, emit the stored
      form. The month words in the labels are not dates - see dimensions.tranche_label.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 19
    district_collisions: 0
    blocks_spanning_more_than_one_district: 0
  colliding_names: [Baghmara, Bajengdoba, Betasing, Damalgre, Demdema, Gambegre,
    Gasuapara, Mawkynrew, Mawkyrwat, Pynursla, Ranikor, Rerapara, Resubelpara, Rongara,
    Rongram, Selsella, Tikrikilla, Umsning, Zikzak]
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "village" or "gaon", resolve as village.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.
  - "If the user said 'municipal board', 'MB', 'town' or 'ward', resolve to the municipal
    board entry, not the C&RD block of the same stem."

# ---------------------------------------------------------------------------
# DIMENSIONS
# ---------------------------------------------------------------------------
dimensions:

  # ---- the cohort dimension - no PMAY counterpart -----------------------
  batch_label:
    column: batch_label
    stored_case: exact - '93K' and '12.5K', do not re-case
    distinct: 2
    closed_set: true
    nulls: 0
    sql_predicate: "batch_label = '<canonical>'"
    critical: true
    why_it_matters: >
      This is not an ordinary dimension. It separates two datasets with different grain
      and different column coverage that happen to share a fact table. Resolve it before
      almost any other entity.
    never_parse_as_number: >
      '93K' and '12.5K' are labels. Do not read them as 93000 and 12500, do not sort them
      numerically, and do not present them as sizes.
    values:
    - canonical: "93K"
      records: 373144
      beneficiaries: 93286
      grain: four rows per member, one per tranche
      tranches: [Tranch 1, Tranch 2 - August, Tranch 3 - December, Tranch 4 - Feb-March]
      financial_years: ['2022-23', '2025-26']
      districts_reached: 12
      person_columns_populated: false
      aliases: [legacy, legacy batch, old batch, "93k", "93 K", "93,000", paid batch,
                paid members, first batch, original batch, legacy paid]
      note: >
        The paid cohort. Every person-level column is NULL here - gender, occupation,
        focus_status, verification_status, member_id and pincode. Its only identifier in
        the source was epic_id, which was dropped at ingest.
    - canonical: "12.5K"
      records: 12527
      beneficiaries: 12527
      grain: one row per member
      tranches: ['Tranch 4 - Feb-March']
      financial_years: ['2025-26']
      districts_reached: 6
      person_columns_populated: true
      aliases: [new, newer, new batch, newer batch, registration batch, registrations,
                "12.5k", "12,500", unpaid, unpaid batch, pending members, second batch]
      note: >
        The registration cohort. Carries every person-level attribute, reaches only six
        districts, and appears in Tranch 4 only. Treating it as "unpaid" is an inference -
        see overloaded_terms.unpaid.
    derived_groups:
      both:
        members: ["93K", "12.5K"]
        records: 385671
        aliases: [all, everyone, overall, whole scheme, total, all batches]
        note: The default when the question is about payments, money or geography.

  # ---- time -------------------------------------------------------------
  financial_year:
    column: financial_year_short
    canonical_column: financial_year
    stored_form: "char(7) short form '2025-26'; char(9) canonical form '2025-2026'"
    distinct_in_scheme: 2
    distinct_in_dim_year: 4
    sql_predicate: "financial_year_short = '<canonical>'"
    critical: true
    sparsity_warning: >
      Focus Plus occupies only TWO of dim_year's four rows. FY 2023-24 and FY 2024-25
      hold NO Focus Plus data at all. A year-over-year trend is two points with a
      three-year gap - never draw a line through it.
    values:
    - canonical: "2022-23"
      canonical_long: "2022-2023"
      year_key: 2022
      records: 93286
      tranches: ['Tranch 1']
      amount_per_payment: 5000
      aliases: ["FY 2022-23", "2022-2023", "2022 23", "FY23", "F.Y. 2022-23", "2022"]
      note: The only year at the 5000 rate, and the only tranche outside FY 2025-26.
    - canonical: "2025-26"
      canonical_long: "2025-2026"
      year_key: 2025
      records: 292385
      tranches: ['Tranch 2 - August', 'Tranch 3 - December', 'Tranch 4 - Feb-March']
      amount_per_payment: 2500
      aliases: ["FY 2025-26", "2025-2026", "2025 26", "FY26", "F.Y. 2025-26", "2025",
                current year, this year, latest year]
    absent_years:
      values: ["2023-24", "2024-25"]
      behaviour: >
        These exist in dim_year but hold no Focus Plus rows. Resolve them, then return an
        empty result with an explanation - do not return not_found, and do not silently
        widen the filter.
    no_calendar_year:
      critical: true
      text: >
        UNLIKE PMAY, THERE IS NO CALENDAR-YEAR READING. Focus Plus has no date column at
        all, so a bare year cannot be bucketed by calendar. A bare "2025" resolves to
        FY 2025-26 with that stated. There is no year_disambiguation section in this file
        because there is no second reading to disambiguate against.
    year_note_warning: >
      dim_year.data_quality_note is scheme-blind. Both current notes are MGNREGA facts,
      and 2025-26 carries one. Do NOT surface it on a Focus Plus answer.

  tranche_label:
    column: tranche_label
    stored_case: exact - "Tranch", not "Tranche". Do not correct the spelling.
    distinct: 4
    closed_set: true
    nulls: 0
    sql_predicate: "tranche_label = '<canonical>'"
    critical: true
    not_time:
      critical: true
      text: >
        THE MOST INVITING WRONG READING IN THIS SCHEMA. The labels embed month words -
        August, December, Feb-March - and look like a timeline. They are label text. The
        extract cannot guarantee they sort chronologically and there is no date column to
        check them against. NEVER order by tranche_label as a series, never build a
        monthly view from it, and never resolve a bare month name to a tranche.
    values:
    - canonical: "Tranch 1"
      records: 93286
      financial_year: "2022-23"
      amount: 5000
      batches: ["93K"]
      aliases: ["tranche 1", "tranch1", "T1", "first tranche", "1st tranche", "tranche one"]
    - canonical: "Tranch 2 - August"
      records: 93286
      financial_year: "2025-26"
      amount: 2500
      batches: ["93K"]
      aliases: ["tranche 2", "tranch2", "T2", "second tranche", "2nd tranche", "tranche two"]
      month_word_warning: The word August is part of the label, not a date filter.
    - canonical: "Tranch 3 - December"
      records: 93286
      financial_year: "2025-26"
      amount: 2500
      batches: ["93K"]
      aliases: ["tranche 3", "tranch3", "T3", "third tranche", "3rd tranche", "tranche three"]
      month_word_warning: The word December is part of the label, not a date filter.
    - canonical: "Tranch 4 - Feb-March"
      records: 105813
      financial_year: "2025-26"
      amount: 2500
      batches: ["93K", "12.5K"]
      aliases: ["tranche 4", "tranch4", "T4", "fourth tranche", "4th tranche", "tranche four"]
      note:
        critical: true
        text: >
          THE ONLY TRANCHE CONTAINING BOTH COHORTS - 93,286 legacy plus the whole 12,527
          registration batch. A four-way tranche breakdown is therefore not a clean split,
          and reading Tranch 4's larger count as growth is wrong. Split by batch_label
          whenever a per-tranche comparison is made.
      month_word_warning: Feb-March is part of the label, not a date range.

  # ---- geography --------------------------------------------------------
  district:
    name_column: lgd_district
    code_column: none_in_curated_layer
    stored_case: UPPERCASE in curated.dim_geography
    case_note: >
      The canonical names below are kept in Title Case for display and matching - emit
      the uppercase form in the predicate.
    distinct: 12
    complete: true
    collisions: none
    sql_predicate: "lgd_district = UPPER('<canonical>')"
    sql_predicate_by_code: null
    code_note: >
      dim_geography carries village_code only. The lgd_code values below resolve a code
      the user typed to a district name, but the code can never appear in a WHERE clause.
      A question asking for a district's LGD code is unanswerable.
    cohort_note:
      critical: true
      text: >
        SIX DISTRICTS ARE LEGACY-ONLY. Eastern West Khasi Hills, East Jaintia Hills,
        Ri Bhoi, South West Khasi Hills, West Jaintia Hills and West Khasi Hills have
        records_registration = 0. A district breakdown filtered to the 12.5K cohort
        returns SIX rows, not twelve, and that is correct - not missing data.
    alias_provenance: >
      canonical, lgd_code, acronym, region and the alias lists are the conformed
      Meghalaya geography, shared with pmay_entity_resolver.yaml. The record counts are
      Focus Plus figures from the source CSV.
    beneficiaries_legacy_note: >
      records_legacy divided by 4, since the legacy cohort carries one row per tranche.
      This is the figure comparable to the use-case workbook - see workbook_conflict below.
    workbook_conflict:
      critical: true
      text: >
        Ten of the twelve district figures reproduce the use-case workbook exactly. TWO DO
