  block:
    name_column: lgd_block
    code_column: none_in_curated_layer
    stored_case: UPPERCASE in curated.dim_geography
    case_note: >
      Same as district - dim_geography stores block UPPERCASE. Canonical names below stay
      Title Case for matching; emit the uppercase form.
    distinct: 50
    distinct_raw_in_source: 77
    integrity: >
      Verified in the source: no block appears in more than one district. The 77 raw
      strings collapse to 51 on folding, of which one is the null-text 'Nan' - leaving 50
      real blocks.
    trailing_space_finding:
      critical: true
      text: >
        26 OF THE 77 RAW BLOCK STRINGS DIFFER FROM ANOTHER ONLY BY A TRAILING SPACE, and
        the spaced variant is always the 12.5K cohort - 'Tikrikilla' 28,504 rows against
        'Tikrikilla ' 1,618. Folding without a trim splits the block in two and halves the
        answer. This is a SOURCE artefact; dim_geography is expected to have cleaned it.
        If a query against megh_db returns a trailing-space block, the ingest did not
        clean it and this catalogue must be revised.
    sql_predicate: "lgd_block = UPPER('<canonical>')"
    sql_predicate_by_code: null
    scope_by_district_when_given: true
    disambiguation: >
      19 of these names are also village names. Apply
      cross_dimension_collisions.disambiguation_rules.
    municipal_boards:
      note: >
        Five entries are municipal boards, not C&RD blocks - Baghmara-Municipal Board,
        Resubelpara-Municipal Board, Tura Municipal Board-Municipal Board,
        Williamnagar-Municipal Board and Shillong-Municipal Board. They carry
        entity_type = 'Ward' in dim_geography. All five are 12.5K-cohort only. A bare stem
        resolves to the C&RD block; the board requires "municipal board", "MB", "town" or
        "ward".
      doubled_suffix: >
        "Tura Municipal Board-Municipal Board" is stored with the suffix twice. It is the
        stored value - match it, do not tidy it.
    excluded_values:
      - value: "Nan"
        records: 4
        reason: >
