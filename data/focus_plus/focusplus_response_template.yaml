# focusplus_response_template.yaml
#
# ===========================================================================
# v1.0 - 2026-09-03 - WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Focus Plus was loaded straight into curated on 2026-09-02, so there is no
# flat-table ancestor and no wording to retire.
#
# SIX CAVEATS MUST TRAVEL WITH THE NUMBERS. They are the reason this file
# exists, and every one of them is a Focus-Plus-only problem:
#
#   1. THE UNIT IS UNCONFIRMED. amount_disbursed has no documented unit and no
#      known precision. Never print a currency symbol or a converted figure
#      until curated.dim_scheme.money_unit has been read.
#   2. COUNT(*) IS PAYMENTS, NOT PEOPLE. A legacy member appears on four rows.
#      Every count sentence says which it is.
#   3. SIX COLUMNS COVER 3.2% OF ROWS. Any gender, occupation or status answer
#      names the cohort and the denominator, or it is wrong by construction.
#   4. PAID VERSUS UNPAID IS INFERRED FROM THE BATCH, not read from a column.
#      Say so every time an answer rests on it.
#   5. TIME IS TWO POINTS AND A GAP. FY 2022-23 and FY 2025-26 only.
#   6. NOTHING IS VERIFIED AGAINST THE DATABASE YET. Every Focus Plus figure
#      is provisional until meta.v_reconciliation_focus_plus has been run.
# ===========================================================================
#
# Response templates for Focus Plus - node 5.15, the response composer.
# Editable by analysts - no code change needed.
# Numbers are locked from the result set; templates only shape the wording around them.

response_templates:

  # ---- how the answer text is shaped ------------------------------------
  formatting:
    number_format: "indian"              # 3,85,671 not 385,671
    currency_symbol: "₹"
    currency_symbol_rule: >
      DO NOT PRINT THE SYMBOL UNTIL THE UNIT IS KNOWN. It is defined here for the case
      where dim_scheme confirms rupees. If the unit is unconfirmed, print the bare number
      and the unit_unconfirmed line instead.
    decimal_places: 2
    percent_decimal_places: 2
    financial_year_format: "YYYY-YY"     # 2025-26; a STORED column, never derived
    date_format: none
    date_format_rule: >
      THERE IS NO DATE COLUMN IN THIS SCHEME. No answer may print a payment date, a month
      or a calendar range. The finest time detail is the financial year. Never render a
      tranche label as a date, even though the labels contain month words.
    money_unit: as_stored
    money_unit_authority: curated.dim_scheme.money_unit
    money_unit_warning: >
      UNLIKE PMAY, THE UNIT IS NOT KNOWN. curated.v_pmay is RUPEES, MGNREGA expenditure is
      LAKH, and the monthly and cross-scheme views are CRORE - but amount_disbursed is a
      bare numeric with no documented unit and no known precision. Read
      curated.dim_scheme.money_unit for the Focus Plus row before formatting or
      converting. If it does not answer, report the figure as stored and say the unit is
      unconfirmed. Never divide by 1e7 on an assumption, and never add a Focus Plus figure
      to a PMAY or MGNREGA one.
    show_unit_always: true
    show_assumptions: true               # surface the defaults that fired
    geography_display_case: "title"      # dim_geography stores district and block
                                         # UPPERCASE - title-case them for display,
                                         # but filter with the uppercase literal
    village_display_case: "as_stored"    # village names are NOT uppercased
    null_display: "not recorded"
    null_person_column_display: "not collected for this batch"
    null_person_column_rule: >
      On gender, occupation, focus_status, verification_status, member_id and pincode,
      NULL means the column was not collected for the legacy cohort - not that the value
      is unknown for an individual. Never render it as 'Unknown' or 'Other', which would
      imply it was asked and not answered.
    zero_display: "0"                    # a recorded zero is a real value, not a blank
    tie_behaviour: "show_all"
    empty_result_message: "No Focus Plus payments for that selection."
    no_placeholder_filter: >
      Focus Plus has no placeholder flag, so no rows are silently excluded from counts.
      Do not carry PMAY's placeholder wording across - there is nothing to exclude and
      nothing to mention.
    count_grain_rule: >
      COUNT(*) IS A PAYMENT COUNT. Every count sentence must say whether it is counting
      payments, members or beneficiaries. Never let a bare "beneficiaries" stand.
    cohort_statement_rule: >
      Any answer touching gender, occupation, focus_status, verification_status or
      member_id must name the batch and give the denominator in the same sentence.
    person_level_rule: >
      RULE 7. This is the only person-level data in the database. Aggregate before
      display. Never print member_id or pincode, never list individual rows, and never
      name a person - the name columns were dropped at ingest anyway.
    provisional_rule: >
      No Focus Plus total has been verified against the database. Attach the provisional
      line to any headline figure until meta.v_reconciliation_focus_plus has been run.
    max_rows_inline: 20

  # =======================================================================
  templates:

    # ---- result shapes --------------------------------------------------
    single_value: "{metric} for {scope} in {period} is {value}."
    multi_metric: "For {scope} in {period}: {metric_list}."
    payment_count: "{scope} has {value} Focus Plus payments in {period}."
    member_count: "{value} members are recorded in {scope}, from the {batch} batch."
    payments_and_members: "{scope} has {payments} payments covering {members} members."
    beneficiary_count_qualified: "{value} {reading} in {scope} - {qualifier}."
    average_value: "Average {metric} per {denominator} for {scope} in {period} is {value}."
    ratio_value: "{metric} for {scope} in {period} works out to {value}."
    share_percentage: "{metric} for {scope} in {period} is {value}%."
    proportion_of_total: "{scope} accounts for {value}% of the state total for {metric} in {period}."
    amount_per_member: "{scope} disbursed {amount} across {members} members, {value} each on average."

    ranked_list: "Top {n} {entity} by {metric} in {period}:"
    bottom_list: "Bottom {n} {entity} by {metric} in {period}:"
    extremes: "Highest is {top_entity} at {top_value}; lowest is {bottom_entity} at {bottom_value}."
    rank_position: "{scope} ranks {rank} of {total} {entity} by {metric} in {period}."
    tie_at_top: "{tied_entities} are level at {value}."

    breakdown: "{metric} by {level} for {period}:"
    batch_breakdown: "Focus Plus payments in {scope} by batch:"
    tranche_breakdown: "Focus Plus payments in {scope} by batch and tranche:"
    gender_breakdown: "Gender of Focus Plus members in {scope}, newer registration batch only:"
    occupation_breakdown: "Occupation of Focus Plus members in {scope}, newer registration batch only:"
    status_breakdown: "Application status of Focus Plus registrations in {scope}:"
    year_comparison: "Focus Plus payments in {scope}: {value_a} in 2022-23 and {value_b} in 2025-26."
    comparison: "{entity_a} {value_a} against {entity_b} {value_b} - a difference of {change}."
    period_comparison: "{metric} for {scope}: {value_a} in {period_a} against {value_b} in {period_b}."
    cross_tab: "{metric} by {row_dimension} and {column_dimension}:"

    entity_list: "{entity} in {scope}:"
    year_list: "Financial years available: 2022-23 and 2025-26."
    coverage_statement: "Focus Plus reaches {districts} districts, {blocks} blocks and {villages} villages."
    village_coverage: "{value} villages in {scope} have Focus Plus payments recorded."

    # ---- situations that need specific wording ---------------------------
    empty_result: "No {metric} recorded for {scope} in {period}."
    all_zero_result: "{scope} recorded zero {metric} in {period}. The zero is a real recorded value, not missing data."
    no_data_in_source: "{scope} has {available} recorded but no {requested}, so there is nothing to report rather than a zero."
    partial_coverage: "{covered} of {requested_total} {entity} have {metric} recorded; the rest are not reported rather than zero."
    unavailable_in_source: "{requested} is not held in this data."
    withheld_column: "{requested} is not available through the approved query surface for Focus Plus."
    permission_denied: "That level of detail is above your access. The finest level available to you is {allowed_level}."
    execution_failed: "The query could not be completed. Please try a narrower period or a smaller area."

    # ---- lines that travel alongside the answer --------------------------
    # The six mandatory caveats come first. They are not optional garnish.

    unit_statement: "Amounts are in {unit}."
    unit_unconfirmed: "The unit for Focus Plus amounts is not confirmed in the database, so the figure is shown as stored."
    unit_never_mixed: "Focus Plus, PMAY and MGNREGA record money in different units, so these figures cannot be added together."

    payment_grain_note: "One row is one payment, so this counts payments rather than people - a member paid in four tranches counts four times."
    member_grain_note: "Members are counted by member ID, which is recorded for the newer registration batch only."
    beneficiary_ambiguity_note: "'Beneficiaries' can mean payments ({payments}), members with an ID ({members}), or the {legacy} legacy paid members, which the database can no longer count directly."
    legacy_serial_note: "The legacy count uses the source serial number, which is a file serial rather than a person identifier."

    cohort_coverage_note: "This covers the newer registration batch only - {covered} of {total} records, about {pct}%."
    cohort_not_scheme_wide: "Gender, occupation and status are recorded only for the newer registration batch, so this is not a scheme-wide figure."
    legacy_no_attributes_note: "The {value} legacy payments carry no gender, occupation or status and are not in this breakdown, though they remain in the totals."

    paid_unpaid_inferred: "No field records whether a member has been paid. This split reads the legacy batch as paid and the newer batch as awaiting payment, which is an inference."
    backlog_overstated_note: "Some members in the newer batch were already paid in the legacy batch, so this figure overstates the backlog. That overlap can no longer be measured."
    approved_not_paid_note: "'Approved' here means the registration was approved, not that a payment was made."
    verification_constant_note: "Verification status reads 'Approved' on every record that has it, so it cannot split the results."

    two_points_not_a_trend: "Focus Plus holds only two financial years, 2022-23 and 2025-26, so this is two points rather than a trend."
    no_date_note: "Focus Plus has no payment date - the finest time detail held is the financial year."
    tranche_not_time_note: "Tranche labels contain month names but are not dates, so they are shown as categories rather than a sequence."
    tranche_four_merged_note: "Tranch 4 contains both batches, so its larger total is a merge of two groups rather than growth."
    two_rate_note: "Tranch 1 paid {rate_a} and the later tranches {rate_b}, so there is no single standard payment."
    average_is_mix_note: "An average across payments would just mix the two tranche rates, so this is the total divided by the number of members instead."

    provisional_total: "Focus Plus totals have not yet been verified against the database, so this figure is provisional."

    # ---- the rest -------------------------------------------------------
    assumption_prefix: "Assumed: {assumptions}."
    batch_scope_note: "This covers the {batch} batch."
    both_batches_note: "This covers both batches - the legacy paid batch and the newer registration batch."
    six_districts_note: "The newer registration batch reaches six districts, so a breakdown of it returns six rows rather than twelve."
    village_identity_note: "Villages are counted by LGD code, since {shared} village names are shared by more than one village."
    unmapped_village_note: "About a quarter of records carry no village code, so village and block figures may be incomplete."
    geo_conflict_excluded: "{excluded} villages have conflicting district or block records between sources and are excluded, because this answer depends on where the payment landed."
    geo_conflict_included: "Villages with conflicting district or block records are included, resolved to the official roster value."
    ward_included_note: "This includes urban wards as well as villages."
    region_expansion_note: "{region} covers {districts}."
    region_lopsided_note: "Garo Hills accounts for about three quarters of all Focus Plus payments, so a regional comparison is heavily weighted."
    district_code_unavailable: "District and block are held as names only - there is no LGD code for them in this data."
    unresolved_year_note: "{value} payments could not be matched to a financial year and are reported separately."
    singleton_category_note: "'{category}' holds a single record, so a percentage or trend on it would not be meaningful."
    small_denominator_note: "This is based on {denominator} records, which is a small base for a percentage."
    entity_not_found: "'{value}' is not in the Focus Plus data. Closest matches: {suggestions}."
    ambiguous_entity_resolved: "Read '{value}' as {resolved} in {district}. There are {count} places with that name."
    colliding_name_resolved: "Read '{value}' as a block. It is also the name of a village - say 'village {value}' for that reading."
    municipal_board_note: "Read '{value}' as the C&RD block. There is also a municipal board of that name - say 'municipal board' for that reading."
    outside_data_span: "No Focus Plus payments are recorded for {period}. The data covers 2022-23 and 2025-26, with nothing in between."
    cross_scheme_caveat: "The schemes measure different things - {measure_semantics}."
    cross_scheme_absent: "Focus Plus does not appear in the cross-scheme comparison view, so this covers {schemes_present} only."
    cross_scheme_coverage_note: "Focus Plus is aggregated to village level and added on, since the coverage view does not carry it."
    threshold_breach: "{scope} is below {threshold} at {value}."
    threshold_pass: "{scope} is at or above {threshold} at {value}."
    outlier_note: "{entity} is well clear of the rest and pulls the average up."
    large_result: "Showing the first {shown} of {total} rows."
    aggregate_only_note: "Focus Plus records identify individual people, so this is reported as an aggregate."

  # =======================================================================
  follow_up_rules:

    # ---- move up or down the hierarchy ----------------------------------
    - condition: "result_is_statewide"
      suggestion: "Split this by district?"

    - condition: "result_by_district"
      suggestion: "Break this down by block?"

    - condition: "result_by_block"
      suggestion: "Break this down by village?"

    - condition: "result_is_single_village"
      suggestion: "Compare this against the rest of the block?"

    - condition: "result_is_single_district"
      suggestion: "See how this compares with the other districts?"

    - condition: "result_is_region"
      suggestion: "See the districts inside that region separately?"

    - condition: "result_includes_wards"
      suggestion: "Separate the urban wards from the villages?"

    # ---- move across the cohorts ----------------------------------------
    - condition: "result_covers_both_batches"
      suggestion: "Split this by batch - the legacy paid group against the newer registrations?"

    - condition: "result_is_legacy_batch_only"
      suggestion: "See the newer registration batch alongside it?"

    - condition: "result_is_registration_batch_only"
      suggestion: "See how this compares with the legacy paid batch?"

    - condition: "result_is_batch_breakdown"
      suggestion: "Break either batch down by district?"

    # ---- move across time -----------------------------------------------
    - condition: "result_has_single_year"
      suggestion: "Compare this against the other financial year?"

    - condition: "result_is_year_comparison"
      suggestion: "See which districts account for the difference?"

    - condition: "result_is_tranche_breakdown"
      suggestion: "Split the tranches by batch, since Tranch 4 holds both?"

    # ---- move across measures -------------------------------------------
    - condition: "result_is_payment_count"
      suggestion: "See the amount disbursed alongside it?"

    - condition: "result_is_member_count"
      suggestion: "See the payment count alongside it?"

    - condition: "result_is_amount"
      suggestion: "See this per member, or broken down by tranche?"

    - condition: "result_is_gender_breakdown"
      suggestion: "Cross this with occupation, or with district?"

    - condition: "result_is_occupation_breakdown"
      suggestion: "Cross this with gender, or with district?"

    - condition: "result_is_status_breakdown"
      suggestion: "See the pending registrations by district?"

    - condition: "result_is_paid_unpaid_split"
      suggestion: "See the districts where the newer batch has no presence yet?"

    - condition: "result_is_village_list"
      suggestion: "See which of these villages also receive PMAY or MGNREGA?"

    # ---- work with the list just returned --------------------------------
    - condition: "result_is_ranked_list"
      suggestion: "Extend this to the full list, or reverse it to show the lowest?"

    - condition: "result_is_ranked_list_top_n"
      suggestion: "See the top 10 instead?"

    - condition: "result_has_tie"
      suggestion: "Break the tie on amount disbursed?"

    - condition: "result_has_outlier"
      suggestion: "See the figures without {entity}?"

    - condition: "result_row_count_exceeds_display"
      suggestion: "Narrow this to one district, or see it as a chart?"

    - condition: "result_is_cross_tab"
      suggestion: "See this as a chart, or pick one dimension?"

    # ---- follow the caveat that was just stated --------------------------
    - condition: "answer_stated_unconfirmed_unit"
      suggestion: "Check the recorded unit for Focus Plus in the scheme dimension?"

    - condition: "answer_stated_payment_grain"
      suggestion: "See the member count instead of the payment count?"

    - condition: "answer_stated_cohort_coverage"
      suggestion: "See the payment figures instead, which cover both batches?"

    - condition: "answer_stated_paid_unpaid_inference"
      suggestion: "See the batch breakdown the inference rests on?"

    - condition: "answer_stated_two_points"
      suggestion: "Break this down by batch and tranche instead?"

    - condition: "answer_stated_provisional"
      suggestion: "Run the Focus Plus reconciliation check before this figure is used?"

    - condition: "answer_excluded_geo_conflict_villages"
      suggestion: "See which villages were excluded?"

    - condition: "answer_noted_unmapped_villages"
      suggestion: "Keep this at district level, where the mapping gap does not apply?"

    # ---- recover from a thin or failed answer ----------------------------
    - condition: "result_is_empty"
      suggestion: "Widen this to the whole district, or to both financial years?"

    - condition: "result_is_all_zero"
      suggestion: "See a district that does have Focus Plus payments recorded?"

    - condition: "entity_not_found"
      suggestion: "Try one of the closest matches?"

    - condition: "entity_resolved_by_assumption"
      suggestion: "Use the other reading instead?"

    - condition: "result_has_partial_coverage"
      suggestion: "See how many records are missing that detail?"

    - condition: "measure_unavailable_in_source"
      suggestion: "See what the data does hold for {scope}?"

    - condition: "producer_group_requested"
      suggestion: "Use district, block or village as the grouping instead?"

    - condition: "account_number_or_ifsc_requested"
      suggestion: "See the payments by bank name instead?"

    - condition: "person_lookup_requested"
      suggestion: "See the aggregate figures for that village or block?"
