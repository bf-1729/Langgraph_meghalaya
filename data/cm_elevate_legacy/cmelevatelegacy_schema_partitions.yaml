  - {scheme: Meghalaya Any Business Venture Scheme,              records: 33,   sanctioned_cr: 7.38,  disbursed_cr: 5.38,  disbursed_pct: 73.0, with_subsidy: 30,   with_loan: 27,  fixed_entitlement: null, financial_years: ['2024-25']}
  - {scheme: Meghalaya Common Facility Center Scheme,            records: 27,   sanctioned_cr: 7.76,  disbursed_cr: 4.42,  disbursed_pct: 57.0, with_subsidy: 21,   with_loan: 23,  fixed_entitlement: null, financial_years: ['2024-25']}
  - {scheme: Meghalaya Sports & Wellness Scheme,                 records: 9,    sanctioned_cr: 11.76, disbursed_cr: 5.87,  disbursed_pct: 49.9, with_subsidy: 7,    with_loan: 3,   fixed_entitlement: null, financial_years: ['2024-25']}
  - {scheme: Meghalaya Motorcaravan Scheme,                      records: 1,    sanctioned_cr: 0.50,  disbursed_cr: 0.50,  disbursed_pct: 100.0, with_subsidy: 1,   with_loan: 1,   fixed_entitlement: 5000000, financial_years: ['2024-25']}
  readings_the_generator_must_respect:
  - "BIGGEST IS AMBIGUOUS. Piggery is the largest by records (1,353 of 2,823) and Agriculture Warehouse by money (Rs 44.34 Cr of Rs 142.74 Cr). A 'biggest scheme' question must say which measure it used."
  - "SERICULTURE SPINNING HAS NO SUBSIDY AT ALL - 0 of 198 records - and only 2 loans. Its Rs 26,000 of disbursement comes from those two. Never describe it as underperforming without saying nothing was paid out at all."
  - "GOAT FARMING HAS NO LOANS AT ALL - 0 of 48. A loan breakdown that shows Goat at zero is correct, not a gap."
  - "PARV and Prime Tourism Vehicle pay subsidy and loan on the SAME records (135/135 and 78/78), so for those two schemes subsidy and loan are two halves of one package rather than alternatives."
  - "Piggery takes loans on 211 of 1,353 records and Poultry on 219 of 454 - a far higher rate in the smaller scheme. A statewide 'how many took loans' figure hides that."

# ===========================================================================
# DATA-QUALITY REGISTER
# Every anomaly found in this scheme, with the source_row_id that anchors it.
# The register exists so an answer can name a specific record rather than
# gesture at "some rows".
# ===========================================================================
data_quality_register:
  provenance: source workbook, profiled 2026-09-23 (unverified_in_db)
  in_the_database:
  - id: DQ-01
    rows: [1351, 1355, 1378, 1556]
    column: subsidy_disbursement_date_1
    finding: "Corrupted century in the source - literal strings 1015-01-15, 1014-11-06, 1014-11-20, 1015-02-18. All four are Piggery."
    loaded_as: NULL
    money_affected: false
    money_note: all four amounts are intact at exactly Rs 31,250
    recorded_in_db_comment: true
    handling: Do not guess a corrected date. A date filter silently drops these four; a money total over the same filter is still complete.
  - id: DQ-02
    rows: [532]
    column: loan_disbursement_date_1
    finding: "A loan dated 1985-07-22 against a real Rs 20,000 Piggery loan, 39 years before the scheme existed."
    loaded_as: as stored - it parses as a valid date
    recorded_in_db_comment: false
    handling: "MIN(loan_disbursement_date_1) returns 1985. Caveat every date extremum, and raise this row with the data owner."
  - id: DQ-03
    rows: [1602, 1696]
    column: subsidy_disbursement_date_1
    finding: "Dated 2026-09-04, one day AFTER the extract's own created_date of 2026-09-03."
    loaded_as: as stored
    recorded_in_db_comment: false
    handling: A payment cannot post-date the file that reports it. Treat MAX() as suspect.
  - id: DQ-04
    rows: [321, 354, 376, 1760]
    column: total_disbursement
    finding: "Disbursed more than sanctioned. Three are Prime Tourism Vehicle, one Poultry."
    recorded_in_db_comment: false
    handling: Report as recorded and flag. A derived pending amount goes negative on these four - do not clamp it.
  - id: DQ-05
    rows: [2403, 2411, 2425]
    column: sanctioned_amount
    finding: "No sanctioned amount at all. All three are refusals under Meghalaya Any Business Venture Scheme with a written reason."
    handling: The blank is explained by the refusal, not by a load fault. Excluded from averages, never counted as zero.
  - id: DQ-06
    rows: [2823]
    column: every money column
    finding: "A record with a sanctioned amount of 62,726 and nothing else - no disbursement, no dates, no financial year, no lender, no village."
    handling: Present in the database as a row of NULLs. Not a placeholder flag - this scheme has none.
  - id: DQ-07
    rows: [429]
    column: refused_reason_text
    finding: "Carries desanctioned_reason_raw = 'Refused' AND refused_flag_raw = TRUE but a BLANK reason - and still received Rs 62,500."
    recorded_in_db_comment: true
    handling: The fifth candidate the database comment mentions. A missing reason does not mean a missing refusal.
  - id: DQ-08
    rows: [1415]
    column: desanctioned_reason_raw
    finding: "Marked 'Duplicate' with reason 'Repeated name' and the refusal flag set - and received Rs 62,500 anyway."
    handling: The clearest single example of refusal and payment coexisting.
  - id: DQ-09
    rows: [1894]
    column: application_number
    finding: "A Poultry record carrying MPDSI001154, which is Piggery's prefix everywhere else."
    recorded_in_db_comment: partially
    correction:
      critical: true
      text: "The database comment on dim_cm_elevate_disb_scheme.application_id_prefixes cites this row as id=2045. That is wrong - id=2045 is an ordinary MPFSI000961. The correct row is source_row_id 1894."
  not_in_the_database:
  - id: DQ-10
    rows: [2392]
    finding: "The one QUARANTINED record - reason corrupted_identity. Its name fields read '4' / 'For' / 'All', i.e. the team name '4 For All', under MSWCS000042, Meghalaya Sports & Wellness Scheme."
    handling:
      critical: true
      text: "Very likely a real organisation name rather than corruption. If so this scheme is short one record and Sports & Wellness is understated. Raise with the data owner; never reverse the quarantine in SQL. Any Sports & Wellness total should carry the caveat."
  population_level:
  - id: DQ-11
    rows_affected: 395
    finding: "No financial year - and they are EXACTLY the two Sericulture schemes, 198 spinning plus 197 weaving, with no record from any other scheme."
    handling: A financial-year grouping removes Sericulture entirely rather than scattering stragglers. Report the bucket or say the schemes are excluded.
  - id: DQ-12
    rows_affected: 114
    finding: "The stated financial year disagrees with the year implied by the first subsidy date - 77 stated 2024-25 deriving to 2025-26, 34 the other way, 2 to 2026-27, 1 to 2023-24."
    handling: Never derive an FY from a date. An FY answer and a date-range answer over the same period will not reconcile.
  - id: DQ-13
    rows_affected: 404
    finding: "No village - the locality could not be matched to any roster entry. District and block are known on all of them."
    handling: Keep in district and state totals, exclude from village answers, state the count.
  - id: DQ-14
    rows_affected: 401
    finding: "No loan entity recorded, and 19 of those carry loan money anyway."
    handling: COALESCE the grouping so the bucket stays visible.
  - id: DQ-15
    rows_affected: 449
    finding: "Zero disbursement against a real sanction. 195 are Sericulture spinning, 172 weaving."
    handling: A recorded zero, not missing data. Test with = 0, never IS NULL.

# ===========================================================================
# WHAT THIS PARTITION CAN AND CANNOT ANSWER
# Mapped against the 36 use cases in Use_Cases_-_CM_Elevate.xlsx so a
# retrieval hit can be checked against the source of the request.
# ===========================================================================
use_case_coverage:
  workbook: datasets/CMelevate Legacy/Use_Cases_-_CM_Elevate.xlsx
  total_cases: 36
  answerable: 18
  answerable_with_clarification: 8
  not_answerable: 10
  bands:
  - band: programme narrative
    cases: [TC-01, TC-02, TC-03, TC-04, TC-05, TC-06, TC-07, TC-08, TC-09, TC-10]
    verdict: NOT ANSWERABLE
    reason: >
      Objectives, beneficiaries, sectors, credit design, entrepreneurship framing, target
      numbers, the application process - none of it is in this data and there is no
      scheme document in this folder. Do not answer from general knowledge.
  - band: counts and scheme mix
    cases: [TC-11, TC-12, TC-13]
    verdict: ANSWERABLE
    note: TC-13 "which schemes have the highest number" needs the biggest-is-ambiguous caveat.
  - band: sanction status
    cases: [TC-14, TC-15, TC-16, TC-19, TC-35]
    verdict: NOT ANSWERABLE AS WRITTEN
    reason: >
      TC-14 and TC-19 become "every record here is a sanction record" plus a count.
      TC-15 (sanction rate), TC-16 (not sanctioned) and the sanctioned half of TC-35 are
      refusals - see semantic_rules.sanction_status_rule.
  - band: money
    cases: [TC-17, TC-18, TC-24, TC-27, TC-30, TC-32]
    verdict: ANSWERABLE AFTER CLARIFICATION
    reason: every one of them says "disbursed" without saying which of the three.
  - band: loan entity
    cases: [TC-20, TC-21, TC-22]
    verdict: ANSWERABLE
    note: carry the 401-record unattributed bucket into the answer.
  - band: financial year
    cases: [TC-23, TC-25]
    verdict: ANSWERABLE
    note: two years only, and Sericulture is absent from both.
  - band: geography
    cases: [TC-26, TC-28, TC-29, TC-33, TC-34, TC-36]
    verdict: ANSWERABLE
    note: TC-34 (village drill-down) must exclude the 404 unresolved records and say so.
  - band: constituency
    cases: [TC-31, TC-32]
    verdict: ANSWERABLE THROUGH THE DIM_GEOGRAPHY JOIN
    reason: >
      The view exposes no constituency column, but geography_key is a declared FK to
      dim_geography, which holds ac_name / ac_number. The join reproduces the source's
      mapped_constituency_name exactly (Mairang 52 = 52; 2026-09-25 use-case QA).
  vocabulary_warning:
    critical: true
    text: >
      The workbook calls every row an "application" and the programme "CM-ELEVATE". The
      grain here is one applicant's sanction-and-disbursement record, and "CM-ELEVATE"
      names a DIFFERENT scheme in this warehouse. Never adopt the workbook's wording in
      an answer without translating it.

# ===========================================================================
semantic_rules:

  scheme_disambiguation:
    critical: true
    text: >
      "CM Elevate" names two different schemes in megh_db. This partition is the
      DISBURSEMENT scheme (curated.v_cm_elevate_disbursement, 13 sub-schemes,
      money and financial year). The other is the APPLICATION scheme
      (curated.v_cm_elevate, 15 sub-schemes, no money and no time). They share no
      identifier and the join between their facts is prohibited.
    runtime_behavior: >
      A bare "CM Elevate" question that needs money, disbursement, sanction,
      loan or financial year belongs here. One that needs application status,
      applicant category, on-hold or withdrawal belongs to the other partition.
      A question that needs both cannot be answered by either and must be refused.
      A sanction RATE is answered here as the share of THIS dataset's records carrying
      a sanctioned amount, with the caveat that never-sanctioned applications live in
      the other dataset (2026-09-25 use-case QA).

  geography_hierarchy:
  - lgd_district
  - lgd_block
  - lgd_village_name

  geography_codes:
  - village_code
  geography_codes_note: >
    Only the village code survives into the curated layer. The source workbook's
    district and block codes are used at load and then dropped, so a question
    asking for a district or block LGD code cannot be answered.

  geography_unresolved_rule:
    critical: true
    text: >
      404 source rows (14.3%) have no village and resolve to an Unresolved
      placeholder. They are included at district grain so money and count totals
      reconcile to the source file, and they must be EXCLUDED from every
      village-count and village-list answer with
      `AND entity_type <> 'Unresolved'`. State how many rows were set aside
      whenever that predicate fires.

  constituency_rule: >
    The source workbook carries mapped_constituency_name, and dim_geography
    carries ac_name / ac_number, but neither the fact nor the view exposes a
    constituency column on this scheme. Constituency questions (use cases TC-31,
    TC-32) are answered by joining curated.dim_geography on geography_key and
    filtering g.ac_name - the same route Focus Legacy uses (2026-09-25 use-case QA). Records with
    no village carry no constituency.

  time_dimension: financial_year
  time_dimensions_available: [financial_year, financial_year_short, year_key]
  time_detail_columns: [subsidy_disbursement_date_1, subsidy_disbursement_date_2, subsidy_disbursement_date_3, loan_disbursement_date_1, loan_disbursement_date_2, loan_disbursement_date_3]
  time_runtime_rule:
    critical: true
    text: >
      A financial-year question uses the stored financial_year column, which comes
      from the source's stated FY label. Do NOT derive a financial year from any
      disbursement date. The two disagree: on 114 of 1,842 comparable source rows
      the stated FY and the date-derived FY are different years, and 9 rows carry a
      real date with no stated FY at all. Focus Legacy's equivalent check found
      zero mismatches - this scheme is the opposite case. An FY answer and a
      date-range answer over the same period will not reconcile, and if a question
      asks for both, say so rather than presenting one as the other.
  time_null_rule: >
    year_key, financial_year and every disbursement date are nullable. 395 source
    rows (14%) have no financial year. A GROUP BY or WHERE on time drops them
    silently - count them and say so in the answer.
  time_monthly_rule: >
    MONTHLY ANALYSIS IS NOT AVAILABLE. The source's month column is not loaded,
    and it holds only four values across two financial years - it is a
    disbursement-batch label, not a time series. Do not offer a monthly trend, and
    do not synthesise one from the disbursement dates without saying that the
    dates disagree with the stated financial year.

  disbursement_ambiguity:
    critical: true
    text: >
      "Disbursed" is a THREE-WAY ambiguity in this scheme and "sanctioned" is a
      fourth number that is not disbursement at all:
        total_subsidy_disbursement  - grant paid            Rs 52.57 Cr
        total_loan_disbursement     - credit extended       Rs 30.33 Cr
        total_disbursement          - the two together      Rs 82.90 Cr
        sanctioned_amount           - approved, not paid    Rs 142.74 Cr
      (source workbook, unverified_in_db)
    runtime_behavior: >
      A bare "how much was disbursed" must be clarified, not guessed. Once the
      user confirms the whole figure, total_disbursement is the measure. A
      subsidy/loan split must never be presented as one number without labelling
      which it is, and sanctioned must never be described as disbursed.

  sanctioned_constant_rule: >
    sanctioned_amount is a per-scheme CONSTANT for 6 of the 13 schemes - Piggery
    125,000, Poultry 120,000, Dairy 300,000, Goat 100,000, Motorcaravan 5,000,000,
    and Sericulture spinning near-constant. For those, AVG(sanctioned_amount) is
    the entitlement restated rather than a statistic. Answer with the entitlement,
    say that it is fixed, and offer the distribution if the user wants to see the
    spread. This is the same situation as PMAY's 130,000 per house.

  derived_totals_rule: >
    total_subsidy_disbursement, total_loan_disbursement and total_disbursement are
    each an exact sum of their components on all 2,823 source rows, verified twice
    - once by the loader and once in this folder's profiling. Use the stored
    totals. Never re-derive them by adding the tranche columns, and never present
    a tranche sum as a check on the total; they are the same number.

  refusal_disagreement:
    critical: true
    text: >
      NO REFUSAL FIELD IS AUTHORITATIVE, and the three disagree:
        desanctioned_reason_raw   52 Refused + 31 Duplicate, NULL on 2,740
        refused_flag_raw          set on 8 rows, positive-only, NULL otherwise
        refused_reason_text       populated on 7 rows, free text
      Only 4 rows carry all three. source_row_id 429 carries the first two with a
      blank reason. 2 flagged rows have no desanction reason at all. Of the 31
      Duplicate rows only 6 have an observable same-name-same-scheme twin.
    runtime_behavior: >
      "How many were refused" is a CLARIFICATION, not a default. Every refusal
      count must name the field it came from and state that the fields disagree.
      Never silently union or intersect them.
    money_caveat: >
      REFUSAL DOES NOT STOP THE MONEY. 9 of the 52 Refused rows and 23 of the 31
      Duplicate rows still carry a disbursement (unverified_in_db). Excluding
      desanctioned rows from a money total is a CHOICE that changes the answer -
      state it, never apply it silently.

  sanction_status_rule:
    critical: true
    text: >
      THERE IS NO SANCTION-STATUS COLUMN AND THERE CANNOT BE A SANCTION RATE.
      Every row in this partition IS a sanction record - 2,820 of 2,823 carry a
      sanctioned amount and the 3 that do not are refusals. The denominator "all
      applications" lives in fact_cm_elevate_application, a different scheme with
      no join key to this one.
    runtime_behavior: >
      "How many sanctioned" answers with the row count, stated as "every record in
      this dataset is a sanction record", never as a filtered subset. "Sanction
      rate" and "how many were not sanctioned" are REFUSED, with the reason that
      the application population is a separate dataset with no linkage. The 83
      desanctioned rows must NEVER be offered as "not sanctioned" - they are a
      post-sanction outcome and that substitution is the most misleading answer
      available in this partition.

  applicant_term:
    status: DEFINED_AS_RECORD_COUNT
    reason: >
      The grain is one applicant's sanction-and-disbursement record, and the name
      columns are dropped from the view. "Applicant" and "beneficiary" can only
      mean a record here.
    runtime_behavior: >
      For "how many applicants/beneficiaries" use COUNT(*) and state that the
      answer is a record count.
    distinct_behavior: >
      COUNT(DISTINCT application_number) equals COUNT(*) - both are unique. There
      is no de-duplication to perform and no distinct-person count to offer: the
      same person can hold records under two schemes and nothing in the view
      identifies them.
    name_lookup: >
      NOT POSSIBLE. first_name, middle_name and last_name are excluded from the
      view and from the embedding layer. A name lookup returns "not held in this
      data", never an improvised join to the fact table.

  applicant_category_rule: >
    THERE IS NO APPLICANT-CATEGORY COLUMN in this partition. The 5th character of
    application_number resembles the Individual / Registered / Unregistered split
    used by the CM Elevate APPLICATION scheme, but it is unreliable - two schemes
    have five-letter acronyms whose 5th character is part of the acronym. Do not
    parse it, and do not borrow applicant_category from the other scheme.

  data_quality_findings:
  - "source_row_id 1351, 1355, 1378, 1556 - subsidy_disbursement_date_1 corrupted century, loaded NULL, amounts intact at Rs 31,250 each."
  - "source_row_id 532 - loan_disbursement_date_1 of 1985-07-22 against a real Rs 20,000 loan. Parses cleanly, survives into the database, NOT recorded in the DB comments."
  - "source_row_id 1602, 1696 - subsidy_disbursement_date_1 of 2026-09-04, after the extract's own creation date."
  - "source_row_id 321, 354, 376, 1760 - total_disbursement exceeds sanctioned_amount."
  - "source_row_id 2392 - the one QUARANTINED row (corrupted_identity). Its name fields read '4' / 'For' / 'All', i.e. '4 For All', which is very likely a real Sports & Wellness team name rather than corruption. If so this partition is short one record and that scheme's sanctioned total is understated. Raise with the data owner; do not reverse the quarantine in SQL."

  null_behavior: NULL is missing; never silently coerce NULL to zero. The exception is total_disbursement, where a stored 0 is a real 'nothing was paid' on 449 source rows.

  identifier_behavior:
  - cm_elevate_disb_fact_id and source_row_id are technical identifiers.
  - application_number is an application identifier and IS unique - unlike PMAY's reg_no.
  - village_code and geography_key are geographic identifiers.
  - year_key, scheme_key and disb_scheme_key are dimension keys.
  - Identifiers and keys must never be SUMed or AVGed.
  - geography_key and cm_elevate_disb_fact_id are unstable across a reload - never export them.

# ===========================================================================
nlp_sql_rules:
  read_only: true
  allowed_operations: [SELECT]
  default_from: curated.v_cm_elevate_disbursement

  aggregation_defaults:
    records: COUNT(*)
    applicants: COUNT(*)
    beneficiaries: COUNT(*)
    sanctioned_amount: SUM(sanctioned_amount)
    total_disbursement: SUM(total_disbursement)
    subsidy: SUM(total_subsidy_disbursement)
    loan: SUM(total_loan_disbursement)
    average_disbursement: AVG(total_disbursement)
    distinct_villages: COUNT(DISTINCT village_code)
    distinct_schemes: COUNT(DISTINCT scheme_name)

  mandatory_predicate:
    clause: none
    note: >
      This partition has NO is_placeholder equivalent - there is no row to exclude
      from every query, unlike PMAY. The conditional predicates are
      `entity_type <> 'Unresolved'` for village-level answers only, and an
      explicit, stated refusal filter when the user asks to exclude desanctioned
      records.

  date_behavior: >
    A financial-year request filters or groups financial_year / financial_year_short.
    A date-range request filters the relevant disbursement date column, and the
    answer must say that dates and stated financial years disagree on some rows.
    There is no monthly grouping.

  comparison: >
    Filter the requested period and GROUP BY the requested dimension; preserve the
    distinction between a financial-year question and a date-range question, and
    never present one as the other.

  ranking: >
    ORDER BY the requested aggregate and default top 5 when N is omitted for plural
    'top' requests; singular 'highest/lowest' uses LIMIT 1. With only 13 schemes, a
    'top schemes' request should usually return all 13 rather than a truncated list.

  entity_behavior: >
    Resolve exact scheme, district, block, village, loan entity and financial-year
    values using canonical stored values and approved aliases before SQL generation.
    District and block are documented as UPPERCASE in dim_geography. The two
    Sericulture scheme names differ only by a space before the bracket.

  unknown_entity: Do not guess; return not-found/did-you-mean.

  join_behavior: >
    The view pre-joins dim_cm_elevate_disb_scheme, dim_geography and dim_year, so
    the generator emits NO joins for ordinary questions. Every fact-to-fact join is
    prohibited, starting with fact_cm_elevate_application - see
    cmelevatelegacy_foreign_key_augmentation.yaml.

  cross_scheme_behavior: >
    NOT AVAILABLE. No cross-scheme view includes this scheme. A comparison against
    MGNREGA, PMAY, Focus+, Focus Legacy or CM Elevate applications is refused, not
    improvised.

  money_behavior: >
    The view is in RUPEES (unconfirmed against dim_scheme.money_unit - see the
    header). Convert explicitly, divide by 1e7 for crore, and state the unit in
    every answer. Never mix a figure from this scheme with MGNREGA's LAKH columns.

  disbursement_behavior: >
    A bare 'disbursed' is ambiguous three ways and must be clarified before SQL is
    emitted. Once clarified, use the stored total, never a sum of tranches.

  refusal_behavior: >
    A refusal question must name which of the three refusal fields it used and
    state that they disagree. A money total must say whether desanctioned rows were
    included.

# ===========================================================================
few_shot_examples:

- question: How many records are there under CM Elevate Legacy?
  explanation: One row is one applicant's sanction-and-disbursement record. There is no placeholder flag to exclude.
  sql: |
    SELECT COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement;

- question: How many records are there under each scheme?
  explanation: Thirteen schemes, heavily skewed towards Piggery. Return all of them rather than a top-N.
  sql: |
    SELECT scheme_name, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY records DESC;

- question: What is the total amount disbursed under CM Elevate Legacy?
  explanation: Only emitted after the gate confirms the user means subsidy and loan together. total_disbursement is stored and verified, so it is never re-derived from the tranches.
  sql: |
    SELECT ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr
    FROM curated.v_cm_elevate_disbursement;

- question: How much was paid as subsidy and how much as loan?
  explanation: The honest answer to an ambiguous 'disbursed' question - show the split rather than choosing one.
  sql: |
    SELECT ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_cr
    FROM curated.v_cm_elevate_disbursement;

- question: What is the total amount disbursed under each scheme?
  explanation: Sanctioned is carried alongside so the answer cannot be misread as full payment of the sanction.
  sql: |
    SELECT scheme_name,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY disbursed_cr DESC;

- question: What is the sanctioned amount for the Piggery scheme?
  explanation: Piggery's sanction is a fixed entitlement, so the distribution is shown rather than an average that would restate the constant as a statistic.
  sql: |
    SELECT sanctioned_amount, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Piggery Development Scheme'
    GROUP BY sanctioned_amount
    ORDER BY records DESC;

- question: How many records are there in each district?
  explanation: District is a name on dim_geography, pre-joined into the view and documented as stored uppercase.
  sql: |
    SELECT lgd_district, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY lgd_district
    ORDER BY records DESC;

- question: What is the total disbursement for West Garo Hills?
  explanation: Unresolved rows are kept here on purpose - they belong to the district and dropping them would understate the district total.
  sql: |
    SELECT ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_district = 'WEST GARO HILLS';

- question: How many villages received CM Elevate Legacy support in West Garo Hills?
  explanation: A village count must exclude the Unresolved placeholders and count distinct codes, never names - 17 names are shared by more than one village.
  sql: |
    SELECT COUNT(DISTINCT village_code) AS villages
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_district = 'WEST GARO HILLS'
      AND entity_type <> 'Unresolved';

- question: How many records could not be matched to a village?
  explanation: The count that must accompany any village-level answer, so the excluded rows are visible rather than silently dropped.
  sql: |
    SELECT lgd_district, COUNT(*) AS unresolved_records
    FROM curated.v_cm_elevate_disbursement
    WHERE entity_type = 'Unresolved'
    GROUP BY lgd_district
    ORDER BY unresolved_records DESC;

- question: Show the number of records in each block of Ri Bhoi
  explanation: Drill-down from district to block. Block is a name only; no block code exists in the curated layer.
  sql: |
    SELECT lgd_block, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_district = 'RI BHOI'
    GROUP BY lgd_block
    ORDER BY records DESC;

- question: How many records are there for each financial year?
  explanation: Only two financial years exist, and the rows with none are reported rather than dropped by the grouping.
  sql: |
    SELECT COALESCE(financial_year_short, '(no financial year)') AS financial_year,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY financial_year_short
    ORDER BY financial_year;

- question: What was the total disbursement in FY 2024-25?
  explanation: The stored financial year is used, never a year derived from a disbursement date - the two disagree on some rows.
  sql: |
    SELECT ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE financial_year_short = '2024-25';

- question: How many records have no financial year?
  explanation: 395 source rows carry no FY label. They vanish from every time series, so the count is offered before one is reported.
  sql: |
    SELECT COUNT(*) AS records_without_financial_year
    FROM curated.v_cm_elevate_disbursement
    WHERE year_key IS NULL;

- question: Which loan entities are used, and how much went through each?
  explanation: The unattributed bucket is kept visible - 19 rows carry loan money with no entity recorded.
  sql: |
    SELECT COALESCE(loan_entity, '(not recorded)') AS loan_entity,
           COUNT(*) AS records,
           ROUND(SUM(total_loan_disbursement) / 1e7, 2) AS loan_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY loan_entity
    ORDER BY loan_cr DESC;

- question: How many records were desanctioned?
  explanation: Answers from one named field and reports both values, because the refusal fields disagree and none is authoritative.
  sql: |
    SELECT desanctioned_reason_raw, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw IS NOT NULL
    GROUP BY desanctioned_reason_raw
    ORDER BY records DESC;

- question: Show how the refusal fields disagree
  explanation: The cross-tab that must back any refusal answer. refused_flag_raw is positive-only, so IS DISTINCT FROM TRUE is used rather than NOT.
  sql: |
    SELECT COALESCE(desanctioned_reason_raw, '(none)') AS desanctioned_reason,
           (refused_flag_raw IS TRUE)                  AS refused_flag,
           (refused_reason_text IS NOT NULL)           AS has_reason_text,
           COUNT(*)                                    AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY 1, 2, 3
    ORDER BY records DESC;

- question: Did any desanctioned records still receive money?
  explanation: They did. Excluding desanctioned rows from a money total is a choice that changes the answer, so the overlap is shown rather than assumed away.
  sql: |
    SELECT desanctioned_reason_raw,
           COUNT(*)                                          AS records,
           COUNT(*) FILTER (WHERE total_disbursement > 0)     AS with_disbursement,
           ROUND(SUM(total_disbursement) / 1e7, 2)            AS disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw IS NOT NULL
    GROUP BY desanctioned_reason_raw;

- question: Which schemes have the largest gap between sanctioned and disbursed?
  explanation: The gap is the finding of this dataset - Sericulture spinning sanctioned crores and disbursed almost nothing.
  sql: |
    SELECT scheme_name,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY disbursed_pct;

- question: How many records received no money at all?
  explanation: Zero is a real recorded value here, not a missing one, so it is tested with = 0 rather than IS NULL.
  sql: |
    SELECT scheme_name, COUNT(*) AS records_with_no_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE total_disbursement = 0
    GROUP BY scheme_name
    ORDER BY records_with_no_disbursement DESC;

- question: Find the record with application number MPDSI018328
  explanation: application_number is unique, so at most one row returns. Applicant names are not in the view, so the detail is scheme, geography, money and outcome.
  sql: |
    SELECT application_number, scheme_name, financial_year_short,
           lgd_district, lgd_block, lgd_village_name,
           sanctioned_amount, total_subsidy_disbursement,
           total_loan_disbursement, total_disbursement,
           loan_entity, desanctioned_reason_raw
    FROM curated.v_cm_elevate_disbursement
    WHERE application_number = 'MPDSI018328';

- question: Give me a district-wise summary of records and disbursement
  explanation: The administrative summary asked for by use case TC-36, with the sanction column alongside so the two are not confused.
  sql: |
    SELECT lgd_district,
           COUNT(*)                                AS records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY lgd_district
    ORDER BY disbursed_cr DESC;

# ---- questions that must be refused -----------------------------------
- question: What percentage of applications have been sanctioned?
  explanation: >
    There is no sanction rate. Every row in this partition IS a sanction record;
    the denominator - all applications - lives in fact_cm_elevate_application,
    a different scheme with no join key to this one. Refuse and explain, and do
    NOT substitute the 83 desanctioned rows, which are a post-sanction outcome
    rather than a rejected application.
  sql: null

- question: How many applications were not sanctioned?
  explanation: >
    Same reason as the sanction rate. This dataset contains no unsanctioned
    applications at all, so any number returned would be an answer to a different
    question.
  sql: null

- question: Who received the largest disbursement?
  explanation: >
    first_name, middle_name and last_name are excluded from the view and from the
    embedding layer, and there is no join that recovers them. Return the
    application_number and scheme instead, and say that applicant names are not
    held in the query surface.
  sql: null

- question: How many applications are mapped to Mairang constituency?
  explanation: >
    Constituency is in the source workbook and in dim_geography (ac_name), but it
    is not carried onto this fact and not exposed by this view. This is a refusal
    with a named fix - the view would have to expose ac_name - not a data gap.
  sql: null

- question: Show me the monthly disbursement trend
  explanation: >
    No monthly grain exists. The source's month column is not loaded and holds
    only four values across two financial years - it is a batch label. Offer the
    two financial years instead, and note that the disbursement dates disagree
    with the stated financial year on some rows.
  sql: null

- question: What share of the sanctioned amount did the bank sanction?
  explanation: >
    bank_sanctioned_amount has no confirmed meaning. It is zero on half the rows
    and its ratio to sanctioned_amount varies within a single scheme, so no share
    or percentage may be built on it. Decline, and say the column's meaning is
    unconfirmed with the client.
  sql: null

- question: Show the CM Elevate applications for these disbursement records
  explanation: >
    fact_cm_elevate_application is a DIFFERENT scheme despite the name. No shared
    identifier exists between the two source files and the fact-to-fact join is
    prohibited. Refuse; there is no bridge to offer.
  sql: null

- question: Compare CM Elevate Legacy and PMAY spending by district
  explanation: >
    No cross-scheme view includes this scheme - v_cross_scheme_money_district_year
    covers MGNREGA and PMAY only. Refuse rather than improvising a join or
    stitching two independent aggregates together without a sanctioned surface.
  sql: null

- question: What is the LGD code of East Khasi Hills district?
  explanation: >
    dim_geography carries village_code only. District and block exist as names,
    with no code column in the curated layer.
  sql: null

- question: How many loans have been repaid?
  explanation: >
    Nothing about repayment is recorded. The source's loan_repaid column is 0 on
    every row and was not loaded; answering "none" would present an empty column
    as a finding.
  sql: null

- question: Update the sanctioned amount for an applicant
  explanation: The read role permits SELECT only. Refuse rather than translating into write SQL.
  sql: null
