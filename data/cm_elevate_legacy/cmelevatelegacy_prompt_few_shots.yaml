- id: S03
  question: "Sericulture disbursement by financial year"
  plan:
  - "Both Sericulture literals"
  - "FY group with COALESCE - both schemes land in the no-FY bucket, which IS the answer"
  sql: |
    SELECT scheme_name,
           COALESCE(financial_year_short, '(no financial year)') AS financial_year,
           COUNT(*) AS records,
