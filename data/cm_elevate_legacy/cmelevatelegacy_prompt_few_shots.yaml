  caveats: [sericulture_year_note, unresolved_year_note]

# ---- 6.9 Lookups and data quality ----------------------------------------
- id: Q01
  question: "Find the record with application number MPDSI018328"
  plan:
  - "application_number is unique -> at most one row"
  - "No names in the view"
  - "Amounts in rupees"
  sql: |
    SELECT application_number, scheme_name, financial_year_short,
           lgd_district, lgd_block, lgd_village_name,
           sanctioned_amount, total_subsidy_disbursement,
           total_loan_disbursement, total_disbursement,
           loan_entity, desanctioned_reason_raw
    FROM curated.v_cm_elevate_disbursement
    WHERE application_number = 'MPDSI018328';

- id: Q02
  question: "List individual records of Goat Farming in Ri Bhoi"
  variants: ["show goat farming records in Ri Bhoi", "details of goat beneficiaries in Ri Bhoi"]
  plan:
  - "'individual records' = a row listing, not an applicant-type question"
  - "Identify by application number (no names)"
  - "LIMIT 100"
  sql: |
    SELECT application_number, lgd_block, lgd_village_name, village_code,
           sanctioned_amount, total_disbursement, financial_year_short
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Goat Farming Scheme'
      AND lgd_district = 'RI BHOI'
    ORDER BY application_number
    LIMIT 100;
  assumptions: ["Showing the first 100 matching records."]

- id: Q03
  question: "Which record received the largest disbursement?"
  plan:
  - "The answerable form of 'who got the most' - identify by application number"
  - "ORDER BY total desc NULLS LAST LIMIT 1"
  sql: |
    SELECT application_number, scheme_name, lgd_district,
           sanctioned_amount, total_disbursement
    FROM curated.v_cm_elevate_disbursement
    ORDER BY total_disbursement DESC NULLS LAST, application_number
    LIMIT 1;

- id: Q04
  question: "How complete is each field?"
  plan:
  - "One row of gap counts via FILTER"
  - "Report - never filter away"
  sql: |
    SELECT COUNT(*)                                                    AS records,
           COUNT(*) FILTER (WHERE sanctioned_amount IS NULL)           AS missing_sanctioned,
           COUNT(*) FILTER (WHERE year_key IS NULL)                    AS missing_financial_year,
           COUNT(*) FILTER (WHERE loan_entity IS NULL)                 AS missing_loan_entity,
           COUNT(*) FILTER (WHERE subsidy_disbursement_date_1 IS NULL
                              AND subsidy_disbursement_1 > 0)          AS paid_but_undated,
           COUNT(*) FILTER (WHERE entity_type = 'Unresolved')          AS unresolved_village
    FROM curated.v_cm_elevate_disbursement;
  caveats: [quarantine_note]

- id: Q05
  question: "Which records have no sanctioned amount?"
  plan:
  - "sanctioned_amount IS NULL list"
  sql: |
    SELECT source_row_id, application_number, scheme_name,
           desanctioned_reason_raw, refused_reason_text, total_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE sanctioned_amount IS NULL
    ORDER BY source_row_id;

- id: Q06
  question: "Do the recorded totals match the sum of their instalments?"
  plan:
  - "AUDIT ONLY - the one place tranches are added"
  - "Count disagreements > 0.01"
  sql: |
    SELECT COUNT(*) AS records_where_totals_disagree
    FROM curated.v_cm_elevate_disbursement
    WHERE ABS(COALESCE(total_subsidy_disbursement, 0)
            - (COALESCE(subsidy_disbursement_1, 0)
             + COALESCE(subsidy_disbursement_2, 0)
             + COALESCE(subsidy_disbursement_3, 0))) > 0.01
       OR ABS(COALESCE(total_disbursement, 0)
            - (COALESCE(total_subsidy_disbursement, 0)
             + COALESCE(total_loan_disbursement, 0))) > 0.01;
  caveats: [derived_total_note]

- id: Q07
  question: "Show the records with data-quality problems"
  plan:
  - "One CASE label per issue"
  - "List by source_row_id"
  sql: |
    SELECT source_row_id, application_number, scheme_name,
           CASE
             WHEN subsidy_disbursement_date_1 > DATE '2026-09-03' THEN 'payment dated after the file was produced'
             WHEN loan_disbursement_date_1    < DATE '2020-01-01' THEN 'loan dated before the scheme existed'
             WHEN total_disbursement > sanctioned_amount          THEN 'disbursed more than sanctioned'
             WHEN sanctioned_amount IS NULL                       THEN 'no sanctioned amount recorded'
           END AS issue,
           sanctioned_amount, total_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE subsidy_disbursement_date_1 > DATE '2026-09-03'
       OR loan_disbursement_date_1    < DATE '2020-01-01'
       OR total_disbursement > sanctioned_amount
       OR sanctioned_amount IS NULL
    ORDER BY source_row_id;
  caveats: [suspect_date_note]
  why: "10 in the source - 2 future dates, 1 1985 loan, 4 over-disbursed, 3 no sanction (the all-NULL row 2823 has a sanction, so it is not caught)."

- id: Q08
  question: "Which Piggery records lost their disbursement date?"
  plan:
  - "Paid first tranche but NULL date = the 4 corrupted-century rows"
  sql: |
    SELECT source_row_id, application_number,
           subsidy_disbursement_1, subsidy_disbursement_date_1, total_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Piggery Development Scheme'
      AND subsidy_disbursement_1 IS NOT NULL
      AND subsidy_disbursement_date_1 IS NULL
    ORDER BY source_row_id;

