      AND subsidy_disbursement_date_1 <  DATE '2025-01-01';
  assumptions:
  - "Dated by the first subsidy disbursement date; the recorded financial year may not agree with it on every record."
  - "Four records have no usable disbursement date and fall outside date filters."
  caveats: [year_date_disagreement_note]

- id: Y12
  question: "When were the first and last disbursements made?"
  variants: ["earliest disbursement date", "earliest loan date", "latest payment date"]
  plan:
  - "MIN/MAX on first subsidy and loan dates"
  - "Always flag the suspect extremes"
  sql: |
    SELECT MIN(subsidy_disbursement_date_1) AS first_subsidy_date,
           MAX(subsidy_disbursement_date_1) AS last_subsidy_date,
           MIN(loan_disbursement_date_1)    AS first_loan_date,
           MAX(loan_disbursement_date_1)    AS last_loan_date
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["The earliest and latest dates are reported as recorded and flagged."]
  caveats: [suspect_date_note]

- id: Y13
  question: "Which records have suspect disbursement dates?"
  plan:
  - "After the extract date (2026-09-03) or before 2020"
  - "List by source_row_id"
  sql: |
    SELECT source_row_id, application_number, scheme_name,
           subsidy_disbursement_date_1, loan_disbursement_date_1, total_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE subsidy_disbursement_date_1 > DATE '2026-09-03'
       OR loan_disbursement_date_1    < DATE '2020-01-01'
    ORDER BY source_row_id;
  caveats: [suspect_date_note]

- id: Y14
  question: "Do the disbursement dates agree with the recorded financial year?"
  plan:
  - "Cross-tab stored FY x calendar year of first subsidy date"
  - "EXTRACT only for display - never to assign an FY"
  sql: |
    SELECT COALESCE(financial_year_short, '(no financial year)') AS financial_year,
           EXTRACT(YEAR FROM subsidy_disbursement_date_1)        AS first_subsidy_calendar_year,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE subsidy_disbursement_date_1 IS NOT NULL
    GROUP BY financial_year_short, EXTRACT(YEAR FROM subsidy_disbursement_date_1)
    ORDER BY financial_year_short NULLS LAST, first_subsidy_calendar_year;
  caveats: [year_date_disagreement_note]

- id: Y15
  question: "How many records would a financial-year filter drop?"
  plan:
  - "Count and money of year_key IS NULL vs NOT NULL"
  sql: |
    SELECT COUNT(*) FILTER (WHERE year_key IS NULL)     AS dropped_by_fy_filter,
           COUNT(*) FILTER (WHERE year_key IS NOT NULL) AS kept,
           COUNT(*)                                     AS total_records,
           ROUND(SUM(total_disbursement) FILTER (WHERE year_key IS NULL) / 1e7, 2) AS dropped_disbursed_cr
    FROM curated.v_cm_elevate_disbursement;
  caveats: [sericulture_year_note]

