           COUNT(*) FILTER (WHERE desanctioned_reason_raw = 'Duplicate') AS desanctioned_duplicate,
           COUNT(*)                                                      AS records
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Not sanctioned means a record with no sanctioned amount. Records whose sanction was later withdrawn (Refused / Duplicate) are shown separately - they were sanctioned first."]

