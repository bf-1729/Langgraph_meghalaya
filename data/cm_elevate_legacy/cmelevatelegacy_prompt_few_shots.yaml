  - "Also count nothing paid"
  - "Exclude NULL sanctions"
  sql: |
    SELECT scheme_name,
           COUNT(*)                                                         AS records,
           COUNT(*) FILTER (WHERE total_disbursement >= sanctioned_amount)  AS fully_paid,
           COUNT(*) FILTER (WHERE total_disbursement = 0)                   AS nothing_paid
    FROM curated.v_cm_elevate_disbursement
    WHERE sanctioned_amount IS NOT NULL
    GROUP BY scheme_name
    ORDER BY fully_paid DESC;
  caveats: [zero_disbursement_note]

