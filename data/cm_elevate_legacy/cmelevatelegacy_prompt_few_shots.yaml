- id: X01
  use_case: TC-15
  question: "What percentage of applications have been sanctioned?"
  variants: ["sanction rate", "approval rate of applications", "ratio of sanctioned to total applications"]
  plan:
  - "Share of records in THIS dataset carrying a sanctioned amount"
  - "Numerator COUNT(sanctioned_amount), denominator COUNT(*)"
  - "Caveat: the wider application pool is the separate CM Elevate dataset"
  sql: |
    SELECT COUNT(*)                                                         AS records,
           COUNT(sanctioned_amount)                                         AS sanctioned_records,
           ROUND(100.0 * COUNT(sanctioned_amount) / NULLIF(COUNT(*), 0), 2) AS sanctioned_pct
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["The percentage is of the records in this sanction-and-disbursement dataset; applications that never reached sanction are held in the separate CM Elevate applications dataset, which cannot be linked to this one."]

