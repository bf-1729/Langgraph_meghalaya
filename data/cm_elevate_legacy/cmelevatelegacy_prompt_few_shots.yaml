- id: L10
  question: "Average loan size by lender"
  plan:
  - "Average only over records that HAVE a loan (FILTER)"
  - "Per record -> rupees"
  - "COALESCE the lender"
  sql: |
    SELECT COALESCE(loan_entity, '(not recorded)')                                     AS loan_entity,
           COUNT(*) FILTER (WHERE total_loan_disbursement > 0)                         AS records_with_loan,
           ROUND(AVG(total_loan_disbursement) FILTER (WHERE total_loan_disbursement > 0)) AS avg_loan_rupees
    FROM curated.v_cm_elevate_disbursement
    GROUP BY loan_entity
    ORDER BY records_with_loan DESC;
  assumptions: ["Averaged over records that received a loan only."]
  caveats: [loan_entity_null_note]
  why: "AVG over all records would divide by the 2,000+ with no loan and understate the loan size."

- id: L11
  question: "How does loan use differ by scheme?"
  plan:
