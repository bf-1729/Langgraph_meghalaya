- id: M20
  question: "Which records were disbursed more than they were sanctioned?"
  plan:
  - "total_disbursement > sanctioned_amount"
  - "List by source_row_id with the excess in rupees"
  - "Report - never filter away"
  sql: |
    SELECT source_row_id, application_number, scheme_name,
           sanctioned_amount, total_disbursement,
           total_disbursement - sanctioned_amount AS excess_rupees
    FROM curated.v_cm_elevate_disbursement
    WHERE total_disbursement > sanctioned_amount
    ORDER BY excess_rupees DESC;

- id: M21
  question: "How many records reached the full entitlement?"
  plan:
