- id: G07
  question: "Compare the Garo Hills, Khasi Hills and Jaintia Hills regions"
  plan:
  - "Regions are not a column -> CASE over the district lists"
  - "Ri Bhoi is its own group"
  sql: |
    SELECT CASE
             WHEN lgd_district IN ('EAST GARO HILLS','NORTH GARO HILLS','SOUTH GARO HILLS',
                                   'SOUTH WEST GARO HILLS','WEST GARO HILLS')   THEN 'Garo Hills'
             WHEN lgd_district IN ('EAST KHASI HILLS','EASTERN WEST KHASI HILLS',
                                   'SOUTH WEST KHASI HILLS','WEST KHASI HILLS') THEN 'Khasi Hills'
             WHEN lgd_district IN ('EAST JAINTIA HILLS','WEST JAINTIA HILLS')   THEN 'Jaintia Hills'
             WHEN lgd_district = 'RI BHOI'                                      THEN 'Ri Bhoi'
           END                                     AS region,
           COUNT(*)                                AS records,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY 1
    ORDER BY records DESC;
  assumptions: ["Garo Hills covers 5 districts, Khasi Hills 4, Jaintia Hills 2; Ri Bhoi is its own group."]
  caveats: [disbursement_split_caveat]

- id: G08
  use_case: TC-36
  question: "Give me a district-wise summary of applications, sanctioned cases and total disbursement under CM-ELEVATE."
  variants: ["district summary", "administrative summary by district", "give me an overview of disbursement by district"]
  plan:
  - "Applications = records (COUNT(*)); sanctioned cases = COUNT(sanctioned_amount) - separate column"
  - "One row per district: records, sanctioned cases, sanctioned, subsidy, loan, total, %"
  - "ROLLUP adds an exact ALL DISTRICTS row - quote statewide totals from it, never sum rounded rows"
  sql: |
    SELECT COALESCE(lgd_district, 'ALL DISTRICTS')              AS lgd_district,
           COUNT(*)                                        AS records,
           COUNT(sanctioned_amount)                        AS sanctioned_records,
           ROUND(SUM(sanctioned_amount)          / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement
    GROUP BY ROLLUP (lgd_district)
    ORDER BY GROUPING(lgd_district), total_disbursed_cr DESC;
  assumptions:
  - 'Applications are all records; sanctioned cases are the records carrying a sanctioned amount (3 Refused records have none).'
  - "Disbursement is shown as subsidy, loan and total side by side."
  caveats: [record_grain_note, disbursement_split_caveat, sanctioned_not_disbursed]
  why: 'An "overview of disbursement" is a DATA summary - answer it; only a programme overview is refused.'

