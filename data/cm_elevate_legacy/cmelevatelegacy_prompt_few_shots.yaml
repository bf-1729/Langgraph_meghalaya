# ---- 6.3 Loans and lenders ------------------------------------------------
- id: L01
  use_case: TC-20
  question: "Which loan entities are associated with CM-ELEVATE applications?"
  variants: ["list of lenders", "loan providers"]
  plan:
  - "Only two stored values + NULL"
  - "COALESCE the NULL bucket to '(not recorded)'"
  sql: |
    SELECT COALESCE(loan_entity, '(not recorded)') AS loan_entity,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY loan_entity
    ORDER BY records DESC;
  assumptions: ["Records with no lender recorded are shown as a separate group."]
  caveats: [loan_entity_null_note, record_grain_note]

- id: L02
  use_case: TC-21
  question: "How many applications are associated with each loan entity?"
  plan:
  - "Group by COALESCE(loan_entity)"
  - "Add with_loan_money: a recorded lender does not mean a loan was paid"
  sql: |
    SELECT COALESCE(loan_entity, '(not recorded)')             AS loan_entity,
           COUNT(*)                                            AS records,
           COUNT(*) FILTER (WHERE total_loan_disbursement > 0) AS with_loan_money
    FROM curated.v_cm_elevate_disbursement
    GROUP BY loan_entity
    ORDER BY records DESC;
  caveats: [loan_entity_null_note, record_grain_note]

- id: L03
  use_case: TC-22
  question: "What is the total disbursement made through each loan entity?"
