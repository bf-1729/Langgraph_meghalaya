  - "Group by scheme"
  sql: |
    SELECT scheme_name, COUNT(*) AS records_with_no_disbursement
    FROM curated.v_cm_elevate_disbursement
    WHERE total_disbursement = 0
    GROUP BY scheme_name
    ORDER BY records_with_no_disbursement DESC;
  assumptions: ["A recorded zero means nothing was paid; it is counted with = 0, not treated as missing."]
  caveats: [zero_disbursement_note]

- id: M19
  question: "Which beneficiaries got nothing in weaving?"
