    SELECT COUNT(*) FILTER (WHERE total_disbursement = 0) AS records_with_no_disbursement,
           COUNT(*)                                       AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Sericulture & Weaving Scheme(weaving)';
  assumptions: ["Read 'weaving' as Meghalaya Sericulture & Weaving Scheme(weaving)."]
