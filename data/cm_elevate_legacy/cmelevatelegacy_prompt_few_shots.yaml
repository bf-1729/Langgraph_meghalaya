# ---- 6.7 Refusal / desanction fields -------------------------------------
- id: R01
  policy: "refusal_ambiguity=answer_all_fields"
  question: "How many records were refused?"
  variants: ["how many applications were refused", "refused cases", "cancelled count"]
  plan:
  - "Three disagreeing fields - count each side by side"
  - "Add desanctioned-but-paid"
  - "No field presented as authoritative"
  sql: |
    SELECT COUNT(*) FILTER (WHERE desanctioned_reason_raw = 'Refused')   AS desanction_reason_refused,
           COUNT(*) FILTER (WHERE desanctioned_reason_raw = 'Duplicate') AS desanction_reason_duplicate,
           COUNT(*) FILTER (WHERE desanctioned_reason_raw IS NOT NULL)   AS any_desanction_reason,
           COUNT(*) FILTER (WHERE refused_flag_raw IS TRUE)              AS refused_flag_set,
           COUNT(*) FILTER (WHERE refused_reason_text IS NOT NULL)       AS written_reason,
           COUNT(*) FILTER (WHERE desanctioned_reason_raw IS NOT NULL
                              AND total_disbursement > 0)                AS desanctioned_but_paid
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Refusal is counted from all three recorded fields side by side, because they disagree and none is authoritative."]
  caveats: [refusal_field_note, refused_with_money_note]

- id: R02
  question: "How many records were desanctioned?"
  variants: ["desanctioned records by reason", "withdrawn sanctions", "whose sanction was withdrawn"]
  plan:
  - "Group desanctioned_reason_raw with COALESCE '(none recorded)'"
  - "Name the field in the answer"
  sql: |
    SELECT COALESCE(desanctioned_reason_raw, '(none recorded)') AS desanctioned_reason,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY desanctioned_reason_raw
    ORDER BY records DESC;
  assumptions: ['Counted from the desanction reason; "(none recorded)" means nothing was recorded, not "not refused".']
  caveats: [refusal_field_note]

- id: R03
  question: "Show how the three refusal fields disagree"
  plan:
  - "Cross-tab of the three signals"
  - "Booleans via IS TRUE / IS NOT NULL"
  sql: |
    SELECT COALESCE(desanctioned_reason_raw, '(none recorded)') AS desanctioned_reason,
           (refused_flag_raw IS TRUE)                          AS refused_flag,
           (refused_reason_text IS NOT NULL)                   AS has_reason_text,
           COUNT(*)                                            AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY 1, 2, 3
    ORDER BY records DESC;
  caveats: [refusal_field_note]

- id: R04
  question: "How many records were not refused?"
  plan:
  - "refused_flag_raw is TRUE or NULL, never FALSE -> IS DISTINCT FROM TRUE"
  sql: |
    SELECT COUNT(*) AS not_flagged_refused
    FROM curated.v_cm_elevate_disbursement
    WHERE refused_flag_raw IS DISTINCT FROM TRUE;
  assumptions: ["Not refused covers every record without a refusal flag, including those where nothing was recorded either way."]
  caveats: [refusal_field_note]
  why: "NOT refused_flag_raw returns 0 rows here - the classic wrong answer."

- id: R05
  question: "Did any desanctioned records still receive money?"
  variants: ["money received by desanctioned applicants", "were refused cases paid"]
  plan:
  - "Desanctioned only"
  - "Count paid and sum per reason"
  sql: |
    SELECT desanctioned_reason_raw                        AS desanctioned_reason,
           COUNT(*)                                       AS records,
           COUNT(*) FILTER (WHERE total_disbursement > 0) AS with_disbursement,
           ROUND(SUM(total_disbursement) / 1e7, 2)        AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw IS NOT NULL
    GROUP BY desanctioned_reason_raw
    ORDER BY records DESC;
  caveats: [refusal_field_note, refused_with_money_note]

- id: R06
  question: "What is the total disbursement excluding desanctioned records?"
  plan:
  - "Exclude only because the user asked - desanctioned_reason_raw IS NULL"
  - "caveat_sql - what the exclusion removed"
  sql: |
    SELECT COUNT(*)                                        AS records,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw IS NULL;
  caveat_sql: |
    SELECT COUNT(*) AS excluded_records,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS excluded_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw IS NOT NULL;
  assumptions: ["Desanctioned records (Refused or Duplicate) are left out, as asked."]
  caveats: [refused_with_money_note, refusal_field_note, disbursement_split_caveat]

- id: R07
  question: "What reasons were recorded for refusals?"
  plan:
  - "Free text on few rows -> list it, never GROUP BY"
  - "No geography columns - reasons can be personal"
  sql: |
    SELECT source_row_id, application_number, scheme_name,
           desanctioned_reason_raw, refused_flag_raw, refused_reason_text
    FROM curated.v_cm_elevate_disbursement
    WHERE refused_reason_text IS NOT NULL
       OR refused_flag_raw IS TRUE
    ORDER BY source_row_id;
  assumptions: ["Refusal reasons are free text on very few records, so they are listed rather than grouped."]
  caveats: [refusal_field_note]

- id: R08
  question: "How many were marked duplicate?"
  variants: ["show me the duplicate records", "duplicate cases"]
  plan:
  - "'Duplicate' is a recorded outcome, not duplicate rows (application_number is unique)"
  - "Count + paid; no self-join"
  sql: |
    SELECT COUNT(*)                                       AS marked_duplicate,
           COUNT(*) FILTER (WHERE total_disbursement > 0) AS still_paid
    FROM curated.v_cm_elevate_disbursement
    WHERE desanctioned_reason_raw = 'Duplicate';
  assumptions: ["The records marked 'Duplicate' are an outcome recorded against a record, not repeated rows - every application number is unique."]
  caveats: [refusal_field_note]

