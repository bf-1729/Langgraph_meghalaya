# ---------------------------------------------------------------------------
# 7. Common mistakes - rendered as a contrastive block into every CM Elevate
# Legacy SQL prompt. Each WRONG trips the named validator rule.
# ---------------------------------------------------------------------------
common_mistakes:
- id: AP01
  title: "Grouping by financial year without keeping the undated bucket"
  rule: V10
  why: "The NULL group prints as a blank row the reader drops - 395 Sericulture records vanish."
  wrong: "SELECT financial_year_short, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY financial_year_short ORDER BY 1"
  right: "SELECT COALESCE(financial_year_short, '(no financial year)') AS financial_year, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY financial_year_short ORDER BY financial_year_short NULLS LAST"
- id: AP02
  title: "Counting villages without excluding Unresolved placeholders"
  rule: V12
  why: "The Unresolved placeholder code(s) get counted as villages, inflating the count (54 West Garo Hills records have no village)."
  wrong: "SELECT COUNT(DISTINCT village_code) AS villages FROM curated.v_cm_elevate_disbursement WHERE lgd_district = 'WEST GARO HILLS'"
  right: "SELECT COUNT(DISTINCT village_code) AS villages FROM curated.v_cm_elevate_disbursement WHERE lgd_district = 'WEST GARO HILLS' AND entity_type <> 'Unresolved'"
- id: AP03
  title: "Listing villages by name only"
  rule: V12
  why: "17 names belong to more than one village - grouping by name merges different places."
  wrong: "SELECT lgd_village_name, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE entity_type <> 'Unresolved' GROUP BY lgd_village_name ORDER BY 2 DESC"
  right: "SELECT lgd_village_name, village_code, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE entity_type <> 'Unresolved' GROUP BY lgd_village_name, village_code ORDER BY 3 DESC"
- id: AP04
  title: "Title-case district literal"
  rule: V13
  why: "Stored UPPERCASE - the mixed-case filter returns 0 silently."
  wrong: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE lgd_district = 'West Garo Hills'"
  right: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE lgd_district = 'WEST GARO HILLS'"
- id: AP05
  title: "Wrong Sericulture spelling"
  rule: V14
  why: "Weaving has NO space before the bracket; spinning has one. Wrong spelling = 0 rows."
  wrong: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Sericulture & Weaving Scheme (weaving)'"
  right: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Sericulture & Weaving Scheme(weaving)'"
- id: AP06
  title: "Deriving the scheme from the application-number prefix"
  rule: V07
  why: "Prefixes are observed, not enforced - one Poultry record carries MPDSI."
  wrong: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE application_number LIKE 'MPDSI%'"
  right: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Piggery Development Scheme'"
- id: AP07
  title: "Negating the positive-only refusal flag"
  rule: V08
  why: "The flag is TRUE or NULL, never FALSE - NOT returns 0 instead of 2,815."
  wrong: "SELECT COUNT(*) AS not_refused FROM curated.v_cm_elevate_disbursement WHERE NOT refused_flag_raw"
  right: "SELECT COUNT(*) AS not_refused FROM curated.v_cm_elevate_disbursement WHERE refused_flag_raw IS DISTINCT FROM TRUE"
- id: AP08
  title: "Re-adding subsidy and loan (or tranches) by hand"
  rule: V15
  why: "The stored total is verified; adding parts invites NULL arithmetic errors and double counting."
  wrong: "SELECT ROUND(SUM(total_subsidy_disbursement + total_loan_disbursement) / 1e7, 2) AS total_cr FROM curated.v_cm_elevate_disbursement"
  right: "SELECT ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr FROM curated.v_cm_elevate_disbursement"
- id: AP09
  title: "Building a metric on bank_sanctioned_amount"
  rule: V09
  why: "Meaning unconfirmed - refuse the share, offer the loans actually disbursed."
  wrong: "SELECT ROUND(100.0 * SUM(bank_sanctioned_amount) / NULLIF(SUM(sanctioned_amount), 0), 1) AS bank_share_pct FROM curated.v_cm_elevate_disbursement"
  right: "SELECT COALESCE(loan_entity, '(not recorded)') AS loan_entity, ROUND(SUM(total_loan_disbursement) / 1e7, 2) AS loan_cr FROM curated.v_cm_elevate_disbursement GROUP BY loan_entity ORDER BY loan_cr DESC"
- id: AP10
  title: "Joining a dimension the view already carries"
  rule: V03
  why: "Zero joins for any ordinary question - and an INNER join to dim_year deletes both Sericulture schemes."
  wrong: "SELECT y.financial_year, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement v JOIN curated.dim_year y ON v.year_key = y.year_key GROUP BY 1 ORDER BY 1"
  right: "SELECT COALESCE(financial_year_short, '(no financial year)') AS financial_year, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY financial_year_short ORDER BY financial_year_short NULLS LAST"
- id: AP11
  title: "Querying the fact table (it carries PII names)"
  rule: V02
  why: "The view is the only query surface."
  wrong: "SELECT COUNT(*) AS records FROM curated.fact_cm_elevate_disbursement"
  right: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement"
- id: AP12
  title: "Monthly grouping from disbursement dates"
  rule: V11
  why: "No monthly grain exists - refuse and offer the two FYs."
  wrong: "SELECT EXTRACT(MONTH FROM subsidy_disbursement_date_1) AS month, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY 1 ORDER BY 1"
  right: "SELECT COALESCE(financial_year_short, '(no financial year)') AS financial_year, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY financial_year_short ORDER BY financial_year_short NULLS LAST"
- id: AP13
  title: "Grouping by lender without the unattributed bucket"
  rule: V17
  why: "401 records (19 with loan money) print as an unlabeled blank row."
  wrong: "SELECT loan_entity, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY loan_entity ORDER BY 2 DESC"
  right: "SELECT COALESCE(loan_entity, '(not recorded)') AS loan_entity, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY loan_entity ORDER BY records DESC"
- id: AP14
  title: "Ratio without NULLIF"
  rule: V21
  why: "A filtered scope with no sanction divides by zero; also show numerator and denominator."
  wrong: "SELECT SUM(total_disbursement) / SUM(sanctioned_amount) AS utilisation FROM curated.v_cm_elevate_disbursement"
  right: "SELECT ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct FROM curated.v_cm_elevate_disbursement"

# ---------------------------------------------------------------------------
# 8. Answer-writing shots (response composer). Two are picked per answer by
# similarity and shown as WORDING examples only - their numbers are never the
# current answer's data (the composer's numbers-locked check enforces that).
# ---------------------------------------------------------------------------
answer_shots:
- id: A01
  question: "What is the total amount disbursed under CM-ELEVATE?"
  columns: [sanctioned_cr, subsidy_cr, loan_cr, total_disbursed_cr, disbursed_pct]
  rows: [[142.74, 52.57, 30.33, 82.9, 58.1]]
  answer: >-
    ₹82.90 crore has been disbursed under CM Elevate Legacy - ₹52.57 crore as subsidy
    and ₹30.33 crore as loans - against ₹142.74 crore sanctioned, so 58.1% of the
    sanction has been paid out. Assumed: "disbursed" is shown three ways because it can
    mean subsidy, loan or both; desanctioned records are included, as in the source
    file's totals. Would you like the subsidy and loan split by scheme?
- id: A02
  question: "How many applications are recorded for each financial year?"
  columns: [financial_year, records]
  rows: [["2024-25", 2291], ["2025-26", 137], ["(no financial year)", 395]]
  answer: >-
    FY 2024-25 holds 2,291 records and FY 2025-26 holds 137. Another 395 records carry
    no financial year - all of them from the two Sericulture schemes, so Sericulture does
    not appear in either year. Financial years are the recorded year labels, not years
    worked out from disbursement dates. Records here are sanction-and-disbursement
    records, one per applicant per scheme. Would you like to see which schemes make up
    FY 2025-26?
- id: A03
  question: "How many villages in West Garo Hills received support?"
  columns: [villages, records_in_those_villages]
  rows: [[196, 439]]
  caveat_values: {unresolved_records: 54}
  answer: >-
    196 villages in West Garo Hills have CM Elevate Legacy records (439 records). A
    further 54 records in the district could not be matched to a village and are left
    out of the village count; they are still included in West Garo Hills' record and
    money totals. Villages are counted by LGD code, because some village names are shared
    by more than one village. Would you like these broken down by block?
- id: A04
  question: "How many records were refused?"
  columns: [desanction_reason_refused, desanction_reason_duplicate, any_desanction_reason, refused_flag_set, written_reason, desanctioned_but_paid]
  rows: [[52, 31, 83, 8, 7, 32]]
  answer: >-
    52 records are marked "Refused" and 31 "Duplicate" in the desanction reason - 83
    withdrawn sanctions in all. The separate refusal flag is set on only 8 records and a
    written reason exists on 7, so the three fields disagree and none of them is
    authoritative. 32 of the 83 desanctioned records still received money, so leaving
    them out would change any money total. Would you like to see how the three fields
    overlap?
- id: A05
  question: "What percentage of applications have been sanctioned?"
  columns: [records, sanctioned_records, sanctioned_pct]
  rows: [[2823, 2820, 99.89]]
  answer: >-
    99.89% of the records in CM Elevate Legacy carry a sanctioned amount - 2,820 of
    2,823. The 3 without one are all marked Refused. This is a share of this sanction
    and disbursement dataset; applications that never reached sanction sit in the
    separate CM Elevate applications dataset, which cannot be linked to this one.
- id: A06
  question: "Which scheme is the biggest?"
  columns: [scheme_name, records, sanctioned_cr, total_disbursed_cr]
  rows: [["Meghalaya Piggery Development Scheme", 1353, 16.91, 9.52], ["Meghalaya Poultry Farming Scheme", 454, 5.45, 4.01], ["Meghalaya Agriculture Warehouse Scheme", 87, 44.34, 22.62]]
  answer: >-
    It depends on the measure. By number of records it is the Meghalaya Piggery
    Development Scheme, with 1,353 records. By money it is the Meghalaya Agriculture
    Warehouse Scheme - ₹44.34 crore sanctioned and ₹22.62 crore disbursed from just 87
    records. Disbursed here means subsidy and loan together. Would you like all 13
    schemes ranked on both measures?
- id: A07
  question: "What is the average sanctioned amount for Piggery?"
  columns: [sanctioned_rupees, records]
  rows: [[125000, 1353]]
  answer: >-
    ₹1,25,000 - the same on all 1,353 Piggery records, because the scheme pays a fixed
    entitlement, so an average adds nothing beyond that figure. What varies is how much
    of it has been paid; shall I show the payment steps?
- id: A08
  question: "How much did Sericulture spinning actually disburse?"
  columns: [records, with_subsidy, with_loan, sanctioned_rupees, total_disbursed_rupees]
  rows: [[198, 0, 2, 20063892, 26000]]
  answer: >-
    Almost nothing. The spinning scheme sanctioned ₹2.01 crore across 198 records but
    disbursed only ₹26,000, and none of that was subsidy - no subsidy payment was made
    on any record; the ₹26,000 is two loans. The scheme also has no financial year on
    any record, so it does not appear in year-by-year figures. Would you like to see the
    weaving scheme alongside it?
