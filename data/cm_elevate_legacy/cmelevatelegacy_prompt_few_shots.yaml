# cmelevatelegacy_prompt_few_shots.yaml
#
# CM Elevate Legacy - prompt-layer few-shot bank, v2.0 (2026-09-24).
# Scheme: CM Elevate Legacy (DB: CM Elevate Disbursement,
# curated.v_cm_elevate_disbursement). Transcribed from PROMPT_LAYER_FEW_SHOTS.md
# ("Prompt Layer Re-verification and Few-Shot Library v2"). That document is the
# reviewed source; this file is the machine-readable form the app loads.
#
# How the app reads this file (app/annotations.py):
#   sql_generation_examples  - the retrieval pool for the SQL prompt. Every entry
#       has `question` and either `sql` or `status: UNANSWERABLE` + `reason`
#       (the loader's existing contract). The extra keys are additive:
#         variants     - other phrasings; retrieval scores the best of question
#                        and variants, so "kitne records hai piggery me" finds C02
#         plan         - 1-5 reasoning steps, rendered as a "Plan:" line
#         caveat_sql   - companion query that fetches the number a caveat needs
#         assumptions / caveats / use_case / why - documentation for reviewers
#   common_mistakes          - the contrastive WRONG -> RIGHT block, rendered into
#                              every CM Elevate Legacy SQL prompt
#   answer_shots             - result rows + finished answer, for the composer
#   clarification_shots      - what the gate asks instead of guessing (reference;
#                              the sericulture ask is wired in app/pipeline.py)
#
# Policy defaults applied here: disbursement_ambiguity = answer_with_split and
# refusal_ambiguity = answer_all_fields, so M01 and R01 are in the pool and the
# clarify_first shots K01 / K02 are kept out of it (the model must never see
# contradictory examples). partition_context = routed_here, so K06 is also out:
# the app itself decides which CM Elevate dataset a question belongs to.
#
# Every expected figure is a SOURCE-WORKBOOK figure (2,823 rows). The database
# now holds all 2,823 too - source row 2392 was un-quarantined on 2026-09-25.
# NOT ONE QUERY HAS BEEN EXECUTED AGAINST megh_db; they execute on the calibrated
# mock described in the document. Verify before trusting a figure.

bank_version: '2.0'
scheme: CM Elevate Legacy
query_surface: curated.v_cm_elevate_disbursement
# The scheme's own name, as retrieval tokens. The pool below is already this
# scheme's, so its name separates nothing; without this, "legacy" (rare in the
# shot questions, so a high IDF) dragged the same shots into every prompt.
# ("disbursement" is NOT listed: retrieval folds it into the money token that
# every disbursement question needs.)
ranking_stop_words: [cm, elevate, legacy, cmelevate, cmelevatelegacy, under]
# The document's selection rule: at most one refusal shot per prompt, and a
# refusal must out-match the SQL shots clearly to lead (a real refusal question
# is caught earlier by the pipeline's deterministic not-held gate anyway).
refusal_score_factor: 0.6
max_refusal_shots: 1

sql_generation_examples:

# ---- 6.1 Counts and scheme mix -------------------------------------------
- id: C01
  use_case: TC-11
  question: "How many total applications are recorded under CM-ELEVATE?"
  variants: ["total beneficiaries under CM Elevate", "how many records are there", "total no of cases"]
  plan:
  - "Bare CM-ELEVATE -> this partition (routed_here); state it"
  - "Applications -> records: one row = one sanction-and-disbursement record"
  - "No mandatory filter in this scheme -> COUNT(*)"
  sql: |
    SELECT COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement;
  assumptions:
  - "Answering from the CM Elevate Legacy sanction and disbursement records."
  - "Counted as records - one row is one applicant's sanction and disbursement under one scheme."
  caveats: [record_grain_note, quarantine_note]
  why: "No placeholder flag exists here (unlike PMAY) - adding any blanket WHERE would be invented."

- id: C02
  use_case: TC-12
  question: "How many applications are recorded under Piggery?"
  variants: ["kitne records hai piggery me", "piggery ke kitne beneficiary", "no. of pig farming cases"]
  plan:
  - "Resolve 'Piggery' -> exact stored scheme_name"
  - "Filter on scheme_name - never on the MPDSI prefix"
  - "COUNT(*)"
  sql: |
    SELECT COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Piggery Development Scheme';
  assumptions: ["Read 'Piggery' as Meghalaya Piggery Development Scheme."]
  caveats: [record_grain_note]

- id: C03
  use_case: TC-12, TC-13
  question: "How many records are there under each scheme?"
  variants: ["scheme wise applications", "scheme-wise count", "applications per scheme"]
  plan:
  - "Group by scheme_name"
  - "13 schemes -> return all, no LIMIT"
  - "Order by records desc"
  sql: |
    SELECT scheme_name, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY records DESC;
  assumptions: ["All 13 schemes are shown, since the list is short enough to read in full."]
  caveats: [record_grain_note]

- id: C04
  use_case: TC-13
  question: "Which schemes have the highest number of applications?"
  variants: ["top schemes by applications", "schemes with most beneficiaries"]
  plan:
  - "Rank schemes by COUNT(*)"
  - "Add share of total (window) to expose the Piggery skew"
  - "Add sanctioned_cr because the money leader is a different scheme"
  sql: |
    SELECT scheme_name,
           COUNT(*) AS records,
           ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct,
           ROUND(SUM(sanctioned_amount) / 1e7, 2)          AS sanctioned_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY records DESC;
  assumptions: ["Ranked by number of records; all 13 schemes are shown."]
  caveats: [biggest_scheme_ambiguity, scheme_skew_note, record_grain_note]

- id: C05
  question: "Which scheme is the biggest?"
  variants: ["largest scheme", "most important scheme under CM Elevate"]
  plan:
  - "'Biggest' has no measure -> return records AND money"
  - "Order by records; the answer must say Warehouse leads on money"
  sql: |
    SELECT scheme_name,
           COUNT(*)                                AS records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY records DESC;
  assumptions: ["Schemes are compared on both record count and amount, since the largest by records and the largest by money are different schemes."]
  caveats: [biggest_scheme_ambiguity, disbursement_split_caveat]

- id: C06
  use_case: TC-14
  question: "How many applications have been sanctioned under CM-ELEVATE?"
  variants: ["number of sanctioned cases", "total sanctions"]
  plan:
  - "Sanctioned cases = records that carry a sanctioned amount: COUNT(sanctioned_amount)"
  - "Show all records alongside - 3 Refused records carry no sanctioned amount"
  - "Say how many were later desanctioned (Refused / Duplicate)"
  sql: |
    SELECT COUNT(*)                               AS records,
           COUNT(sanctioned_amount)               AS sanctioned_records,
           COUNT(desanctioned_reason_raw)         AS later_desanctioned,
           ROUND(SUM(sanctioned_amount) / 1e7, 2) AS sanctioned_cr
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["A sanctioned case is a record with a sanctioned amount; the few records without one (all marked Refused) are not counted as sanctioned. Records later desanctioned (Refused / Duplicate) are reported alongside, not removed."]
  caveats: [record_grain_note, sanctioned_not_disbursed]

- id: C07
  use_case: TC-19
  question: "How many sanctioned applications are there for each scheme?"
  plan:
  - "Sanctioned cases = COUNT(sanctioned_amount), never COUNT(*)"
  - "Group by scheme with sanctioned amount alongside"
  sql: |
    SELECT scheme_name,
           COUNT(sanctioned_amount)               AS sanctioned_records,
           ROUND(SUM(sanctioned_amount) / 1e7, 2) AS sanctioned_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY sanctioned_records DESC;
  assumptions: ["A sanctioned case is a record with a sanctioned amount; Any Business Venture has 3 Refused records with none, which are not counted."]
  caveats: [record_grain_note]

- id: C08
  use_case: TC-35
  question: "Compare the number of sanctioned applications across West Garo Hills and Ri Bhoi."
  variants: ["WGH vs Ri Bhoi sanctioned cases", "compare two districts"]
  plan:
  - "Two districts -> IN list of UPPERCASE stored names"
  - "Sanctioned applications = COUNT(sanctioned_amount)"
  - "Carry sanctioned and disbursed money for context"
  - "ROLLUP adds an exact ALL SELECTED DISTRICTS row - a combined figure comes from it, never from adding rounded rows"
  sql: |
    SELECT COALESCE(lgd_district, 'ALL SELECTED DISTRICTS') AS lgd_district,
           COUNT(sanctioned_amount)                AS sanctioned_records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_district IN ('WEST GARO HILLS', 'RI BHOI')
    GROUP BY ROLLUP (lgd_district)
    ORDER BY GROUPING(lgd_district), sanctioned_records DESC;
  assumptions: ["A sanctioned application is a record with a sanctioned amount; money is shown alongside."]
  caveats: [record_grain_note, disbursement_split_caveat]

- id: C09
  question: "List all the schemes"
  variants: ["which schemes are covered", "how many schemes are there", "names of sub-schemes"]
  plan:
  - "Distinct scheme_name with record count"
  - "13 rows, alphabetical is fine but records desc is more useful"
  sql: |
    SELECT scheme_name, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY records DESC;
  why: "A scheme list answers from the data, never from memory - and there are 13 here, not the 15 of the other CM Elevate dataset."

- id: C10
  question: "How many distinct schemes operate in East Khasi Hills?"
  plan:
  - "District literal is the stored UPPERCASE form"
  - "COUNT(DISTINCT scheme_name)"
  sql: |
    SELECT COUNT(DISTINCT scheme_name) AS schemes,
           COUNT(*)                    AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_district = 'EAST KHASI HILLS';

# ---- 6.2 Money - sanctioned, subsidy, loan, total, utilisation, pending ---
- id: M01
  use_case: TC-17
  policy: "disbursement_ambiguity=answer_with_split/total_means_both"
  question: "What is the total amount disbursed under CM-ELEVATE?"
  variants: ["how much money has been disbursed", "total disbursment", "how much was released so far"]
  plan:
  - "'Disbursed' is 3-way -> return subsidy, loan and total side by side"
  - "Sanctioned beside it + disbursed %"
  - "Stored totals only; ROUND(SUM/1e7,2) crore"
  sql: |
    SELECT ROUND(SUM(sanctioned_amount)          / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement;
  assumptions:
  - 'Disbursement is shown three ways - subsidy, loan, and the two together - since "disbursed" can mean any of them.'
  - "Desanctioned records are included in the totals, as the source file's own totals include them."
  caveats: [disbursement_split_caveat, sanctioned_not_disbursed]

- id: M02
  question: "What is the total disbursement, subsidy and loan together?"
  variants: ["overall amount paid including loans", "combined disbursement"]
  plan:
  - "User named the whole -> total_disbursement"
  - "Sanctioned alongside"
  sql: |
    SELECT ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Using total disbursement - subsidy and loan together."]
  caveats: [sanctioned_not_disbursed]

- id: M03
  question: "How much subsidy has been paid out?"
  variants: ["total grant disbursed", "subsidy released", "assistance given as subsidy"]
  plan:
  - "Subsidy -> total_subsidy_disbursement (never the tranches)"
  - "Count records with subsidy > 0"
  sql: |
    SELECT ROUND(SUM(total_subsidy_disbursement) / 1e7, 2)      AS subsidy_cr,
           COUNT(*) FILTER (WHERE total_subsidy_disbursement > 0) AS records_with_subsidy
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Subsidy means the grant paid, excluding loans."]

- id: M04
  question: "What is the total amount sanctioned?"
  plan:
  - "Sanctioned -> SUM(sanctioned_amount); it is NOT disbursed"
  sql: |
    SELECT ROUND(SUM(sanctioned_amount) / 1e7, 2) AS sanctioned_cr,
           COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Sanctioned means the amount approved - not the amount paid out."]
  caveats: [sanctioned_not_disbursed]

- id: M05
  use_case: TC-18
  question: "What is the total amount disbursed under each scheme?"
  variants: ["scheme wise disbursement", "how much each scheme paid out"]
  plan:
  - "Group by scheme"
  - "Split subsidy / loan / total + sanctioned"
  - "Order by total disbursed"
  sql: |
    SELECT scheme_name,
           COUNT(*)                                        AS records,
           ROUND(SUM(sanctioned_amount)          / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY total_disbursed_cr DESC;
  assumptions: ["Disbursement is shown as subsidy, loan and total side by side; all 13 schemes are shown."]
  caveats: [disbursement_split_caveat, sanctioned_not_disbursed]

- id: M06
  question: "How much of the sanctioned amount has actually been disbursed?"
  variants: ["fund utilisation", "disbursement rate", "what percent of sanction is paid"]
  plan:
  - "Utilisation = total disbursed / sanctioned (a share of MONEY - answerable)"
  - "Show numerator and denominator"
  - "NULLIF on the denominator"
  sql: |
    SELECT ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement;
  assumptions: ["Utilisation is total disbursed (subsidy and loan) over total sanctioned."]
  caveats: [sanctioned_not_disbursed, disbursement_split_caveat]
  why: "A share of the sanctioned AMOUNT is answerable; a share of APPLICATIONS sanctioned is not (X01)."

- id: M07
  question: "Which district has the highest utilisation?"
  variants: ["best performing district by disbursement %", "district wise utilisation"]
  plan:
  - "Utilisation per district = disbursed / sanctioned"
  - "Rank all 12 with both sides of the ratio and record count"
  - "Singular 'highest' -> the lead row, but show the table for context"
  sql: |
    SELECT lgd_district,
           COUNT(*)                                AS records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement
    GROUP BY lgd_district
    ORDER BY disbursed_pct DESC, records DESC;
  assumptions: ["Utilisation is total disbursed over total sanctioned; all 12 districts are ranked."]
  caveats: [sanctioned_not_disbursed, small_scheme_note]

- id: M08
  question: "Which schemes have the largest gap between sanctioned and disbursed?"
  variants: ["pending amount by scheme", "outstanding disbursement per scheme", "yet to be disbursed"]
  plan:
  - "Pending is DERIVED (sanctioned - disbursed); label it"
  - "Keep negatives as calculated"
  - "Order by pending desc"
  sql: |
    SELECT scheme_name,
           COUNT(*)                                AS records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr,
           ROUND((SUM(sanctioned_amount) - SUM(total_disbursement)) / 1e7, 2) AS pending_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY pending_cr DESC;
  assumptions: ["Pending is calculated as sanctioned minus disbursed - it is not a recorded column in this scheme."]
  caveats: [pending_derived_note, singleton_scheme_note]

- id: M09
  question: "What is pending to be disbursed in Mylliem?"
  plan:
  - "Mylliem -> block literal"
  - "Pending = sanctioned - disbursed (derived)"
  sql: |
    SELECT COUNT(*)                                AS records,
           ROUND(SUM(sanctioned_amount)  / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_disbursement) / 1e7, 2) AS total_disbursed_cr,
           ROUND((SUM(sanctioned_amount) - SUM(total_disbursement)) / 1e7, 2) AS pending_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_block = 'MYLLIEM';
  assumptions: ["Pending is calculated as sanctioned minus disbursed - it is not a recorded column in this scheme."]
  caveats: [pending_derived_note]

- id: M10
  use_case: TC-27
  question: "What is the total disbursement amount for each district?"
  variants: ["district wise disbursement", "money paid per district"]
  plan:
  - "Group by district; KEEP Unresolved-village rows (district is known)"
  - "Split subsidy / loan / total + sanctioned + records"
  sql: |
    SELECT lgd_district,
           COUNT(*)                                        AS records,
           ROUND(SUM(sanctioned_amount)          / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    GROUP BY lgd_district
    ORDER BY total_disbursed_cr DESC;
  assumptions:
  - "Records whose village could not be identified are included in district figures, where their district is known."
  - "Record counts are shown alongside the money, since district totals are driven by which schemes happen to sit there."
  caveats: [disbursement_split_caveat]

- id: M11
  use_case: TC-30
  question: "What is the total disbursement amount for Mawkyrwat block?"
  variants: ["total disbursment mawkyrwat", "money in Mawkyrwat"]
  plan:
  - "Mawkyrwat is both block and village -> block (user said block)"
  - "UPPERCASE literal"
  - "Split money"
  sql: |
    SELECT COUNT(*)                                        AS records,
           ROUND(SUM(sanctioned_amount)          / 1e7, 2) AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2) AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2) AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2) AS total_disbursed_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE lgd_block = 'MAWKYRWAT';
  caveats: [disbursement_split_caveat]

- id: M12
  question: "What share of the total sanctioned amount does each scheme have?"
  variants: ["scheme wise percentage of sanction", "contribution of each scheme to sanctioned money"]
  plan:
  - "Per-scheme SUM(sanctioned_amount)"
  - "Share over the statewide total via a window SUM"
  - "All 13 rows"
  sql: |
    SELECT scheme_name,
           ROUND(SUM(sanctioned_amount) / 1e7, 2) AS sanctioned_cr,
           ROUND(100.0 * SUM(sanctioned_amount) / SUM(SUM(sanctioned_amount)) OVER (), 1) AS share_of_state_pct
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY sanctioned_cr DESC;
  caveats: [sanctioned_not_disbursed]

- id: M13
  question: "Compare Piggery and Poultry"
  variants: ["piggery vs poultry", "difference between pig and poultry schemes"]
  plan:
  - "Two exact scheme literals in an IN list"
  - "Compare records, sanctioned, subsidy, loan, total, disbursed %"
  - "Loan uptake count because it differs sharply"
  sql: |
    SELECT scheme_name,
           COUNT(*)                                            AS records,
           COUNT(*) FILTER (WHERE total_loan_disbursement > 0) AS with_loan,
           ROUND(SUM(sanctioned_amount)          / 1e7, 2)     AS sanctioned_cr,
           ROUND(SUM(total_subsidy_disbursement) / 1e7, 2)     AS subsidy_cr,
           ROUND(SUM(total_loan_disbursement)    / 1e7, 2)     AS loan_cr,
           ROUND(SUM(total_disbursement)         / 1e7, 2)     AS total_disbursed_cr,
           ROUND(100.0 * SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0), 1) AS disbursed_pct
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name IN ('Meghalaya Piggery Development Scheme', 'Meghalaya Poultry Farming Scheme')
    GROUP BY scheme_name
    ORDER BY records DESC;
  assumptions: ["Schemes are compared on both record count and amount."]
  caveats: [fixed_entitlement_note, disbursement_split_caveat]

- id: M14
  question: "What is the average disbursement per applicant?"
  variants: ["average amount per beneficiary", "mean disbursement per record"]
  plan:
  - "Per-record average is in RUPEES"
  - "Break down by scheme - a statewide mean is a Piggery mean"
  - "AVG ignores NULLs; never COALESCE to 0"
  sql: |
    SELECT scheme_name,
           COUNT(*)                               AS records,
           ROUND(AVG(total_disbursement))         AS avg_total_disbursed_rupees,
           ROUND(AVG(total_subsidy_disbursement)) AS avg_subsidy_rupees
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY avg_total_disbursed_rupees DESC;
  assumptions: ["Averaged per record and broken down by scheme, because a single statewide average is dominated by Piggery."]
  caveats: [scheme_skew_note, singleton_scheme_note, disbursement_split_caveat]

- id: M15
  question: "What is the average sanctioned amount for Piggery?"
  variants: ["piggery sanctioned amount per beneficiary", "how much is sanctioned per piggery unit"]
  plan:
  - "Piggery is a fixed-entitlement scheme"
  - "AVG would restate the constant -> show the distribution"
  sql: |
    SELECT sanctioned_amount AS sanctioned_rupees, COUNT(*) AS records
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Piggery Development Scheme'
    GROUP BY sanctioned_amount
    ORDER BY records DESC;
  assumptions: ["Meghalaya Piggery Development Scheme pays a fixed entitlement to every applicant, so the distribution is shown rather than an average."]
  caveats: [fixed_entitlement_note]

- id: M16
  question: "Dairy sanctioned amount"
  variants: ["how much is sanctioned under dairy"]
  plan:
  - "Dairy pays a fixed Rs 3,00,000 per record"
  - "Give the total AND the per-record entitlement in one query"
  sql: |
    SELECT sanctioned_amount                          AS sanctioned_each_rupees,
           COUNT(*)                                   AS records,
           ROUND(SUM(sanctioned_amount) / 1e7, 2)     AS sanctioned_cr
    FROM curated.v_cm_elevate_disbursement
    WHERE scheme_name = 'Meghalaya Dairy Development Scheme'
    GROUP BY sanctioned_amount
    ORDER BY records DESC;
  assumptions: ["Meghalaya Dairy Development Scheme pays a fixed entitlement, so the total is the record count times that amount."]
  caveats: [fixed_entitlement_note, sanctioned_not_disbursed]

- id: M17
  question: "Which schemes pay a fixed entitlement?"
  plan:
  - "Distinct sanctioned amounts per scheme with min / max"
  - "1 distinct value = fixed entitlement"
  sql: |
    SELECT scheme_name,
           COUNT(DISTINCT sanctioned_amount) AS distinct_amounts,
           MIN(sanctioned_amount)            AS min_sanctioned_rupees,
           MAX(sanctioned_amount)            AS max_sanctioned_rupees,
           COUNT(*)                          AS records
    FROM curated.v_cm_elevate_disbursement
    GROUP BY scheme_name
    ORDER BY distinct_amounts, records DESC;
