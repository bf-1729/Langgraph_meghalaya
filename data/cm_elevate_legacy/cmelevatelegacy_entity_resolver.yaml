        placeholder with entity_type = 'Unresolved' and on_roster = FALSE. They carry a
        real district. KEEP them in district and state totals so the figures reconcile;
        EXCLUDE them from every village count or village list with
        `AND entity_type <> 'Unresolved'`, and say how many were set aside.
