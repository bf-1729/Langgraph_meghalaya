        present them as high-performing villages - they are one big sanction each.
    catalogue_note: >
      The full 1,051-code catalogue is not inlined here. Resolve village names against
      curated.dim_geography at runtime, filtered to the codes present in this scheme, and
      apply the ambiguity registry above before accepting a single match.

  financial_year:
    name_column: financial_year_short
    canonical_column: financial_year
    source: curated.dim_year, reached by LEFT JOIN
    distinct_in_this_scheme: 2
    sql_predicate: "financial_year_short = '<canonical>'"
    values:
    - canonical: '2024-25'
      long_form: '2024-2025'
      records: 2291
      aliases: ["2024-25", "2024-2025", "FY 2024-25", "FY25", "2024 25", "24-25", "last year", "FY 2024"]
      schemes: >
        All 13 schemes except the two Sericulture ones, which carry no year at all.
    - canonical: '2025-26'
      long_form: '2025-2026'
      records: 137
      aliases: ["2025-26", "2025-2026", "FY 2025-26", "FY26", "2025 26", "25-26", "this year", "current year", "FY 2025"]
      schemes: >
        Only three - Prime Tourism Vehicle (84), Agriculture Warehouse (27) and Prime
        Agriculture Response Vehicle (26). An FY-over-FY comparison is really a
        comparison of those three schemes.
    null_bucket:
      critical: true
      records: 395
      label_in_output: "(no financial year)"
      finding: >
        THE 395 UNDATED RECORDS ARE EXACTLY THE TWO SERICULTURE SCHEMES - 198 spinning
        plus 197 weaving, and no record from any other scheme. So a financial-year
        grouping does not scatter a few stragglers into a NULL bucket; it removes
        Sericulture from the answer entirely. Any FY breakdown must either report the
        bucket or state that Sericulture is excluded.
    date_disagreement:
      critical: true
      text: >
        The stated financial year and the year implied by the first subsidy disbursement
        date disagree on 114 of the 1,842 records where both exist - 77 stated 2024-25
        that derive to 2025-26, 34 the other way, 2 deriving to 2026-27 and 1 to 2023-24.
        9 further records carry a real date (2025-09-24, all Sericulture weaving) with no
        stated year. The database groups on the stated label, so that is what this
        resolver emits. Never derive a financial year from a date, and if a question
        mixes the two, say that they do not reconcile.
    year_disambiguation:
      rule: >
        A bare "2024" or "2025" is ambiguous between a calendar year and a financial
        year, but the two are not measured the same way here: the financial year is a
        recorded label, while a calendar year can only come from the disbursement dates,
        which disagree with that label on 114 records. Prefer the financial year, state
        the assumption, and offer the date-based reading as an alternative.

  loan_entity:
    name_column: loan_entity
    distinct: 2
    nulls: 401
    sql_predicate: "loan_entity = '<canonical>'"
    values:
    - canonical: "Bank"
      records: 1733
      with_loan_money: 452
      aliases: [bank, banks, "through bank", "bank loan", "commercial bank", "scheduled bank"]
      note: >
        A literal category value, not the name of a bank. There is no bank-name column in
        this scheme - a question naming a specific bank cannot be answered.
    - canonical: "LIFCOM"
      records: 689
      with_loan_money: 331
      aliases: [lifcom, "LIFCOM loan", "life com", "L.I.F.C.O.M.",
                "Meghalaya Livestock and Fisheries Corporation"]
      note: >
        The expansion in the aliases is a reasonable reading of the acronym, NOT a
        client-confirmed fact. Accept it as an alias; do not print it as the entity's
        full name.
    null_rule:
      critical: true
      text: >
        401 records have no lender recorded, and 19 of them carry loan money anyway. A
        bare GROUP BY loan_entity drops all 401. Emit
        COALESCE(loan_entity, '(not recorded)') and keep the bucket visible.

  loan_disbursed_status:
    name_column: loan_disbursed_status
    distinct: 2
    stored_case: lowercase - emit verbatim
    sql_predicate: "loan_disbursed_status = '<canonical>'"
    values:
    - { canonical: "disbursed",     records: 802,  aliases: [disbursed, paid, released, "loan given"] }
    - { canonical: "not disbursed", records: 2020, aliases: ["not disbursed", "no loan", unpaid, "not paid", "loan not given"] }
    derived_warning:
      critical: true
      text: >
        This column is FULLY DERIVED from the money: 'disbursed' holds exactly where
        total_loan_disbursement > 0, on every row without exception. It is the same fact
        stated twice, so it can filter but can never corroborate an amount. Note the
        lowercase stored values - 'Disbursed', 'Y' and 'Yes' are not stored forms.

  desanctioned_reason:
    name_column: desanctioned_reason_raw
    distinct: 2
    nulls: 2740
    sql_predicate: "desanctioned_reason_raw = '<canonical>'"
    values:
    - canonical: "Refused"
      records: 52
      with_disbursement: 9
      aliases: [refused, rejected, declined, "turned down", cancelled]
    - canonical: "Duplicate"
      records: 31
      with_disbursement: 23
      observable_twins: 6
      aliases: [duplicate, "repeated", "double entry", "same applicant twice"]
    null_rule: >
      NULL means nothing was recorded, NOT that the record was accepted. Label it
      "(none recorded)" in a breakdown, never "not refused".
    companion_fields:
      refused_flag_raw:
        records_true: 8
        stored_values: TRUE only - never FALSE
        predicate_for_not_refused: "refused_flag_raw IS DISTINCT FROM TRUE"
      refused_reason_text:
        records: 7
        distinct_values: 6
        values: ["Unable to connect", "Government Employee", "Wife is a government employee",
                 "Repeated name", "Family emergency", "Economical reason"]
        rule: >
          Free text, not a coded dimension - never GROUP BY it. One value names a family
          circumstance; do not pair it with a geography narrow enough to identify a
          person.
    disagreement:
      critical: true
      text: >
        The three fields disagree. 2 records carry the flag with no desanction reason;
        47 of the 52 Refused records do not carry the flag; only 4 carry all three, and
        source_row_id 429 carries the first two with a blank reason. No field is
        authoritative - name the one used in every answer.

  identifiers:
    application_number:
      column: application_number
      unique: true
      format: five letters then six digits, exactly 11 characters
      examples: [MPDSI018328, MPFSI000961, ARVSR000104, PTVSI000088, MSWCS000042]
      sql_predicate: "application_number = '<value>'"
      never_parse:
        critical: true
        text: >
          The letters are NOT a scheme code. 7 of the 13 schemes use more than one prefix
          and one Poultry record carries Piggery's MPDSI. The 5th letter (I/R/U) looks
          like an applicant-type code but is unreliable - in MABVS and MSWCS it is part
          of the acronym. Resolve schemes through scheme_name, and never offer an
          applicant-type split.
      lookup_behaviour: >
        Unique, so a lookup returns at most one row - unlike PMAY's reg_no, which repeats.
        A prefix search is possible but must be labelled as a prefix search, not a scheme
        filter.
    source_row_id:
      column: source_row_id
      unique: true
      meaning: the source workbook's own id
      use: >
        The anchor for every data-quality finding in this scheme. Accept it when a user
        quotes one (429, 532, 1351, 1894, 2392 and the rest), and use it to explain an
        anomaly rather than to list records.
    village_code:
      column: village_code
      meaning: LGD national village code
      use: The only correct village identity. Never SUM it.
    applicant_name:
      status: NOT_RESOLVABLE
      critical: true
      text: >
        first_name, middle_name and last_name exist on the fact for audit only and are
        dropped by the view and excluded from the embedding layer. A name is not an
        entity this resolver can return. Emit not-held; do not offer suggestions, a fuzzy
        match, or a fallback to the fact table.

# ---------------------------------------------------------------------------
# DIMENSIONS THAT DO NOT EXIST - resolve to a refusal, not a guess
# ---------------------------------------------------------------------------
absent_dimensions:
  why: >
    Users, and the use-case workbook, ask for these by name. Each looks like it should be
    a dimension in a scheme of this shape, and none of them is. Resolving any of them to
    a near-neighbour column would produce a confident wrong answer.

  sanction_status:
    critical: true
    asked_by: [TC-14, TC-15, TC-16, TC-19, TC-35]
    text: >
      There is no sanctioned/not-sanctioned flag, and there cannot be a sanction rate.
      Every record here IS a sanction - 2,820 of 2,823 carry an amount and the 3 that do
      not are refusals. The denominator, all applications, lives in
      fact_cm_elevate_application with no join key.
    never: >
      NEVER resolve "not sanctioned" to the 83 desanctioned records. They are a
      post-sanction outcome, not a rejected application, and that substitution is the
      most misleading answer available in this partition.

  applicant_category:
    asked_by: [users familiar with the other CM Elevate partition]
    text: >
      No individual/group column exists here. The other CM Elevate scheme has
      applicant_category; this one does not, and the letter inside application_number is
      not a substitute.

  constituency:
    asked_by: [TC-31, TC-32]
    text: >
      mapped_constituency_name exists in the source workbook (55 values, e.g.
      "30 MAIRANG") and dim_geography carries ac_name and ac_number, but this scheme's
      fact and view expose neither. Resolve to "not available on this scheme's query
      surface" - a view change, not a data gap.

  month:
    asked_by: [users expecting PMAY-style monthly trends]
    text: >
      The source's month column was not loaded, and it holds only four values (Nov, Apr,
      Feb, Mar) across two financial years - a disbursement-batch label, not a time
      series. PMAY is the only scheme in megh_db with a real monthly grain.

  bank_name:
    text: >
      loan_entity holds Bank or LIFCOM. There is no column naming an individual bank, no
      branch, no IFSC and no account - unlike Focus Legacy, which carries all four.

  demographics:
    text: >
      No gender, age, caste, income, category or household field exists for this scheme.

  repayment:
    text: >
      The source's loan_repaid column is 0 on every row and was not loaded. "None have
      been repaid" would present an empty column as a finding.

  business_outcome:
    text: >
      Jobs created, income, turnover and survival of the venture are not recorded. The
      data stops at the money leaving the department.

# ---------------------------------------------------------------------------
measure_vocabulary:

  record_count:
    column: "*"
    aliases: [records, applications, applicants, beneficiaries, cases, how many, count,
              number of records]
    aggregate: COUNT(*)
    note: >
      One row is one applicant's sanction-and-disbursement record under one scheme. No
      mandatory filter, unlike PMAY. COUNT(DISTINCT application_number) is identical.

  sanctioned_amount:
    column: sanctioned_amount
    aliases: [sanctioned amount, sanction amount, amount sanctioned, approved amount,
              entitlement, allocation, sanctioned money]
    aggregate: SUM(sanctioned_amount)
    unit: rupees
    source_total: 1427420903            # Rs 142.74 Cr
    nulls: 3
    verified_in_db: false
    constant_for_schemes:
      critical: true
      text: >
        SOURCE-WORKBOOK FINDING, NOT RE-VERIFIED AGAINST megh_db. For 6 of the 13 schemes
        this column is a per-scheme CONSTANT - Piggery 125,000 on all 1,353 records,
        Poultry 120,000, Dairy 300,000, Goat 100,000, Motorcaravan 5,000,000, and
        Sericulture spinning near-constant. Where it holds:
          - SUM(sanctioned_amount) within one of those schemes is just the entitlement
            times the record count, so ranking districts by sanctioned amount inside a
            single scheme is identical to ranking them by record count.
          - AVG(sanctioned_amount) carries no information. Answer with the entitlement
            and say it is fixed.
        The other 7 schemes DO vary - Sports & Wellness spans 400,000 to 30,000,000 - so
        the rule is per-scheme, not global. This is the same shape as PMAY's flat
        130,000, but only partial.

  total_disbursement:
    column: total_disbursement
    aliases: [total disbursement, total disbursed, amount disbursed, disbursed, payout,
              money paid, released]
    aggregate: SUM(total_disbursement)
    unit: rupees
    source_total: 828978537.75          # Rs 82.90 Cr
    zero_rows: 449
    derived_verified: "= total_subsidy_disbursement + total_loan_disbursement on all 2,823 rows"
    ambiguity_warning:
      critical: true
      text: >
        This is ONE of three readings of "disbursed". Emit it only after the gate has
        confirmed the user means subsidy and loan together. See overloaded_terms.disbursed.

  total_subsidy_disbursement:
    column: total_subsidy_disbursement
    aliases: [subsidy, total subsidy, subsidy disbursed, grant, assistance, subsidy amount]
    aggregate: SUM(total_subsidy_disbursement)
    unit: rupees
    source_total: 525658223.25          # Rs 52.57 Cr
    derived_verified: "= subsidy_disbursement_1 + _2 + _3 on all 2,823 rows"
    tranche_shape: "2 tranches on 1,863 records, 1 on 469, 3 on 13, none on 478"

  total_loan_disbursement:
    column: total_loan_disbursement
    aliases: [loan, total loan, loan disbursed, credit, borrowing, loan amount]
    aggregate: SUM(total_loan_disbursement)
    unit: rupees
    source_total: 303320314.50          # Rs 30.33 Cr
    derived_verified: "= loan_disbursement_1 + _2 + _3 on all 2,823 rows"
    note: "A loan is credit the applicant carries, not a grant. Never merge it into a subsidy figure without saying so."

  bank_sanctioned_amount:
    column: bank_sanctioned_amount
    aliases: ["bank sanctioned", "bank amount", "bank share", "bank contribution"]
    aggregate: none_permitted
    unit: rupees
    source_total: 402109637.60
    zero_rows: 1435
    meaning: UNCONFIRMED
    critical: >
      DO NOT BUILD A METRIC ON THIS COLUMN. Zero on 50.8% of rows; where non-zero the
      ratio to sanctioned_amount clusters at 0.20 / 0.50 / 0.496 / 0.60 and varies within
      a single scheme - 9 distinct ratios inside Prime Tourism Vehicle alone. Route to
      the gate; never emit a share or a percentage from it.

  derived:
    disbursement_rate:
      expression: "SUM(total_disbursement) / NULLIF(SUM(sanctioned_amount), 0)"
      aliases: [utilisation, utilization, "disbursement rate", "share disbursed",
                "how much was actually paid", "fund utilisation"]
      statewide_value: 0.581
      note: >
        58.1% statewide, and it is the most informative single figure in this scheme.
        Ranges from 0.1% (Sericulture spinning) to 100% (Motorcaravan, n=1). Always
        state both numerator and denominator in the answer.
    pending_amount:
      expression: "SUM(sanctioned_amount) - SUM(total_disbursement)"
      aliases: [pending, outstanding, "not yet paid", balance, "yet to be disbursed"]
      critical: >
        A DERIVATION, NOT A COLUMN - unlike PMAY, which stores amount_pending. Label it
        as calculated. Four records disburse more than they sanctioned, so it can go
        negative in a small group; do not clamp it silently.

# ---------------------------------------------------------------------------
# PAYMENT LADDERS AND SCHEME SHAPE
# Values a user may quote at the bot, and the shape an answer has to respect.
# All figures: source workbook 2026-09-23, unverified_in_db.
# ---------------------------------------------------------------------------
payment_ladders:
  note: >
    In the fixed-entitlement schemes the money moves in equal steps, so the amounts a
    user quotes are recognisable values rather than arbitrary ones. Resolve a quoted
    amount to the scheme it belongs to before assuming it is a filter value.
  ladders:
  - scheme: Meghalaya Piggery Development Scheme
    entitlement: 125000
    tranche: 31250
    tranche_share: one quarter
    common_totals:
    - {total: 62500,  records: 1145, meaning: two tranches - half the entitlement, by far the most common outcome}
    - {total: 125000, records: 98,   meaning: four tranches - fully paid}
    - {total: 93750,  records: 33,   meaning: three tranches}
    note: >
      The four records with a corrupted date all sit at exactly Rs 31,250, i.e. one
      tranche. Their money is intact; only the date was lost.
  - scheme: Meghalaya Poultry Farming Scheme
    entitlement: 120000
    tranche: 30000
    tranche_share: one quarter
    common_totals:
    - {total: 60000,  records: 226, meaning: two tranches - half the entitlement}
    - {total: 120000, records: 214, meaning: fully paid}
  - scheme: Meghalaya Dairy Development Scheme
    entitlement: 300000
    tranche: 75000
    tranche_share: one quarter
  - scheme: Meghalaya Goat Farming Scheme
    entitlement: 100000
    tranche: 40000
    common_totals: [{total: 40000, records: 48, meaning: one payment on every record - the whole scheme}]
    note: The only scheme with no loans at all, 0 of 48 records.
  resolution_rule: >
    A user quoting "62,500" or "31,250" is almost certainly talking about Piggery, and
    "60,000" or "30,000" about Poultry. Treat a quoted ladder amount as a strong signal
    for the scheme, but confirm it rather than filtering on the amount alone - the same
    figure appears as a loan amount elsewhere (Rs 62,500 appears 96 times as a loan).

scheme_shape_facts:
  note: >
    Facts an answer should carry when it names a scheme. Each one changes how a number
    from that scheme should be read.
  facts:
  - scheme: Meghalaya Sericulture & Weaving Scheme (spinning)
    fact: "NO SUBSIDY WAS PAID AT ALL - 0 of 198 records. The scheme's entire Rs 26,000 of disbursement comes from 2 loans."
    handling: Say nothing was paid out rather than quoting a 0.1% rate, which reads as underperformance rather than inactivity.
  - scheme: Meghalaya Goat Farming Scheme
    fact: "NO LOANS AT ALL - 0 of 48 records. Every record is subsidy-only, one payment of Rs 40,000."
    handling: A zero in a loan breakdown is correct here, not a gap.
  - scheme: Prime Agriculture Response Vehicle Scheme
    fact: "Subsidy and loan on the SAME 135 records - the two are halves of one package."
    handling: Do not present subsidy and loan as alternatives for this scheme.
  - scheme: Prime Tourism Vehicle Scheme
    fact: "Same package shape - 78 records carry both. Also the highest disbursement rate of any scheme at 81.3%."
  - scheme: Meghalaya Agriculture Warehouse Scheme
    fact: "The largest scheme BY MONEY - Rs 44.34 Cr sanctioned from just 87 records - while Piggery is largest by count."
    handling: This is why "biggest scheme" must name its measure.
  - scheme: Meghalaya Piggery Development Scheme
    fact: "48% of all records, a fixed Rs 1,25,000 entitlement, and loans on only 211 of 1,353."
    handling: Any statewide average is a Piggery average. Say so or break it down.
  - scheme: Meghalaya Poultry Farming Scheme
    fact: "Loans on 219 of 454 records - a far higher rate than Piggery's, in a much smaller scheme."
  - scheme: Meghalaya Sports & Wellness Scheme
    fact: "Nine records spanning Rs 4,00,000 to Rs 3,00,00,000, and a tenth was quarantined at load."
    handling: Never quote a percentage for this scheme, and carry the quarantine caveat.
  - scheme: Meghalaya Motorcaravan Scheme
    fact: "One record, fully disbursed at Rs 50,00,000."
    handling: n=1. Never a rate, a percentage or a ranking position.
  - scheme: Meghalaya Any Business Venture Scheme
    fact: "The most varied sanctions in the scheme - 20 distinct amounts across 33 records - and the only scheme holding records with no sanctioned amount at all."

# ---------------------------------------------------------------------------
region_groupings:
  note: >
    Users group districts by hill range. These are not columns - expand into an IN list
    and state which districts were included.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      records: 1387
      aliases: [Garo, Garo region, Garo Hills region, GH]
      note: "Just under half the scheme - 1,387 of 2,823 records."
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      records: 762
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      records: 188
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      records: 486
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group. Both
        readings produce the same filter, so no clarification is needed. Do not fold it
        into Khasi Hills.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how much was disbursed under CM Elevate"
  resolve:
  - { text: "CM Elevate", type: scheme_partition, status: ambiguous,
      question: "the disbursement dataset or the applications dataset?" }
  - { text: disbursed, type: overloaded, status: ambiguous,
      question: "subsidy, loan, or both?" }
  sql: null
  note: >
    TWO clarifications before any SQL. This is the single most common question in the
    use-case workbook and it cannot be answered as asked.

- user: "total disbursement for piggery"
  resolve:
  - { text: piggery, type: scheme, canonical: "Meghalaya Piggery Development Scheme", matched_by: 2_alias }
  - { text: "total disbursement", type: measure, canonical: "SUM(total_disbursement)" }
  sql: "SELECT ROUND(SUM(total_disbursement)/1e7, 2) AS disbursed_cr FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Piggery Development Scheme';"
  expected_source_value: 95241250
  note: >
    "Piggery" names a scheme in BOTH CM Elevate partitions, so it does not settle which
    one is meant - but "total disbursement" does, because the application partition has
    no money at all.

- user: "average sanctioned amount for piggery"
  resolve:
  - { text: piggery, type: scheme, canonical: "Meghalaya Piggery Development Scheme" }
  - { text: "average sanctioned amount", type: measure, reading: constant_entitlement }
  sql: "SELECT sanctioned_amount, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Piggery Development Scheme' GROUP BY sanctioned_amount;"
  note: >
    Every Piggery record is 1,25,000, so an average restates the entitlement. Show the
    distribution and say the amount is fixed.

- user: "sericulture disbursement by financial year"
  resolve:
  - { text: sericulture, type: scheme, status: ambiguous,
      candidates: ["Meghalaya Sericulture & Weaving Scheme (spinning)", "Meghalaya Sericulture & Weaving Scheme(weaving)"],
      question: "spinning or weaving?" }
  note:
    critical: true
    text: >
      Whichever is chosen, the answer is the same shape: NEITHER Sericulture scheme has a
      financial year on ANY record. All 395 undated records in the scheme are these two.
      The honest answer is that Sericulture cannot be placed on a financial-year axis at
      all - not that it disbursed nothing in 2024-25.

- user: "how many villages in WGH got support"
  resolve:
  - { text: WGH, type: district, canonical: "West Garo Hills", lgd_code: 278, matched_by: 4_acronym }
  - { text: "how many villages", type: measure, canonical: "COUNT(DISTINCT village_code)" }
  sql: "SELECT COUNT(DISTINCT village_code) AS villages FROM curated.v_cm_elevate_disbursement WHERE lgd_district = 'WEST GARO HILLS' AND entity_type <> 'Unresolved';"
  expected_source_value: 196
  note: >
    54 West Garo Hills records have no village and are excluded here - say so. They stay
    in the district's record count and money total.

- user: "how many were refused"
  resolve:
  - { text: refused, type: overloaded, status: ambiguous,
      question: "the desanction reason (52), the refusal flag (8), or anything withdrawn (83)?" }
  sql: null
  note: >
    Three fields, three different numbers, none authoritative. Whichever the user picks,
    name the field in the answer and mention that 32 desanctioned records still received
    money.

- user: "which scheme is the biggest"
  resolve:
  - { text: biggest, type: measure, status: ambiguous,
      question: "by number of records, or by money?" }
  note: >
    Piggery is the biggest by records (1,353 of 2,823). Agriculture Warehouse is the
    biggest by sanctioned money (Rs 44.34 Cr from 87 records). The two answers name
    different schemes, so the question must be settled before SQL.

- user: "records in Songsak"
  resolve:
  - { text: Songsak, type: block_or_village, status: ambiguous_by_level,
      resolution: default to BLOCK, state the assumption }
  sql: "SELECT COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE lgd_block = 'SONGSAK';"
  note: "One of the 19 names that are both a block and a village. Default to block and say so."

- user: "who received the most money"
  resolve:
  - { text: who, type: applicant_name, status: not_resolvable }
  sql: null
  note: >
    Applicant names are not in the query surface. Offer the application number, scheme
    and district of the largest record instead, and say names are not held.

- user: "what is the sanction rate for CM Elevate Legacy"
  resolve:
  - { text: "sanction rate", type: absent_dimension, status: not_answerable }
  sql: null
  note: >
    Every record here is a sanction. The application denominator is in a different
    scheme with no join key. Refuse, and do NOT offer the 83 desanctioned records as the
    complement.

- user: "records in Nongthymmai"
  resolve:
  - { text: Nongthymmai, type: village, status: ambiguous,
      candidates: [{code: 278407, block: Mawryngkneng, district: East Khasi Hills},
                   {code: 277681, block: Jirang, district: Ri Bhoi},
                   {code: 278993, block: Pynursla, district: East Khasi Hills}],
      question: "which block - Mawryngkneng, Jirang or Pynursla?" }
  sql: null
  note:
    critical: true
    text: >
      THREE candidates, and asking "which district?" would not resolve it - two of the
      three are in East Khasi Hills. The question must name the BLOCK. Six other shared
      names have the same problem; see village.ambiguity_registry.

- user: "how many got 62500"
  resolve:
  - { text: "62500", type: payment_ladder_amount, reading: two Piggery tranches,
      confirm: "the total disbursed, or a single payment?" }
  sql: "SELECT scheme_name, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE total_disbursement = 62500 GROUP BY scheme_name;"
  expected_source_value: 1145
  note: >
    Rs 62,500 is two Piggery tranches of 31,250, half the 1,25,000 entitlement, and it is
    the most common outcome in the whole scheme. But the same figure appears 96 times as
    a LOAN amount elsewhere, so confirm which measure before filtering.

- user: "which block got the most money"
  resolve:
  - { text: "most money", type: measure, canonical: "SUM(total_disbursement)" }
  - { text: block, type: breakdown_level, canonical: lgd_block }
  sql: "SELECT lgd_block, ROUND(SUM(total_disbursement)/1e7, 2) AS disbursed_cr, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement GROUP BY lgd_block ORDER BY disbursed_cr DESC LIMIT 5;"
  expected_top: Mylliem at Rs 6.67 Cr from 58 records
  note: >
    Mylliem wins on money while Umling wins on records (224). The answer should carry
    both columns, because "most" means different blocks on the two measures.

- user: "goat farming loans"
  resolve:
  - { text: "goat farming", type: scheme, canonical: "Meghalaya Goat Farming Scheme" }
  - { text: loans, type: measure, canonical: "SUM(total_loan_disbursement)" }
  sql: "SELECT COUNT(*) FILTER (WHERE total_loan_disbursement > 0) AS with_loan, COUNT(*) AS records FROM curated.v_cm_elevate_disbursement WHERE scheme_name = 'Meghalaya Goat Farming Scheme';"
  expected_source_value: 0 of 48
  note: >
    The honest answer is zero, and it is a real finding rather than a gap - Goat Farming
    is subsidy-only, one payment of Rs 40,000 on every record.

- user: "show me Resubelpara"
  resolve:
  - { text: Resubelpara, type: block, status: ambiguous,
      candidates: ["Resubelpara", "Resubelpara-Municipal Board"],
      question: "the rural block, or the Municipal Board?" }
  note: >
    Two distinct stored values in the same district, 67 records against 14, and the
    Municipal Board disbursed nothing. They are different places - never fold them
    together, and never tidy the stored suffix away.

- user: "average disbursement per applicant"
  resolve:
  - { text: "average disbursement", type: measure, canonical: "AVG(total_disbursement)" }
  - { text: applicant, type: grain, canonical: record }
  sql: "SELECT scheme_name, COUNT(*) AS records, ROUND(AVG(total_disbursement)) AS avg_rupees FROM curated.v_cm_elevate_disbursement GROUP BY scheme_name ORDER BY avg_rupees DESC;"
  note: >
    Broken down by scheme on purpose. A single statewide average mixes a Rs 50,00,000
    motorcaravan with 1,353 Piggery records at a fixed Rs 1,25,000 entitlement, and is
    dominated by the latter.

