resolver_version: '1.0'
resolver_name: cmelevatelegacy_entity_resolver
display_name: CM Elevate Legacy (Disbursement) Entity Resolver (Meghalaya) - curated star schema
generated_from:
- datasets/CMelevate Legacy/Cm Elevate to share to BLH.xlsx      # Sheet1, 2823 x 43
- datasets/CMelevate Legacy/Use_Cases_-_CM_Elevate.xlsx          # CM Elevate Legacy, 36 x 3
- SCHEMA_FOR_DEVELOPERS.md (live information_schema extract, 2026-09-22)
generated_on: '2026-09-23'
companion_schema: cmelevatelegacy_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-09-23 - WRITTEN AGAINST THE LIVE DATABASE
#
# There is no flat-table ancestor for this scheme, so nothing here is a
# migration note. The value catalogues below are read from the source workbook;
# the column names and predicates are read from the live curated view.
#
# THE ONE RULE THAT OUTRANKS EVERY OTHER IN THIS FILE
#   Two schemes in megh_db are called "CM Elevate". This resolver serves the
#   DISBURSEMENT one (curated.v_cm_elevate_disbursement, 13 schemes, money and
#   financial year). The other is the APPLICATION one (curated.v_cm_elevate,
#   15 schemes, no money and no time). They share no identifier, the join is
#   prohibited, and resolving a scheme name against the wrong catalogue is the
#   most damaging mistake available here. See scheme.disambiguation.
#
# All record counts, distinct counts and value distributions below are from the
# source workbook (2,823 rows, profiled 2026-09-23) and have NOT been re-verified
# against megh_db, which holds 2,822 after one quarantine.
# ===========================================================================

description: >
  Value-level entity resolution for the CM Elevate Legacy NLP-to-SQL bot. This file
  answers exactly one question: the user typed some text - which stored database value
  did they mean? It does NOT define column meanings or aggregation; that is the
  companion stage2 semantic schema. Resolve entities with this file FIRST, then hand the
  resolved canonical values to schema linking and SQL generation.

scheme:
  id: cm_elevate_legacy
  display_name: CM Elevate Legacy
  full_name: CM Elevate Disbursement (Meghalaya)
  state: Meghalaya
  source_system: cm_elevate_disbursement
  aliases: ["CM Elevate Legacy", "CM-ELEVATE Legacy", "CM Elevate Disbursement",
            "CM Elevate disbursements", "CM Elevate legacy data", "Elevate legacy",
            "CM Elevate sanctions", "CM Elevate loans", "CM Elevate subsidy"]
  ambiguous_aliases: ["CM Elevate", "CM-ELEVATE", "CMELEVATE", "CM elevate scheme",
                      "Elevate", "Chief Minister Elevate"]
  disambiguation:
    critical: true
    text: >
      The aliases under ambiguous_aliases match BOTH CM Elevate schemes and must never
      be resolved silently. Route to the clarification gate
      (cm_elevate_scheme_ambiguous) unless the question also names a field that exists
      in only one of them.
    this_partition_if_question_mentions:
    - sanctioned, sanction amount, entitlement
    - disbursed, disbursement, subsidy, loan, instalment, tranche
    - lender, bank, LIFCOM
    - refused, desanctioned, duplicate
    - financial year, FY, 2024-25, 2025-26
    - any of the 13 scheme names below
    other_partition_if_question_mentions:
    - application status, current level, file status
    - applicant category, individual / registered / unregistered group
    - on hold, withdrawn, data verified
    - request id
    - a scheme name that is in the 15-scheme catalogue but not the 13-scheme one
      (e.g. Piggery appears in both - that one does NOT disambiguate)

tables:
  disbursements: curated.v_cm_elevate_disbursement     # primary query surface, 38 columns
  fact: curated.fact_cm_elevate_disbursement           # underlying fact, 38 columns
  scheme_dimension: curated.dim_cm_elevate_disb_scheme # 13 rows
  cross_scheme_money: none_for_this_scheme
  cross_scheme_coverage: none_for_this_scheme
  cross_scheme_note: >
    curated.v_cross_scheme_money_district_year and
    curated.v_cross_scheme_village_coverage cover MGNREGA and PMAY only. This scheme
    appears in neither, so there is no sanctioned cross-scheme surface to resolve to.

dataset_shape:
  grain: one row per applicant's sanction-and-disbursement record
  row_count: unverified_in_db
  row_count_note: >
    The source workbook holds 2,823 rows; one was quarantined at load
    (source_row_id 2392, corrupted_identity), so 2,822 is expected. Unmeasured.
  single_table: false
  emits_no_joins: >
    curated.v_cm_elevate_disbursement already pre-joins dim_cm_elevate_disb_scheme,
    dim_geography and dim_year, so the generator emits WHERE and GROUP BY only. See
    cmelevatelegacy_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because block and
    village names collide - see cross_dimension_collisions. Try: scheme ->
    financial_year -> district -> block -> village -> loan_entity ->
    loan_disbursed_status -> desanctioned_reason -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "WHICH CM ELEVATE COMES FIRST. A bare 'CM Elevate' resolves to nothing until the
    gate has settled which of the two schemes is meant."
  - "NEVER PARSE application_number. The leading letters are not a scheme code - 7 of the
    13 schemes use more than one prefix, and one Poultry record carries Piggery's MPDSI
    prefix. Resolve the scheme through scheme_name only."
  - "The two Sericulture schemes differ by ONE SPACE before the bracket. Emit the stored
    form exactly; an exact match on the wrong spelling returns zero rows silently."
  - "lgd_district and lgd_block are documented as stored UPPERCASE in dim_geography.
    lgd_village_name keeps its stored mixed case. Always compare case-folded, and emit
    the form the column actually stores. The casing is UNCONFIRMED for this partition -
    see maintenance.open_verification_tasks."
  - Villages are resolved by village_code, never by name alone. 17 village names in this
    data are shared by two or more different villages.
  - "District and block have NO CODE COLUMN in the curated layer. A user who supplies an
    LGD district code can be resolved to the NAME using the catalogue below, but the code
    itself can never appear in a WHERE clause."
  - "Applicant names are not in the query surface. first_name, middle_name and last_name
    are dropped by the view. A name lookup returns not-held, never a guess, and there is
    no did-you-mean to offer."
  - "There is NO MANDATORY ROW FILTER in this scheme - no is_placeholder equivalent. The
    only conditional exclusion is entity_type <> 'Unresolved' for village-level answers."
  - "The word disbursed is overloaded three ways - subsidy, loan, or both. See
    overloaded_terms. Ask; never pick one silently."
  - "refused_flag_raw is POSITIVE-ONLY. It is TRUE on 8 rows and NULL everywhere else,
    never FALSE, so NOT refused_flag_raw returns nothing. Use IS DISTINCT FROM TRUE."
  - "application_number IS unique and source_row_id IS unique - unlike PMAY's reg_no.
    One record per application number, so a lookup returns at most one row."
  - NULL is missing; a stored 0 in total_disbursement is a real 'nothing was paid'. The
    two are different and must not be merged.
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a scheme, district, block, village or lender.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - "strip trailing qualifier words: BLOCK, DISTRICT, VILLAGE, C&RD, SCHEME"
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    All LGD codes, source_row_id and village_code are integers. Cast user-typed codes
    with int() and strip any trailing .0 before comparing.
  application_ids: >
    application_number is uppercase alphanumeric, exactly 11 characters - five letters
    then six digits, e.g. MPDSI018328. Uppercase and strip spaces before matching. Do
    NOT interpret the letters; see hard_rules.
  scheme_names:
    critical: true
    text: >
      Folding maps "&" to AND and collapses the bracket into a space, so
      "Meghalaya Sericulture & Weaving Scheme (spinning)" and
      "Meghalaya Sericulture & Weaving Scheme(weaving)" fold to distinguishable forms
      ending SPINNING and WEAVING. That is the ONLY reliable way to tell them apart -
      the raw strings differ by a single space that users never type.

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts only - do not invent them for blocks or schemes }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
  note: >
    Dangerous for schemes - every scheme name contains "Scheme" and eleven of them start
    with "Meghalaya". Require the distinguishing token (PIGGERY, POULTRY, DAIRY, GOAT,
    SERICULTURE, TOURISM, WAREHOUSE, MOTORCARAVAN, SPORTS, BUSINESS, FACILITY,
    AGRICULTURE RESPONSE) before accepting a scheme at this stage.
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - ["Meghalaya Sericulture & Weaving Scheme (spinning)", "Meghalaya Sericulture & Weaving Scheme(weaving)"]
  - ["Meghalaya Sericulture & Weaving Scheme(weaving)", "Meghalaya Sericulture & Weaving Scheme (spinning)"]
  - ["Meghalaya Piggery Development Scheme", "Meghalaya Poultry Farming Scheme"]
  - ["Meghalaya Poultry Farming Scheme", "Meghalaya Piggery Development Scheme"]
  - ["Prime Agriculture Response Vehicle Scheme", "Meghalaya Agriculture Warehouse Scheme"]
  - ["Prime Agriculture Response Vehicle Scheme", "Prime Tourism Vehicle Scheme"]
  - ["Prime Tourism Vehicle Scheme", "Prime Agriculture Response Vehicle Scheme"]
  - [Laskein, Thadlaskein]          # two different West Jaintia Hills blocks
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]          # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]         # East Khasi Hills vs West Khasi Hills
  - [Mawshynrut, Mawsynram]
  - [Siju, Saipung]
  - [Mairang, Mawhati]
  - [Resubelpara, "Resubelpara-Municipal Board"]     # rural block vs municipal board
  - [Refused, Duplicate]            # the two desanction reasons are not synonyms
  piggery_poultry_note:
    critical: true
    text: >
      Piggery and Poultry are the two largest schemes (1,353 and 454 records), they both
      fold to MEGHALAYA P... and their prefixes cross over on one record. A fuzzy hit
      between them would misassign 48% of the file. Exact or alias only.

output_contract:
  resolved:
    status: resolved
    entity_type: scheme | district | block | village | financial_year | loan_entity |
                 loan_disbursed_status | desanctioned_reason | identifier | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    lgd_code: <code, geography only>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, lgd_code, district, block } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the CM Elevate Legacy data.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to more than one scheme, in this
    dataset. Getting these wrong produces a confidently wrong answer, so they are listed
    explicitly.

  cm_elevate:
    critical: true
    readings:
    - { means: curated.v_cm_elevate_disbursement, when: "the question needs money, a lender, a refusal or a financial year" }
    - { means: curated.v_cm_elevate, when: "the question needs application status, applicant category, on-hold or withdrawal" }
    default: >
      NONE. Ask. The two are different schemes with different row counts, different
      sub-scheme lists and no shared key. A wrong route answers a money question from a
      fact table that has no money column at all.

  disbursed:
    critical: true
    readings:
    - { means: SUM(total_subsidy_disbursement), when: "the user says subsidy, grant, assistance" }
    - { means: SUM(total_loan_disbursement),    when: "the user says loan, credit, borrowing" }
    - { means: SUM(total_disbursement),         when: "the user says total, altogether, overall, or confirms both" }
    default: >
      ASK. The three differ by up to 64% - Rs 52.57 Cr subsidy, Rs 30.33 Cr loan,
      Rs 82.90 Cr together. A subsidy is a grant and a loan is credit the applicant
      carries; presenting one as the other is a category error, not a rounding choice.

  sanctioned:
    readings:
    - { means: SUM(sanctioned_amount), when: "the user asks for a sanctioned AMOUNT, money or rupees" }
    - { means: COUNT(*),               when: "the user asks how many were sanctioned - every record here IS a sanction" }
    - { means: "a financial-year filter", when: "the user says 'sanctioned in FY <year>'" }
    default: >
      "How much was sanctioned" is SUM(sanctioned_amount). "How many were sanctioned" is
      COUNT(*) with the sentence "every record in this dataset is a sanction record" -
      it is NOT a filtered subset, and there is no unsanctioned population to compare it
      against. See absent_dimensions.sanction_status.
    never: >
      Never read "sanctioned" as disbursed. Rs 142.74 Cr was sanctioned and Rs 82.90 Cr
      paid; the gap is the most interesting finding in this data and collapsing it hides
      the answer.

  refused:
    critical: true
    readings:
    - { means: "desanctioned_reason_raw = 'Refused'", when: "the user means the recorded desanction reason - 52 records" }
    - { means: "refused_flag_raw IS TRUE",            when: "the user means the refusal flag - 8 records" }
    - { means: "desanctioned_reason_raw IS NOT NULL", when: "the user means anything withdrawn, refused or duplicated - 83 records" }
    default: >
      ASK which. The three fields disagree and none is authoritative - the database's own
      comment says to surface the disagreement rather than picking one. Whichever is
      used, name it in the answer.
    never: >
      Never read "refused" as "application rejected". These are post-sanction outcomes.
      See absent_dimensions.sanction_status.

  duplicate:
    readings:
    - { means: "desanctioned_reason_raw = 'Duplicate'", when: always }
    note: >
      31 records are marked Duplicate, but only 6 have another record with the same name
      under the same scheme. The marking is weakly evidenced - report it as recorded and
      say so. It is NOT a de-duplication instruction: application_number is unique on
      every row, so there are no duplicate rows to remove.

  applications:
    readings:
    - { means: COUNT(*), when: "the user is inside this partition and means records" }
    default: >
      COUNT(*), and say the answer counts sanction-and-disbursement records. The word is
      a trap: the use-case workbook calls every row an "application", but the CM Elevate
      APPLICATION scheme is a different dataset entirely. If the question is really about
      applications as a population - how many were made, how many succeeded - it belongs
      to the other partition or cannot be answered at all.

  beneficiaries:
    readings:
    - { means: COUNT(*), when: default - the grain is one record }
    default: COUNT(*), and say the answer is a record count.
    note:
      critical: true
      text: >
        "Beneficiary" cannot mean a named person here - the name columns are dropped
        from the view. COUNT(DISTINCT application_number) is identical to COUNT(*)
        because the column is unique, so there is no distinct-person count to offer.
        The same person can hold records under two schemes and nothing links them.

  amount:
    readings:
    - { means: SUM(sanctioned_amount),          when: the user says sanctioned/approved/entitlement }
    - { means: SUM(total_disbursement),         when: the user says disbursed/paid/released - AFTER the three-way clarification }
    - { means: SUM(total_subsidy_disbursement), when: the user says subsidy/grant }
    - { means: SUM(total_loan_disbursement),    when: the user says loan/credit }
    default: ask which. Do not silently pick one.

  pending:
    readings:
    - { means: "SUM(sanctioned_amount) - SUM(total_disbursement)", when: the user means money not yet paid }
    note:
      critical: true
      text: >
        UNLIKE PMAY, there is NO amount_pending column in this scheme. It can only be
        derived, and the derivation must be labelled as one in the answer. Four records
        disburse more than they sanctioned, so the figure can go negative for a small
        group - do not clamp it to zero silently.

  bank:
    readings:
    - { means: "loan_entity = 'Bank'", when: "the user means the lender category, as opposed to LIFCOM" }
    - { means: bank_sanctioned_amount, when: "the user means the second sanctioned figure - UNCONFIRMED, see below" }
    default: >
      loan_entity. 'Bank' is a literal stored value naming an unspecified bank, not the
      name of a bank - there is no bank-name column here.
    bank_sanctioned_warning:
      critical: true
      text: >
        bank_sanctioned_amount has NO CONFIRMED MEANING. Zero on 50.8% of rows; where
        non-zero the ratio to sanctioned_amount clusters at 0.20 / 0.50 / 0.496 / 0.60
        and varies within a single scheme. Never present it as a bank's share, never
        build a percentage on it, and route any question that needs it to the gate.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 19
    village_names_sharing_a_code: 17
    district_collisions: 0
    scheme_name_collisions_with_geography: 0
  colliding_block_village_names: [Adokgre, Amlarem, Batabari, Demdema, Gambegre, Laskein,
    Mawkynrew, Mawkyrwat, Mawpat, Mawryngkneng, Mawshynrut, Nongstoin, Ranikor, Saipung,
    Selsella, Songsak, Tikrikilla, Umling, Zikzak]
  village_names_with_more_than_one_code: [Amonggre, Ampanggre, Apalgre, Aragittim,
    Babupara, Bolchugre, Boldamgre, Bolsalgre, Damalgre, Dombagre, Galwanggre, Mawrang,
    Mawroh, Nongsder, Nongthymmai, Rongchigre, Umtham]
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "village" or "gaon", resolve as village.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.
  - A village name in the shared list resolves to ambiguous unless a district or block
    narrows it to one code.

