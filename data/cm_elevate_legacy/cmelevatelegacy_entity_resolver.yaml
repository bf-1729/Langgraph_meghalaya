    prefer:
      critical: true
      text: >
        ALWAYS resolve to village_code and filter on it. 17 names are shared by two or
        more villages, so a name filter silently merges different places. Count villages
        with COUNT(DISTINCT village_code).
    unresolved_rule:
      critical: true
      text: >
