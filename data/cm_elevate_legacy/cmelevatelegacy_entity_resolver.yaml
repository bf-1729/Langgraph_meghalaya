dimensions:

  scheme:
    name_column: scheme_name
    source: curated.dim_cm_elevate_disb_scheme.scheme_name
    stored_case: mixed - emit the stored form verbatim
    distinct: 13
    sql_predicate: "scheme_name = '<canonical>'"
    prefer: Filter on the name. Never on application_number.
    skew_warning:
      critical: true
      text: >
        Piggery alone is 1,353 of 2,823 records (48%) and pays a fixed Rs 1,25,000. Any
        statewide average is really a Piggery average. Break down by scheme, or say so.
    alias_provenance: >
      canonical, records, sanctioned_total and financial_year are read from the source
      workbook. aliases are curated linguistic forms.
    values:
    - canonical: "Meghalaya Piggery Development Scheme"
