  identifiers:
    pg_id:
      column: pg_id
      type: varchar(50)
      unique_in_dimension: true
      role: the natural key of curated.dim_producer_group and the only group identity
      resolve_as: producer_group
    focus_legacy_fact_id:
      column: focus_legacy_fact_id
      type: bigint
      unique: true
      role: primary key of the fact and the view
      note: Surrogate and unstable across a reload. Never export it or quote it to a user.
    source_row_id:
      column: source_row_id
      type: integer
      unique: true
      role: the source workbook's own `id`; the strongest row identity in the partition
      note: >
        Three ids from the workbook are absent from the database - 1148 or 2552 (one of
        the disputed duplicate pair), 3101 and 14565. If a user quotes one of those, say
        it was held back at load.
