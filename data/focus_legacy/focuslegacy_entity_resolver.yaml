dimensions:

  district:
    name_column: lgd_district
    code_column: none_in_curated_layer
    stored_case: UPPERCASE in curated.dim_geography
    case_note: >
      The source workbook is Title Case ("West Garo Hills"); dim_geography stores
      district UPPERCASE. The canonical names below are kept in Title Case for display
      and matching - emit the uppercase form in the predicate.
    distinct: 12
    complete: true            # all 12 Meghalaya districts appear in Focus Legacy
    collisions: none
    sql_predicate: "lgd_district = UPPER('<canonical>')"
    sql_predicate_by_code: null
    code_note: >
      The source's mapped_district_lgd_code has NO equivalent in the curated layer -
      dim_geography carries village_code only. The lgd_code values below remain useful
      for RESOLVING a code the user typed to a district name, but the code can never
      appear in a WHERE clause.
    alias_provenance: >
      canonical, lgd_code, payments, groups, blocks and villages are read from the source
      workbook. acronym, region and the spelling variants are curated linguistic forms,
      shared with the PMAY and Focus Plus resolvers so that one alias family serves every
      scheme.
