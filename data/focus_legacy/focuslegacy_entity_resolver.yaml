        offered as a search path. Emit the `refused` output shape.

# ---------------------------------------------------------------------------
measure_vocabulary:

  amount_disbursed:
    column: amount_disbursed
    aliases: [amount, amount disbursed, disbursement, disbursed, money, funds, payment,
              remittance, remitted, released, total amount, spend, expenditure]
    aggregate: SUM(amount_disbursed)
    distinct_values: 21
    nulls: 0
    unit: UNVERIFIED - read curated.dim_scheme.money_unit
    source_total: 510105000
    critical:
      text: >
        FULLY DERIVED: amount_disbursed = no_of_pg_members x 5000 on every one of the
        14,569 source rows, confirmed by the DB table comment and re-confirmed on
        2026-09-21. The consequences the generator must respect:
          - SUM(amount) is exactly 5000 * SUM(members). The two carry the same information.
          - AVG(amount) is 5000 * average group size. It is NOT an entitlement and it does
            NOT move when policy moves.
          - "Per member" is the constant 5,000. State the rate; do not compute a ratio.
          - Ranking by amount and ranking by members produce the SAME order. Never present
            them as two findings.
          - A correlation or regression between the two is degenerate.
    all_values: [5000, 10000, 15000, 20000, 25000, 30000, 35000, 40000, 45000, 50000,
                 55000, 60000, 65000, 70000, 75000, 80000, 85000, 90000, 95000, 100000, 950000]
    outlier: { value: 950000, payments: 1, pg_id: PG-FOCUS-WKH-3565, members: 190 }

  no_of_pg_members:
    column: no_of_pg_members
    aliases: [members, number of members, membership, group size, PG members, member count,
              how many members, people covered]
    aggregate: SUM(no_of_pg_members)
    distinct_values: 21
    nulls: 0
    source_total: 102021
    distribution: { min: 1, median: 6, mean: 7.0, max: 190 }
    critical: >
      SUMMING COUNTS MEMBERSHIPS, NOT PEOPLE. A group paid in two years contributes its
      membership twice, and its recorded size can differ between the two payments. There
      is no person identifier, so a distinct-people figure is impossible. Say "memberships"
      or "members covered", never "people".
    outlier_rule: >
      One payment carries 190 members against a next-largest of 20. Exclude it explicitly
      or mention it whenever it would dominate an average or a maximum.

  record_count:
    aliases: [payments, disbursements, records, transactions, how many payments, count,
              number of payments]
    aggregate: COUNT(*)
    default: true
    mandatory_filter: none
    note: >
      One row = one payment to one group. There is NO always-on predicate on this
      partition - PMAY's WHERE NOT is_placeholder has no counterpart here. COUNT(*)
      exceeds the group count by about 2,663 because groups can be paid more than once.

  group_count:
    aliases: [producer groups, groups, PGs, how many groups, number of groups, organisations]
    aggregate: COUNT(DISTINCT pg_id)
    source_value: 11906
    loaded_value: 11904
    note: Never COUNT(DISTINCT pg_name) - names split and merge groups. See dimensions.producer_group.

  village_count:
    aliases: [villages, how many villages, number of villages, village coverage]
    aggregate: COUNT(DISTINCT village_code)
    mandatory_filter: "entity_type <> 'Unresolved'"
    source_value: 3384
    note: >
      Village counts exclude the 1,101 placeholder payments, so a village-level total will
      not reconcile to the scheme total. State the shortfall.

  derived:
    average_group_size: AVG(no_of_pg_members)
    payments_per_group: "COUNT(*) / COUNT(DISTINCT pg_id)"
    forbidden:
    - "amount per member - it is the constant 5,000, not a calculation"
    - "correlation between amount and members - the same column twice"
    - "any rate, ratio or projection against an eligible-group denominator - none is held"

# ---------------------------------------------------------------------------
region_groupings:
  note: >
    Users group districts by hill range. These are not columns - expand into an IN list
    and state which districts were included. Emit UPPERCASE district literals.
  groups:
    "Garo Hills":
      districts: [West Garo Hills, North Garo Hills, East Garo Hills,
                  South West Garo Hills, South Garo Hills]
      payments: 7685
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [West Khasi Hills, Eastern West Khasi Hills, East Khasi Hills,
                  South West Khasi Hills]
      payments: 3553
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [West Jaintia Hills, East Jaintia Hills]
      payments: 2098
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      payments: 1233
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group. Both
        readings produce the same filter, so no clarification is needed. Do not fold it
        into Khasi Hills.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many Focus Legacy payments in WGH"
  resolve:
  - { text: WGH, type: district, canonical: West Garo Hills, lgd_code: 278, matched_by: 4_acronym }
  - { text: "how many payments", type: measure, canonical: "COUNT(*)" }
  sql: "SELECT COUNT(*) FROM curated.v_focus_legacy WHERE lgd_district = 'WEST GARO HILLS';"
  expected: 3493
  note: The district literal is UPPERCASE. A Title Case literal returns zero rows silently.

- user: "how many producer groups got paid in West Garo Hills"
  resolve:
  - { text: West Garo Hills, type: district, canonical: West Garo Hills }
  - { text: producer groups, type: measure, canonical: "COUNT(DISTINCT pg_id)" }
  sql: "SELECT COUNT(DISTINCT pg_id) FROM curated.v_focus_legacy WHERE lgd_district = 'WEST GARO HILLS';"
  expected: 2701
  note: >
    3,493 payments but only 2,701 groups - the two are not interchangeable. Say which one
    the answer is.

- user: "which district is PG-FOCUS-WKH-5956 in"
  resolve:
  - { text: PG-FOCUS-WKH-5956, type: producer_group, canonical: PG-FOCUS-WKH-5956, matched_by: 1_exact }
  response_guidance: >
    Answer from lgd_district, NOT from the WKH token in the id. Explain that the letters
    record where the group enrolled and that 990 WKH-coded groups now sit in Eastern West
    Khasi Hills after the district split.
  forbidden_sql: "... WHERE lgd_district = 'WEST KHASI HILLS'   -- inferred from the id"

- user: "find the group called Muskan"
  resolve:
  - { text: Muskan, type: producer_group, status: ambiguous, matched_by: 5_contains }
  response:
    status: ambiguous
    note: >
      The same group appears as "Muskan Producer Group" and "Muskan Pg" on two payments.
      Return the distinct pg_id values with their district and village, ask which is meant,
      then query on pg_id.
  sql: "SELECT DISTINCT pg_id, pg_name, lgd_district, lgd_village_name FROM curated.v_focus_legacy WHERE pg_name ILIKE '%muskan%';"

- user: "total disbursed in 2022"
  resolve:
  - { text: "2022", type: calendar_year, canonical: 2022, assumption: calendar }
  sql: "SELECT SUM(amount_disbursed) FROM curated.v_focus_legacy WHERE date_of_remittance >= '2022-01-01' AND date_of_remittance < '2023-01-01';"
  expected_payments: 2804
  note: >
    Calendar 2022 spans two financial years - 665 payments in FY2021-22 and 2,139 in
    FY2022-23. State that calendar year was assumed and offer FY2022-23 (2,139) as the
    alternative.

- user: "total disbursed in FY 2022-23"
  resolve:
  - { text: "FY 2022-23", type: financial_year, canonical: '2022-23' }
  sql: "SELECT SUM(amount_disbursed) FROM curated.v_focus_legacy WHERE financial_year_short = '2022-23';"
  expected: 141790000
  note: >
    A different population from the calendar reading above - 2,139 payments against 2,804.
    This is why year_disambiguation matters.

- user: "how much was disbursed in 2023"
  resolve:
  - { text: "2023", type: calendar_year, canonical: 2023, status: empty_both_readings }
  response_guidance: >
    BOTH readings are empty - calendar 2023 has no payments and FY2023-24 has none either.
    Say the scheme has a one-year gap between FY2022-23 and FY2024-25, rather than
    returning zero with no explanation.

- user: "top 5 products"
  resolve:
  - { text: products, type: product, canonical_group: all, folding: required }
  sql: "SELECT UPPER(TRIM(product_raw)) AS product, COUNT(*) AS payments FROM curated.v_focus_legacy WHERE product_raw IS NOT NULL GROUP BY 1 ORDER BY payments DESC LIMIT 5;"
  expected: [PIGGERY 877, GINGER 429, VEGETABLES 340, "BROOM GRASS 230", TURMERIC 167]
  note: >
    Case folding is mandatory. Without it PIGGERY (632), Piggery and piggery appear as
    three rows and the leader is understated by 245 payments. The answer must also state
    that product covers FY2021-22 and FY2022-23 only - 21% of payments.

- user: "how many villages did Focus Legacy reach in Ri Bhoi"
  resolve:
  - { text: Ri Bhoi, type: district, canonical: Ri Bhoi }
  - { text: how many villages, type: measure, canonical: "COUNT(DISTINCT village_code)" }
  sql: "SELECT COUNT(DISTINCT village_code) FROM curated.v_focus_legacy WHERE lgd_district = 'RI BHOI' AND entity_type <> 'Unresolved';"
  expected: 281
  note: The Unresolved exclusion is mandatory for a village count and only for a village count.

- user: "Focus Legacy payments in Asimgre"
  resolve:
  - { text: Asimgre, type: village, status: ambiguous }
  response:
    status: ambiguous
    candidates: 5 distinct village codes named ASIMGRE
    districts: [East Garo Hills, South West Garo Hills, West Garo Hills]
    question: "Asimgre exists in three districts, with five different village codes. Which one did you mean?"
  note: never pick the first row.

- user: "payments in Songsak"
  resolve:
  - { text: Songsak, type: block, canonical: Songsak, lgd_code: 1973, assumption: default_level }
  note: >
    Songsak is both a block in East Garo Hills and a village name. With no level word the
    default is block - say so in the answer.

- user: "which bank handles most Focus Legacy payments"
  resolve:
  - { text: bank, type: bank, canonical_group: all }
  sql: "SELECT bank_name, COUNT(*) AS payments FROM curated.v_focus_legacy GROUP BY bank_name ORDER BY payments DESC;"
  expected: ["Meghalaya Rural Bank 8174", "Meghalaya Co-operative Apex Bank 5270"]
  note: >
    Legitimate for this scheme, unlike Focus Plus. Report the 276 payments with no bank
    name as "not recorded", and do not use ifsc_code to fill them in - the IFSC-to-bank
    mapping is dirty.

- user: "average payment per group"
  resolve:
  - { text: average payment, type: measure, canonical: "AVG(amount_disbursed)" }
  response_guidance: >
    Answer, but state that amount is fixed at Rs 5,000 per member, so the average amount
    is the average group size multiplied by 5,000 - about 7 members, so about Rs 35,000.
    It measures membership, not entitlement.

- user: "who is the account holder for PG-FOCUS-WGH-7089"
  resolve:
  - { text: PG-FOCUS-WGH-7089, type: producer_group, canonical: PG-FOCUS-WGH-7089 }
  - { text: account holder, type: account_holder_name, status: refused }
  response:
    status: refused
    message: >
      The account-holder name is personal data held for audit only and is outside the
      approved query surface. Offer the masked account number and the payment history for
      that group instead.

- user: "show me Focus beneficiaries"
  resolve:
  - { text: Focus, type: scheme, status: ambiguous }
  - { text: beneficiaries, type: overloaded, status: ambiguous }
  response:
    status: ambiguous
    question: >
      Two questions at once - which scheme (Focus Legacy pays producer groups, Focus Plus
      pays individuals), and which count (payments, groups, or memberships)? Resolve the
      scheme first.

