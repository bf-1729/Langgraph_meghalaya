  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: >
      Mixed case in dim_geography.lgd_village_name. UNLIKE district and block, the village
      name is NOT uppercased in the curated layer - do not apply one casing rule to all
      three levels.
    distinct_codes: 3384
    distinct_names: 3270
    sql_predicate_preferred: "village_code = <code>"
    sql_predicate_fallback: "lgd_village_name = '<canonical>'"
    counting_villages: >
      COUNT(DISTINCT village_code), never COUNT(DISTINCT name) - 114 codes would be lost
      to shared names - and always with entity_type <> 'Unresolved'.
    unresolved_rule:
      critical: true
      text: >
        1,101 payments (7.6%) carry no real village: 1,013 had a block but no village and
        88 had neither. They resolve to a synthetic Unresolved placeholder under their
        district. A village LIST or village COUNT must exclude them; a money or district
        total must not.
    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their
         district and block. Ask which one.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.

    ambiguity_registry:
      measured: { shared_names: 94, codes_involved: 208 }
      split: { resolvable_by_district: 66, needs_block_or_code: 28 }
      note: >
        66 of the 94 shared names span more than one district, so naming the district
        settles them. The remaining 28 repeat INSIDE one district and need a block or a
        code. Never pick the first row.
      worst_cases:
      - { name: ASIMGRE,       codes: 5, districts: [East Garo Hills, South West Garo Hills, West Garo Hills] }
      - { name: CHIGITCHAKGRE, codes: 5, districts: [South West Garo Hills, West Garo Hills] }
      - { name: BOLCHUGRE,     codes: 4, districts: [South West Garo Hills, West Garo Hills] }
      - { name: APALGRE,       codes: 3, districts: [South West Garo Hills, West Garo Hills] }
      - { name: UMSAW,         codes: 3, districts: [South West Khasi Hills, West Khasi Hills] }
      - { name: TIEHBAH,       codes: 3, districts: [East Khasi Hills, Eastern West Khasi Hills, West Khasi Hills] }
      - { name: NOKATGRE,      codes: 3, districts: [South West Garo Hills, West Garo Hills] }
      - { name: NONGLANG,      codes: 3, districts: [Eastern West Khasi Hills, South West Khasi Hills, West Khasi Hills] }
      - { name: RANGSAGRE,     codes: 3, districts: [South West Garo Hills, West Garo Hills] }
      - { name: MAWLIEH,       codes: 3, districts: [East Khasi Hills, Eastern West Khasi Hills, West Khasi Hills] }
      - { name: MAWSAW,        codes: 3, districts: [South West Khasi Hills, West Khasi Hills] }
      - { name: MAWBRI,        codes: 3, districts: [Ri Bhoi, South West Khasi Hills, West Khasi Hills] }
      - { name: JARAIN,        codes: 3, districts: [East Jaintia Hills, East Khasi Hills, West Jaintia Hills] }
      - { name: MEGONGGRE,     codes: 3, districts: [West Garo Hills], needs: block }
      - { name: TEKSRAGRE,     codes: 3, districts: [West Garo Hills], needs: block }
      single_district_repeats:
        note: >
          These names repeat INSIDE one district, so naming the district does not settle
          them - ask for the block, or take a village code.
        examples: [MEGONGGRE, TEKSRAGRE, CHANDIGRE, BELBARI, BALUPARA, BOLBOKGRE,
          BOLDAMGRE, GALWANGGRE, DOPANANGGRE, DOLLONGGRE, DALMAGRE, DABAKGRE, CHIBOKGRE,
          KOTCHUGRE, HARIBHANGA, MANDAGRE, MARAKAPARA, JANGRAPARA, NAWALGRE, LYNGNGAI,
          LUMPYNGNGAD, MAWROH, POMLUM, NONGMADAN, RONGCHIGRE, SELBALGRE, TEBRONGGRE,
          TIEHSAW]

  producer_group:
    id_column: pg_id
    name_column: pg_name
    source_dimension: curated.dim_producer_group
    distinct_ids_in_source: 11906
    distinct_ids_loaded: 11904
    distinct_names: 10678
    sql_predicate: "pg_id = '<canonical>'"
    sql_predicate_name_search: "pg_name ILIKE '%<folded>%'"

    identity_rule:
      critical: true
      text: >
        pg_id is the ONLY group identity. pg_name is display text: 11,906 groups carry
        10,678 distinct names, and 1,634 groups appear under more than one spelling - the
        same group is "Muskan Producer Group" in one payment run and "Muskan Pg" in the
        next. Names therefore both SPLIT one group across rows and MERGE several groups
        into one label. Never GROUP BY pg_name and never COUNT(DISTINCT pg_name).

    structure:
      pattern: "PG-<TYPE>-<DISTRICT_ABBR>-<NUMBER>"
      examples: [PG-FOCUS-EGH-754, PG-LAMP-WGH-5956, PG-EXISTING-COOPERATIVE-NGH-12]
      type_tokens: { PG-FOCUS: 12722, PG-LAMP: 1794, PG-EXISTING-COOPERATIVE: 53 }
      number_rule:
        critical: true
        text: >
          The trailing number is unique only WITHIN a prefix. PG-FOCUS-WKH-5956 and
          PG-LAMP-WGH-5956 are two different groups. Never match on the number alone and
          never present it to a user as a quotable "PG number".

    district_token_trap:
      critical: true
      measured: { payments_where_token_disagrees_with_mapped_district: 1075 }
      detail:
      - "990 payments whose pg_id says WKH map to Eastern West Khasi Hills (LGD 740)."
      - "85 payments whose pg_id says WGH map to South West Garo Hills."
      text: >
        The token records the district AT ENROLMENT; the mapped LGD district records where
        the village is now. Both are correct about different moments, and the mapped one
        is what the database groups by. NEVER derive district, block or region from a
        pg_id, and never "correct" a mapped district because the id disagrees with it.

    malformed_ids:
      count_in_source: 2
      values: ["PG-FOCUS- RB- 7751", "PG- FOCUS-EKH-12359"]
      text: >
        Both are corrupted by stray spaces and were quarantined as BAD_PG_ID_PREFIX, so
        two groups are absent from the database. If a user supplies one of these, say the
        record was not loaded rather than returning not_found with no explanation.

    lookup_strategy:
    - 1. If the text matches the pg_id pattern, uppercase it, strip ALL spaces, and match exactly.
    - 2. Otherwise treat it as a NAME. Fold, strip trailing PG / PRODUCER GROUP, and ILIKE.
    - 3. If exactly one pg_id survives, resolve to that id and say which name matched.
    - 4. If more than one survives, return ambiguous listing pg_id, name, district and village.
    - 5. If none survive, offer fuzzy suggestions from pg_name - never invent an id.

    payment_frequency:
      note: A group may hold more than one payment, so a group filter can return several rows.
      distribution: { paid_once: 9251, paid_twice: 2647, paid_three_times: 8 }
      membership_caveat: >
        A group's recorded member count can DIFFER between its own payments -
        PG-FOCUS-RB-3210 was paid for 1 member in September 2025 and 12 in January 2026.
        Member counts are per payment, not a tracked attribute of the group.

  pg_entity_type:
    name_column: pg_entity_type
    display_column: pg_entity_type_name
    source_dimension: curated.dim_pg_entity_type
    distinct: 3
    closed_set: true
    sql_predicate: "pg_entity_type = '<canonical>'"
    stored_values: UNVERIFIED_ENUMERATE_FIRST
    critical: >
      THE STORED type_code STRINGS ARE NOT KNOWN TO THIS FILE. The 2026-09-21 extract
      does not carry them. RUN
      SELECT pg_entity_type_key, type_code, type_name, source_id_prefix
      FROM curated.dim_pg_entity_type
      before emitting any filter, legend or chart series. Do not guess 'FOCUS', 'LAMP' or
      'EXISTING'.
    observed_prefixes:
    - { source_id_prefix: "PG-FOCUS",                payments: 12722, groups: 10075, members: 94766, user_words: [focus, focus group, regular PG] }
    - { source_id_prefix: "PG-LAMP",                 payments: 1794,  groups: 1794,  members: 6705,  user_words: [LAMP, lamps, LAMP society] }
    - { source_id_prefix: "PG-EXISTING-COOPERATIVE", payments: 53,    groups: 37,    members: 550,   user_words: [existing, cooperative, co-operative, existing cooperative] }
    lamp_caveat:
      critical: true
      text: >
        dim_pg_entity_type.notes records the LAMP reading as an UNCONFIRMED hypothesis -
        it may correspond to what the Focus+ use-case docs call "LAMP" as distinct from
        "PG" (UC-041), and no client or SME has confirmed it. Report the counts; do not
        harden the interpretation into a definition.
    fixed_rule: >
      The type is derived from the pg_id prefix at ingest and never changes for a group.
      It is a structural classification, not a status. There is no 'Other' member - a
      prefix matching none of the three is quarantined, not bucketed.

  programme_variant:
    column: programme_variant
    distinct: 2
    closed_set: true
    sql_predicate: "programme_variant = '<canonical>'"
    stored_form: UNVERIFIED_ENUMERATE_FIRST
    stored_form_note: >
      The source holds 'FOCUS' and 'Focus (Addnl)'. Whether the loader stored them
      verbatim into varchar(20) is unverified - the second is 13 characters so it very
      likely survived, but run SELECT DISTINCT programme_variant before filtering.
    values:
    - canonical: "FOCUS"
      payments: 13863
      financial_years: ['2021-22', '2022-23', '2024-25', '2025-26']
      aliases: [focus, main focus, regular focus, ordinary focus, base focus]
    - canonical: "Focus (Addnl)"
      payments: 706
      financial_years: ['2025-26']
      remittance_dates: ['2025-06-26']
      amount: 18405000
      aliases: [additional, addnl, add-on, top-up, topup, extra focus, additional focus,
                "focus additional", "focus addnl"]
      critical: >
        NOT A SECOND ERA - A SINGLE ROUND. All 706 payments were remitted on one day,
        2025-06-26, inside FY2025-26. A programme breakdown that is not also a year
        breakdown reads as a trend when it is a one-off top-up.
    note: >
      Do not confuse programme_variant with pg_entity_type. One describes the PAYMENT,
      the other the GROUP, and both have a member that sounds like "focus".

