    - { canonical: WILD PEPPER,  payments: 1,   raw_spellings: [Wild pepper], note: "distinct from PEPPER and BLACK PEPPER" }

    long_tail_note: >
      Nine products have a single payment each. A "top products" answer is really about
      the first six, which cover 2,151 of the 3,112 product-bearing payments. Do not
      present a one-payment product as a programme finding.

  bank:
    column: bank_name
    stored_case: Title Case - NOT uppercased, unlike district and block
    distinct: 13
    nulls: 276
    sql_predicate: "bank_name = '<canonical>'"
    usable: true
    usable_note: >
      UNLIKE FOCUS PLUS, bank-wise analysis is legitimate here. Focus Plus withholds
      bank_name_raw from its view because the values are inconsistent between cohorts;
      this view exposes bank_name and the values are clean. bank_name is institution-level
      data, not personal data.
    concentration: >
      Two banks carry 13,444 of 14,569 payments - 92%. Any "bank concentration" finding is
      that one sentence.
    values:
    - { canonical: "Meghalaya Rural Bank",             payments: 8174, groups: 6650, ifscs: 23, aliases: [MRB, meghalaya rural, rural bank, MGB] }
    - { canonical: "Meghalaya Co-operative Apex Bank", payments: 5270, groups: 4517, ifscs: 62, aliases: [MCAB, apex bank, co-operative apex, cooperative apex, meghalaya cooperative, meghalaya co operative apex bank] }
    - { canonical: "State Bank Of India",              payments: 464,  groups: 400,  ifscs: 32, aliases: [SBI, state bank, state bank of india] }
    - { canonical: "Hdfc Bank",                        payments: 227,  groups: 199,  ifscs: 5,  aliases: [HDFC, hdfc bank ltd] }
    - { canonical: "North East Small Finance Bank",    payments: 79,   groups: 53,   ifscs: 2,  aliases: [NESFB, north east small finance, NE small finance] }
    - { canonical: "Union Bank Of India",              payments: 21,   groups: 18,   ifscs: 2,  aliases: [UBI, union bank] }
    - { canonical: "Uco Bank",                         payments: 19,   groups: 16,   ifscs: 3,  aliases: [UCO, uco] }
    - { canonical: "Indian Bank",                      payments: 13,   groups: 10,   ifscs: 1,  aliases: [indian bank] }
    - { canonical: "Central Bank Of India",            payments: 12,   groups: 10,   ifscs: 3,  aliases: [CBI, central bank] }
    - { canonical: "Canara Bank",                      payments: 10,   groups: 10,   ifscs: 5,  aliases: [canara] }
    - { canonical: "Punjab National Bank",             payments: 2,    groups: 2,    ifscs: 2,  aliases: [PNB, punjab national] }
    - { canonical: "Bank Of Baroda",                   payments: 1,    groups: 1,    ifscs: 1,  aliases: [BOB, baroda] }
    - { canonical: "United Bank Of India",             payments: 1,    groups: 1,    ifscs: 1,  aliases: [UBI united, united bank] }
    null_rule: >
      276 payments have no bank name but DO have an IFSC code. Render them as "not
      recorded", never merge them into another bank, and use ifsc_code to identify the
      institution where it matters.
    ubi_collision: >
      "UBI" is claimed by both Union Bank Of India (21 payments) and United Bank Of India
      (1 payment). Treat a bare "UBI" as ambiguous and ask; do not silently pick the
      larger.

  ifsc:
    column: ifsc_code
    distinct: 113
    nulls: 0
    sql_predicate: "ifsc_code = '<canonical>'"
    completeness: The most complete banking column in the partition - present on every payment.
    sponsor_code_trap:
      critical: true
      value: SBIN0RRMEGB
      payments: 8328
      text: >
        This single code covers 8,328 of 14,569 payments because it is Meghalaya Rural
        Bank's sponsor-bank-issued code, NOT a branch. Never present a count of IFSC
        codes as a count of branches, and never describe SBIN0RRMEGB as "the busiest
        branch".
    not_one_to_one_with_bank:
      critical: true
      measured: { ifsc_codes_carrying_more_than_one_bank_name: 19 }
      worst_case: >
        SBIN0RRMEGB appears against SEVEN different bank_name values - Meghalaya Rural
        Bank (7,976), NULL (190), Meghalaya Co-operative Apex Bank (118), State Bank Of
        India (34), Uco Bank (5), Central Bank Of India (2), Hdfc Bank (2) and United Bank
        Of India (1).
      text: >
        The IFSC-to-bank relationship is dirty in the source. Do NOT use ifsc_code to
        "correct" bank_name, or vice versa, and do not report a bank-by-IFSC cross-tab as
        a finding about banking structure - it is a finding about data entry.
    character_confusion:
      text: >
        The Apex Bank's sponsor codes appear as both YESB0MCA0xx (digit zero) and
        YESBOMCA008 (letter O). Fold O to 0 from position 5 onward when matching, and
        record which raw form was seen. Report the pair as a data-quality observation if
        an IFSC-level answer depends on it.
    pii_status: Not personal data - an IFSC identifies a branch, not an account. It may be reported.

  branch:
    column: branch_raw
    distinct: 182
    populated_rows: 3192
    populated_pct: 22
    stored_form: raw free text, unnormalised
    coverage_by_year: { '2021-22': "965 of 965", '2022-23': "2,002 of 2,139",
                        '2024-25': "1 of 2,653", '2025-26': "224 of 8,812" }
    prefer: >
      Use ifsc_code for branch-level questions - it is on every payment. Reach for
      branch_raw only when the user explicitly asks for the recorded branch name, and say
      it covers 22% of payments.
    sample_values: [Williamnagar, Nongstoin, Tura, Jowai, Shillong, Mairang, Resubelpara]

  financial_year:
    stored_column: financial_year / financial_year_short on curated.v_focus_legacy
    key_column: year_key
    source: curated.dim_year, pre-joined into the view
    definition: April 1 to March 31, labelled by the starting year, e.g. 2025-26
    sql_predicate: "financial_year_short = '<canonical>'"
    sql_predicate_by_key: "year_key = <start_year>"
    prefer: >
      financial_year_short is the form the source workbook used, so it is the form users
      type. Prefer it over the char(9) financial_year for equality filters.
    distinct: 4
    closed_set: true
    covers_every_payment: >
      Every source row carries a financial year, and the April-March bucket derived from
      date_of_remittance agrees with it on all 14,398 dated rows - zero mismatches. So an
      FY grouping loses nothing, while a date grouping loses the 171 dateless payments.
    gap_rule:
      critical: true
      missing_year: '2023-24'
      text: >
        FY2023-24 HOLDS NO FOCUS LEGACY PAYMENTS. dim_year contains the row, so a GROUP BY
        returns no line for it rather than a zero. Never plot through the gap, never call
        it a decline, and never let "the previous year" step into it - the year before
        FY2024-25 with payments is FY2022-23. Whether the gap is a programme pause or an
        extract gap is UNKNOWN; say so rather than choosing.
    values:
    - canonical: "2021-22"
      range: { start: '2021-04-01', end_exclusive: '2022-04-01' }
      payments: 965
      groups: 965
      members: 13647
      amount: 68235000
      remittance_dates: 15
      first_payment: '2021-08-31'
      last_payment: '2022-03-31'
      dateless: 1
      aliases: ["FY2021-22", "FY 2021-22", "2021-2022", "FY2021-2022", "2021/22", "financial year 2021-22", "fiscal 2021-22", "2021-22 FY"]
    - canonical: "2022-23"
      range: { start: '2022-04-01', end_exclusive: '2023-04-01' }
      payments: 2139
      groups: 2138
      members: 28358
      amount: 141790000
      remittance_dates: 7
      first_payment: '2022-04-20'
      last_payment: '2022-05-31'
      dateless: 0
      aliases: ["FY2022-23", "FY 2022-23", "2022-2023", "FY2022-2023", "2022/23", "financial year 2022-23", "fiscal 2022-23", "2022-23 FY"]
      note: >
        Every payment in this year was made in April and May 2022. The FY label spans
        twelve months; the money moved in six weeks.
    - canonical: "2024-25"
      range: { start: '2024-04-01', end_exclusive: '2025-04-01' }
      payments: 2653
      groups: 2653
      members: 22998
      amount: 114990000
      remittance_dates: 2
      first_payment: '2024-10-07'
      last_payment: '2024-10-08'
      dateless: 0
      aliases: ["FY2024-25", "FY 2024-25", "2024-2025", "FY2024-2025", "2024/25", "financial year 2024-25", "fiscal 2024-25", "2024-25 FY"]
      note: The whole year is two days in October 2024, and 2,331 of the 2,653 payments fall on one of them.
    - canonical: "2025-26"
      range: { start: '2025-04-01', end_exclusive: '2026-04-01' }
      payments: 8812
      groups: 8806
      members: 37018
      amount: 185090000
      remittance_dates: 6
      first_payment: '2025-06-18'
      last_payment: '2026-03-31'
      dateless: 170
      aliases: ["FY2025-26", "FY 2025-26", "2025-2026", "FY2025-2026", "2025/26", "financial year 2025-26", "fiscal 2025-26", "2025-26 FY"]
      note: >
        60% of the scheme. Includes all 706 Focus (Addnl) top-up payments and all but one
        of the 171 dateless rows.
    relative_terms:
      latest / current / most recent: '2025-26'
      previous / last year: '2024-25'
      the year before that: '2022-23'      # NOT 2023-24 - it holds no payments
      earliest / first: '2021-22'
      all years / overall / since inception / till date: no year filter at all

  calendar_year:
    derivation: EXTRACT(YEAR FROM date_of_remittance)
    range: 2021 to 2026
    data_span: { first_payment: '2021-08-31', last_payment: '2026-03-31' }
    nulls: 171
    sql_predicate: "date_of_remittance >= '<YYYY>-01-01' AND date_of_remittance < '<YYYY+1>-01-01'"
    payment_counts:
      2021: 299
      2022: 2804
      2023: 0
      2024: 2653
      2025: 8609
      2026: 33
    note: >
      Calendar 2023 holds ZERO payments, matching the FY2023-24 gap. Calendar 2022 holds
      2,804 payments that span two financial years - 665 in FY2021-22 and 2,139 in
      FY2022-23.

  year_disambiguation:
    critical: true
    problem: >
      A bare year means different things and the gap is large. Calendar 2022 has 2,804
      payments; FY2022-23 has 2,139 - a 31% difference. Calendar 2025 has 8,609; FY2025-26
      has 8,812. Silently choosing one is a materially wrong answer.
    rules:
    - A hyphenated or slashed year ("2025-26", "2025/26", "FY 2025") is a FINANCIAL year.
    - The words "financial year", "FY", "fiscal" force the financial-year reading.
    - A bare four-digit year ("in 2022", "during 2024") defaults to CALENDAR year, filtered
      on date_of_remittance. State the assumption, and note that a calendar filter drops
      the 171 dateless payments while a financial-year filter keeps them.
    - "A bare 2023 is a special case: BOTH readings are empty. Say that the scheme has no
      payments in calendar 2023 or FY2023-24, rather than returning an empty result."
    - When the phrasing is genuinely unclear and the two readings differ materially, ask.

  remittance_date:
    column: date_of_remittance
    type: date
    nulls: 171
    min: '2021-08-31'
    max: '2026-03-31'
    distinct_dates: 30
    sql_predicate_range: "date_of_remittance >= '<from>' AND date_of_remittance < '<to_exclusive>'"
    batch_rule:
      critical: true
      text: >
        THIS IS NOT A CONTINUOUS DATE. Money moves in 30 bulk treasury runs across five
        years. Three dates carry 9,193 of 14,569 payments. A daily or monthly series is a
        picture of BATCHES, not of a payment rate: label it as such, never interpolate
        between runs, and never report a month with no batch as a month of zero
        disbursement.
    month_names: >
      Accept "October 2024", "Oct 24", "Q3 2025" and similar. Convert to an explicit
      half-open date range. Quarters are calendar quarters unless the user says "financial
      quarter", in which case Q1 = April-June.
    out_of_range: >
      Anything before 2021-08-31 or after 2026-03-31 has no payments, and the whole of
      calendar 2023 is empty. Say so with the actual span rather than returning an empty
      result with no explanation.
    batches:
    - { date: '2021-08-31', fy: '2021-22', payments: 32,   amount: 1930000 }
    - { date: '2021-09-20', fy: '2021-22', payments: 54,   amount: 3160000 }
