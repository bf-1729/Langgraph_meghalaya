resolver_version: '1.0'
resolver_name: focuslegacy_entity_resolver
display_name: Focus Legacy Entity Resolver (Meghalaya) - curated star schema
generated_from:
- datasets/Focus legacy/Focus Legacy to share to BLH.xlsx   # Sheet1, 14569 x 22
- SCHEMA_FOR_DEVELOPERS.md (live information_schema extract, 2026-09-21)
generated_on: '2026-09-21'
companion_schema: focuslegacy_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-09-21 - WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Focus Legacy was loaded straight into curated, so there is no flat-table
# ancestor and no migration to record. Every catalogue below is read from the
# source workbook; every column name and case rule is read from the live extract.
#
# FIVE THINGS MAKE THIS RESOLVER DIFFERENT FROM PMAY'S:
#
#   1. THE ENTITY IS A GROUP, NOT A PERSON. pg_id is the only identity. Group
#      NAMES are unstable - 11,906 groups carry 10,678 distinct names and 1,634
#      groups are spelled more than one way - so a name is a search term, never
#      a key. See dimensions.producer_group.
#
#   2. THE pg_id LOOKS RESOLVABLE AND IS NOT. PG-FOCUS-WGH-7089 embeds a
#      district abbreviation, and on 1,075 of 14,569 payments that abbreviation
#      disagrees with the mapped district - correctly, because of district
#      bifurcation. NEVER resolve geography from a pg_id.
#      See dimensions.producer_group.district_token_trap.
#
#   3. product_raw IS UNNORMALISED. 62 raw spellings collapse to 45 products.
#      The resolver owns the folding; the database does not do it.
#      See dimensions.product.
#
#   4. TWO SCHEMES ANSWER TO "FOCUS". Focus Legacy pays producer groups; Focus
#      Plus pays individuals. A bare "Focus" is a scheme-level ambiguity that
#      must be resolved before anything else. See scheme.disambiguation.
#
#   5. BANKING VALUES ARE RESOLVABLE BUT PARTLY PII. bank_name and ifsc_code
#      resolve and may be reported. account_no and name_on_the_account are
#      outside the query surface entirely - this resolver never returns them.
#
# ALL RECORD COUNTS, DISTINCT COUNTS AND DISTRIBUTIONS BELOW ARE FROM THE SOURCE
# WORKBOOK AND HAVE NOT BEEN RE-VERIFIED AGAINST megh_db. The two exceptions the
# database independently confirms are the 14,569 / 3 / 14,566 reconciliation and
# the amount = members x 5000 identity.
# ===========================================================================

description: >
  Value-level entity resolution for the Focus Legacy NLP-to-SQL bot. This file answers
  exactly one question: the user typed some text - which stored database value did they
  mean? It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: focus_legacy
  display_name: Focus Legacy
  full_name: Focus (legacy producer-group disbursement programme), Meghalaya
  state: Meghalaya
  aliases: ["Focus Legacy", "FocusLegacy", "Focus legacy", "legacy Focus", "old Focus",
            "Focus scheme", "FOCUS", "Focus programme", "producer group scheme",
            "PG scheme", "producer group payments", "Focus PG"]
  scheme_code_in_db: UNVERIFIED_ENUMERATE_FIRST
  scheme_code_note: >
    curated.dim_scheme now holds 5 rows. The scheme_code for this partition was not
    captured in the 2026-09-21 extract. Run
    SELECT scheme_key, scheme_code, scheme_name, money_unit FROM curated.dim_scheme
    before emitting any scheme filter or reading the money unit.

  disambiguation:
    critical: true
    problem: >
      "Focus" alone is ambiguous between two live schemes in megh_db. Focus Legacy pays
      PRODUCER GROUPS at Rs 5,000 per member; Focus Plus pays INDIVIDUAL BENEFICIARIES.
      They share no key, and Focus Plus holds no producer-group column at all.
    rules:
    - The words "producer group", "PG", "PG id", "group" force the Focus Legacy reading.
    - The words "beneficiary", "member id", "tranche", "batch", "93K", "12.5K" force the
      Focus Plus reading. Route the question to that partition.
    - A bare "Focus" with no other signal is ASKED, not guessed - see
      focuslegacy_classification_rules.yaml, condition focus_plus_confused_with_focus_legacy.
    - Never answer a Focus Plus question from this partition, and never join the two.

tables:
  payments: curated.v_focus_legacy               # primary query surface, 28 columns
  fact: curated.fact_focus_legacy_disbursement   # underlying fact - NEVER QUERIED, holds unmasked bank data
  groups: curated.dim_producer_group             # 12 columns; first/last payment year not exposed by the view
  entity_types: curated.dim_pg_entity_type       # 3 rows
  bank_history: curated.bridge_pg_bank_history   # NEVER QUERIED - unmasked account numbers
  geography: curated.dim_geography               # conformed; holds ac_number / ac_name
  village_source_bridge: curated.bridge_geography_source
  reconciliation: meta.v_reconciliation_focus_legacy

dataset_shape:
  grain: one row per payment to one producer group
  approx_row_count_db: 14566
  row_count_note: >
    The source workbook held 14,569 rows; 3 were quarantined, and the live extract's
    planner estimate of 14,566 agrees exactly. Run the reconciliation view before
    publishing a total.
  single_table: false
  emits_no_joins: >
    curated.v_focus_legacy already pre-joins dim_producer_group, dim_pg_entity_type,
    dim_geography, dim_year and bridge_pg_bank_history, so the generator emits WHERE and
    GROUP BY only. Three documented exceptions - dim_scheme for the money unit,
    dim_geography for constituency, dim_producer_group for first/last payment year. See
    focuslegacy_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because block and
    village names collide, and because a pg_id contains a district abbreviation that must
    NOT be read as geography. Try: scheme -> producer_group_id -> financial_year ->
    calendar_year -> remittance_date -> district -> block -> village -> pg_entity_type ->
    programme_variant -> product -> bank -> ifsc -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "lgd_district and lgd_block are stored UPPERCASE in dim_geography; lgd_village_name,
    bank_name and product_raw are not. Always compare case-folded, and emit the form the
    column actually stores. A Title Case district literal returns zero rows silently."
  - "NEVER PARSE A pg_id. The district abbreviation inside it is the district at
    enrolment and is stale on 1,075 payments. Resolve geography from lgd_district only."
  - Villages are resolved by village_code, never by name alone. 94 village names are
    shared by two or more different villages, covering 208 codes.
  - "Every village count and village list carries entity_type <> 'Unresolved'. Never
    extend that filter to a money, district, block or programme total."
  - "Group names are NOT identities. Resolve a name to one or more pg_id values, ask if
    more than one survives, then query on pg_id."
  - "product_raw is unnormalised - 62 spellings, 45 products. Fold case and trim before
    matching or grouping, always."
  - "Product answers cover FY2021-22 and FY2022-23 only. Say so every time."
  - "There is NO always-on predicate. Do not copy PMAY's WHERE NOT is_placeholder - the
    column does not exist and the query will error."
  - "amount_disbursed = no_of_pg_members x 5000 on every row. A money ranking and a
    membership ranking are the same ranking. Never present them as two findings."
  - "account_no and name_on_the_account are outside the query surface. This resolver
    never returns them, and account_no_masked is displayable but never countable."
  - NULL is missing, never zero. 171 payments have no remittance date, 11,457 no product,
    11,377 no branch and 276 no bank name.
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a district, block, village, group, product or bank.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - strip trailing qualifier words: BLOCK, DISTRICT, VILLAGE, C&RD
  - strip trailing group words when matching a group name: PG, P G, PRODUCER GROUP, GROUP
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    village_code, block and district LGD codes and source_row_id are integers. Cast
    user-typed codes with int() and strip any trailing .0 before comparing.
  pg_ids: >
    Uppercase, then remove ALL internal spaces before matching - the source itself
    contains two space-corrupted ids and users paste ids with stray spaces. Match the
    whole string; never match on the trailing number alone.
  ifsc_codes: >
    Uppercase and strip spaces. Beware the character confusion in the source: MCAB and
    YESB sponsor codes appear as both YESB0MCA... (digit zero) and YESBOMCA... (letter O).
    Fold O to 0 in positions 5 onward before comparing, and record which raw form matched.
  product_terms: >
    Fold case and trim, then match against the canonical list in dimensions.product.
    Singular and plural are treated as the same product (VEGETABLE = VEGETABLES).

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: "acronyms are defined for districts only - do not invent them for blocks, and
           do not read a district acronym out of a pg_id" }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [Laskein, Thadlaskein]          # two different West Jaintia Hills blocks, 647 vs 383 payments
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]          # East Khasi Hills block vs South West Khasi Hills block
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]         # East Khasi Hills block vs West Khasi Hills block
  - [Mawshynrut, Mawsynram]
  - [Siju, Saipung]                 # South Garo Hills block vs East Jaintia Hills block
  - [Saipung, Siju]
  - [Umling, Umsning]               # two different Ri Bhoi blocks, 303 vs 504 payments
  - [Umsning, Umling]
  - [Mawpat, Mawlai]                # two different East Khasi Hills blocks
  - [Mawlai, Mawpat]
  - [Rambrai, Rerapara]
  - [Rongram, Rongara]              # West Garo Hills block vs South Garo Hills block
  - [Rongara, Rongram]
  - [Dadenggiri, Demdema]
  - [Bajengdoba, Baghmara]
  - ["Focus Legacy", "Focus Plus"]  # two different schemes - see scheme.disambiguation
  - ["FOCUS", "Focus (Addnl)"]      # two programme variants within this scheme
  - [Ginger, "Long Pepper"]
  - [Pepper, "Black Pepper"]        # both exist as separate products
  - ["Black Pepper", "Wild pepper"]
  - [Vegetables, "Vegetables (Mushroom)"]
  - [Mushroom, "Vegetables (Mushroom)"]
  - [Sericulture, Silkworm]         # both exist as separate products
  - ["Meghalaya Rural Bank", "Meghalaya Co-operative Apex Bank"]

output_contract:
  resolved:
    status: resolved
    entity_type: scheme | producer_group | pg_entity_type | programme_variant | district |
                 block | village | product | bank | ifsc | financial_year |
                 calendar_year | remittance_date | identifier | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    lgd_code: <code, geography only>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, lgd_code, district, block, pg_id } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the Focus Legacy data.
  refused:
    status: refused
    entity_type: account_number | account_holder_name
    user_text: <verbatim span>
    reason: outside the approved query surface
    message: >
      State that bank account numbers and account-holder names are not available, offer
      the masked account for a single named group, and do not attempt a lookup.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to more than one scheme. Getting
    these wrong produces a confidently wrong answer, so they are listed explicitly.

  focus:
    readings:
    - { means: this partition, when: "the user says producer group, PG, group, or names this scheme" }
    - { means: the Focus Plus partition, when: "the user says beneficiary, member id, tranche, batch, 93K or 12.5K" }
    - { means: programme_variant = the FOCUS variant, when: "the user is contrasting it with Focus (Addnl) inside this scheme" }
    default: ask. Two schemes and one programme variant all answer to the word.

  beneficiaries:
    readings:
    - { means: COUNT(*), when: "the user means payments - the grain" }
    - { means: COUNT(DISTINCT pg_id), when: "the user means the organisations paid" }
    - { means: SUM(no_of_pg_members), when: "the user means people reached" }
    default: ask. The three differ by an order of magnitude - about 14,566, 11,904 and 102,021.
    critical: >
      THERE IS NO PERSON-LEVEL ANSWER. SUM(no_of_pg_members) counts MEMBERSHIPS: a group
      paid in two years contributes twice, and its recorded size can differ between the
      two payments. Never present it as a headcount of people, and never offer a person
      lookup - no name, EPIC or member id exists in this partition.

  amount:
    readings:
    - { means: SUM(amount_disbursed), when: always - it is the only money column }
    default: SUM(amount_disbursed), with the x5000 identity stated back.
    critical: >
      amount_disbursed = no_of_pg_members x 5000 on every row. SUM(amount) is
      5000 x SUM(members); AVG(amount) is 5000 x average group size and is NOT an
      entitlement. "Per member" is the constant 5,000 - say the rate, do not compute it.
    unit: >
      UNVERIFIED. Read curated.dim_scheme.money_unit for this scheme before formatting.
      Magnitudes corroborate rupees; nothing in the extract confirms it.

  members:
    readings:
    - { means: SUM(no_of_pg_members), when: the user asks how many members were covered }
    - { means: AVG(no_of_pg_members), when: the user asks about group size }
    - { means: "a WHERE on no_of_pg_members", when: "the user asks about groups OF a given size" }
    default: SUM, labelled as memberships rather than people.

  group:
    readings:
    - { means: COUNT(DISTINCT pg_id), when: the user means producer groups }
    - { means: "a GROUP BY", when: the user means 'group by district' and similar }
    default: read as producer groups unless the sentence is asking for a breakdown.

  type:
    readings:
    - { means: pg_entity_type, when: "the user asks what kind of group - FOCUS, LAMP, EXISTING" }
    - { means: programme_variant, when: "the user asks which programme - FOCUS vs Focus (Addnl)" }
    - { means: product_raw, when: "the user asks what type of produce or activity" }
    default: ask. All three are live and they are different columns.

  current:
    readings:
    - { means: bank_details_current, when: the user asks about the group's current account }
    - { means: "the latest financial year", when: "the user says current year" }
    default: ask if the sentence touches banking; otherwise read as the latest year.
    note: >
      bank_details_current is TRUE or NULL, never FALSE. For "paid to an old account"
      write bank_details_current IS NULL AND account_no_masked IS NOT NULL.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 17
    village_names_shared_by_more_than_one_code: 94
    village_codes_involved_in_a_shared_name: 208
    district_collisions: 0
  colliding_block_and_village_names: [Baghmara, Batabari, Gambegre, Laskein, Mawkynrew,
    Mawkyrwat, Mawlai, Mawpat, Mawryngkneng, Rambrai, Ranikor, Rerapara, Saipung,
    Songsak, Umling, Umsning, Zikzak]
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "village" or "gaon", resolve as village.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.
  - "A district ABBREVIATION inside a pg_id is not a geography span at all. Do not
    classify it as a district entity - see dimensions.producer_group.district_token_trap."

# ---------------------------------------------------------------------------
# DIMENSIONS
