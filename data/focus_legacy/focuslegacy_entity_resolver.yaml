      critical: >
        NOT AN IDENTIFIER AND NOT COUNTABLE. Masking is not collision-free - two accounts
        of the same length ending in the same four digits collapse to one string. Never
        COUNT(DISTINCT account_no_masked). Display it only for one named group's payment
        history, never in a bulk export.
