resolver_version: '1.0'
resolver_name: cmelevate_entity_resolver
display_name: CM Elevate Entity Resolver (Meghalaya) - curated star schema
generated_from:
- datasets/Cmelevate/CM_Elevate_AllSchemes_20260818_122217.xlsx
- datasets/Cmelevate/Megh One AI - CM Elevate NLP Use Cases.xlsx
- SCHEMA_FOR_DEVELOPERS.md (live database extract, 2026-09-04)
generated_on: '2026-09-04'
companion_schema: cmelevate_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-09-04 - FIRST VERSION, WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# There is no flat-table predecessor for CM Elevate. Everything below was
# derived from the live schema plus a profile of the 2026-08-18 API export.
#
# WHAT THIS RESOLVER HAS THAT PMAY'S DOES NOT
#   * A SUB-SCHEME DIMENSION. CM Elevate is 15 schemes under one scheme_code.
#     Resolving which of the 15 a user meant is the FIRST job, not an
#     afterthought - it changes the answer more than geography does.
#   * A SCHEME CODE INSIDE THE APPLICATION NUMBER. request_id segment 1 is a
#     stable three-digit per-scheme code, so an application number alone
#     identifies its scheme. Verified 1:1 across all 15 schemes.
#   * A JSONB DIMENSION. gender lives in scheme_specific, not in a column.
#   * WARDS AND URBAN BODIES. Unlike PMAY-G, which is rural only, CM Elevate
#     reaches Municipal Boards and Town Committees, and 92 of its village names
#     are ward names.
#
# WHAT PMAY'S RESOLVER HAS THAT THIS ONE CANNOT
#   * No financial_year or calendar_year dimension - CM Elevate has NO DATE.
#   * No status roll-up flags - no is_completed equivalent exists.
#   * No money vocabulary - there is no amount column of any kind.
#   These absences are recorded explicitly in `absent_dimensions` so the
#   resolver refuses rather than improvising.
#
# All record counts, distinct counts and value distributions below are from the
# source export (8,436 rows, profiled 2026-09-04) and have NOT been re-verified
# against megh_db, which reports ~8,543 rows.
#
# CANONICAL-FORM WARNING, READ BEFORE TRUSTING THE BLOCK AND VILLAGE LISTS
#   The catalogues below are the values the SOURCE EXPORT carries. The database
#   resolves geography through dim_geography at ingest, so lgd_block and
#   lgd_village_name hold the ROSTER's forms, which differ - most visibly, the
#   source writes "Umling C & RD Block" where the roster is expected to hold
#   "UMLING". Treat the source forms below as ALIASES to match on, and confirm
#   the stored canonical forms against dim_geography before shipping. Flagged in
#   maintenance.open_verification_tasks.
# ===========================================================================

description: >
  Value-level entity resolution for the CM Elevate NLP-to-SQL bot. This file answers
  exactly one question: the user typed some text - which stored database value did they
  mean? It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: cm_elevate
  display_name: CM Elevate
  full_name: CM Elevate (Meghalaya livelihood and enterprise programme)
  scheme_code: CM_ELEVATE
  state: Meghalaya
  sub_scheme_count: 15
  aliases: ["CM Elevate", "CMElevate", "CM-Elevate", "CM elevate scheme", "Elevate",
            "Chief Minister's Elevate", "Chief Ministers Elevate", "CM Elevate programme",
            "CME", "elevate programme", "CM Elevate Meghalaya"]
  programme_note:
    critical: true
    text: >
      CM Elevate is a PROGRAMME, not a scheme. One row in curated.dim_scheme covers
      FIFTEEN individual schemes, separated by cm_scheme_key. A user saying "CM Elevate"
      may mean the whole programme or one scheme inside it - see dimensions.cm_scheme
      and the scheme_scope_missing default. A programme-level total with no sub-scheme
      breakdown mixes 15 unrelated schemes into one number.

tables:
  applications: curated.v_cm_elevate               # primary query surface, 22 columns
  fact: curated.fact_cm_elevate_application        # underlying fact, 20 columns
  scheme_dim: curated.dim_cm_elevate_scheme        # the 15 sub-schemes
  reconciliation: meta.v_reconciliation_cm_elevate # one row per sub-scheme endpoint
  cross_scheme_coverage: curated.v_cross_scheme_village_coverage
  cross_scheme_money: curated.v_cross_scheme_money_district_year   # CM Elevate NOT in it

dataset_shape:
  grain: one row per application (request_id) across all 15 CM Elevate schemes
  row_count: unverified_in_db
  row_count_note: >
    The source export held 8,436 rows. megh_db reports ~8,543 by reltuples estimate.
    Neither is an exact count and they do not agree.
  single_table: false
  emits_no_joins: >
    curated.v_cm_elevate already pre-joins dim_cm_elevate_scheme and dim_geography, so
    the generator emits WHERE and GROUP BY only. Both joins are INNER and both keys are
    NOT NULL, so no rows are lost. The one routine exception is a scheme_specific
    containment query, which must run against the fact to use the GIN index.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because scheme names
    contain place-like words and block names collide with village names. Try:
    cm_scheme -> application_number -> district -> block -> village -> applicant_category
    -> data_verified -> application_mode -> current_file_status -> current_level ->
    gender -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "RESOLVE THE SUB-SCHEME FIRST. CM Elevate is 15 schemes. Almost every figure in this
    partition changes by scheme - gender runs from 100% female (Sericulture) to 0%
    (Green Taxi), and eight schemes do not reach all 12 districts."
  - "THERE IS NO DATE. No financial_year, no calendar_year, no month. Any time span in
    the user text resolves to entity_type: time and status: not_available. Never parse
    request_id for a date, and never use ingested_at."
  - "THERE IS NO MONEY. No amount, subsidy, loan, sanctioned or disbursed column. A
    money span resolves to entity_type: measure and status: not_available. Never
    substitute an application count."
  - "lgd_district and lgd_block are stored UPPERCASE in dim_geography. lgd_village_name
    keeps mixed case. Always compare case-folded, and emit the form the column stores."
  - Villages are resolved by village_code, never by name alone. 36 village names in
    this data map to more than one LGD code.
  - "entity_type = 'Unresolved' is not a village. Exclude it from village counts and
    village lists; keep it everywhere else."
  - "Applicant names are not in the curated layer. citizen_name, epic_id, mobile_number,
    pan_number and every bank_account field were stripped at ingest. A name lookup
    returns not-held, never a guess."
  - "'On hold' resolves to data_verified = 'On Hold', NEVER to the onhold boolean, which
    is FALSE on every row and returns zero while looking correct."
  - "Group applicant type on applicant_category, never on type_raw. The raw labels are
    per-scheme and carry source typos preserved verbatim."
  - "request_id is NOT unique - 36 numbers repeat across 64 rows, all inside Piggery.
    Never treat it as a primary key, and never assume LIMIT 1 is safe."
  - "Fold case on current_level and current_file_status before grouping - 'level1' and
    'Level1' are the same level stored twice."
  - NULL is missing, never zero. 389 rows have no verification outcome recorded.
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a scheme, district, block, village or status value.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - "strip trailing qualifier words: SCHEME, BLOCK, DISTRICT, VILLAGE, C&RD, C & RD BLOCK,
     MUNICIPAL BOARD, TOWN COMMITTEE, MB, TC"
  - "strip leading qualifier words: MEGHALAYA, THE"
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    village_lgd_code arrives from the source as a float (277617.0). Cast with int() and
    strip any trailing .0 before comparing. Village codes in this data are 5 to 7 digit
    integers with no letters.
  meghalaya_prefix_rule:
    critical: true
    text: >
      TEN OF THE 15 SCHEME NAMES BEGIN "Meghalaya". Stripping that prefix during folding
      is what lets "piggery" reach "Meghalaya Piggery Development Scheme". Never treat a
      leading "Meghalaya" as a geography token when the span is being classified as a
      scheme.
  application_ids: >
    request_id is uppercase with slashes, e.g. REQ/001/001/10102025/188877. Uppercase and
    strip spaces before matching. Match on the full string; see
    identifiers.request_id.scheme_prefix for resolving the scheme from segment 1.

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts only - do not invent them for blocks or schemes }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
  scheme_note: >
    This stage carries most of the scheme resolution. "piggery", "goat", "warehouse" and
    "cinema" are all whole-word substrings of exactly one scheme name.
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  # --- the three PRIME schemes are NOT interchangeable
  - ["PRIME Tourism Vehicle Scheme", "PRIME Agriculture Response Vehicle Scheme"]
  - ["PRIME Agriculture Response Vehicle Scheme", "PRIME Tourism Vehicle Scheme"]
  - ["PRIME Small Enterprise Empowerment and Development (SEED)", "PRIME Tourism Vehicle Scheme"]
  - ["PRIME Small Enterprise Empowerment and Development (SEED)", "PRIME Agriculture Response Vehicle Scheme"]
  # --- two tourism schemes, different things
  - ["Agro Tourism Villa Scheme", "PRIME Tourism Vehicle Scheme"]
  - ["PRIME Tourism Vehicle Scheme", "Agro Tourism Villa Scheme"]
  # --- vehicle schemes
  - ["Meghalaya Motorcaravan Scheme", "Chief Minister's Green Taxi Scheme"]
  - ["Chief Minister's Green Taxi Scheme", "Meghalaya Motorcaravan Scheme"]
  # --- livestock schemes are four distinct schemes
  - ["Meghalaya Piggery Development Scheme", "Meghalaya Poultry Farming Scheme"]
  - ["Meghalaya Poultry Farming Scheme", "Meghalaya Piggery Development Scheme"]
  - ["Meghalaya Goat Farming Scheme", "Meghalaya Poultry Farming Scheme"]
  - ["Meghalaya Dairy Development Scheme", "Meghalaya Piggery Development Scheme"]
  # --- geography pairs, inherited from the shared dim_geography
  - [Laskein, Thadlaskein]
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]
  - [Mawshynrut, Mawsynram]
  - [Saipung, Songsak]
  - [Mairang, Mawiong]
  # --- status values that mean different things
  - ["On Hold", Invalid]
  - [Invalid, Wrong]
  - [Wrong, Invalid]
  - [registered, unregistered]
  - [unregistered, registered]
  - [Sendback, Resubmit]
  scheme_note:
    critical: true
    text: >
      The scheme blocks matter more than the geography ones. "PRIME vehicle" is
      genuinely ambiguous between two schemes of very different size (403 vs 339
      applications) and very different applicant profile. Ask, never guess.

output_contract:
  resolved:
    status: resolved
    entity_type: cm_scheme | district | block | village | applicant_category |
                 data_verified | current_file_status | current_level | application_mode |
                 gender | application_number | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    cm_scheme_key: <key, sub-scheme only>
    lgd_code: <code, geography only>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, cm_scheme_key, lgd_code, district, block, applications } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the CM Elevate data.
  not_available:
    status: not_available
    entity_type: measure | time
    user_text: <verbatim span>
    reason: <which column does not exist>
    message: >
      state plainly that CM Elevate does not hold this kind of value, and do not offer a
      substitute of a different kind. Used for money and time spans - see
      absent_dimensions.
    note: >
      NO PMAY COUNTERPART. PMAY could always answer a money or time question somehow;
      CM Elevate cannot, and the resolver needs a shape that says so rather than
      degrading to not_found, which implies a spelling problem.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to a column that does not exist.
    Getting these wrong produces a confidently wrong answer, so they are listed
    explicitly.

  scheme:
    readings:
    - { means: "the CM Elevate programme as a whole", when: "the user says CM Elevate, the programme, or overall" }
    - { means: "one of the 15 sub-schemes", when: "the user names or hints at a specific scheme" }
    default: >
      Ask when unclear. A programme total mixes 15 unrelated schemes; a scheme total is
      often a handful of rows. The word carries far more weight here than in PMAY, where
      there is only one scheme.

  on_hold:
    readings:
    - { means: "data_verified = 'On Hold'", when: always }
    critical: true
    text: >
      THE MOST DANGEROUS TERM IN THIS PARTITION. There is also a boolean column called
      onhold, and it is FALSE on every one of the 8,436 source rows. A query against it
      returns zero and looks perfectly correct. Always resolve "on hold", "held",
      "held up" and "paused" to data_verified = 'On Hold' - about 1,199 applications.

  pending:
    readings:
    - { means: "data_verified = 'On Hold'", when: "the user means applications awaiting a verification outcome" }
    - { means: "not_available", when: "the user means money awaiting release" }
    default: >
      Read it as On Hold and say so. There is no pending AMOUNT in CM Elevate - PMAY's
      amount_pending has no counterpart here.

  status:
    readings:
    - { means: data_verified, when: "default - the only status field that varies usefully" }
    - { means: current_file_status, when: "the user says file status, workflow, or where the file is" }
    - { means: current_level, when: "the user says level or stage" }
    default: >
      data_verified. current_file_status is 98.4% one value and current_level is 98.6%
      one value, so neither answers "what is the status split" usefully.

  approved:
    readings:
    - { means: not_available, when: always }
    critical: true
    text: >
      There is NO approval field. current_file_status = 'forward' means the file moved to
      the next step, not that it was approved, and it covers 98.4% of rows. Never resolve
      "approved", "sanctioned" or "cleared" to it. CM Elevate records applications, not
      decisions.

  sanctioned:
    readings:
    - { means: not_available, when: always }
    note: >
      DIFFERENT FROM PMAY, where "sanctioned" is a status, a measure and a date. In CM
      Elevate it is none of those - there is no sanction stage, no sanctioned amount and
      no sanction date. Resolve to not_available and say the data stops at the
      application.

  beneficiaries:
    readings:
    - { means: COUNT(*), when: default - the grain is one APPLICATION }
    - { means: COUNT(DISTINCT request_id), when: "the user says distinct, unique, or individual" }
    default: COUNT(*), and say the answer is an application count.
    critical: true
    text: >
      An application is a REQUEST, not an award. Nothing in this data confirms that any
      applicant received anything. Say "applications", never "beneficiaries who
      received". request_id is not unique either, so the two counts can differ - report
      both when they do.

  applicants:
    means: COUNT(*)
    note: >
      Same as beneficiaries. There is no person identifier, so distinct PEOPLE cannot be
      counted at all - only distinct application numbers.

  amount:
    readings:
    - { means: not_available, when: always }
    critical: true
    text: >
      NO MONEY COLUMN EXISTS. Not sanctioned, not subsidy, not loan, not disbursed, not
      pending. PMAY's three-way amount ambiguity has no counterpart here - there is
      nothing to disambiguate between. Resolve to not_available.

  type:
    readings:
    - { means: applicant_category, when: default }
    - { means: cm_scheme, when: "the user says type of scheme or which type of scheme" }
    default: applicant_category - individual, registered or unregistered.

  mode:
    means: application_mode
    note: online or cmconnectcenter. The cleanest two-value field on this fact.

  vehicle:
    readings:
    - { means: "PRIME Tourism Vehicle Scheme", when: "the user says tourism or taxi-for-tourists" }
    - { means: "PRIME Agriculture Response Vehicle Scheme", when: "the user says agriculture or response" }
    - { means: "Chief Minister's Green Taxi Scheme", when: "the user says taxi or green" }
    - { means: "Meghalaya Motorcaravan Scheme", when: "the user says caravan or motorhome" }
    default: ask. Four schemes involve vehicles and they are not interchangeable.

  tourism:
    readings:
    - { means: "PRIME Tourism Vehicle Scheme", when: "the user mentions a vehicle, taxi or transport" }
    - { means: "Agro Tourism Villa Scheme", when: "the user mentions a villa, homestay or accommodation" }
    default: ask. 403 applications against 3 - picking wrong is not a rounding error.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    village_names_mapping_to_more_than_one_code: 36
    block_names_that_are_also_village_names: "unmeasured against dim_geography - see maintenance"
    district_collisions: 0
    scheme_word_collisions: "see disambiguation_rules"
  colliding_village_names: [Chandigre, Bolchugre, Bollonggitok, Mawiong, Lumpyngngad,
    Matchokgre, Dollonggre, Mawbri, Adugre, Aruagre, Mawhati, Ampanggre, Allagre,
    Lumsohphoh, Demthring, Mawlein, Mawlieh, Mawlong, Mawryngkang, Mawsaw, Nogorpara,
    Nongbah, Nongdom, Nongkynrih, Nonglang]
  colliding_village_names_note: >
    25 of the 36 shown. Chandigre maps to THREE different LGD codes; the rest map to two.
    Always resolve a village to its code, and ask when more than one survives.
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "village" or "gaon", resolve as village.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.
  - "SCHEME WORDS BEAT PLACE WORDS. 'Warehouse', 'Cinema', 'Sports' and 'Villa' are
    scheme words, not places. Classify a span as cm_scheme before trying geography."
  - "'Meghalaya' at the start of a span is a scheme-name prefix on ten of the 15 schemes,
    not a geography token. Strip it before classifying."

# ---------------------------------------------------------------------------
# ABSENT DIMENSIONS - no PMAY counterpart. These exist so the resolver refuses
# rather than improvising a substitute.
# ---------------------------------------------------------------------------
absent_dimensions:
  purpose: >
    PMAY's resolver has a financial_year dimension and a money vocabulary. CM Elevate has
    neither, and a resolver that simply lacked them would fall through to not_found,
    implying the user mistyped something. These entries make the refusal explicit and
    give it a reason.

  time:
    status: NOT_AVAILABLE
    columns_that_do_not_exist: [year_key, financial_year, financial_year_short,
                                sanction_date, application_date, month, quarter]
    what_exists_instead: ingested_at
    ingested_at_rule:
      critical: true
      text: >
        ingested_at is on the fact and describes WHEN THE ROW WAS LOADED. It is not an
        application date. Charting it would present ETL activity as applicant behaviour.
        Never resolve a time span to it.
    request_id_rule:
      critical: true
      text: >
        request_id segment 4 looks like a date - REQ/001/001/10102025/224638. It is
        unpadded and ambiguous: 6, 7 or 8 digits with leading zeros dropped, so 1032026
        is validly 1-Mar-2026 or 10-Mar-2026. A naive parse over the source export
        resolved only 3,038 of 8,436 rows and produced dates AFTER the export date.
        Never parse it in generated SQL.
    resolver_behaviour: >
      Classify the span as entity_type: time and emit not_available with the reason
      "CM Elevate applications carry no date in this warehouse". Do not offer a
      did-you-mean list - it is not a spelling problem.
    aliases_that_trigger_it: [year, this year, last year, 2024, 2025, FY, financial year,
      month, monthly, quarter, trend, growth, over time, recent, latest, newest, oldest,
      since, between, wave, April, November]

  money:
    status: NOT_AVAILABLE
    columns_that_do_not_exist: [sanctioned_amount, subsidy, loan, total_disbursement,
                                amount_released, amount_pending, unit_cost, tranche]
    what_exists_instead: nothing
    resolver_behaviour: >
      Classify the span as entity_type: measure and emit not_available with the reason
      "CM Elevate holds no monetary values in this warehouse". NEVER substitute an
      application count - offer it only as an explicitly different question.
    aliases_that_trigger_it: [amount, money, rupees, crore, lakh, sanctioned, disbursed,
      disbursement, subsidy, loan, funds, spend, spending, expenditure, released,
      pending amount, budget, cost, value, per beneficiary, average amount]

  loan_channel:
    status: NOT_AVAILABLE
    columns_that_do_not_exist: [loan_entity, bank, lifcom]
    resolver_behaviour: >
      "Bank" and "LIFCOM" come from the requirement workbook, which describes a different
      dataset. Emit not_available. Note that a bank_id field does survive in
      scheme_specific for some schemes, but it holds an unresolvable numeric code with no
      lookup table anywhere in megh_db - it is not a loan channel.

  outcome_flags:
    status: NOT_AVAILABLE
    columns_that_do_not_exist: [desanctioned, refused, refusal_reason, approved]
    what_exists_instead: data_verified
    resolver_behaviour: >
      Offer data_verified only if clearly relabelled as a data-verification outcome, not
      a funding decision. is_withdraw exists but is FALSE on every row and means
      withdrawn by the applicant - never present it as refusal.

  person_identity:
    status: DROPPED_AT_INGEST
    columns_that_do_not_exist: [citizen_name, epic_id, mobile_number, pan_number,
                                bank_account_number, bank_account_no, bank_account]
    resolver_behaviour:
      critical: true
      text: >
        Classify the span as entity_type: person_name and emit not_found with the reason
        "personal names are not held in the curated layer" - NOT a did-you-mean list.
        Never substitute request_id for a name.
    retained_but_forbidden:
      columns: [dob, email_id, address, member_id, family_id, pds_id,
                account_holder_name, ifsc_code]
      rule:
        critical: true
        text: >
          These DID survive into scheme_specific because the loader's strip list does not
          cover them, so they are queryable. They must never be resolved, surfaced,
          exported or embedded. dob plus address plus village is re-identifying. If a
          user names one, refuse and offer the same question as a group total.

# ---------------------------------------------------------------------------
# DIMENSIONS
# ---------------------------------------------------------------------------
dimensions:

  # =========================================================================
  # THE SUB-SCHEME DIMENSION - resolve this first. No PMAY counterpart.
  # =========================================================================
  cm_scheme:
    name_column: scheme_name
    key_column: cm_scheme_key
    endpoint_column: endpoint
    source: curated.dim_cm_elevate_scheme, pre-joined into curated.v_cm_elevate
    stored_case: as shown - mixed case, stored exactly
    distinct: 15
    closed_set: true
    sql_predicate: "scheme_name = '<canonical>'"
    sql_predicate_by_key: "cm_scheme_key = <key>"
    prefer: >
      Filter on scheme_name for readability. Use cm_scheme_key when scoping a
      scheme_specific JSONB read, where the key is what the schema partition file
      requires.
    key_note: >
      cm_scheme_key values are NOT listed below. They are assigned by the loader and have
      not been read from the database. Resolve to scheme_name and let the view supply the
      key. Flagged in maintenance.open_verification_tasks.
    request_id_prefix_note:
      critical: true
      text: >
        SEGMENT 1 OF request_id IS A STABLE PER-SCHEME CODE, verified 1:1 across all 15
        schemes in the source export. REQ/001/... is always Piggery, REQ/233/... is
        always PRIME Small Enterprise. This means an application number alone identifies
        its scheme, with no lookup. The prefix is recorded on each value below.
    alias_provenance: >
      canonical and applications are read from the source export Summary sheet.
      request_prefix is measured from request_id segment 1. Aliases are curated
      linguistic forms.
    distribution_warning:
      critical: true
      text: >
