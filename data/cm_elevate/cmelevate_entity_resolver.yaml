  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: >
      Mixed case in dim_geography.lgd_village_name - NOT uppercased, unlike district and
      block. The source export itself is inconsistent: 269 of its 2,001 village names are
      ALL-CAPS ("PEINLANG", "BOLKINGGRE") while the rest are Title Case. Fold case before
      matching and emit the stored form.
    distinct_names: 2001
    distinct_codes: 2038
    sql_predicate_preferred: "village_code = <lgd_code>"
    sql_predicate_fallback: "lgd_village_name = '<canonical>'"
    counting_villages:
      critical: true
      text: >
        Use COUNT(DISTINCT village_code) with entity_type <> 'Unresolved', never
        COUNT(DISTINCT name). 36 names map to more than one code, so a name count loses
        villages; and the Unresolved placeholder is not a village at all.
    catalogue_note: >
      The 2,038 village codes are NOT enumerated in this file - the list would dominate
      it and dim_geography is the authority. Resolve villages against dim_geography at
      runtime, scoped by any district or block the user also gave. Only the ambiguity
      registry and the shape rules below are recorded here.

    resolution_strategy:
    - 1. If the user gave a numeric code, cast to int (the source carries floats like 277617.0) and resolve on village_code directly.
    - 2. Fold the name and look it up in dim_geography scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their district and block. Ask which one.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.

    ambiguity_registry:
      names_mapping_to_multiple_codes: 36
      worst_case: { name: Chandigre, codes: 3 }
      names: [Chandigre, Bolchugre, Bollonggitok, Mawiong, Lumpyngngad, Matchokgre,
              Dollonggre, Mawbri, Adugre, Aruagre, Mawhati, Ampanggre, Allagre,
              Lumsohphoh, Demthring, Mawlein, Mawlieh, Mawlong, Mawryngkang, Mawsaw,
              Nogorpara, Nongbah, Nongdom, Nongkynrih, Nonglang]
      note: >
        25 of the 36 are listed. Chandigre maps to three different LGD codes; the rest
        map to two. Never resolve one of these without a district or block scope.

    ward_names:
      critical: true
      count: 92
      applications: 495
      examples: ["9-Ward No. 9", "14-Nongstoin (TC) - Ward No.14",
                 "8-Williamnagar (MB) - Ward No.8", "11-Pahamsyiem - Ward No. 11",
                 "7-Williamnagar (MB) - Ward No.7"]
      rule: >
        92 of the village names are URBAN WARDS, carrying about 495 applications. They
        correspond to dim_geography.entity_type = 'Ward'. They are real localities and
        must be counted - do NOT confuse them with entity_type = 'Unresolved', which is
        a synthetic placeholder and must be excluded from village answers.
        Their names begin with a ward number and embed "(MB)" or "(TC)". Do not mistake
        the leading digits for an LGD code.

    numeric_prefix_rule: >
      Names beginning with a digit ("9-Ward No. 9", "11-Pahamsyiem - Ward No. 11") must
      not be mistaken for LGD codes. A village code in this data is a 5 to 7 digit
      integer with no letters or punctuation.

    unresolved_placeholder:
      critical: true
      entity_type_value: Unresolved
      rule: >
        A synthetic per-district - or global - placeholder created when a source row's
        locality could not be matched to any roster entry. on_roster is always FALSE.
        It is NEVER a real village. Keep it in district, block and scheme totals so they
        reconcile; exclude it from every village count and village list. If a user asks
        to see it, treat that as a data-completeness question and say what it is.
      source_signal: 16 rows in the source export carried no village_lgd_code at all.

    largest_villages:
      note: Measured from the source export, unverified_in_db.
      values:
      - { name: Umshaken, code: 277617, district: "Ri Bhoi", applications: 74 }
      - { name: "11-Pahamsyiem - Ward No. 11", code: 1298479, district: "Ri Bhoi", applications: 66 }
      - { name: "8-Williamnagar (MB) - Ward No.8", code: 70679, district: "East Garo Hills", applications: 51 }
      - { name: Watregre, code: 273460, district: "West Garo Hills", applications: 51 }
      - { name: Balakhawa, code: 277694, district: "Ri Bhoi", applications: 44 }

  # =========================================================================
  # CATEGORICAL DIMENSIONS
  # =========================================================================
  applicant_category:
    column: applicant_category
    raw_column: type_raw
    stored_case: lowercase
    distinct: 3
    closed_set: true
    nullable: true
    sql_predicate: "applicant_category = '<canonical>'"
    prefer:
      critical: true
      text: >
        ALWAYS GROUP AND FILTER ON applicant_category, NEVER ON type_raw. type_raw holds
        the API's per-scheme string and the taxonomy is not shared: each scheme prefixes
        its own name, and the strings carry source defects preserved verbatim - a double
        space in "Prime Seed  unregistered", "Any Bussiness Venture", "Motorcarvan",
        and a capital I in "Sericulture and Weaving Spinning Individual". Grouping on
        type_raw splits one category into fifteen.
    derivation: >
      applicant_category is the last token of type_raw, lowercased. Verified across the
      whole source export: every one of the 8,436 rows reduces to one of three values.
    values:
    - canonical: "individual"
      applications: 8342
      share_pct: 98.9
      aliases: [individual, individuals, person, personal, single applicant, self,
                individual applicant, farmer, citizen]
    - canonical: "registered"
      applications: 83
      share_pct: 1.0
      aliases: [registered, registered body, registered society, registered group,
                registered organisation, registered organization, society, FPC,
                cooperative, co-operative, collective, SHG, registered entity]
      note: >
        Concentrated in two schemes - Agriculture Response Vehicle (30) and Warehouse
        (20). Warehouse is the ONLY scheme where registered outnumbers individual.
    - canonical: "unregistered"
      applications: 11
      share_pct: 0.1
      aliases: [unregistered, unregistered body, unregistered group, informal group,
                unregistered organisation, unregistered society]
      note: n=11 across the whole programme. Never quote a percentage from it.
    small_n_warning:
      critical: true
      text: >
        99% of applications are individual. Any breakdown isolating registered or
        unregistered rests on fewer than 100 rows programme-wide. Always show the count
        alongside the percentage.
    null_handling:
      rule: NULLABLE. Show as "not recorded"; never assume individual.

  data_verified:
    column: data_verified
    type: varchar(20)
    stored_case: Title Case as shown
    distinct: 4
    plus_null: true
    closed_set: true
    sql_predicate: "data_verified = '<canonical>'"
    authoritative:
      critical: true
      text: >
        THE ONLY STATUS FIELD ON THIS FACT WITH MEANINGFUL SPREAD, and the correct target
        for "on hold", "pending", "verified" and "valid". It records whether the
        APPLICATION'S OWN DATA was found valid - it is NOT a funding decision, an approval
        or a rejection.
    not_a_boolean:
      critical: true
      text: >
        Despite the name, this is a varchar with five states including NULL. Never write
        `WHERE data_verified` and never assume two values.
    values:
    - canonical: "Valid"
      applications: 6700
      share_pct: 79.4
      aliases: [valid, verified, ok, clean, data verified, passed, correct]
    - canonical: "On Hold"
      applications: 1199
      share_pct: 14.2
      aliases: [on hold, onhold, held, held up, paused, pending, awaiting, stuck,
                on-hold, in hold]
      note:
        critical: true
        text: >
          THIS IS WHERE "ON HOLD" RESOLVES, not the onhold boolean, which is FALSE on
          every row. Getting this wrong returns zero and looks correct. It is the single
          most likely wrong answer in this partition.
    - canonical: "Wrong"
      applications: 81
      share_pct: 1.0
      aliases: [wrong, incorrect, erroneous, bad data, wrong data]
    - canonical: "Invalid"
      applications: 67
      share_pct: 0.8
      aliases: [invalid, not valid, failed, rejected data, invalid data]
      note: >
        "Wrong" and "Invalid" are SEPARATE stored verdicts. Do not merge them without
        saying so, and do not read either as a scheme rejection.
    null_handling:
      rows: 389
      share_pct: 4.6
      rule: >
        NULL means no verdict was recorded. It is NOT "Valid". Show it as a separate
        "not recorded" bucket in any breakdown and keep it in totals.
    ordering: Valid -> On Hold -> Wrong -> Invalid -> not recorded.

  current_file_status:
    column: current_file_status
    type: varchar(30)
    distinct: 4
    closed_set: true
    sql_predicate: "LOWER(current_file_status) = LOWER('<canonical>')"
    near_constant:
      critical: true
      text: >
        98.4% of applications sit at 'forward'. This is not a distribution and should not
        be charted as one. More importantly, 'forward' means THE FILE MOVED TO THE NEXT
        STEP - it does NOT mean approved, sanctioned or funded. Never resolve "approved"
        to it.
    values:
    - canonical: "forward"
      applications: 8302
      share_pct: 98.4
      aliases: [forward, forwarded, moved on, sent forward, progressed]
    - canonical: "sendback to vdv/citizen"
      applications: 90
      share_pct: 1.1
      aliases: [sendback to vdv, sent back to citizen, returned to citizen,
                sendback to vdv/citizen, returned to applicant]
    - canonical: "resubmit"
      applications: 43
      share_pct: 0.5
      aliases: [resubmit, resubmitted, re-submitted, submitted again]
    - canonical: "sendback"
      applications: 1
      share_pct: 0.01
      aliases: [sendback, sent back, returned, send back]
    wording_collision:
      critical: true
      text: >
        'sendback' (1 row) and 'sendback to vdv/citizen' (90 rows) are two stored strings
        for a related idea, differing in case and wording. A user asking "how many were
        sent back" means both - 91 in total. Match with
        LOWER(current_file_status) LIKE 'sendback%'.
    scheme_concentration: >
      Only two schemes carry any non-Forward status: PRIME Tourism Vehicle (89 sent back,
      43 resubmitted) and Piggery (1 Sendback, 1 sendback to vdv/citizen). Everywhere
      else this column is constant.

  current_level:
    column: current_level
    type: varchar(30)
    distinct_stored: 4
    distinct_after_folding: 3
    sql_predicate: "LOWER(current_level) = '<canonical>'"
    case_collision:
      critical: true
      text: >
        'level1' (8,273 rows) and 'Level1' (45 rows) ARE THE SAME LEVEL stored two ways.
        Without LOWER() the same level appears twice in a breakdown. Always fold.
    no_ordering:
      critical: true
      text: >
        THE DATA DOES NOT ASSERT A PROGRESSION. level0 -> level1 -> level2 is a guess,
        and level0 co-occurs with 'sendback to vdv/citizen', which suggests it is not
        simply "earliest". Do not build a funnel, a stage chart or a progress metric from
        this column. List levels by frequency.
    values:
    - { canonical: "level1", applications: 8318, stored_as: [level1, Level1], aliases: [level 1, l1, first level, stage 1] }
    - { canonical: "level0", applications: 90,  stored_as: [level0], aliases: [level 0, l0, zero level, stage 0] }
    - { canonical: "level2", applications: 28,  stored_as: [Level2], aliases: [level 2, l2, second level, stage 2] }
    near_constant: 98.6% of applications are at level1 after folding.

  application_mode:
    column: application_mode
    type: varchar(30)
    distinct: 2
    closed_set: true
    stored_case: lowercase ('online' / 'cmconnectcenter'), despite the camelCase-looking source label
    sql_predicate: "application_mode = '<canonical>'"
    quality_note: >
      THE CLEANEST CATEGORICAL ON THIS FACT - two values, no case variants, no nulls
      observed. Genuinely worth offering as a breakdown.
    values:
    - canonical: "online"
      applications: 7643
      share_pct: 90.6
      aliases: [online, internet, web, self service, self-service, applied online,
                digital, portal]
    - canonical: "cmconnectcenter"
      applications: 793
      share_pct: 9.4
      aliases: [cm connect center, cm connect centre, connect center, connect centre,
                cmconnect, CM Connect, assisted, walk in, walk-in, offline, facilitation centre]
      note: >
        An ASSISTED WALK-IN CENTRE. Emit the stored camelCase form. Relabelling it
        "Offline" is acceptable only if the answer says so - it is not the stored value.
    scheme_variation:
      critical: true
      text: >
        Online share varies sharply by scheme - Dairy is 39.8% online against 70-100%
        everywhere else, and PRIME Small Enterprise is 99.2%. Never quote the programme
        figure of 90.6% for a single scheme.

  gender:
    column: "scheme_specific ->> 'gender_id'"
    physical_location: jsonb
    distinct: 3
    closed_set: true
    populated: every row in the source export
    sql_predicate: "scheme_specific ->> 'gender_id' = '<canonical>'"
    critical_note:
      critical: true
      text: >
        NOT A PROMOTED COLUMN. gender lives inside scheme_specific and must be read with
        ->>. Despite the source field being named gender_id IT HOLDS TEXT, not a code -
        there is no gender lookup table and none is needed.
        It is common to all 15 schemes, so this is the ONE scheme_specific read that does
        NOT require a scheme scope. Every other key does.
    values:
    - { canonical: "Female", applications: 5178, share_pct: 61.4, aliases: [female, women, woman, ladies, girls, f] }
    - { canonical: "Male",   applications: 3250, share_pct: 38.5, aliases: [male, men, man, gents, boys, m] }
    - { canonical: "Other",  applications: 8,    share_pct: 0.1,  aliases: [other, others, transgender, third gender] }
    scheme_variation:
      critical: true
      text: >
        THE PROGRAMME FIGURE HIDES THE FINDING. 61.4% female overall, but Sericulture
        100%, Piggery 74.3%, Poultry 66.0%, Agro Tourism Villa 66.7%, Dairy 57.8%,
        Goat 50.0%, Warehouse 39.5%, Any Business Venture 37.5%, Tourism Vehicle 19.9%,
        Agriculture Response Vehicle 14.7%, Green Taxi 0%. Never quote 61% for a single
        scheme. This is the most interesting fact in the dataset and the requirement
        workbook never asks for it.

  # =========================================================================
  # IDENTIFIERS
  # =========================================================================
  identifiers:
    request_id:
      column: request_id
      type: varchar(100)
      format: "REQ/<scheme>/<sub>/<date-like>/<sequence>, e.g. REQ/001/001/10102025/188877"
      distinct: 8400
      rows: 8436
      duplicates: 36
      duplicate_rows: 64
      unique: false
      unique_constraint_in_db: false
      aliases: [application number, application id, application no, request id,
                request number, reference number, file number, acknowledgement number]
      rule:
        critical: true
        text: >
          NOT UNIQUE and NOT unique-constrained in the database. 36 numbers appear more
          than once across 64 rows, ALL inside the Piggery scheme. Uniqueness was
          unverified at ingest and the loader collapses only exact full-row duplicates.
          Never treat it as a primary key, never assume LIMIT 1 is safe, and report both
          COUNT(*) and COUNT(DISTINCT request_id) when they differ.
      resolution: uppercase and strip spaces, then exact match. Do not fuzzy-match it.
      scheme_prefix:
        critical: true
        text: >
          SEGMENT 1 IS A STABLE PER-SCHEME CODE, verified 1:1 across all 15 schemes in
          the source export. An application number alone therefore identifies its scheme
          with no lookup - useful for validating a user's number and for saying which
          scheme they are asking about before any query runs.
        map:
          "001": "Meghalaya Piggery Development Scheme"
          "002": "Meghalaya Poultry Farming Scheme"
          "003": "Meghalaya Goat Farming Scheme"
          "004": "Meghalaya Dairy Development Scheme"
          "006": "Meghalaya Any Business Venture Scheme"
          "007": "Meghalaya Sports & Wellness Centre Scheme"
          "008": "Meghalaya Cinema Theatre Scheme"
          "010": "Meghalaya Warehouse Scheme"
          "011": "PRIME Agriculture Response Vehicle Scheme"
          "012": "Meghalaya Motorcaravan Scheme"
          "015": "Agro Tourism Villa Scheme"
          "017": "PRIME Tourism Vehicle Scheme"
          "018": "Meghalaya Sericulture & Weaving Scheme"
          "232": "Chief Minister's Green Taxi Scheme"
          "233": "PRIME Small Enterprise Empowerment and Development (SEED)"
        caution: >
          Use it to VALIDATE and to route, not as a substitute for cm_scheme_key in SQL.
          Filter on scheme_name or cm_scheme_key; the prefix is a resolver convenience.
      embedded_date:
        critical: true
        text: >
          SEGMENT 4 LOOKS LIKE A DATE AND IS NOT USABLE. Unpadded, 6 to 8 digits, so
          1032026 is validly 1-Mar-2026 or 10-Mar-2026. A naive parse resolved only
          3,038 of 8,436 source rows and produced dates after the export date. NEVER
          parse it in generated SQL and never offer it as a time dimension.
      format_confusion:
        critical: true
        text: >
          The requirement workbook uses a DIFFERENT identifier format - MPDSI018599,
          PTVSI000078, MEWSI... - and ED-004 tells the bot to validate those prefixes.
          Those belong to a different extract. Every CM Elevate application number in
          megh_db begins "REQ/". If a user supplies an MPDSI/PTVSI-style number, say the
          format is not the one held here rather than returning a plain not-found.

    cm_elevate_fact_id:
      column: cm_elevate_fact_id
      type: bigint
      unique: true
      role: the primary key of curated.fact_cm_elevate_application and curated.v_cm_elevate
      aliases: [record id, row id, fact id]
      rule: identifier only - never SUM or AVG.
      unstable: >
        Surrogate, regenerated on every reload. Never export it or quote it back to a
        user as a durable reference.

    cm_scheme_key:
      column: cm_scheme_key
      type: smallint
      role: FK to curated.dim_cm_elevate_scheme - the column that separates the 15 schemes
      aliases: [scheme key, sub-scheme key]
      rule: >
        Identifier only. Prefer scheme_name for display and for user-facing filters. Use
        the key when scoping a scheme_specific JSONB read.

    endpoint:
      column: endpoint
      type: varchar(80)
      unique: true
      role: >
        The API endpoint each scheme's applications were ingested from, and the
        source_dataset value in raw.source_rows and staging.quarantine. It is what
        meta.v_reconciliation_cm_elevate reports one row per.
      rule: Internal identity. Prefer scheme_name in any user-facing answer.

    village_code:
      column: village_code
      type: integer
      role: the LGD national village identifier, denormalised onto every row
      aliases: [village code, LGD village code, LGD code]
      rule: >
        Identifier only - never SUM or AVG. It is the correct key for counting villages
        and for anything leaving the database. The source delivers it as a float
        (277617.0); cast with int() before comparing.

    geography_key:
      column: geography_key
      type: integer
      role: surrogate key into dim_geography
      rule: >
        Identifier only. NOT stable across a reload - use village_code for exports and
        cross-scheme joins.

    citizen_name:
      status: STRIPPED_AT_INGEST
      column: null
      aliases: [applicant name, beneficiary name, name, citizen name, person, who]
      rule:
        critical: true
        text: >
          NOT in the curated layer. Stripped by the loader along with epic_id,
          mobile_number, pan_number and every bank_account field. There is no join that
          recovers them. A question naming a person, or asking who an applicant is, must
          return "not held in this data". Never substitute request_id for a name and
          never build an applicant-lookup feature against this schema.
      resolver_behaviour: >
        Classify the span as entity_type: person_name and emit not_found with the reason
        "personal names are not held in the curated layer" - not a did-you-mean list.

    member_id:
      status: RETAINED_IN_JSONB_BUT_FORBIDDEN
      column: "scheme_specific ->> 'member_id'"
      rule:
        critical: true
        text: >
          This one DID survive, because the loader's strip list does not cover it - as
          did dob, email_id, address, family_id, pds_id, account_holder_name and
          ifsc_code. They are queryable and must never be resolved, surfaced, exported or
          embedded. Refuse and offer the same question as a group total.

# ---------------------------------------------------------------------------
# MEASURE VOCABULARY - user phrasing to column. stage2 owns aggregation semantics.
# ---------------------------------------------------------------------------
measure_vocabulary:
  note:
    critical: true
    text: >
      THIS SECTION IS DELIBERATELY TINY. PMAY's resolver maps a dozen money and count
      phrasings to columns. CM Elevate has exactly ONE aggregate - a count - because the
      fact carries no numeric measure at all. Everything money-shaped resolves through
      absent_dimensions.money to not_available.

  application_count:
    column: null
    aggregate: "COUNT(*)"
    aliases: [applications, how many, number of, count, total, applicants, beneficiaries,
              records, farmers, people, cases, requests, files]
    rule: >
      The default and only measure. Say "applications" in the answer - an application is
      a REQUEST, not an award, and nothing here confirms anyone received anything.

  distinct_application_count:
    column: request_id
    aggregate: "COUNT(DISTINCT request_id)"
    aliases: [distinct applications, unique applications, distinct application numbers,
              unique requests]
    rule: >
      Use only when the user explicitly says distinct or unique. request_id is not
      unique, so this is genuinely a different number - about 8,400 against 8,436 rows.

  distinct_village_count:
    column: village_code
    aggregate: "COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved')"
    aliases: [villages, how many villages, village count, villages covered, coverage]
    rule: Never count villages by name - 36 names map to more than one code.

  distinct_block_count:
    column: lgd_block
    aggregate: "COUNT(DISTINCT lgd_block)"
    aliases: [blocks, how many blocks, block count, blocks covered]
    rule: >
      58 blocks, of which 44 are rural C&RD blocks and 10 are urban Municipal Boards or
      Town Committees. Say so, or offer the split.

  distinct_district_count:
    column: lgd_district
    aggregate: "COUNT(DISTINCT lgd_district)"
    aliases: [districts, how many districts, district count, districts covered]
    rule: All 12 at programme level, but eight individual schemes reach fewer.

  distinct_scheme_count:
    column: cm_scheme_key
    aggregate: "COUNT(*) FROM curated.dim_cm_elevate_scheme"
    aliases: [schemes, how many schemes, sub-schemes, number of schemes]
    rule:
      critical: true
      text: >
        FIFTEEN. Read it from dim_cm_elevate_scheme, not from a DISTINCT over the fact -
        a scheme with no applications would be invisible in the fact. The requirement
        workbook's 13 is wrong for this database.

  share_of_applications:
    aggregate: "COUNT(*) * 100.0 / SUM(COUNT(*)) OVER ()"
    aliases: [share, percentage, proportion, percent, what share, how much of]
    rule: >
      Round to one decimal. Below about 15 applications show the count instead - six
      schemes are that small and one record moves them by 7 to 50 points.

# ---------------------------------------------------------------------------
region_groupings:
  note:
    critical: true
    text: >
      THERE IS NO REGION COLUMN in dim_geography. These are the resolver's own groupings.
      Expand into an IN list and STATE in the answer that the grouping was applied here,
      not read from the data.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      applications: 3198
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      applications: 2257
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      applications: 389
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      applications: 2592
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group. Both
        readings produce the same filter, so no clarification is needed. Do not fold it
        into Khasi Hills. Note it is the LARGEST single unit in the programme, larger
        than the whole of Khasi Hills.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.
    caution: >
      "Meghalaya" is also the first word of ten scheme names. Classify the span as
      cm_scheme before treating it as a whole-state marker.

# ---------------------------------------------------------------------------
scheme_groupings:
  note:
    critical: true
    text: >
      NO PMAY COUNTERPART, and NO SECTOR COLUMN EXISTS. Like region_groupings these are
      the resolver's constructions. Expand into an IN list over scheme_name and say the
      grouping was applied here. A user asking about "livestock schemes" is asking a
      question the database cannot answer directly.
  groups:
    "livestock":
      schemes: ["Meghalaya Piggery Development Scheme", "Meghalaya Poultry Farming Scheme",
                "Meghalaya Goat Farming Scheme", "Meghalaya Dairy Development Scheme"]
      applications: 3862
      aliases: [livestock, animal husbandry, animal rearing, farming schemes, cattle schemes]
    "vehicles":
      schemes: ["PRIME Tourism Vehicle Scheme", "PRIME Agriculture Response Vehicle Scheme",
                "Chief Minister's Green Taxi Scheme", "Meghalaya Motorcaravan Scheme"]
      applications: 754
      aliases: [vehicle schemes, transport, transport schemes, vehicles]
    "tourism":
      schemes: ["PRIME Tourism Vehicle Scheme", "Agro Tourism Villa Scheme"]
      applications: 406
      aliases: [tourism schemes, tourist schemes, hospitality]
      note: Overlaps the vehicles group - PRIME Tourism Vehicle is in both. Never sum the two groups.
    "PRIME":
      schemes: ["PRIME Small Enterprise Empowerment and Development (SEED)",
                "PRIME Tourism Vehicle Scheme", "PRIME Agriculture Response Vehicle Scheme"]
      applications: 4363
      aliases: [PRIME, PRIME schemes, PRIME family, prime programme]
      note: >
        A real naming family, and the only grouping with any textual basis in the data.
        Still not a stored attribute.
    "enterprise":
      schemes: ["PRIME Small Enterprise Empowerment and Development (SEED)",
                "Meghalaya Any Business Venture Scheme", "Meghalaya Warehouse Scheme",
                "Meghalaya Cinema Theatre Scheme", "Meghalaya Sports & Wellness Centre Scheme"]
      applications: 3803
      aliases: [enterprise, business schemes, business, commercial schemes]
  overlap_warning:
    critical: true
    text: >
      THESE GROUPS OVERLAP. PRIME Tourism Vehicle belongs to vehicles, tourism and PRIME.
      Never sum two groups together - the total will double-count. If a user asks for two
      groups, return them separately and say they overlap.

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many CM Elevate applications"
  resolve:
  - { text: "how many applications", type: measure, canonical: "COUNT(*)" }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cm_elevate;"
  expected: ~8436 in the source export; unverified_in_db
  note: Say "applications", not "beneficiaries". An application is a request, not an award.

- user: "how many piggery applications"
  resolve:
  - { text: piggery, type: cm_scheme, canonical: "Meghalaya Piggery Development Scheme",
      matched_by: 5_contains }
  sql: "SELECT COUNT(*) FROM curated.v_cm_elevate WHERE scheme_name = 'Meghalaya Piggery Development Scheme';"
  expected: 2982
  note: >
    "piggery" is a whole-word substring of exactly one scheme name, so stage 5 resolves
    it cleanly. The requirement workbook's 1,357 is from a different extract.

- user: "applications in EGH"
  resolve:
  - { text: EGH, type: district, canonical: "East Garo Hills", lgd_code: 273, matched_by: 4_acronym }
  sql: "SELECT COUNT(*) FROM curated.v_cm_elevate WHERE lgd_district = 'EAST GARO HILLS';"
  expected: 607
  note: District is stored UPPERCASE in dim_geography - emit the uppercase literal.

- user: "how many in Ri-Bhoi"
  resolve:
  - { text: "Ri-Bhoi", type: district, canonical: "Ri Bhoi", lgd_code: 276, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FROM curated.v_cm_elevate WHERE lgd_district = 'RI BHOI';"
  expected: 2592
  note: >
    Three spellings in play - the source's "Ri-Bhoi", the workbook's "Ri Bhoi", the
    roster's "RI BHOI". All resolve to the stored form.

- user: "how many applications are on hold"
  resolve:
  - { text: "on hold", type: data_verified, canonical: "On Hold", matched_by: 2_alias }
  sql: "SELECT COUNT(*) FROM curated.v_cm_elevate WHERE data_verified = 'On Hold';"
  expected: 1199
  note:
    critical: true
    text: >
      THE MOST IMPORTANT EXAMPLE IN THIS FILE. There is also a boolean column named
      onhold and it is FALSE on every row. Resolving "on hold" to it returns 0 and looks
      correct. Always route to data_verified.

- user: "how many withdrew"
  resolve:
  - { text: withdrew, type: workflow_flag, canonical: is_withdraw }
  sql: "SELECT COUNT(*) FILTER (WHERE is_withdraw IS TRUE) AS withdrawn, COUNT(*) AS total FROM curated.v_cm_elevate;"
  expected: 0 withdrawn of ~8436
  note: >
    Answer zero AND say the flag is unpopulated on every record, so the zero reads as a
    data gap rather than as applicant behaviour.

- user: "gender split of applicants"
  resolve:
  - { text: gender, type: gender, canonical: "scheme_specific ->> 'gender_id'" }
  sql: |
    SELECT scheme_specific ->> 'gender_id' AS gender, COUNT(*) AS applications
    FROM curated.v_cm_elevate GROUP BY 1 ORDER BY applications DESC;
  expected: "Female 5178, Male 3250, Other 8"
  note: >
    gender is not a promoted column - it is read from JSONB. It is the one
    scheme_specific key common to all 15 schemes, so this read needs no scheme scope.

- user: "gender split for the tourism vehicle scheme"
  resolve:
  - { text: "tourism vehicle", type: cm_scheme, canonical: "PRIME Tourism Vehicle Scheme" }
  - { text: gender, type: gender, canonical: "scheme_specific ->> 'gender_id'" }
  sql: |
    SELECT scheme_specific ->> 'gender_id' AS gender, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name = 'PRIME Tourism Vehicle Scheme'
    GROUP BY 1 ORDER BY applications DESC;
  expected: about 19.9% female
  note:
    critical: true
    text: >
      NEVER quote the programme's 61% female for a single scheme. This one is 19.9% and
      Green Taxi is 0%. The scheme-level figure is the answer; the programme figure is a
      different question.

- user: "how many villages does CM Elevate reach"
  resolve:
  - { text: villages, type: measure, canonical: "COUNT(DISTINCT village_code)" }
  sql: |
    SELECT COUNT(DISTINCT village_code) AS villages
    FROM curated.v_cm_elevate WHERE entity_type <> 'Unresolved';
  expected: about 2038 codes in the source export, less any Unresolved placeholders
  note: >
    Two rules fire together - count by code because 36 names map to several codes, and
    exclude Unresolved because it is not a village. The workbook's 1,153 is a different
    extract.

- user: "which scheme is biggest"
  resolve:
  - { text: biggest, type: overloaded, reading: most applications }
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate GROUP BY 1 ORDER BY applications DESC LIMIT 1;
  expected: "PRIME Small Enterprise Empowerment and Development (SEED), 3621"
  note: >
    The requirement workbook offers a choice between "by beneficiaries" and "by rupees
    disbursed". Only the first exists. Do not ask a question whose second option is
    unanswerable.

- user: "the vehicle scheme"
  resolve:
  - { text: "the vehicle scheme", type: cm_scheme, status: ambiguous,
      candidates: ["PRIME Tourism Vehicle Scheme", "PRIME Agriculture Response Vehicle Scheme",
                   "Chief Minister's Green Taxi Scheme", "Meghalaya Motorcaravan Scheme"] }
  sql: null
  note: >
    Four schemes involve vehicles, ranging from 403 applications to 2. Ask. This is a
    blocked_matches pair - never let fuzzy pick one.

- user: "look up REQ/001/001/10102025/188877"
  resolve:
  - { text: "REQ/001/001/10102025/188877", type: application_number, canonical: "REQ/001/001/10102025/188877",
      scheme_from_prefix: "Meghalaya Piggery Development Scheme" }
  sql: |
    SELECT request_id, scheme_name, lgd_district, lgd_block, lgd_village_name,
           applicant_category, current_file_status, data_verified
    FROM curated.v_cm_elevate WHERE request_id = 'REQ/001/001/10102025/188877' LIMIT 10;
  note: >
    Segment 1 = 001 identifies Piggery before the query runs. The LIMIT is 10, not 1 -
    request_id is not unique.

- user: "look up MPDSI018599"
  resolve:
  - { text: MPDSI018599, type: application_number, status: not_found,
      reason: "format belongs to a different extract" }
  sql: null
  note: >
    From requirement workbook UC-042. CM Elevate numbers in megh_db all begin "REQ/".
    Say the format is not the one held here rather than returning a bare not-found.

- user: "how much was disbursed under the warehouse scheme"
  resolve:
  - { text: warehouse, type: cm_scheme, canonical: "Meghalaya Warehouse Scheme" }
  - { text: disbursed, type: measure, status: not_available, reason: no money column exists }
  sql: null
  note:
    critical: true
    text: >
      Resolve the scheme, then REFUSE the measure. Do not answer with the application
      count of 38 - that is a different question and must be offered as one, relabelled.
      The workbook claims Rs 22.62 Cr for this scheme; no amount is held in this database.

- user: "show the application trend by month"
  resolve:
  - { text: "by month", type: time, status: not_available, reason: no date column exists }
  sql: null
  note: >
    Do not fall back to ingested_at and do not parse request_id. Offer a breakdown by
    scheme or district instead.

- user: "applications by scheme in Ri Bhoi"
  resolve:
  - { text: "Ri Bhoi", type: district, canonical: "Ri Bhoi" }
  - { text: "by scheme", type: measure, canonical: "COUNT(*) GROUP BY scheme_name" }
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate WHERE lgd_district = 'RI BHOI'
    GROUP BY 1 ORDER BY applications DESC;
  expected: 13 schemes present in Ri Bhoi, led by Piggery with about 1,955
  note: Two of the 15 schemes have no applications in Ri Bhoi - show them as zero or say so.

- user: "how many registered bodies applied"
  resolve:
  - { text: "registered bodies", type: applicant_category, canonical: registered }
  sql: |
    SELECT COUNT(*) AS applications FROM curated.v_cm_elevate
    WHERE applicant_category = 'registered';
  expected: 83
  note: >
    n=83 across the whole programme, concentrated in Agriculture Response Vehicle (30)
    and Warehouse (20). Show the count with any percentage.

- user: "how many applied through connect centres"
  resolve:
  - { text: "connect centres", type: application_mode, canonical: cmconnectcenter, matched_by: 2_alias }
  sql: |
    SELECT COUNT(*) AS applications FROM curated.v_cm_elevate
    WHERE application_mode = 'cmconnectcenter';
  expected: 793
  note: Emit the stored camelCase form. It is an assisted walk-in centre, not "offline".

- user: "sericulture by district"
  resolve:
  - { text: sericulture, type: cm_scheme, canonical: "Meghalaya Sericulture & Weaving Scheme" }
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name = 'Meghalaya Sericulture & Weaving Scheme'
    GROUP BY 1 ORDER BY applications DESC;
  expected: one row - Ri Bhoi, 14
  note: >
    Single-district scheme. Say so rather than presenting one row as a geographic
    comparison. It is also held as ONE scheme, not split into Spinning and Weaving.

- user: "how many schemes are under CM Elevate"
  resolve:
  - { text: "how many schemes", type: measure, canonical: "COUNT(*) FROM dim_cm_elevate_scheme" }
  sql: "SELECT COUNT(*) AS schemes FROM curated.dim_cm_elevate_scheme;"
  expected: 15
  note: >
    Read the dimension, not a DISTINCT over the fact. If the user says 13, correct them -
    that figure comes from the requirement workbook.

- user: "common facility center applications"
  resolve:
  - { text: "common facility center", type: cm_scheme, status: not_found,
      suggestions: ["Meghalaya Sports & Wellness Centre Scheme", "Meghalaya Warehouse Scheme",
                    "PRIME Small Enterprise Empowerment and Development (SEED)"] }
  sql: null
  note:
    critical: true
    text: >
      From workbook UC-083. This scheme does not exist in megh_db. Return not_found with
      real scheme names as candidates - and do NOT let fuzzy resolve it to "Sports and
      Wellness Centre", which is the nearest string and a completely different scheme.

- user: "which villages have CM Elevate but no PMAY"
  resolve:
  - { text: "CM Elevate", type: cm_scheme, canonical: all }
  - { text: PMAY, type: cross_scheme, canonical: v_cross_scheme_village_coverage }
  sql: |
    WITH cm AS (
      SELECT village_code, COUNT(*) AS cm_applications
      FROM curated.v_cm_elevate WHERE entity_type <> 'Unresolved' GROUP BY 1
    )
    SELECT cm.village_code, c.lgd_district, cm.cm_applications, c.pmay_houses
    FROM cm LEFT JOIN curated.v_cross_scheme_village_coverage c USING (village_code)
    WHERE COALESCE(c.pmay_houses, 0) = 0
    ORDER BY cm.cm_applications DESC;
  note: >
    CM Elevate has no column in the coverage view, so aggregate first and join the
    aggregate. The view COALESCEs to 0, so the test is = 0, never IS NULL.

# ---------------------------------------------------------------------------
maintenance:
  source_files:
  - datasets/Cmelevate/CM_Elevate_AllSchemes_20260818_122217.xlsx   # 15 sheets + Summary, 8436 rows
  - datasets/Cmelevate/Megh One AI - CM Elevate NLP Use Cases.xlsx  # 89 use cases - DIFFERENT DATASET
  schema_authority: SCHEMA_FOR_DEVELOPERS.md   # live database extract, 2026-09-04
  row_counts_at_generation:
    source_export: 8436
    curated.v_cm_elevate: unverified_in_db   # ~8543 by reltuples estimate
  data_span_in_source: none - CM Elevate carries no date
  last_generated: '2026-09-04'

  open_verification_tasks:
    critical: true
    note: >
      This file was written from the source export plus the live schema. The VALUE
      catalogues have not been read back from megh_db. Each item is a query to run
      before any CM Elevate answer ships.
    tasks:
    - "Row count: SELECT COUNT(*) FROM curated.v_cm_elevate - reconcile 8,436 against ~8,543."
    - "cm_scheme_key values: SELECT cm_scheme_key, scheme_name, endpoint FROM curated.dim_cm_elevate_scheme ORDER BY 1. This file lists scheme names only; the keys are unread."
    - "BLOCK CANONICAL FORMS - the highest-risk item. SELECT DISTINCT lgd_block FROM curated.v_cm_elevate. The 58 canonical values here are the source forms with 'C & RD Block' stripped; the roster forms are expected to be uppercase and may differ further."
    - "Geography casing: confirm lgd_district and lgd_block are stored UPPERCASE and lgd_village_name is not."
    - "Unresolved placeholders: SELECT COUNT(*) FROM curated.v_cm_elevate WHERE entity_type = 'Unresolved', and how many distinct village_codes they carry."
    - "request_id duplicates: confirm 36 duplicates survived the loader's full-row dedupe."
    - "applicant_category: SELECT DISTINCT applicant_category - confirm the three values and that the loader derives them as this file assumes."
    - "data_verified: SELECT data_verified, COUNT(*) - confirm the five states including NULL."
    - "onhold and is_withdraw: confirm both are still FALSE on every row, and whether any NULLs exist."
    - "scheme_specific keys: SELECT DISTINCT jsonb_object_keys(scheme_specific) per cm_scheme_key - build the key manifest this file does not have."
    - "gender_id: confirm it is present in scheme_specific for all 15 schemes."
    - "PII: confirm whether dob, email_id, address, member_id, family_id, pds_id, account_holder_name and ifsc_code really did survive into scheme_specific. If so, escalate - the strip list is incomplete."
    - "request_id scheme prefix: confirm the 15 prefixes below are still 1:1 after any reload."

  regeneration_rules:
  - Re-profile the export AND re-query megh_db. Diff every count here. Explain each change.
  - APPEND new canonical values and aliases. Never delete one - old questions must keep resolving.
  - "Re-run the village ambiguity registry. If a name gains a code it must appear here."
  - "Re-check the block canonical forms against dim_geography. This is the weakest part of the file."
  - "Re-check the request_id scheme-prefix map. It is a measured regularity, not a documented contract, and the API could change it."
  - "Watch applicant_types_seen on dim_cm_elevate_scheme - it is an observation dated 2026-09-03 and will drift."
  - "If a disbursement dataset is ever loaded, absent_dimensions.money must be rewritten, not merely edited - most of this file's refusals depend on it."
  - Bump resolver_version.

  known_conflicts:
    critical: true
    text: >
      The requirement workbook describes a different dataset - 2,847 applications, 13
      schemes, 1,153 villages, 57 blocks, four rupee measures, Bank/LIFCOM channels,
      subsidy tranches, desanctioned and refused flags, Month/Year columns, and
      MPDSI/PTVSI identifiers. It also names a Common Facility Center scheme that does
      not exist here and omits PRIME Small Enterprise Empowerment, the largest scheme in
      the real data. 40 of its 89 use cases are unanswerable from megh_db. See
      Annotations/CMElevate/README.md section 5.

  companion_files:
  - Annotations/CMElevate/cmelevate_schema_partitions.yaml
  - Annotations/CMElevate/cmelevate_classification_rules.yaml
  - Annotations/CMElevate/cmelevate_default_rules.yaml
  - Annotations/CMElevate/README.md
  - SCHEMA_FOR_DEVELOPERS.md
