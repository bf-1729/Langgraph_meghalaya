    SELECT COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE lgd_district = 'RI BHOI';
  tables:
  - curated.v_cm_elevate
  note: >
    Three spellings are in circulation - the source export's 'Ri-Bhoi', the requirement
    workbook's 'Ri Bhoi', and the roster's 'RI BHOI'. All resolve to the stored form.

- question: How many applications are in West Garo Hills?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE lgd_district = 'WEST GARO HILLS';
  tables:
  - curated.v_cm_elevate

- question: Top 5 districts by applications
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY applications DESC
    LIMIT 5;
  tables:
  - curated.v_cm_elevate

- question: What share of applications is in each district?
  sql: |
