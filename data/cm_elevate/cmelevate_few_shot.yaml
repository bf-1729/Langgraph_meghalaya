- question: Compare Piggery and Poultry
  sql: |
    SELECT scheme_name,
           COUNT(*) AS applications,
           COUNT(DISTINCT lgd_district) AS districts,
           COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved') AS villages
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('Meghalaya Piggery Development Scheme',
                          'Meghalaya Poultry Farming Scheme')
    GROUP BY scheme_name;
  tables:
  - curated.v_cm_elevate
  note: Two named schemes returned side by side, never silently merged.

- question: Compare applicant counts for Piggery and Poultry across Ri Bhoi and East Khasi Hills
  sql: |
    SELECT scheme_name, lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('Meghalaya Piggery Development Scheme',
                          'Meghalaya Poultry Farming Scheme')
      AND lgd_district IN ('RI BHOI', 'EAST KHASI HILLS')
    GROUP BY scheme_name, lgd_district
    ORDER BY scheme_name, lgd_district;
  tables:
  - curated.v_cm_elevate
  note: >
    Two schemes AND two districts named together is one GROUP BY scheme_name,
    lgd_district — four cells, not two separate single-scheme or single-district
    queries. State all four counts and, if useful, which district leads for each
    scheme.

- question: How many applicants are there in Umling block under Piggery, Poultry and Dairy?
  sql: |
    SELECT scheme_name,
           COUNT(DISTINCT request_id) AS applicants
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('Meghalaya Piggery Development Scheme',
                          'Meghalaya Poultry Farming Scheme',
                          'Meghalaya Dairy Development Scheme')
      AND lgd_block = 'UMLING'
    GROUP BY scheme_name
    ORDER BY scheme_name;
  tables:
  - curated.v_cm_elevate
  note: >
    THREE (OR MORE) NAMED SCHEMES IN ONE "how many applicants" QUESTION IS STILL
    A GROUP BY, never a single merged COUNT(*) with no breakdown — the same rule
    as the two-scheme case above, it does not relax as more schemes are listed.
    State each scheme's own applicant count AND the combined total across all
    three (confirmed live 2026-09-13: "Piggery, Poultry and Dairy" collapsed to
    one bare `COUNT(*) ... WHERE scheme_name IN (...)` with no GROUP BY at all,
    losing the per-scheme breakdown the question needs and also using COUNT(*)
    instead of COUNT(DISTINCT request_id) for "applicants"). Naming three or
    four schemes by comma list ("A, B and C") is exactly the same shape as
    naming two with "and" — resolve every named scheme into the IN-list and
    GROUP BY scheme_name regardless of how many are named.

- question: Compare the three PRIME schemes
  sql: |
    SELECT scheme_name,
           COUNT(*) AS applications,
           COUNT(DISTINCT lgd_district) AS districts
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('PRIME Small Enterprise Empowerment and Development (SEED)',
                          'PRIME Tourism Vehicle Scheme',
                          'PRIME Agriculture Response Vehicle Scheme')
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    PRIME is a naming family, not a stored attribute. Say that the grouping was applied
    by the resolver.

- question: How many applications are under the livestock schemes?
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('Meghalaya Piggery Development Scheme',
                          'Meghalaya Poultry Farming Scheme',
                          'Meghalaya Goat Farming Scheme',
                          'Meghalaya Dairy Development Scheme')
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    THERE IS NO SECTOR COLUMN. 'Livestock' is the resolver's grouping and must be declared
    as such in the answer.

- question: How many applications are under the vehicle schemes?
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name IN ('PRIME Tourism Vehicle Scheme',
                          'PRIME Agriculture Response Vehicle Scheme',
                          'Chief Minister's Green Taxi Scheme',
                          'Meghalaya Motorcaravan Scheme')
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    Resolver grouping, and it OVERLAPS the tourism grouping - PRIME Tourism Vehicle is in
    both. Never sum two groupings together.

- question: How many schemes operate in each district?
  sql: |
    SELECT lgd_district, COUNT(DISTINCT cm_scheme_key) AS schemes
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY schemes DESC;
  tables:
  - curated.v_cm_elevate

- question: Which schemes are not statewide?
  sql: |
    SELECT scheme_name, COUNT(DISTINCT lgd_district) AS districts
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    HAVING COUNT(DISTINCT lgd_district) < 12
    ORDER BY districts ASC;
  tables:
  - curated.v_cm_elevate
  note: >
    Eight of the 15 schemes reach fewer than all 12 districts. Sericulture and
    Motorcaravan reach one each, so a district breakdown for them returns a single row.

