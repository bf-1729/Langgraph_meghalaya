- question: How many applications came from urban wards?
  sql: |
    SELECT COUNT(*) AS applications,
           COUNT(DISTINCT village_code) AS wards
    FROM curated.v_cm_elevate
    WHERE entity_type = 'Ward';
  tables:
  - curated.v_cm_elevate
  note: >
    Unlike PMAY-G, which is rural-only, CM Elevate reaches urban wards. These are REAL
    localities - do not confuse them with entity_type = 'Unresolved'.

- question: Applications by region
  sql: |
    SELECT CASE
             WHEN lgd_district IN ('EAST GARO HILLS','NORTH GARO HILLS','SOUTH GARO HILLS',
                                   'SOUTH WEST GARO HILLS','WEST GARO HILLS') THEN 'Garo Hills'
             WHEN lgd_district IN ('EAST KHASI HILLS','EASTERN WEST KHASI HILLS',
                                   'SOUTH WEST KHASI HILLS','WEST KHASI HILLS') THEN 'Khasi Hills'
             WHEN lgd_district IN ('EAST JAINTIA HILLS','WEST JAINTIA HILLS') THEN 'Jaintia Hills'
             WHEN lgd_district = 'RI BHOI' THEN 'Ri Bhoi'
           END AS region,
           COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY region
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    THERE IS NO REGION COLUMN. This CASE is the resolver's grouping and the answer must
    say so. Ri Bhoi is its own group and is never folded into Khasi Hills.

- question: Which district has the widest scheme coverage?
  sql: |
    SELECT lgd_district,
           COUNT(DISTINCT cm_scheme_key) AS schemes,
           COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY schemes DESC, applications DESC
    LIMIT 1;
  tables:
  - curated.v_cm_elevate

# ---------------------------------------------------------------------------
# SCHEME x GEOGRAPHY
# ---------------------------------------------------------------------------
- question: Cross-tab districts by scheme
  sql: |
    SELECT lgd_district, scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district, scheme_name
    ORDER BY lgd_district, applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    The full grid is 12 x 15 = 180 cells and most are empty or very small. Restrict to
    the larger schemes or chart it.

- question: Applications by scheme in Ri Bhoi
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE lgd_district = 'RI BHOI'
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate

- question: Which districts does the Warehouse scheme reach?
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name = 'Meghalaya Warehouse Scheme'
    GROUP BY lgd_district
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: Reaches 9 districts, not 12 - say so rather than implying statewide coverage.

- question: Show Sericulture by district
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name = 'Meghalaya Sericulture & Weaving Scheme'
    GROUP BY lgd_district
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    Returns ONE row - Sericulture is a single-district scheme. Present it as a fact, not
    as a geographic comparison.

- question: Which scheme dominates each district?
  sql: |
    SELECT DISTINCT ON (lgd_district)
           lgd_district, scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district, scheme_name
    ORDER BY lgd_district, applications DESC;
  tables:
  - curated.v_cm_elevate

- question: Show every district for a scheme, including districts with none
  sql: |
    WITH d AS (SELECT DISTINCT lgd_district FROM curated.v_cm_elevate),
         s AS (
           SELECT lgd_district, COUNT(*) AS applications
           FROM curated.v_cm_elevate
           WHERE scheme_name = 'Meghalaya Warehouse Scheme'
           GROUP BY lgd_district
         )
    SELECT d.lgd_district, COALESCE(s.applications, 0) AS applications
    FROM d LEFT JOIN s USING (lgd_district)
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    A missing row and a zero row read very differently when eight of 15 schemes are not
    statewide. Show the zeros.

- question: Compare East Khasi Hills and West Garo Hills
  sql: |
    SELECT lgd_district,
           COUNT(*) AS applications,
           COUNT(DISTINCT cm_scheme_key) AS schemes,
           COUNT(DISTINCT lgd_block) AS blocks,
           COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved') AS villages
    FROM curated.v_cm_elevate
    WHERE lgd_district IN ('EAST KHASI HILLS','WEST GARO HILLS')
    GROUP BY lgd_district;
  tables:
  - curated.v_cm_elevate
  note: >
    The requirement workbook's version of this compares rupees disbursed. That column
    does not exist - compare counts and coverage instead.

- question: Which blocks have the Piggery scheme?
  sql: |
    SELECT lgd_district, lgd_block, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE scheme_name = 'Meghalaya Piggery Development Scheme'
    GROUP BY lgd_district, lgd_block
    ORDER BY applications DESC
    LIMIT 20;
  tables:
  - curated.v_cm_elevate

# ---------------------------------------------------------------------------
# APPLICANT CATEGORY
