  - curated.v_cm_elevate

- question: Which district has the fewest applications?
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY applications ASC
    LIMIT 1;
  tables:
  - curated.v_cm_elevate

