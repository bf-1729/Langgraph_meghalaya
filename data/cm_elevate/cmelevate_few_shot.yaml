# cmelevate_few_shot.yaml
#
# Validated question-to-SQL pairs for CM Elevate - node 5.10.
#
# ===========================================================================
# v1.0 - 2026-09-04 - FIRST VERSION, WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# There is no flat-table predecessor, so nothing here is a retarget. Every
# example runs against curated.v_cm_elevate unless it needs the scheme
# dimension, the fact table's GIN index, or the reconciliation view.
#
# House rules encoded in every example below:
#   FROM curated.v_cm_elevate       the primary query surface; both its joins are
#                                   INNER on NOT NULL keys, so no rows are lost
#   COUNT(*) ONLY                   there is NO measure column. If an example
#                                   contains SUM or AVG over a v_cm_elevate
#                                   column, it is WRONG
#   applicants -> DISTINCT          "applicants"/"beneficiaries" = distinct people,
#                                   COUNT(DISTINCT request_id) - request_id repeats on
#                                   ~36 rows (all Piggery), so COUNT(*) overcounts them.
#                                   "applications"/"requests" = the raw row count,
#                                   COUNT(*), unchanged. (2026-09-13 policy change)
#   NO DATE ANYTHING                no year, month, date_trunc, BETWEEN on a date,
#                                   no ingested_at, no request_id parsing
#   entity_type <> 'Unresolved'     on VILLAGE counts and lists only - never on
#                                   district, block or scheme totals
#   data_verified = 'On Hold'       never the onhold boolean, which is FALSE on
#                                   every row and returns zero looking correct
#   LOWER(current_level)            'level1' and 'Level1' are the same level
#   LOWER(current_file_status)      'sendback' and 'sendback to vdv/citizen' both
#   applicant_category              never type_raw - the raw taxonomy is per-scheme
#   scheme_name / cm_scheme_key     15 schemes; read the list from the dimension
#   lgd_district / lgd_block        UPPERCASE literals - dim_geography stores them so
#   village_code                    for counting villages, never a name
#   scheme_specific ->> 'key'       ALWAYS scoped to one scheme, except gender_id
#
# Examples marked status: UNANSWERABLE carry sql: null. They are NEGATIVE
# examples: the question is asked often - 40 of the 89 use cases in the
# requirement workbook are of this kind - and the data cannot answer it. They
# are here so the generator refuses instead of improvising, and never answers a
# money question with an application count.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db. They are correct
# against the structure in SCHEMA_FOR_DEVELOPERS.md (2026-09-04) and unverified
# against the data. Run them before trusting a result.
# ===========================================================================

sql_generation_examples:

# ---------------------------------------------------------------------------
# PROGRAMME-LEVEL COUNTS
# ---------------------------------------------------------------------------
- question: How many CM Elevate applications are there?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    One row is one application. There is no placeholder flag to exclude, so unlike PMAY
    no blanket predicate is needed. Report this as an application count, not a count of
    people funded.

- question: How many beneficiaries are there under CM Elevate?
  sql: |
    SELECT COUNT(DISTINCT request_id) AS applicants
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    'Beneficiary' resolves to an applicant, not a raw row. The grain is a REQUEST, not
    an award - nothing in this data confirms anyone received anything - but request_id
    is also NOT unique (about 36 numbers repeat, all inside Piggery), so a bare
    COUNT(*) overcounts applicants by those duplicates. Say 'applicants' in the answer,
    not 'applications'.

- question: How many CM Elevate applicants are there?
  sql: |
    SELECT COUNT(DISTINCT request_id) AS applicants
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    'Applicants' means distinct people, not rows. Dedupe on request_id - never
    COUNT(*), which double-counts the ~36 repeating request_id values. Contrast with
    'How many CM Elevate applications are there?' above, which asks for the raw
    request count and stays COUNT(*).

- question: How many CM Elevate applicants are there in West Garo Hills?
  sql: |
    SELECT COUNT(DISTINCT request_id) AS applicants
    FROM curated.v_cm_elevate
    WHERE lgd_district = 'WEST GARO HILLS';
  tables:
  - curated.v_cm_elevate
  note: >
    Same rule as the programme-level applicant count, scoped by district: 'applicants'
    dedupes on request_id, 'applications' does not.

- question: How many distinct applications are there?
  sql: |
    SELECT COUNT(*) AS rows_total,
           COUNT(DISTINCT request_id) AS distinct_applications
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    request_id carries no unique constraint - about 36 numbers repeat. Report both
    figures; the difference is a finding, not a number to pick between.

- question: How many schemes run under CM Elevate?
  sql: |
    SELECT COUNT(*) AS schemes
    FROM curated.dim_cm_elevate_scheme;
  tables:
  - curated.dim_cm_elevate_scheme
  note: >
    FIFTEEN. Read the dimension, not a DISTINCT over the fact - a scheme with zero
    applications would be invisible in the fact. The requirement workbook says 13; that
    figure describes a different dataset.

- question: List all CM Elevate schemes
  sql: |
    SELECT scheme_name, endpoint
    FROM curated.dim_cm_elevate_scheme
    ORDER BY scheme_name;
  tables:
  - curated.dim_cm_elevate_scheme

- question: How many districts does CM Elevate reach?
  sql: |
    SELECT COUNT(DISTINCT lgd_district) AS districts
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    No Unresolved filter here. An Unresolved row still carries the district it was placed
    under, and excluding it would understate district coverage.

- question: How many blocks are covered?
  sql: |
    SELECT COUNT(DISTINCT lgd_block) AS blocks
    FROM curated.v_cm_elevate;
  tables:
  - curated.v_cm_elevate
  note: >
    About 58, of which roughly 44 are rural C&RD blocks and 10 are urban Municipal Boards
    or Town Committees. Say so, or offer the split - unlike PMAY-G, CM Elevate is not
    rural-only.

- question: How many villages are covered?
  sql: |
    SELECT COUNT(DISTINCT village_code) AS villages
    FROM curated.v_cm_elevate
    WHERE entity_type <> 'Unresolved';
  tables:
  - curated.v_cm_elevate
  note: >
    Two rules fire together - count by code because 36 village names map to more than one
    LGD code, and exclude Unresolved because it is a synthetic placeholder, not a village.

# ---------------------------------------------------------------------------
# BY SCHEME - the dimension that matters most
# ---------------------------------------------------------------------------
- question: Applications by scheme
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    Heavily skewed - two schemes hold about 78%. Show the counts, not only shares.

- question: Which scheme has the most applications?
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    ORDER BY applications DESC
    LIMIT 1;
  tables:
  - curated.v_cm_elevate

- question: Which scheme has the fewest applications?
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    ORDER BY applications ASC
    LIMIT 1;
  tables:
  - curated.v_cm_elevate
  note: Several schemes hold only two or three applications - report the count, never a rank alone.

- question: Top 5 schemes by applications
  sql: |
    SELECT scheme_name, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    ORDER BY applications DESC
    LIMIT 5;
  tables:
  - curated.v_cm_elevate

- question: Show every scheme including those with no applications
  sql: |
    SELECT d.scheme_name, COUNT(f.cm_elevate_fact_id) AS applications
    FROM curated.dim_cm_elevate_scheme d
    LEFT JOIN curated.fact_cm_elevate_application f USING (cm_scheme_key)
    GROUP BY d.scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.dim_cm_elevate_scheme
  - curated.fact_cm_elevate_application
  note: >
    The one sanctioned LEFT JOIN in this partition. A scheme with zero applications is
    invisible in the fact, and a missing row reads very differently from a zero row.

- question: What share of applications does each scheme hold?
  sql: |
    SELECT scheme_name,
           COUNT(*) AS applications,
           ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) AS share_pct
    FROM curated.v_cm_elevate
    GROUP BY scheme_name
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    One decimal, and the count travels with the share. Six schemes have fewer than 15
    applications, where one record moves the percentage by 7 to 50 points.

- question: How concentrated is CM Elevate by scheme?
  sql: |
    WITH s AS (
      SELECT scheme_name, COUNT(*) AS applications
      FROM curated.v_cm_elevate GROUP BY scheme_name
    )
    SELECT scheme_name, applications,
           ROUND(applications * 100.0 / SUM(applications) OVER (), 1) AS share_pct,
           ROUND(SUM(applications) OVER (ORDER BY applications DESC) * 100.0
                 / SUM(applications) OVER (), 1) AS cumulative_pct
    FROM s
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: Answers the concentration question by count. There is no monetary concentration to compute.

