    FROM curated.v_cm_elevate
    WHERE lgd_district = 'EAST KHASI HILLS';
  tables:
  - curated.v_cm_elevate
  note: District is stored UPPERCASE in dim_geography - emit the uppercase literal.

- question: How many applications are in Ri Bhoi?
