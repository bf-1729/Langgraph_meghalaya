           COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY 1
    ORDER BY applications DESC;
  tables:
  - curated.v_cm_elevate
  note: >
    Group on applicant_category, NEVER on type_raw - the raw taxonomy is per-scheme and
    carries source typos preserved verbatim.

- question: How many applications came from registered bodies?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE applicant_category = 'registered';
  tables:
  - curated.v_cm_elevate
  note: About 83 programme-wide. Always show the count with any percentage.

- question: How many applications came from individuals?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_cm_elevate
    WHERE applicant_category = 'individual';
  tables:
  - curated.v_cm_elevate

- question: Applicant type by scheme
  sql: |
    SELECT scheme_name,
           COUNT(*) FILTER (WHERE applicant_category = 'individual')   AS individual,
           COUNT(*) FILTER (WHERE applicant_category = 'registered')   AS registered,
