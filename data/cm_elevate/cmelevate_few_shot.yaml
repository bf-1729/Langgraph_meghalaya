           COUNT(*) FILTER (WHERE applicant_category = 'individual') AS individual,
           COUNT(*) FILTER (WHERE applicant_category <> 'individual') AS bodies,
           COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY applications DESC;
  tables:
