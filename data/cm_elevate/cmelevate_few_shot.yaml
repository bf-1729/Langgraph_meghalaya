- question: Applications by district
  sql: |
    SELECT lgd_district, COUNT(*) AS applications
    FROM curated.v_cm_elevate
    GROUP BY lgd_district
    ORDER BY applications DESC
    LIMIT 12;
  tables:
  - curated.v_cm_elevate

- question: Which district has the most applications?
  sql: |
