      records: 34966
      share_pct: 20.4
      confidence_range: "85.3% to 97.7%"
      sql_predicate: null
      sql_predicate_v1_obsolete: "mapping_status LIKE 'Fuzzy Mapped%'"
      sql_predicate_v2_pending: "mapping_category = '<bucket for fuzzy mapped>'"
      blocked_until_verified: >
        The curated bucket value is UNKNOWN. Run SELECT DISTINCT mapping_category before
        emitting any predicate here. Confidence now lives in mapping_confidence_pct, so a
        threshold question is a numeric comparison, not a LIKE.
      aliases: [fuzzy mapped, fuzzy match, approximate mapping, uncertain mapping,
