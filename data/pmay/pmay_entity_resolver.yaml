# ===========================================================================
# v2.0 - 2026-08-24 - RETARGETED FROM THE FLAT TABLE TO THE CURATED VIEW
#
# The VALUE catalogues below (district, block and village names, aliases,
# allotment categories, status labels) are unchanged - those are still the
# stored values. What changed is WHERE they live and HOW to filter them.
#
#   pmay_beneficiaries       -> curated.v_pmay
#   house_status             -> status_name  (+ is_completed / is_in_progress)
#   installment_paid         -> installments_paid
#   mapped_district_lgd_name -> lgd_district        STORED UPPERCASE NOW
#   mapped_block_lgd_name    -> lgd_block           STORED UPPERCASE NOW
#   mapped_village_lgd_name  -> lgd_village_name
#   mapped_village_lgd_code  -> village_code
#   mapping_status           -> mapping_category (+ mapping_confidence_pct)
#   mapped_district_lgd_code -> NO EQUIVALENT. District and block have no code
#   mapped_block_lgd_code       column in the curated layer, only names.
#   beneficiary_name         -> DROPPED AT INGEST. Name lookup is impossible.
#   pmay_fy_summary          -> GONE. Financial year is dim_year; the pre-aggregate
#                               is v_pmay_monthly_sanctions, at MONTH grain.
#
# All record counts, distinct counts and value distributions below are from the
# source workbook (2026-08-21) and have NOT been re-verified against megh_db.
# ===========================================================================

description: >
  Value-level entity resolution for the PMAY-G NLP-to-SQL bot. This file answers exactly
  one question: the user typed some text - which stored database value did they mean?
  It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: pmay
  display_name: PMAY-G
  full_name: Pradhan Mantri Awaas Yojana - Gramin
  state: Meghalaya
  aliases: [PMAY, PMAYG, "PMAY-G", "PMAY G", "PM Awas", "PM Awaas", "Awas Yojana",
            "Awaas Yojana", "Pradhan Mantri Awas Yojana", "Pradhan Mantri Awaas Yojana",
            "housing scheme", "rural housing scheme", "PM housing scheme",
            "gramin housing", "IAY", "Indira Awaas Yojana"]
  iay_note: >
    IAY is the predecessor scheme. Users say it, but this dataset holds PMAY-G records
    only. Accept it as a scheme alias; never present the data as IAY data.

tables:
  houses: curated.v_pmay                     # primary query surface, 28 columns
  fact: curated.fact_pmay_house              # underlying fact, 26 columns
  monthly: curated.v_pmay_monthly_sanctions  # pre-aggregate, MONTH grain, crore
  cross_scheme_money: curated.v_cross_scheme_money_district_year
  cross_scheme_coverage: curated.v_cross_scheme_village_coverage

dataset_shape:
  grain: one row per sanctioned PMAY-G house
  row_count: unverified_in_db
  row_count_note: The source workbook held 171107 rows. The curated count is unmeasured.
  single_table: false
  emits_no_joins: >
    curated.v_pmay already pre-joins dim_year, dim_geography, dim_scheme and
    dim_pmay_house_status, so the generator still emits WHERE and GROUP BY only. The
    reason changed in v2.0 - it is no longer "there is nothing to join to" but
    "it is already joined". See pmay_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because block and
    village names collide - see cross_dimension_collisions. Try: financial_year ->
    calendar_year -> district -> block -> village -> house_status -> house_alloted_to ->
    mapping_status -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "CASE RULE CHANGED IN v2.0. lgd_district and lgd_block are stored UPPERCASE in
    dim_geography. lgd_village_name, status_name and house_alloted_to keep their stored
    mixed case. Always compare case-folded, and emit the form the column actually stores."
  - Villages are resolved by village_code, never by name alone. 198 village
    names are shared by two or more different villages.
  - "District and block have NO CODE COLUMN in the curated layer. A user who supplies an
    LGD district or block code can be resolved to the NAME using the catalogue below,
    but the code itself can never appear in a WHERE clause."
  - "Beneficiary names are not in the curated layer. beneficiary_name and
    father_mother_name were dropped at ingest. A name lookup returns not-held, never a
    guess."
  - Every count and every sum carries WHERE NOT is_placeholder.
  - "Prefer is_completed over a status_name string comparison. It is NULLABLE, so
    'not completed' is (is_completed IS DISTINCT FROM TRUE), never NOT is_completed." 
  - The word sanctioned is dangerously overloaded - it is a house_status value, a
    measure (sanctioned_amount) and a date (sanction_date). See overloaded_terms.
  - A bare year is ambiguous between calendar year and financial year, and the two give
    materially different answers. See year_disambiguation. Ask.
  - reg_no is NOT unique (368 duplicates) and sanction_no is very much NOT unique
    (35131 distinct across 171107 rows). Never treat either as a primary key.
    pmay_fact_id is, and source_house_id carries the flat table's old id.
  - NULL is missing, never zero. 462 rows have no installment/release recorded and 126
    rows have no sanction date or amount.
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a district, block, village, status or category.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - strip trailing qualifier words: BLOCK, DISTRICT, VILLAGE, C&RD
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    All LGD codes and id are int64. Cast user-typed codes with int() and strip any
    trailing .0 before comparing.
  registration_ids: >
    reg_no is uppercase alphanumeric beginning MG. Uppercase and strip spaces before
    matching. sanction_no embeds a date in square brackets, e.g.
    "MG04002/1/987[10-02-2023]" - match on the full string or on the part before "[".

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts only - do not invent them for blocks }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [Laskein, Thadlaskein]        # two different West Jaintia Hills blocks
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]        # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]       # East Khasi Hills vs West Khasi Hills
  - [Mawshynrut, Mawsynram]
  - [Siju, Saipung]
  - [Woman-Married, Woman-Unmarried]
  - [Woman-Widow, Woman-Unmarried]
  - [Completed, House Sanctioned]
  - [Proposed Site, "Existing site(Old House)"]

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | village | house_status | house_alloted_to |
                 mapping_status | financial_year | calendar_year | identifier | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    lgd_code: <code, geography only>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, lgd_code, district, block } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the PMAY data.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column in this dataset. Getting these wrong
    produces a confidently wrong answer, so they are listed explicitly.

  sanctioned:
    readings:
    - { means: status_name = 'House Sanctioned',
        when: "the user asks how many houses are 'sanctioned' as a STAGE, i.e. approved but not started" }
    - { means: SUM(sanctioned_amount),
        when: "the user asks for a sanctioned AMOUNT, money, or rupees" }
    - { means: "a sanction_date filter",
        when: "the user says 'sanctioned in <year>' or 'sanctioned between'" }
    default: >
      "houses sanctioned in 2023" is a DATE filter over all rows, not house_status =
      'House Sanctioned'. Only read it as the status when the user is clearly asking
      about construction stage. When genuinely unclear, ask.

  completed:
    readings:
    - { means: "is_completed", when: always }
    v2_change: >
      Use the precomputed boolean is_completed rather than status_name = 'Completed'.
      For "not completed" write (is_completed IS DISTINCT FROM TRUE) - the flag is
      NULLABLE and NOT is_completed would drop the undecided rows.
    note: >
      Do NOT infer completion from amount_released = 130000 or installments_paid = 3.
      The status dimension is authoritative. They correlate but are not identical.

  beneficiaries:
    readings:
    - { means: COUNT(*), when: default - the grain is one HOUSE }
    - { means: COUNT(DISTINCT reg_no), when: "the user says distinct, unique, or individual" }
    default: COUNT(*), and say the answer is a house count.
    v2_change:
      critical: true
      text: >
        The curated grain is one row per HOUSE, and beneficiary_name /
        father_mother_name were DROPPED AT INGEST. "Beneficiary" can no longer mean a
        named person. A question asking WHO a beneficiary is, or asking to look one up by
        name, is unanswerable - return not-held. reg_no is also nullable now, so
        COUNT(DISTINCT reg_no) excludes the NULLs; say so.

  houses:
    means: COUNT(*)
    note: one row is one house. Same as the default beneficiary count.
    mandatory_filter: WHERE NOT is_placeholder

  amount:
    readings:
    - { means: SUM(sanctioned_amount), when: the user says sanctioned/approved }
    - { means: SUM(amount_released), when: the user says released/paid/disbursed/utilised }
    - { means: SUM(amount_pending), when: "the user says pending/unreleased/outstanding/balance" }
    default: ask which. Do not silently pick one.
    v2_change: >
      amount_pending is a STORED column now, so a pending-amount question is a third
      reading rather than a derivation. Watch the collision: "pending HOUSES" means not
      completed (is_completed), "pending AMOUNT" means amount_pending.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 26
    district_collisions: 0
  colliding_names: [Adokgre, Amlarem, Baghmara, Batabari, Demdema, Gambegre, Laskein,
    Lumshnong, Mawhati, Mawkynrew, Mawkyrwat, Mawlai, Mawpat, Mawryngkneng, Mawshynrut,
    Nongstoin, Pynursla, Rambrai, Ranikor, Rerapara, Saipung, Songsak, Tikrikilla,
    Umling, Umsning, Zikzak]
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "village" or "gaon", resolve as village.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.

