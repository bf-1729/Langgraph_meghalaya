  data_span_in_source: { first_sanction: '2017-08-09', last_sanction: '2023-07-04' }
  last_generated: '2026-08-21'
  last_revised: '2026-08-24'

  open_verification_tasks:
    critical: true
    note: >
      v2.0 retargeted this file from structure alone. NOTHING below has been measured
      against megh_db. Each item is a query to run before any PMAY answer ships.
    tasks:
    - "Row count: SELECT COUNT(*) FROM curated.v_pmay - and how many are is_placeholder."
    - "dim_year coverage: does it hold the five pre-2022 PMAY financial years, or do ~33%
       of houses carry year_key = NULL? See dimensions.financial_year.coverage_conflict."
    - "mapping_category: SELECT DISTINCT mapping_category - the bucket values are unknown."
    - "Geography casing: confirm lgd_district and lgd_block are stored UPPERCASE."
    - "sanctioned_amount: is it still a flat 130000 constant after the load?"
    - "status roll-ups: how many rows have is_completed IS NULL."
    - "completed_underfunded and is_placeholder: how many rows carry each flag."

  regeneration_rules:
  - Re-profile the workbooks AND re-query megh_db. Diff every count here. Explain each change.
  - APPEND new canonical values and aliases. Never delete one - old questions must keep
    resolving.
  - Re-run the village ambiguity registry. If a name gains a code it must appear here.
  - Re-check the dim_year coverage conflict. It is the single highest-risk open item.
  - Re-check whether sanctioned_amount is still constant. If a second real value appears,
    the "ranking equals counting" guidance must be removed.
  - Watch the 2023-24 partial-year caveat. Once later data lands, update or drop it.
  - Bump resolver_version.
  companion_files:
  - Annotations/PMAY/pmay_schema_partitions.yaml
  - Annotations/PMAY/pmay_foreign_key_augmentation.yaml
  - SCHEMA_FOR_DEVELOPERS.md
  - Annotations/MGNREGA/README.md    # the Excel-to-YAML method this file follows
