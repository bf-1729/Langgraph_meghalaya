  year_disambiguation:
    critical: true
    problem: >
      A bare year means different things and the gap is large. Calendar 2023 has 110890
      records; FY 2023-24 has 106527. Calendar 2022 has 4056; FY 2022-23 has 8225 - more
      than double. Silently choosing one is a wrong answer roughly half the time.
    rules:
    - A hyphenated or slashed year ("2023-24", "2023/24", "FY 2023") is a FINANCIAL year.
    - The words "financial year", "FY", "fiscal" force the financial year reading.
    - A bare four-digit year ("in 2023", "during 2022") defaults to CALENDAR year,
      filtered on sanction_date. State the assumption in the answer. Note that in v2.0 a
      financial-year reading is now cheap to offer as an alternative, because
      financial_year_short is a stored column rather than a derivation.
    - If the question asks about "utilisation", "completion rate" or "pending amount",
      use the FINANCIAL year - financial_year_short on curated.v_pmay. (v1.0 pointed at
      the FY summary workbook for these; that object does not exist in megh_db.)
    - When the phrasing is genuinely unclear and the two readings differ materially, ask.

  sanction_date:
    column: sanction_date
    type: date
    nulls: 126
    min: '2017-08-09'
    max: '2023-07-04'
    sql_predicate_range: "sanction_date >= '<from>' AND sanction_date < '<to_exclusive>'"
    month_names: >
      Accept "January 2023", "Jan 23", "Q1 2023" and similar. Convert to an explicit
      half-open date range. Quarters are calendar quarters unless the user says
      "financial quarter", in which case Q1 = April-June.
    out_of_range: >
      Anything before 2017-08-09 or after 2023-07-04 has no records. Say so with the
      actual data span rather than returning an empty result with no explanation.

# ---------------------------------------------------------------------------
  identifiers:
    pmay_fact_id:
      column: pmay_fact_id
      type: bigint
      unique: true
      role: the primary key of curated.fact_pmay_house and curated.v_pmay
      aliases: [record id, row id, fact id]
      rule: identifier only - never SUM or AVG.
      unstable: >
        Surrogate, regenerated on every reload. Never export it or quote it back to a
        user as a durable reference.
    source_house_id:
      column: source_house_id
      type: integer
      role: >
        The flat table's old `id`. v2.0 CHANGE - a user or saved query referring to PMAY
        record id N means this column, not pmay_fact_id.
      aliases: [source id, original id, house id]
      rule: identifier only - never SUM or AVG.
    reg_no:
      column: reg_no
      type: string
      format: "MG followed by 9 digits, e.g. MG123676572"
      distinct: 170739
      duplicates: 368
      max_repeats: 2
      unique: false
      aliases: [registration number, registration no, reg no, beneficiary registration
                number, registration id]
      rule: >
        NOT unique - 368 registration numbers appear twice. COUNT(DISTINCT reg_no) is the
        right answer only when the user explicitly asks for distinct or unique
        beneficiaries. Never join or key on it.
      resolution: uppercase and strip spaces, then exact match. Do not fuzzy-match reg_no.
    sanction_no:
      column: sanction_no
      type: string
      format: "<office>/<n>/<seq>[DD-MM-YYYY], e.g. MG04002/1/987[10-02-2023]"
      distinct: 35131
      nulls: 126
      unique: false
      max_repeats: 322
      median_repeats: 2
      aliases: [sanction number, sanction no, sanction reference, sanction order]
      rule: >
        Strongly NOT unique - one sanction number covers up to 322 records, median 2.
        A sanction is an office order covering many houses. Never treat it as a
        beneficiary key. Counting sanctions means COUNT(DISTINCT sanction_no).
      embedded_date: >
        The bracketed date is the sanction order date and usually matches sanction_date.
        Prefer the sanction_date column for any date filtering; do not parse the string.
    beneficiary_name:
      status: DROPPED_AT_INGEST
      column: null
      v1_column: beneficiary_name
      aliases: [beneficiary, beneficiary name, applicant name, house owner, name]
      rule:
        critical: true
        text: >
          v2.0 CHANGE. This column is NOT in the curated layer. Personal names were
          dropped when PMAY loaded into megh_db, and there is no join that recovers them.
          A question naming a person, or asking who a beneficiary is, must return
          "not held in this data". Never substitute reg_no for a name, never guess, and
          never build a beneficiary-lookup feature against this schema.
      resolver_behaviour: >
        Classify the span as entity_type: person_name and emit not_found with the reason
        "personal names are not held in the curated layer" - not a did-you-mean list.
    father_mother_name:
      status: DROPPED_AT_INGEST
      column: null
      v1_column: father_mother_name
      v1_source_column: father_s_mother_s_name
      v1_nulls: 114118
      v1_null_share_pct: 66.7
      aliases: [father name, mother name, parent name, guardian name]
      rule:
        critical: true
        text: >
          v2.0 CHANGE. Not in the curated layer, for the same reason as
          beneficiary_name. Any rule about splitting on "[" or reporting the 66.7% null
          share is obsolete - there is no column to split..

# ---------------------------------------------------------------------------
# MEASURE VOCABULARY - user phrasing to column. stage2 owns aggregation semantics.
# ---------------------------------------------------------------------------
measure_vocabulary:
  sanctioned_amount:
    column: sanctioned_amount
    aliases: [sanctioned amount, sanction amount, amount sanctioned, approved amount,
              allocated amount, sanctioned money, allocation]
    aggregate: SUM(sanctioned_amount)
    distinct_values: 2
    constant_value: 130000
    zero_rows: 126
    verified_in_db: false
    critical: >
      SOURCE-WORKBOOK FINDING, NOT RE-VERIFIED AGAINST megh_db. Check the distribution
      before relying on it. As profiled, this column is effectively a CONSTANT - every
      real record is 130000 and only the 126 dateless records are 0. If that still holds,
      the consequences the LLM must respect are:
        - SUM(sanctioned_amount) is just 130000 * record count. Ranking districts by
          sanctioned amount is IDENTICAL to ranking them by house count.
        - AVG(sanctioned_amount) is always ~130000 and carries no information. If the
          user asks for it, answer but say it is a flat per-house entitlement.
        - Never present "which district got the most money sanctioned" as a funding
          insight - it is purely a count of houses.
    unit: rupees per house (flat PMAY-G unit assistance)

  amount_released:
    column: amount_released
    aliases: [amount released, released amount, funds released, money released,
              disbursed, payment released, utilised amount, utilisation]
    aggregate: SUM(amount_released)
    distinct_values: 4
    nulls: 462
    value_ladder:
      note: >
        amount_released takes only four values and they track installments_paid exactly.
        This is a stepped entitlement, not a continuous amount.
      mapping:
      - { installments_paid: 1, amount_released: 52000, records: 1986 }
      - { installments_paid: 2, amount_released: "110500 or 120000", records: 15836 }
      - { installments_paid: 3, amount_released: 130000, records: 152823 }
    never_exceeds_sanctioned: true
    zero_rows: 0
    null_rule: >
      462 rows have NULL amount_released AND NULL installments_paid - the same 462 rows.
      NULL means no release recorded, not zero released. AVG silently skips them; SUM
      treats them as absent. Say so when the answer depends on them.

  installments_paid:
    column: installments_paid
    aliases: [installments paid, installment count, number of installments,
              payments made, instalments]
    distinct_values: [1, 2, 3]
    nulls: 462
    counts: { 1: 1986, 2: 15836, 3: 152823 }
    rule: >
      For "how many beneficiaries/houses" use COUNT(*) with a WHERE on installments_paid.
      Use SUM(installments_paid) only when the user explicitly asks for TOTAL installments
      across records. Confusing the two is the most common error on this column.

  record_count:
    aliases: [houses, records, beneficiaries, how many, number of houses, count,
              total houses, sanctioned houses]
    aggregate: COUNT(*)
    default: true
    mandatory_filter: WHERE NOT is_placeholder
    note: >
      One row = one house. v2.0 CHANGE - every count carries NOT is_placeholder, because
      the curated layer flags rows that are not real sanctioned houses. The flat table
      had no such flag, so v1.0 counts were unfiltered.

  amount_pending:
    column: amount_pending
    aliases: [pending amount, unreleased amount, balance, outstanding, remaining funds,
              not yet released, amount pending]
    aggregate: SUM(amount_pending)
    unit: rupees
    v2_change:
      critical: true
      text: >
        NEW STORED COLUMN. v1.0 listed pending_amount under `derived` with the formula
        SUM(sanctioned_amount - amount_released) and a NULL guard. That derivation is
        OBSOLETE - do not emit it. Read the column.
    collision_warning: >
      "pending houses" is a CONSTRUCTION question (is_completed), "pending amount" is a
      MONEY question (amount_pending). The words are the same; the columns are not.

  derived:
    pending_amount_obsolete:
      status: replaced_by_stored_column
      v1_formula: SUM(sanctioned_amount - amount_released)
      replacement: SUM(amount_pending)
      note: Kept only so a stale retrieval hit is recognised as stale.
    completion_rate:
      formula: "100.0 * COUNT(*) FILTER (WHERE is_completed) / NULLIF(COUNT(*),0)"
      v1_formula: "100.0 * COUNT(*) FILTER (WHERE house_status = 'Completed') / NULLIF(COUNT(*),0)"
      aliases: [completion rate, completion percentage, percent completed, completion pct]
    utilisation_rate:
      formula: "100.0 * SUM(amount_released) / NULLIF(SUM(sanctioned_amount),0)"
      aliases: [utilisation, utilization rate, fund utilisation, percent utilised]
      note: >
        Both operands are RUPEES on curated.v_pmay, so the ratio is unit-safe. Do not
        mix in the crore columns from v_pmay_monthly_sanctions.

# ---------------------------------------------------------------------------
pre_aggregate_table:
  table: curated.v_pmay_monthly_sanctions
  replaces: pmay_fy_summary
  rows: unverified_in_db
  grain: one row per sanction MONTH, statewide
  v2_change:
    critical: true
    text: >
      pmay_fy_summary DOES NOT EXIST in megh_db. Its replacement is a MONTHLY view, not
      a financial-year one, and it has FOUR columns rather than eight - completed,
      pending_cr, completion_pct and utilisation_pct are all gone. Those four metrics
      must now be computed from curated.v_pmay, not read from a summary.
      There is also NO GEOGRAPHY BREAKDOWN - the view is statewide only. For district
      money use curated.v_cross_scheme_money_district_year.
  relationship: >
    A pre-aggregate of curated.v_pmay, NOT a join target. Read it alone for monthly
    questions, or group the detail on sanction_month - never both. Joining the detail to
    its own rollup repeats every monthly figure once per house.
  columns:
    sanction_month: the month, as a date
    houses_sanctioned: COUNT(*) for that month
    sanctioned_cr: sanctioned amount that month, in CRORE rupees
    released_cr: released amount that month, in CRORE rupees
  unit_warning: >
    The _cr columns are in CRORE, while sanctioned_amount, amount_released and
    amount_pending on curated.v_pmay are in RUPEES. 1 crore = 10,000,000. Never compare
    or add across the two without converting, and always state the unit.
  metrics_that_moved:
    completed: COUNT(*) FILTER (WHERE is_completed) on curated.v_pmay
    pending: SUM(amount_pending) on curated.v_pmay - a stored column now
    completion_pct: computed from curated.v_pmay
    utilisation_pct: computed from curated.v_pmay
  retired_totals:
    note: >
      v1.0 carried verified FY-summary totals - 170981 houses, 2222.753 sanctioned_cr,
      2185.25985 released_cr, 129941 completed. Those were measured from the source
      workbook and reconcile with it exactly, but they have NOT been re-derived from
      megh_db and no curated object reproduces them. Do not quote them as database
      figures.
    houses: 170981
    sanctioned_cr: 2222.753
    released_cr: 2185.25985
    completed: 129941
    verified_in_db: false

# ---------------------------------------------------------------------------
region_groupings:
  note: >
    Users group districts by hill range. These are not columns - expand into an IN list
    and state which districts were included.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      records: 89922
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      records: 45294
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      records: 18326
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      records: 17565
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group. Both
        readings produce the same filter, so no clarification is needed. Do not fold it
        into Khasi Hills.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many PMAY houses in EGH"
  resolve:
  - { text: EGH, type: district, canonical: East Garo Hills, lgd_code: 273,
      matched_by: 4_acronym }
  - { text: "how many houses", type: measure, canonical: "COUNT(*)" }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE lgd_district = 'East Garo Hills';"
  expected: 16899

- user: "e garo hill completed houses"
  resolve:
  - { text: "e garo hill", type: district, canonical: East Garo Hills, matched_by: 2_alias }
  - { text: completed, type: house_status, canonical: Completed }
  note: >
    Alias family: EGH, E Garo Hills, East Garo Hill, East Garo, EAST GARO HILLS all land
    on the same canonical district.

- user: "houses sanctioned in 2023"
  resolve:
  - { text: sanctioned, type: overloaded, reading: sanction_date filter }
  - { text: "2023", type: calendar_year, canonical: 2023, assumption: calendar }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE sanction_date >= '2023-01-01' AND sanction_date < '2024-01-01';"
  expected: 110890
  note: >
    "sanctioned in <year>" is a DATE filter, not status_name = 'House Sanctioned'.
    State that calendar year was assumed.

- user: "houses sanctioned in FY 2023-24"
  resolve:
  - { text: "FY 2023-24", type: financial_year, canonical: '2023-24' }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE sanction_date >= '2023-04-01' AND sanction_date < '2024-04-01';"
  expected: 106527
  note: >
    Different number from the calendar-year reading above - 106527 vs 110890. This is why
    year_disambiguation matters. Also flag that 2023-24 is partial (data ends 2023-07-04).

- user: "how many houses are at sanctioned stage"
  resolve:
  - { text: sanctioned stage, type: house_status, canonical: House Sanctioned }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE status_name = 'House Sanctioned';"
  expected: 2057
  note: the word "stage" flips "sanctioned" from a date filter to a status filter.

- user: "how many houses went to women"
  resolve:
  - { text: women, type: house_alloted_to, canonical_group: women_any,
      members: [Woman-Married, Woman-Widow, Woman-Unmarried, Woman] }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE house_alloted_to IN ('Woman-Married','Woman-Widow','Woman-Unmarried','Woman');"
  expected: 46520
  note: >
    Must include all four Woman-* categories. Answering with Woman-Married alone (42331)
    understates by 4189. Also offer the 156885 figure that includes joint allotments,
    since those involve a woman too - but do not silently substitute it.

- user: "which district got the most sanctioned amount"
  resolve:
  - { text: sanctioned amount, type: measure, canonical: sanctioned_amount }
  response_guidance: >
    Answer, but state plainly that sanctioned_amount is a flat 130000 per house, so this
    ranking is identical to ranking districts by house count. Do not present it as a
    funding-allocation insight.

- user: "PMAY houses in Asimgre"
  resolve:
  - { text: Asimgre, type: village, status: ambiguous }
  response:
    status: ambiguous
    candidates: 6 distinct village codes named ASIMGRE
    districts: [East Garo Hills, South Garo Hills, West Garo Hills]
    question: "Asimgre exists in three districts. Which one did you mean?"
  note: never pick the first row.

- user: "PMAY houses in Mawlai"
  resolve:
  - { text: Mawlai, type: block, canonical: Mawlai, lgd_code: 6540,
      assumption: default_level }
  note: >
    Mawlai is both a block and a village name. With no qualifier the default is block.
    State the assumption.

- user: "how many fuzzy mapped records"
  resolve:
  - { text: fuzzy mapped, type: mapping_status, family: "Fuzzy Mapped" }
  sql: "SELECT COUNT(*) FROM curated.v_pmay WHERE NOT is_placeholder AND mapping_category = '<bucket>';"
  expected: 34966
  expected_verified_in_db: false
  note: >
    v2.0 CHANGE. The v1.0 predicate mapping_status LIKE 'Fuzzy Mapped%' no longer works -
    curated.v_pmay exposes mapping_category, not the 44 raw labels. The bucket values are
    unknown from the information_schema extract; enumerate them with
    SELECT DISTINCT mapping_category before writing this predicate.

- user: "total funds released in crores"
  resolve:
  - { text: funds released, type: measure, canonical: amount_released }
  - { text: crores, type: unit_request }
  guidance: >
    curated.v_pmay stores RUPEES. Divide by 10000000 and label the result crore, or read
    released_cr straight from curated.v_pmay_monthly_sanctions, which is already crore
    but is monthly and statewide only. Do not mix the two units.

- user: "average sanctioned amount per beneficiary"
  resolve:
  - { text: average sanctioned amount, type: measure, canonical: sanctioned_amount }
  guidance: >
    Returns ~130000 for every cut of the data. Answer, but say it is a flat per-house
    entitlement so the average carries no comparative information.

- user: "houses completed in Nagaland"
  resolve:
  - { text: Nagaland, type: unknown, status: not_found }
  response: >
    Not in the PMAY data - this dataset covers the 12 districts of Meghalaya only.

- user: "total expenditure under PMAY"
  resolve:
  - { text: total expenditure, type: measure, status: ambiguous }
  question: >
    There is no generic expenditure column. Do you mean total sanctioned amount or total
    amount released?

- user: "how many beneficiaries are there"
  resolve:
  - { text: beneficiaries, type: overloaded, reading: "COUNT(*)" }
  expected: 171107
  expected_verified_in_db: false
  note: >
    Default is the house count, with WHERE NOT is_placeholder. Say it is a house count.
    Only use COUNT(DISTINCT reg_no) if the user asks for distinct or unique
    registrations, and note that reg_no is nullable so NULLs are excluded.
    The 171107 / 170739 figures are source-workbook counts and do not account for
    placeholder rows - do not quote them as database figures.

