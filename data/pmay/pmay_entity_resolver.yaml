  house_status:
    column: status_name
    column_v1: house_status
    source: curated.dim_pmay_house_status, pre-joined into curated.v_pmay
    rollup_flags: [is_completed, is_in_progress]
    stored_case: Title Case
    distinct: 6
    closed_set: true
    nulls: 12
    sql_predicate: "status_name = '<canonical>'"
    prefer_rollup: >
      v2.0 CHANGE. For 'completed' and 'in progress' use the precomputed booleans
      is_completed / is_in_progress instead of comparing status_name to a string. Reach
      for status_name only for the stages that have no flag - Plinth, Roof Cast,
      House Sanctioned, Proposed Site, Existing site(Old House).
    rollup_null_trap:
      critical: true
      text: >
        is_completed and is_in_progress are NULLABLE - a status whose roll-up is
        undecided is NULL, not false. WHERE is_completed is correct for 'completed'.
        NOT is_completed is WRONG for 'not completed' because it also drops the NULLs.
        Write (is_completed IS DISTINCT FROM TRUE).
    authoritative: >
      status_name is the ONLY authoritative construction-stage field. Never infer stage
      from amount_released or installments_paid even though they correlate.
    ordering: >
      Progression is Proposed Site -> Existing site(Old House) -> House Sanctioned ->
      Plinth -> Roof Cast -> Completed. Use this order for stage comparisons and charts.
    values:
    - canonical: "Completed"
      records: 129941
      stage_order: 6
      aliases: ["complete", "finished", "done", "constructed", "built", "house completed", "completed house", "fully built"]
    - canonical: "Roof Cast"
      records: 25000
      stage_order: 5
      aliases: ["roof", "roof casting", "roof level", "roof stage", "roof cast stage", "casting done"]
    - canonical: "Plinth"
      records: 13984
      stage_order: 4
      aliases: ["plinth level", "plinth stage", "foundation", "foundation level", "plinth completed"]
    - canonical: "House Sanctioned"
      records: 2057
      stage_order: 3
      aliases: ["sanctioned", "sanctioned only", "approved not started", "not started", "yet to start", "sanction stage", "sanctioned stage", "sanctioned status"]
    - canonical: "Existing site(Old House)"
      records: 73
      stage_order: 2
      aliases: ["old house", "existing site", "existing house", "old site", "existing site old house"]
    - canonical: "Proposed Site"
      records: 40
      stage_order: 1
      aliases: ["proposed", "site proposed", "proposed stage"]
    null_handling:
      rows: 12
      rule: >
        12 rows have no house_status. They are missing, not a stage. Exclude them from
        status breakdowns and say so if the user asks for a full status split.
    derived_groups:
      note_v2: >
        v2.0 CHANGE. in_progress is now a stored boolean, is_in_progress, on
        dim_pmay_house_status. Prefer the flag over the member list - the flag is the
        database's own roll-up and the member list is this file's reconstruction of it.
        If they disagree, the flag wins and this file is stale.
      in_progress:
        prefer_flag: is_in_progress
        members: [Roof Cast, Plinth, House Sanctioned]
        records: 41041
        aliases: [in progress, ongoing, under construction, incomplete, not completed,
                  pending houses, work in progress]
      not_started:
        members: [House Sanctioned, Proposed Site, "Existing site(Old House)"]
        records: 2170
        aliases: [not started, yet to begin, no construction]
      note: >
        v2.0 CHANGE. "incomplete" or "pending" means NOT completed. Build it as
        (is_completed IS DISTINCT FROM TRUE), which keeps the rows whose roll-up is
        undecided. The v1.0 form status_name <> 'Completed' AND status_name IS NOT NULL
        silently drops the 12 status-less houses.
        Do not confuse "pending houses" with amount_pending, which is money.

