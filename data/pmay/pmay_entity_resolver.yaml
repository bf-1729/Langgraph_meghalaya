  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: >
      Title Case in dim_geography.lgd_village_name (21 names legitimately break it -
      see casing_exceptions). UNLIKE district and block, the village name is NOT
      uppercased in the curated layer.
    distinct_names: 4855
    distinct_codes: 5121
    integrity: >
      Verified clean: no village code carries more than one name, and no village code
      appears in more than one block. The code is a reliable key; the NAME is not.
    sql_predicate_preferred: "village_code = <lgd_code>"
    sql_predicate_fallback: "lgd_village_name = '<canonical>'"
    counting_villages: >
      Use COUNT(DISTINCT village_code), never COUNT(DISTINCT name) - 266
      villages would be lost to shared names.

    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their
         district and block. Ask which one.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.

    casing_exceptions:
      count: 21
      note: >
        These are stored exactly as shown and are not Title Case. Do not "correct" them.
      values: ["12th Mer", "15th Mile Nongthymmai", "5th Mile", "Baridua 10th Mile",
               "Bogularbhita-II", "Boldamgre II", "Bollonggre II", "Chapahati II",
               "Chapahati III", "Chengkurigre II", "Dhapangpara II", "Dhapangpara III",
               "Kalapani II", "Mawmluh II", "Nonglwai II", "Pahammawlein 20th Mile",
               "Rabidaspara II", "Salbila II", "Salbila III", "Seinduli II",
               "Soleartek II"]
      numeric_prefix_rule: >
        Names beginning with a digit ("5th Mile", "12th Mer") must not be mistaken for
        LGD codes. A village code in this dataset is a 6-digit integer with no letters.

    ambiguity:
      shared_names: 198
      detail: >
        198 village names are used by two or more physically different villages. Village
        name alone is NEVER a key.
      resolve_by_district: 159
      resolve_by_block: 39      # every copy sits in ONE district, so naming the
                                # district does not help - ask for the block
