  source_files:
  - quadrent/datasets/PMAY/PMAY_FullyMapped_with_dates.xlsx      # Sheet1, 171107 x 18
  - quadrent/datasets/PMAY/PMAY_FullyMapped_FY_summary.xlsx      # Sheet1, 7 x 8
  schema_authority: SCHEMA_FOR_DEVELOPERS.md   # live information_schema extract, 2026-08-24
