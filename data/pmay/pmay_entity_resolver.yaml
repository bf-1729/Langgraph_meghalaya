      completed: 3524
      sanctioned_cr: 45.955
      released_cr: 45.89325
      completion_pct: 99.69
      aliases: ["FY2018-19", "FY 2018-19", "2018-2019", "FY2018-2019", "2018/19", "financial year 2018-19", "fiscal 2018-19", "2018-19 FY"]
