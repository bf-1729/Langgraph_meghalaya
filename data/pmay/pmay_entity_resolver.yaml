# ---------------------------------------------------------------------------
# TIME  - the highest-risk dimension in this dataset
# ---------------------------------------------------------------------------
  financial_year:
    stored_column: financial_year / financial_year_short on curated.v_pmay
    key_column: year_key
    source: curated.dim_year, pre-joined into curated.v_pmay
    definition: April 1 to March 31, labelled by the starting year, e.g. 2023-24
    v2_change:
      critical: true
      text: >
        THE BIGGEST CHANGE IN THIS FILE. v1.0 said "no financial-year column exists,
        derive it from sanction_date with a CASE expression". A real financial-year
        dimension exists now. Filter and group financial_year_short directly. The CASE
        derivation must NOT be emitted any more.
      obsolete_derivation_sql: >
        CASE WHEN EXTRACT(MONTH FROM sanction_date) >= 4
             THEN EXTRACT(YEAR FROM sanction_date)
             ELSE EXTRACT(YEAR FROM sanction_date) - 1 END
    sql_predicate: "financial_year_short = '<canonical>'"
    sql_predicate_by_key: "year_key = <start_year>"

    coverage_conflict:
      critical: true
      unresolved: true
      text: >
        dim_year holds FOUR rows covering FY 2022-23 through FY 2025-26 (verified
        2026-08-20, for MGNREGA). PMAY sanctions in the source workbook run from
        2017-08-09 to 2023-07-04 - SEVEN financial years, five of which (2017-18,
        2018-19, 2019-20, 2020-21, 2021-22) fall OUTSIDE that window. Those five hold
        56,229 of 171,107 houses, about 33%.
        Exactly one of these is true, and the extract cannot say which:
          (a) dim_year was extended when PMAY loaded, and all seven years resolve; or
          (b) dim_year still holds four years, and ~33% of PMAY houses carry
              year_key = NULL and vanish from every GROUP BY on financial year.
        THIS MUST BE MEASURED BEFORE ANY PMAY TIME SERIES IS PUBLISHED. Run:
          SELECT financial_year_short, COUNT(*) FROM curated.v_pmay
          WHERE NOT is_placeholder GROUP BY 1 ORDER BY 1;
        and check the NULL bucket. If (b) holds, every FY figure below is unreachable
        through year_key and the answer must fall back to sanction_date ranges.
    null_year_rule: >
      year_key is NULLABLE. Always count the NULL bucket before reporting a time series,
      and state how many houses it holds.
    distinct: 7
    distinct_note: 7 financial years in the SOURCE. dim_year may expose fewer - see coverage_conflict.
    closed_set: true
    excluded_rows: >
      126 records have a NULL sanction_date and belong to NO financial year. Separately,
      any sanction outside dim_year's window keeps year_key NULL - see coverage_conflict.
    sql_predicate_fallback: "sanction_date >= '<start>' AND sanction_date < '<end>'"
    sql_predicate_fallback_when: use only if coverage_conflict resolves to (b)
    values:
    - canonical: "2017-18"
      range: { start: '2017-04-01', end_exclusive: '2018-04-01' }
      houses: 15513
      completed: 15456
      sanctioned_cr: 201.669
      released_cr: 201.4623
      completion_pct: 99.63
      aliases: ["FY2017-18", "FY 2017-18", "2017-2018", "FY2017-2018", "2017/18", "financial year 2017-18", "fiscal 2017-18", "2017-18 FY"]
    - canonical: "2018-19"
