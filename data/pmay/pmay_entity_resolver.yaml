    confidence_column: mapping_confidence_pct
    v2_change:
      critical: true
      text: >
        The 44 composite labels were split at ingest. curated.v_pmay exposes
        mapping_category (a bucket) and mapping_confidence_pct (a number). The raw
        44-label string survives only as fact_pmay_house.mapping_status_raw, which the
        VIEW DOES NOT EXPOSE. Filter on mapping_category; compare confidence with
        mapping_confidence_pct. The percent-parsing SQL below is OBSOLETE.
      obsolete_predicates:
      - "mapping_status = 'Fully Mapped (100%)'"
      - "mapping_status LIKE 'Fuzzy Mapped%'"
      - "CAST(REPLACE(SPLIT_PART(SPLIT_PART(mapping_status,'(',2),'%',1),'','') AS DECIMAL)"
      replacement_note: >
        The exact bucket values in mapping_category are NOT known from the
        information_schema extract - only that the column is varchar(20). Enumerate them
        with SELECT DISTINCT mapping_category before writing any predicate against it.
    distinct: 44
    distinct_note: 44 is the RAW label count in the source workbook, not the mapping_category cardinality.
    stored_format: "<Family> (<percent>%)  - RAW LABEL ONLY, not the curated column"
    nulls: 0
    families:
    - canonical_prefix: "Fully Mapped"
      exact_value: "Fully Mapped (100%)"
      records: 136141
      share_pct: 79.6
      sql_predicate: null
      sql_predicate_v1_obsolete: "mapping_status = 'Fully Mapped (100%)'"
      sql_predicate_v2_pending: "mapping_category = '<bucket for fully mapped>'"
      blocked_until_verified: >
        The curated bucket value is UNKNOWN. Run SELECT DISTINCT mapping_category before
        emitting any predicate here. Do NOT fall back to the v1 form - mapping_status
        does not exist on curated.v_pmay.
      aliases: [fully mapped, exact match, exactly mapped, confirmed mapping,
