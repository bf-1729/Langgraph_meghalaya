# pmay_response_template.yaml
#
# ===========================================================================
# v2.0 - 2026-08-24 - RETARGETED TO THE CURATED STAR SCHEMA
#
# This file shapes wording, not SQL, so most of it survives untouched. Three
# things did change:
#
#   1. The two detail templates interpolated {beneficiary_name}. That column was
#      DROPPED AT INGEST - the placeholder would render empty. Both were rewritten
#      around registration and sanction number.
#   2. Geography display case: dim_geography stores district and block UPPERCASE,
#      so the composer must title-case them for display rather than pass them through.
#   3. New templates were added for placeholder rows, houses with no financial
#      year, completed-but-underfunded houses, and cross-scheme comparison.
#
# The financial year is no longer derived from sanction_date - it is a stored
# column - but the DISPLAY format is unchanged.
# ===========================================================================
#
# Response templates for PMAY-G - node 5.15, the response composer.
# Editable by analysts - no code change needed.
# Numbers are locked from the result set; templates only shape the wording around them.

response_templates:

  # ---- how the answer text is shaped ------------------------------------
  formatting:
    number_format: "indian"            # 1,71,107 not 171,107
    currency_symbol: "₹"
    decimal_places: 2
    percent_decimal_places: 2
    financial_year_format: "YYYY-YY"   # 2023-24; STORED column in v2.0, not derived
    date_format: "DD Month YYYY"       # 4 July 2023; sanction_date is a real date
    money_unit: "crore"                # v_pmay stores RUPEES, reported in crore for totals
    row_level_money_unit: "rupees"     # a single house is a flat entitlement, never 0.013 crore
    money_unit_warning: >              # v2.0: three units are live across megh_db
      curated.v_pmay is RUPEES; v_pmay_monthly_sanctions and the cross-scheme money view
      are already CRORE; MGNREGA expenditure is LAKH. Never add across them, and state
      the unit on every figure. The authority is curated.dim_scheme.money_unit.
    show_unit_always: true
    show_assumptions: true             # surface the defaults that fired
    geography_display_case: "title"    # v2.0: district and block are stored UPPERCASE in
                                       # dim_geography - title-case them for display,
                                       # but filter with the uppercase literal
    null_display: "not recorded"
    zero_display: "0"                  # a recorded zero is a real value, not a blank
    tie_behaviour: "show_all"
    empty_result_message: "No PMAY houses for that selection."
    placeholder_rule: >                # v2.0
      Every count and sum excludes is_placeholder rows. Do not mention that in the
      answer unless the user asked about data completeness - it is the normal case.
    max_rows_inline: 20

  # =======================================================================
  templates:

    # ---- result shapes --------------------------------------------------
    single_value: "{metric} for {scope} in {period} is {value}."
    multi_metric: "For {scope} in {period}: {metric_list}."
    count: "{scope} has {value} {entity} in {period}."
    house_count: "{scope} has {value} PMAY houses in {period}."
    completed_count: "{value} of {total} houses in {scope} are recorded as completed."
    average_value: "Average {metric} per {denominator} for {scope} in {period} is {value}."
    ratio_value: "{metric} for {scope} in {period} works out to {value}."
    share_percentage: "{metric} for {scope} in {period} is {value}%."
    proportion_of_total: "{scope} accounts for {value}% of the state total for {metric} in {period}."
    completion_rate: "{scope} has completed {completed} of {total} houses, {value}%."
    utilisation_rate: "{scope} has released {released} of {sanctioned} sanctioned, {value}%."

    ranked_list: "Top {n} {entity} by {metric} in {period}:"
    bottom_list: "Bottom {n} {entity} by {metric} in {period}:"
    extremes: "Highest is {top_entity} at {top_value}; lowest is {bottom_entity} at {bottom_value}."
    rank_position: "{scope} ranks {rank} of {total} {entity} by {metric} in {period}."
    tie_at_top: "{tied_entities} are level at {value}."

    breakdown: "{metric} by {level} for {period}:"
    status_breakdown: "Houses in {scope} by construction stage, Proposed Site through Completed:"
    category_breakdown: "Houses in {scope} by who they were allotted to:"
    time_series: "{metric} by financial year, {start} to {end}:"
    comparison: "{entity_a} {value_a} against {entity_b} {value_b} - a difference of {change}."
    growth_change: "{metric} for {scope} moved from {value_start} in {start} to {value_end} in {end}, a change of {change} ({change_pct}%)."
    period_comparison: "{metric} for {scope}: {value_a} in {period_a} against {value_b} in {period_b}."

    # v2.0: beneficiary_name was DROPPED AT INGEST. Both templates were rebuilt
    # around the identifiers that survive. Never reintroduce a name placeholder.
    entity_detail: "Registration {reg_no}, sanction {sanction_no}, sits in {village} village, {block} block, {district} district."
    house_detail: "The house was sanctioned on {sanction_date}; it is at {status_name} with {installments} of 3 installments, {released} released and {pending} pending."
    name_not_held: "Beneficiary names are not held in this data, so houses are identified by registration and sanction number."
    lookup_list: "Matches for '{value}':"
    entity_list: "{entity} in {scope}:"
    year_list: "Financial years available: {years}."
    coverage_statement: "{value} villages in {scope} have PMAY houses recorded."

    # ---- situations that need specific wording ---------------------------
    empty_result: "No {metric} recorded for {scope} in {period}."
    all_zero_result: "{scope} recorded zero {metric} in {period}. The zero is a real recorded value, not missing data."
    no_data_in_source: "{scope} has {available} recorded but no {requested}, so there is nothing to report rather than a zero."
    partial_coverage: "{covered} of {requested_total} {entity} have {metric} recorded; the rest are not reported rather than zero."
    unavailable_in_source: "{requested} is not held in this data."

    # ---- v2.0 additions ---------------------------------------------------
    unresolved_year: "{value} houses have a sanction date outside the years held in the database and are reported separately rather than dropped."
    completed_underfunded: "{value} houses are recorded complete with less released than sanctioned."
    placeholder_excluded: "{value} placeholder rows were excluded; they are not real sanctioned houses."
    low_confidence_geography: "{value} of these houses are fuzzy-matched to their village, so the geography split is approximate."
    cross_scheme_caveat: "PMAY and MGNREGA amounts are not like for like - {measure_semantics}."
    cross_scheme_coverage: "{both} villages have both schemes, {pmay_only} PMAY only, {mgnrega_only} MGNREGA only."
    district_code_unavailable: "District and block are held as names only - there is no LGD code for them in this data."
    entity_not_found: "'{value}' is not in the PMAY data. Closest matches: {suggestions}."
    ambiguous_entity_resolved: "Read '{value}' as {resolved} in {district}. There are {count} places with that name."
    colliding_name_resolved: "Read '{value}' as a block. It is also the name of a village - say 'village {value}' for that reading."
    period_trimmed: "Sanctions run from {first_period} to {last_period}, so the period was trimmed to {applied_range}."
    outside_data_span: "No sanctions are recorded for {period}. The data runs from 9 August 2017 to 4 July 2023."
    permission_denied: "That level of detail is above your access. The finest level available to you is {allowed_level}."
    execution_failed: "The query could not be completed. Please try a narrower period or a smaller area."

    # ---- lines that travel alongside the answer --------------------------
    unit_statement: "Amounts are in {unit} rupees."
    assumption_prefix: "Assumed: {assumptions}."
    record_grain_note: "One row is one beneficiary-sanction-house record, so houses and beneficiaries are the same count here."
    flat_sanction_note: "Sanctioned amount is a flat ₹1,30,000 per house, so this figure is the house count times that entitlement."
    sanctioned_ranking_note: "Ranking by sanctioned amount is the same as ranking by number of houses, since every house carries the same ₹1,30,000."
    partial_year_caveat: "FY 2023-24 covers only April to June 2023 - sanctions stop on 4 July 2023 - so it is not a full year."
    newest_year_completion_note: "Completion is lower in the newer years because those houses are the most recent, not because progress slowed."
    calendar_year_note: "Read {year} as the calendar year, January to December."
    financial_year_note: "Financial years run April to March and are derived from the sanction date."
    sanction_date_only_note: "Dates are sanction dates - there is no completion or payment date in this data."
    women_definition_note: "Women covers Woman-Married, Woman-Widow, Woman-Unmarried and Woman. Joint husband-and-wife allotments are counted separately."
    joint_allotment_note: "A further {joint_count} houses are jointly allotted to husband and wife, which also involve a woman."
    status_authority_note: "Completion is taken from house status, not from installments paid or amount released."
    pending_definition_note: "Pending here means houses not recorded as Completed, not an amount of money."
    installment_ladder_note: "Amount released moves in steps with installments - ₹52,000 at one, ₹1,10,500 or ₹1,20,000 at two, ₹1,30,000 at three."
    village_identity_note: "Villages are counted by LGD code, since 198 village names are shared by more than one village."
    sanction_order_note: "One sanction order can cover up to 322 houses, so sanctions and houses are different counts."
    duplicate_registration_note: "{duplicates} registration numbers appear twice, so record count and distinct beneficiary count differ."
    region_expansion_note: "{region} covers {districts}."
    undated_records_note: "{excluded} records have no sanction date and are left out of year-based figures."
    nulls_excluded_note: "{excluded} records have no release recorded and are left out of the average rather than counted as zero."
    missing_status_note: "{excluded} records have no house status and are excluded from the status breakdown."
    missing_parent_name_note: "Father's or mother's name is missing on {missing} records ({missing_pct}%)."
    fuzzy_mapping_note: "{fuzzy} records ({fuzzy_pct}%) are fuzzy-matched to their village, so village figures may be imprecise."
    singleton_category_note: "'{category}' holds a single record and is almost certainly a data-entry artefact."
    summary_vs_detail_note: "The financial-year summary totals 170,981 houses; the detail records total 1,71,107, the difference being the undated records."
    threshold_breach: "{scope} is below {threshold} at {value}."
    threshold_pass: "{scope} is at or above {threshold} at {value}."
    outlier_note: "{entity} is well clear of the rest and pulls the average up."
    large_result: "Showing the first {shown} of {total} rows."

  # =======================================================================
  follow_up_rules:

    # ---- move up or down the hierarchy ----------------------------------
    - condition: "result_is_statewide"
      suggestion: "Split this by district?"

    - condition: "result_by_district"
      suggestion: "Break this down by block?"

    - condition: "result_by_block"
      suggestion: "Break this down by village?"

    - condition: "result_is_single_village"
      suggestion: "Compare this against the rest of the block?"

    - condition: "result_is_single_district"
      suggestion: "See how this compares with the other districts?"

    - condition: "result_is_region"
      suggestion: "See the districts inside that region separately?"

    # ---- move across time -----------------------------------------------
    - condition: "result_has_single_year"
      suggestion: "Compare this against the previous financial year?"

    - condition: "result_is_single_value"
      suggestion: "See how this has moved across the seven years?"

    - condition: "result_is_time_series"
      suggestion: "See which districts drove the change?"

    - condition: "result_is_comparison"
      suggestion: "See the same comparison for the other years?"

    - condition: "result_includes_2023_24"
      suggestion: "Exclude FY 2023-24, since it holds only April to June?"

    - condition: "result_is_calendar_year"
      suggestion: "See the same figure by financial year instead?"

    # ---- move across measures -------------------------------------------
    - condition: "result_is_house_count"
      suggestion: "See how many of them are completed?"

    - condition: "result_is_completed_count"
      suggestion: "See the houses still under construction?"

    - condition: "result_is_status_breakdown"
      suggestion: "See the amount released against each stage?"

    - condition: "result_is_completion_rate"
      suggestion: "See the house counts behind that rate?"

    - condition: "result_is_amount_released"
      suggestion: "See what share of the sanctioned amount that is?"

    - condition: "result_is_utilisation"
      suggestion: "See the pending amount for the same scope?"

    - condition: "result_is_sanctioned_amount"
      suggestion: "See the amount actually released instead?"

    - condition: "result_is_pending_amount"
      suggestion: "See the houses those pending amounts belong to?"

    # ---- v2.0 additions ---------------------------------------------------
    - condition: "result_is_completion_count"
      suggestion: "See how many of those are recorded complete but underfunded?"

    - condition: "result_has_unresolved_years"
      suggestion: "See the houses that could not be placed in a financial year?"

    - condition: "result_is_pmay_money_by_district"
      suggestion: "Compare that against MGNREGA spending for the same districts?"

    - condition: "result_is_village_list"
      suggestion: "See which of those villages also have MGNREGA activity?"

    - condition: "result_is_monthly_series"
      suggestion: "See the same series by financial year instead?"

    - condition: "result_is_installment_breakdown"
      suggestion: "See the amount released at each installment stage?"

    - condition: "result_is_women_count"
      suggestion: "Include the joint husband-and-wife allotments as well?"

    - condition: "result_is_category_breakdown"
      suggestion: "See the completion rate for each category?"

    # ---- work with the list just returned --------------------------------
    - condition: "result_is_ranked_list"
      suggestion: "Would you like to see the lowest as well?"

    - condition: "result_is_ranked_list_top_n"
      suggestion: "See what share of the state total these account for?"

    - condition: "result_has_tie"
      suggestion: "Break the tie on a second measure?"

    - condition: "result_has_outlier"
      suggestion: "See the figures with that entry set aside?"

    - condition: "result_row_count_exceeds_display"
      suggestion: "Export the full list?"

    - condition: "result_is_record_listing"
      suggestion: "Summarise these records by status instead?"

    # ---- recover from a thin or failed answer ----------------------------
    - condition: "result_is_empty"
      suggestion: "Try a wider period, or the block this village sits in?"

    - condition: "result_is_all_zero"
      suggestion: "Check a year when this village did record sanctions?"

    - condition: "entity_not_found"
      suggestion: "List the villages in that district instead?"

    - condition: "entity_resolved_by_assumption"
      suggestion: "Did you mean the village of that name rather than the block?"

    - condition: "result_has_partial_coverage"
      suggestion: "See which of them have nothing recorded?"

    - condition: "measure_unavailable_in_source"
      suggestion: "See what is recorded for that area instead?"

    - condition: "result_excludes_undated_records"
      suggestion: "See the 126 records with no sanction date?"

    - condition: "result_has_fuzzy_mapping"
      suggestion: "Restrict this to fully mapped records?"
