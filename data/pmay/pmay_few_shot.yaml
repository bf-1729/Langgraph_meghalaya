# pmay_few_shot.yaml
#
# Validated question-to-SQL pairs for PMAY-G - node 5.10.
#
# ===========================================================================
# v2.0 - 2026-08-24 - RETARGETED TO THE CURATED STAR SCHEMA
#
# Every example was rewritten against curated.v_pmay. The v1.0 examples ran
# against the flat table pmay_beneficiaries, which does not exist in megh_db.
#
# House rules encoded in every example below:
#   FROM curated.v_pmay              never pmay_beneficiaries
#   WHERE NOT is_placeholder         on every count and every sum
#   is_completed                     never status_name = 'Completed'
#   financial_year_short             never a CASE derivation from sanction_date
#   SUM(amount_pending)              never sanctioned_amount - amount_released
#   installments_paid                never installment_paid
#   lgd_district / lgd_block         UPPERCASE literals - dim_geography stores them so
#   village_code                     for counting villages, never a name
#   amounts are RUPEES               divide by 1e7 for crore, and say the unit
#
# Examples marked status: RETIRED_v2.0 are kept as NEGATIVE examples - their
# premise is gone (beneficiary names dropped at ingest, pmay_fy_summary absent).
# Never emit their v1_sql. They are here so a stale retrieval hit is recognised.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db. They are correct
# against the structure in SCHEMA_FOR_DEVELOPERS.md (2026-08-24) and unverified
# against the data. Run them before trusting a result.
# ===========================================================================

sql_generation_examples:
# --- 2026-09-28 PMAY-G use-case QA (KI-089, KI-092, KI-093): one row per named area,
# ratio of totals, no LIMIT 1 on a comparison. Executed against megh_db.
- question: Give me the PMAY financial summary for Mawphlang block.
  sql: |
    SELECT COUNT(*) AS houses,
           SUM(sanctioned_amount) AS sanctioned_rupees,
           SUM(COALESCE(amount_released, 0)) AS released_rupees,
           SUM(sanctioned_amount) - SUM(COALESCE(amount_released, 0)) AS remaining_rupees
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND lgd_block = 'MAWPHLANG';
  tables:
  - curated.v_pmay
- question: What percentage of the sanctioned amount has been released in East Khasi Hills?
  sql: |
    SELECT ROUND(100.0 * SUM(COALESCE(amount_released, 0)) / NULLIF(SUM(sanctioned_amount), 0), 2) AS released_pct
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanctioned_amount > 0
      AND lgd_district = 'EAST KHASI HILLS';
  tables:
  - curated.v_pmay
- question: Compare the sanctioned amounts of Umsning and Amlarem blocks.
  sql: |
    SELECT lgd_block, COUNT(*) AS houses, SUM(sanctioned_amount) AS sanctioned_rupees
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND lgd_block IN ('UMSNING', 'AMLAREM')
    GROUP BY lgd_block
    ORDER BY sanctioned_rupees DESC;
  tables:
  - curated.v_pmay
- question: How many PMAY houses are there?
  sql: |
    SELECT COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder;
  tables:
  - curated.v_pmay
- question: How many distinct beneficiaries are there?
  sql: |
    SELECT COUNT(DISTINCT reg_no) AS distinct_beneficiaries
    FROM curated.v_pmay
    WHERE NOT is_placeholder;
  tables:
  - curated.v_pmay
- question: How many houses are there in West Garo Hills?
  sql: |
    SELECT COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND lgd_district = 'WEST GARO HILLS';
  tables:
  - curated.v_pmay
- question: Houses by district
  sql: |
    SELECT lgd_district, COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
    GROUP BY lgd_district
    ORDER BY houses DESC
    LIMIT 12;
  tables:
  - curated.v_pmay
- question: How many sanction orders were issued?
  sql: |
    SELECT COUNT(DISTINCT sanction_no) AS sanction_orders
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanction_no IS NOT NULL;
  tables:
  - curated.v_pmay
- question: How many houses are completed?
  sql: |
    SELECT COUNT(*) AS completed_houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND is_completed;
  tables:
  - curated.v_pmay
- question: Break down houses by construction stage
  sql: |
    SELECT status_name, COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND status_name IS NOT NULL
    GROUP BY status_name
    ORDER BY CASE status_name
               WHEN 'Proposed Site'             THEN 1
               WHEN 'Existing site(Old House)'  THEN 2
               WHEN 'House Sanctioned'          THEN 3
               WHEN 'Plinth'                    THEN 4
               WHEN 'Roof Cast'                 THEN 5
               WHEN 'Completed'                 THEN 6
             END
    LIMIT 6;
  tables:
  - curated.v_pmay
- question: How many houses are not yet completed?
  sql: |
    SELECT COUNT(*) AS not_completed_houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND is_completed IS DISTINCT FROM TRUE;
  tables:
  - curated.v_pmay
  note: 'v2.0: no status_name IS NOT NULL guard. is_completed is nullable, and a house with no recorded stage is still not
    completed - the v1.0 guard dropped it.'
- question: How many houses are under construction?
  sql: |
    SELECT COUNT(*) AS in_progress_houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND is_in_progress;
  tables:
  - curated.v_pmay
  note: 'v2.0: is_in_progress is the database roll-up. The v1.0 member list (''Roof Cast'',''Plinth'',''House Sanctioned'')
    was this project''s reconstruction of it; if the two disagree the flag wins.'
- question: What percentage of houses are completed?
  sql: |
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE is_completed)
                 / NULLIF(COUNT(*), 0), 2) AS completion_pct
    FROM curated.v_pmay
    WHERE NOT is_placeholder;
  tables:
  - curated.v_pmay
- question: Completion rate by district
  sql: |
    SELECT lgd_district,
           COUNT(*) AS houses,
           COUNT(*) FILTER (WHERE is_completed) AS completed,
           ROUND(100.0 * COUNT(*) FILTER (WHERE is_completed)
                 / NULLIF(COUNT(*), 0), 2) AS completion_pct
    FROM curated.v_pmay
    WHERE NOT is_placeholder
    GROUP BY lgd_district
    ORDER BY completion_pct DESC
    LIMIT 12;
  tables:
  - curated.v_pmay
- question: Which district has the most completed houses?
  sql: |
    SELECT lgd_district, COUNT(*) AS completed_houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND is_completed
    GROUP BY lgd_district
    ORDER BY completed_houses DESC
