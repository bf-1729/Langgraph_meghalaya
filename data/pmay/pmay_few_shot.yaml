- question: Share of houses allotted to women by district
  sql: |
    SELECT lgd_district,
           COUNT(*) AS houses,
           COUNT(*) FILTER (WHERE house_alloted_to IN ('Woman-Married', 'Woman-Widow',
                                                       'Woman-Unmarried', 'Woman'))
             AS houses_to_women,
           ROUND(100.0 * COUNT(*) FILTER (WHERE house_alloted_to IN ('Woman-Married',
                   'Woman-Widow', 'Woman-Unmarried', 'Woman'))
                 / NULLIF(COUNT(*), 0), 2) AS women_share_pct
    FROM curated.v_pmay
    WHERE NOT is_placeholder
    GROUP BY lgd_district
    ORDER BY women_share_pct DESC
    LIMIT 12;
