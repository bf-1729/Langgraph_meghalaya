- question: How many houses were sanctioned in 2023?
  sql: |
    SELECT COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanction_date >= '2023-01-01'
      AND sanction_date <  '2024-01-01';
  tables:
  - curated.v_pmay
- question: Houses sanctioned by calendar year
  sql: |
    SELECT EXTRACT(YEAR FROM sanction_date) AS sanction_year,
           COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanction_date IS NOT NULL
    GROUP BY sanction_year
    ORDER BY sanction_year
    LIMIT 7;
  tables:
  - curated.v_pmay
- question: Monthly sanctions in 2023
  sql: |
    SELECT sanction_month AS sanction_month,
           COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanction_date >= '2023-01-01'
      AND sanction_date <  '2024-01-01'
    GROUP BY sanction_month
    ORDER BY sanction_month
    LIMIT 12;
  tables:
  - curated.v_pmay
  note: 'v2.0: sanction_month is stored - group on it directly.'
- question: What period does the data cover?
  sql: |
    SELECT MIN(sanction_date) AS first_sanction,
           MAX(sanction_date) AS last_sanction,
           COUNT(*) FILTER (WHERE sanction_date IS NULL) AS undated_records,
           COUNT(*) AS total_records
    FROM curated.v_pmay
    WHERE NOT is_placeholder;
  tables:
  - curated.v_pmay
