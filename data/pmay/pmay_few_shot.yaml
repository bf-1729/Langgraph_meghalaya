# FIXED 2026-09-08: the two examples below used to share the same GROUP BY
# breakdown SQL for both questions (bucket values were unknown at v2.0 time,
# so a precise filtered COUNT couldn't be written). mapping_category values are
# now confirmed against live data — 'Fully Mapped' / 'Fuzzy Mapped', 136,141 /
# 34,966 rows, same values used by "Mapping quality by district" below — so
# each question now gets its own filtered count instead of a breakdown that
# doesn't actually answer either one.
- question: How many records are fully mapped?
  sql: |
    SELECT COUNT(*) AS fully_mapped_records
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND mapping_category = 'Fully Mapped';
  tables:
  - curated.v_pmay
- question: How many records are fuzzy mapped?
  sql: |
    SELECT COUNT(*) AS fuzzy_mapped_records,
           ROUND(100.0 * COUNT(*) FILTER (WHERE mapping_category = 'Fuzzy Mapped')
                 / NULLIF(COUNT(*), 0), 2) AS share_pct
    FROM curated.v_pmay
    WHERE NOT is_placeholder;
  tables:
  - curated.v_pmay
- question: Mapping quality by district
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE mapping_category = 'Fully Mapped') AS fully_mapped,
           COUNT(*) FILTER (WHERE mapping_category = 'Fuzzy Mapped') AS fuzzy_mapped,
           COUNT(*) AS houses
    FROM curated.v_pmay
    WHERE NOT is_placeholder
    GROUP BY lgd_district
    ORDER BY fuzzy_mapped DESC
    LIMIT 12;
  tables:
  - curated.v_pmay
- question: How many records have missing sanction dates?
  sql: |
    SELECT COUNT(*) AS undated_records
    FROM curated.v_pmay
    WHERE NOT is_placeholder
      AND sanction_date IS NULL;
  tables:
  - curated.v_pmay
- question: Which registration numbers appear more than once?
  sql: |
    SELECT reg_no, COUNT(*) AS records
    FROM curated.v_pmay
    WHERE NOT is_placeholder
    GROUP BY reg_no
    HAVING COUNT(*) > 1
    ORDER BY reg_no
    LIMIT 100;
  tables:
  - curated.v_pmay
