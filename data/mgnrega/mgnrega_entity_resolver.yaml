maintenance:
  source_files:
  - quadrent/datasets/Updated MNGREGA Expenditure WIth Year.xlsx
  - quadrent/datasets/MGNREGA_Employment.xlsx
  expenditure_sheet_name: "Mactched Village MNGREGA"   # the typo is in the file
  employment_sheet_name: Sheet1
  row_counts_at_generation: { mgnrega_expenditure: 18818, mgnrega_employment: 26375 }
  last_generated: '2026-08-21'
  regeneration_rules:
  - Re-profile both workbooks and diff every count in this file. Explain each change.
  - APPEND new canonical values and aliases. Never delete one - old questions about old
    years and old village names must keep resolving.
  - Re-run the ambiguity registry. If a name gains a code, it must appear here.
  - Check any new district acronym against the existing 12 before adding it.
  - Re-check cross_dimension_collisions when blocks or constituencies change.
  - Bump resolver_version.
  see_also: Annotations/README.md
