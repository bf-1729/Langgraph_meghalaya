resolver_version: '2.0'
resolver_name: mgnrega_entity_resolver
display_name: MGNREGA Entity Resolver (Meghalaya)
generated_from:
- quadrent/datasets/Updated MNGREGA Expenditure WIth Year.xlsx
- quadrent/datasets/MGNREGA_Employment.xlsx
- Annotations/stage2_mgnrega_combined_production.yaml
generated_on: '2026-08-21'
companion_schema: stage2_mgnrega_combined_production.yaml

description: >
  Value-level entity resolution for the MGNREGA NLP-to-SQL bot. This file answers exactly
  one question: the user typed some text - which stored database value did they mean?
  It does NOT describe column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: mgnrega
  display_name: MGNREGA
  full_name: Mahatma Gandhi National Rural Employment Guarantee Act
  state: Meghalaya
  aliases: [MGNREGA, MNREGA, NREGA, NREGS, "MGNREGS", "Mahatma Gandhi NREGA",
            "employment guarantee scheme", "job card scheme", "100 days work scheme",
            "rural employment scheme"]

tables:
  expenditure: mgnrega_expenditure
  employment: mgnrega_employment

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE  (read this before resolving anything)
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide which entity type each span of user text is. Order of attempt matters
    because block, constituency and village names overlap heavily - see
    cross_dimension_collisions. Try: year -> district -> block -> assembly_constituency
    -> village -> measure.
  step_2_normalise: Apply normalisation.fold to both the user text and the candidate values.
  step_3_match: Walk matching_pipeline in order. Stop at the first stage that produces a hit.
  step_4_emit: Return the output_contract shape. Never emit raw user text into SQL.
  step_5_predicate: Build the WHERE clause using the per-dimension sql_predicate template.

  hard_rules:
  - Villages are resolved by village_code, never by name alone. 238 village names are
    shared by two or more different villages.
  - Never filter on village_clean (expenditure) or village (employment). Those are raw
    pre-LGD text. Always filter on lgd_village_name.
  - The two tables store geography in DIFFERENT CASE. Always compare case-folded, and
    emit the per-table stored form given under stored_as.
  - If more than one candidate survives with no way to separate them, return
    status ambiguous and ask. Do not pick the first row.
  - If nothing matches above the fuzzy floor, return status not_found with suggestions.
    Never invent a district, block, village, constituency or year.
  - Only the four financial years listed under year exist. Do not extrapolate.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim leading/trailing whitespace
  - collapse internal whitespace runs to a single space
  - uppercase
  - strip the characters . , ' and the words BLOCK, DISTRICT, VILLAGE, C&RD, AC,
    CONSTITUENCY when they appear as a trailing qualifier
  - map & to AND
  - treat - and / and ( ) as a single space, then re-collapse whitespace
  squash: >
    a second, stricter key used only for tie-breaking: remove EVERY non-alphanumeric
    character from the folded form. "SHELLA BHOLAGANJ" and "Shella-Bholaganj" both
    squash to SHELLABHOLAGANJ.
  numeric_ids: >
    village_code is an integer in both workbooks. Cast user-typed codes with int();
    strip any trailing .0 before comparing.

matching_pipeline:
- stage: 1_exact
  test: folded user text == folded canonical value
  confidence: 1.0
- stage: 2_alias
  test: folded user text is in the value's aliases list
  confidence: 0.98
- stage: 3_squash
  test: squashed user text == squashed canonical or squashed alias
  confidence: 0.95
- stage: 4_acronym
  test: user text matches an acronym in the district table (districts only)
  confidence: 0.95
  note: acronyms are defined for districts only; do not invent them for blocks or ACs
- stage: 5_contains
  test: >
    folded canonical is a whole-word substring of the user text, or vice versa
    (catches "in East Garo Hills district of Meghalaya")
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio against the dimension catalogue
  accept_at: ">= 90 and the runner-up is at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
  confidence: score / 100
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND the value is unique in its dimension
  otherwise: fall through to not_found with the top 5 as suggestions
- stage: 8_fail
  action: emit not_found

blocked_matches:
  purpose: >
    Pairs that fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value
    to the right value; require an exact or alias hit.
  pairs:
  - [LASKEIN, THADLASKEIN]        # two different West Jaintia Hills blocks
  - [THADLASKEIN, LASKEIN]
  - [MAWKYNREW, MAWKYRWAT]        # East Khasi Hills vs South West Khasi Hills
  - [MAWKYRWAT, MAWKYNREW]
  - [MAWSYNRAM, MAWSHYNRUT]       # East Khasi Hills vs West Khasi Hills
  - [MAWSHYNRUT, MAWSYNRAM]
  - [SIJU, SAIPUNG]
  - [MAWIONG, MAWLONG]            # both are ambiguous village names in their own right
  - [MAWSAW, MAWSMAI]
  - [NORTH TURA, SOUTH TURA]      # two different constituencies

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | assembly_constituency | village | year | measure
    user_text: <verbatim span>
    canonical: <canonical value>
    stored_as: { expenditure: <value or null>, employment: <value or null> }
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, village_code, district, block } ]
    question: <one short clarifying question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the MGNREGA data.

# ---------------------------------------------------------------------------
# CROSS-DIMENSION COLLISIONS - the highest-risk part of this resolver
# ---------------------------------------------------------------------------
cross_dimension_collisions:
  why: >
    Block names, assembly constituency names and village names overlap massively in
    Meghalaya. A bare "Mawlai" is a valid block, a valid constituency AND a valid
    village. Districts are the only dimension with zero collisions.
  measured:
    block_names_that_are_also_ac_names: 26
    block_names_that_are_also_village_names: 28
    ac_names_that_are_also_village_names: 26
    district_collisions: 0
  disambiguation_rules:
  - If the user said "constituency", "AC", "assembly", "MLA" or gave a number, resolve
    as assembly_constituency.
  - Else if the user said "block", "C&RD block" or "development block", resolve as block.
  - Else if the user said "village", "gaon" or "GP", resolve as village.
  - With no qualifier, default to BLOCK. Blocks are the level MGNREGA is administered at
    and the level users mean by default.
  - State the assumption in the answer whenever the default rule fired and the name was
    also valid at another level.
  - assembly_constituency exists ONLY in mgnrega_employment. If the question needs
    expenditure and names a constituency, say so instead of silently switching level.

# ---------------------------------------------------------------------------
# DIMENSIONS
# ---------------------------------------------------------------------------
