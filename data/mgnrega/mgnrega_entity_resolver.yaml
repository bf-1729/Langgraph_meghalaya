    name_variation:
      why: >
        The raw source name and the LGD-standardised name differ for a large share of
        rows. The resolver must expect the user to type either. Match against
        lgd_village_name but be tolerant of the raw form's shape.
      raw_vs_lgd_rows:
        expenditure: { differing: 18818, case_only: 16860, real_change: 1958 }
        employment:  { differing: 2270,  case_only: 0,     real_change: 2270 }
      distinct_real_pairs: { expenditure: 482, employment: 839, total: 1321 }
      patterns:
      - pattern: spacing_shift
        count: 314
        rule: >
          words merge or split between raw and LGD. Always compare on the squashed key
          as well as the folded key.
        examples:
        - ["DARANGDURA", "Darang Dura"]
        - ["GOKA PEPCHANDAL", "Gokapepchandal"]
        - ["SIJUTENGKIGITTIM", "Siju Tengkigittim"]
        - ["KARUKOL A DINGGRE", "Karukol Adinggre"]
      - pattern: spelling_edit
        count: 505
        rule: >
          one or two character corrections, usually doubled consonants in Garo names
          (GITTIM/GITIM, NGG/NG). Fuzzy matching handles these; the squash key does not.
        examples:
        - ["AGRENGGITTIM", "Agrenggitim"]
        - ["GITTINGGRE", "Gitinggre"]
        - ["DIKRONGGRE", "Dikgronggre"]
        - ["MATMAGITIK", "Matmagittik"]
        warning: >
          AGRENGGITTIM vs Agrenggitim looks like a pure case fold but is GITTIM vs GITIM.
          Never assume case-insensitive equality implies a match - always compare folded.
      - pattern: qualifier_in_parentheses
        count: 201
        rule: >
          LGD adds a bracketed qualifier the user will not type. Strip ( ) content when
          matching, and keep it when displaying.
        examples:
        - ["CHANDABHOI HAJONGPARA", "Chandabhoi (Hajongpara)"]
        - ["BANGAL KHATA MUSLIM", "Bangal Khata(Muslim)"]
        - ["SHYAMDING GARO", "Shyamding ( Garo )"]
        - ["MEKKA APAL", "Mekka A. Pal"]
      - pattern: affix_added_or_dropped
        count: 239
        rule: >
          a roman numeral, direction word or A/B suffix is added or removed. Treat
          I/II/III, -I/-II, A/B and East/West/Upper/Lower suffixes as soft tokens.
        examples:
        - ["CHERENGPARA", "Cherengpara I"]
        - ["JATRAKONA", "Jatrakona-I"]
        - ["DIMAPARA A", "Dimapara"]
        - ["DURA", "Dura-Asimgiri"]
      - pattern: genuine_rename
        count: 62
        rule: >
          the LGD name is a different name. No string rule will find these. They can only
          be resolved through village_code or the dimension catalogue. If the user types
          the old name and it is not in lgd_village_name, go to fuzzy/embedding, and if
          that fails return not_found - do not fabricate.
        examples:
        - ["CHAMBIL BADIMAGRE", "Upper Chambil Badimagre"]
        - ["SIJU DOCHETGITTIM", "Dochetgittim"]
        - ["RONGKUAKGRE", "Daji Rongkuakgre"]
        - ["NEW DALCHENGKONA", "Dalchengkona"]
        - ["NONGSHILLIANG", "Kreit Nongshilliang"]

  match_method:
    column: { employment: match_method }
    expenditure: null
    purpose: ETL provenance for how the source village was mapped to an LGD village.
    values:
    - canonical: "Direct - current LGD"
      rows: 25135
      confidence: high
      aliases: ["direct", "direct match", "current LGD"]
    - canonical: "Via shifted-village list"
      rows: 1240
      confidence: medium
      aliases: ["shifted", "shifted village", "via shifted list"]
      implication: >
        These are the same 1240 rows with a null assembly constituency. The village was
        reassigned between LGD revisions. Prefer lgd_village_name over any older name the
        user may type.
    runtime: >
      ETL metadata. Do not surface or filter on it unless the user explicitly asks about
      data quality or mapping method.

# ---------------------------------------------------------------------------
# MEASURE VOCABULARY - user phrasing to column. stage2 owns the aggregation rules.
# ---------------------------------------------------------------------------
measure_vocabulary:
  note: >
    Resolve the metric the user named to exactly one column before SQL generation. If the
    phrasing maps to more than one column, ask. Never sum two measures the user did not
    ask to combine.

  expenditure_table:
  - column: total_exp
    aliases: [total expenditure, total spending, total spend, total expense, expenditure,
              spending, spend, money spent, amount spent, funds spent, outlay]
    default_for: a bare "expenditure" or "spending" question
  - column: exp_unskilled_wage
    aliases: [unskilled wage, unskilled wages, unskilled wage expenditure, unskilled labour
              wages, wage expenditure, wages]
    note: >
      a bare "wages" is ambiguous between unskilled and semi-skilled. Unskilled is by far
      the larger component; if the user says only "wages", ask or state the assumption.
  - column: exp_semi_skilled_wage
    aliases: [semi skilled wage, semi-skilled wages, semiskilled wage expenditure]
  - column: exp_material
    aliases: [material, materials, material expenditure, material cost, material spending]
  - column: exp_tax
    aliases: [tax, tax expenditure, tax expense, taxes]
  excluded:
    columns: [adm_exp_rec, adm_exp_non_rec, adm_exp_total]
    aliases_that_must_not_resolve: [administrative expenditure, admin cost, admin expense,
              overhead]
    behaviour: >
      These are marked excluded in stage2. If the user asks for administrative
      expenditure, say it is excluded by policy rather than silently answering with
      total_exp.

  employment_table:
  - column: employment_provided_persons
    aliases: [persons employed, people employed, workers, number of people, persons
              provided employment, individuals employed]
  - column: employment_provided_households
    aliases: [households employed, families employed, households provided employment,
              households given work]
  - column: employment_provided_total_person_days
    aliases: [person days, person-days, mandays, man days, total person days,
              employment days, days of work generated]
  - column: households_completed_100_days_work
    aliases: [100 days, 100 days completed, households completed 100 days,
              full employment households, hundred days work]
  - column: job_cards_issued_total
    aliases: [job cards, job cards issued, total job cards, cards issued]
  - column: women_employment_provided
    aliases: [women employed, female employment, women provided employment,
              women workers, female workers]
  - column: benefit_to_households
    aliases: [benefit, household benefit, benefit to households, benefit amount]
    unit: thousands of currency units
    caveat: >
      NULL in 11633 of 26375 rows (44%). NULL means not recorded, not zero. Any AVG over
      this column silently covers only about half the rows - say so in the answer.

  ambiguous_terms:
    beneficiary:
      status: SME_CONFIRMATION_REQUIRED
      candidates: [employment_provided_households, employment_provided_persons]
      behaviour: ask whether households or persons are meant. Do not default.
    wages:
      candidates: [exp_unskilled_wage, exp_semi_skilled_wage]
      behaviour: default to exp_unskilled_wage and state the assumption, or ask.
    employment:
      candidates: [employment_provided_persons, employment_provided_households,
                   employment_provided_total_person_days]
      behaviour: ask which measure of employment is intended.

# ---------------------------------------------------------------------------
region_groupings:
  note: >
    Users group districts by hill range. These are not columns - expand the group into
    an IN list of districts and say which districts were included.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group.
        Do not fold it into Khasi Hills. This is the one name that is both a district
        and a region; both readings produce the same filter, so no clarification is
        needed - resolve it as the district.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.

# ---------------------------------------------------------------------------
joins:
  key: village_code
  columns: { expenditure: village_code, employment: village_code }
  employment_source_header: >
    village_code comes from the SECOND column literally headed "Village" in
    MGNREGA_Employment.xlsx, which pandas renames Village.1. The first "Village" column
    is the name. Confusing these destroys the join.
  coverage:
    expenditure_codes: 4673
    employment_codes: 6419
    overlap: 4601
    expenditure_only: 72       # villages with expenditure but no employment rows
    employment_only: 1818      # villages with employment but no expenditure rows
  unmatched_behaviour: >
    A village present in only one table must answer "no <other> data recorded for this
    village", never zero.

  grain_warning:
    critical: true
    detail: >
      (village_code, year) is NOT unique. It repeats 181 times in expenditure and 2069
      times in employment. Joining the two tables on village_code alone fans out rows and
      inflates every SUM.
    required_pattern: >
      Aggregate each side to (village_code, year) in a subquery FIRST, then join the two
      aggregates on village_code AND the translated year. Never join the raw tables.
    counting: >
      COUNT(*) is a row count, not a village count. Use COUNT(DISTINCT village_code).

  year_translation_required: true
  join_predicate_template: |
    WITH exp AS (
      SELECT village_code, year, SUM(total_exp) AS total_exp
      FROM mgnrega_expenditure GROUP BY village_code, year
    ), emp AS (
      SELECT village_code, year, SUM(employment_provided_persons) AS persons
      FROM mgnrega_employment GROUP BY village_code, year
    )
    SELECT * FROM exp JOIN emp
      ON exp.village_code = emp.village_code
     AND LEFT(exp.year, 4) = LEFT(emp.year, 4)   -- '2023-2024' <-> '2023-24'

  fallback_join:
    use_when: village_code is missing on one side
    columns: [year, lgd_district, lgd_block, lgd_village_name]
    mandatory_case_fold: true
    detail: >
      Expenditure stores lgd_village_name in Title Case and employment stores it in ALL
      CAPS - 0 percent of rows match on a raw string compare. Every column in this
      fallback must be wrapped in UPPER() on both sides, and year must be translated
      first. Without this the fallback silently returns nothing.

  cross_table_geography_agreement:
    checked_on: the 4601 shared village codes
    district_disagreements: 0
    block_disagreements: 4
    village_name_disagreements: 1
    detail: >
      Geography is consistent across the two tables apart from five codes. Expenditure is
      canonical where they differ.
    exceptions:
    - { village_code: 276472, expenditure_block: SHALLANG,  employment_block: MAWSHYNRUT }
    - { village_code: 276474, expenditure_block: SHALLANG,  employment_block: MAWSHYNRUT }
    - { village_code: 276645, expenditure_block: SHALLANG,  employment_block: MAWSHYNRUT }
    - { village_code: 276888, expenditure_block: NONGSTOIN, employment_block: RAMBRAI,
        expenditure_village: MAWPHANLUR, employment_village: MAWBYRKONG }

# ---------------------------------------------------------------------------
# WORKED EXAMPLES - the intended behaviour, end to end
# ---------------------------------------------------------------------------
worked_examples:

- user: "total expenditure in EGH for 2023-24"
  resolve:
  - { text: EGH, type: district, canonical: East Garo Hills, matched_by: 4_acronym,
      stored_as_expenditure: "East Garo Hills" }
  - { text: "2023-24", type: year, canonical: '2023-2024', matched_by: 2_alias,
      stored_as_expenditure: '2023-2024' }
  - { text: total expenditure, type: measure, canonical: total_exp }
  sql_filter: "lgd_district = 'East Garo Hills' AND year = '2023-2024'"

- user: "e garo hill spending"
  resolve:
  - { text: "e garo hill", type: district, canonical: East Garo Hills, matched_by: 2_alias }
  note: >
    Demonstrates the alias family: EGH, E Garo Hills, East Garo Hill, East Garo and
    EAST GARO HILLS all land on the same canonical district.

- user: "person days in East Garo Hills in 2023-24"
  resolve:
  - { text: East Garo Hills, type: district, canonical: East Garo Hills,
      stored_as_employment: "EAST GARO HILLS" }
  - { text: "2023-24", type: year, canonical: '2023-2024',
      stored_as_employment: '2023-24' }
  - { text: person days, type: measure, canonical: employment_provided_total_person_days }
  sql_filter: "UPPER(lgd_district) = 'EAST GARO HILLS' AND year = '2023-24'"
  note: >
    Same district, same year, same question shape as the first example - but because this
    one hits the employment table, BOTH the district casing and the year format change.
    This is the single most common source of silent zero-row answers.

- user: "expenditure in Asimgre"
  resolve:
  - { text: Asimgre, type: village, status: ambiguous }
  response:
    status: ambiguous
    candidates: 7 distinct village_codes named ASIMGRE
    districts: [East Garo Hills, South Garo Hills, South West Garo Hills, West Garo Hills]
    question: "Asimgre exists in four districts. Which one did you mean?"
  note: never pick the first row.

- user: "expenditure in Asimgre, West Garo Hills"
  resolve:
  - { text: West Garo Hills, type: district, canonical: West Garo Hills }
  - { text: Asimgre, type: village, scoped_by: district }
  note: >
    Scoping by district narrows ASIMGRE to the codes in West Garo Hills. If exactly one
    remains, resolve it and emit village_code. If more than one remains, ask for the block.

- user: "how much was spent in Aruakgre"
  resolve:
  - { text: Aruakgre, type: village, status: ambiguous, resolve_by: block }
  note: >
    ARUAKGRE has 2 codes and both are in North Garo Hills. Naming the district does not
    help - ask for the block. This is the resolve_by: block case, 47 names behave this way.

- user: "spending in Mawlai"
  resolve:
  - { text: Mawlai, type: block, canonical: MAWLAI, assumption: default_level }
  note: >
    MAWLAI is simultaneously a block, an assembly constituency (15 MAWLAI) and a village
    name. With no qualifier the default is block. State the assumption in the answer.

- user: "spending in Mawlai constituency"
  resolve:
  - { text: Mawlai, type: assembly_constituency, canonical: MAWLAI, number: 15 }
  note: >
    The word "constituency" flips the level. But assembly_constituency exists only in
    mgnrega_employment - there is no expenditure by constituency. Say that rather than
    silently answering at block level.

- user: "expenditure in Khatarshnong Laitkroh"
  resolve:
  - { text: Khatarshnong Laitkroh, type: block, canonical: KHATARSHNONG LAITKROH,
      in_tables: [employment] }
  response: >
    Resolves cleanly, but there are no expenditure rows for this block. Answer "no
    expenditure data recorded for KHATARSHNONG LAITKROH", not zero.

- user: "expenditure in 2023"
  resolve:
  - { text: "2023", type: year, status: ambiguous }
  question: "Do you mean FY 2022-2023 or FY 2023-2024?"

- user: "expenditure in Nagaland"
  resolve:
  - { text: Nagaland, type: unknown, status: not_found }
  response: >
    Not in the MGNREGA data - this dataset covers the 12 districts of Meghalaya only.
    Do not guess a district.

- user: "how many beneficiaries in Ri Bhoi"
  resolve:
  - { text: Ri Bhoi, type: district, canonical: Ri Bhoi }
  - { text: beneficiaries, type: measure, status: ambiguous }
  question: >
    "Beneficiaries" could mean households or persons. Which do you want?

