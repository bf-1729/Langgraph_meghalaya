  village:
    canonical_column: lgd_village_name
    stored_case: { expenditure: Title Case, employment: ALL CAPS }
    never_filter_on: [village_clean, village]     # raw pre-LGD text, expenditure/employment
    identity_column: village_code
    stored_type: integer (int64 in both workbooks - no float suffix to strip)
    distinct_names: { expenditure: 4433, employment: 6106, union: 6171 }
    distinct_codes: { expenditure: 4673, employment: 6419, overlap: 4601 }
    sql_predicate_preferred: "village_code = <code>"
    sql_predicate_fallback: "UPPER(lgd_village_name) = UPPER('<canonical>')"

    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up in the village catalogue scoped by any district or
         block the user also gave. Scoping first removes most ambiguity.
    - 3. If exactly one code survives, resolve. Emit the code, not the name.
    - 4. If more than one code survives, return ambiguous with the candidate codes and
         their district/block. Ask which one.
    - 5. If nothing survives, run fuzzy then embedding per matching_pipeline, then
         not_found with up to 5 suggestions.

    ambiguity:
      shared_names: 238
      detail: >
        238 village names in the union of both tables are used by two or more physically
        different villages. Village name alone is NEVER a key. The registry below lists
        every one of them, the number of distinct village_codes sharing the name, the
        districts involved, and what the user must supply to disambiguate.
      resolve_by_district: 191    # naming the district narrows it to one village
      resolve_by_block: 47        # all copies sit in ONE district - district does not
                                  # help, you must ask for the block
      registry_key: "NAME: { codes, districts, resolve_by }"
      district_codes_used: >
        EGH East Garo Hills, EJH East Jaintia Hills, EKH East Khasi Hills,
        EWKH Eastern West Khasi Hills, NGH North Garo Hills, RB Ri Bhoi,
        SGH South Garo Hills, SWGH South West Garo Hills, SWKH South West Khasi Hills,
        WGH West Garo Hills, WJH West Jaintia Hills, WKH West Khasi Hills
