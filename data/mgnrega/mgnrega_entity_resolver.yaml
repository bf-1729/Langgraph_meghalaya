      previous / last year: '2024-2025'
      earliest / first: '2022-2023'
      all years / overall / till date: all four, no year filter
    ambiguous_input:
      bare_four_digit_year: >
        "2023" could mean FY 2022-2023 or FY 2023-2024. Return ambiguous and ask which
        financial year. Do not default.
      calendar_range_outside_set: >
        Anything before 2022-23 or after 2025-26 is not in the data. Return not_found
        and state the available range.

