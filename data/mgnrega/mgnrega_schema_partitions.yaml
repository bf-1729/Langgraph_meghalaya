semantic_rules:
  geography_hierarchy:
  - lgd_district
  - lgd_block
  - lgd_village_name
  time_dimension: year
  year_formats:
    mgnrega_expenditure: YYYY-YYYY
    mgnrega_employment: YYYY-YY
  year_runtime_rule: Preserve exact stored label for the selected dataset.
  beneficiary_term:
    status: SME_CONFIRMATION_REQUIRED
    reason: Source has household and person measures but no single beneficiary field.
    candidate_measures:
    - employment_provided_households
    - employment_provided_persons
    runtime_behavior: Ask whether households or persons are intended.
  benefit_to_households:
    unit: thousands_of_currency_units
    base_currency_conversion: SUM(benefit_to_households) * 1000 only when explicitly requested.
  excluded_expenditure_columns:
  - adm_exp_rec
  - adm_exp_non_rec
  - adm_exp_total
  null_behavior: NULL is missing; never silently coerce to zero.
nlp_sql_rules:
  read_only: true
  allowed_operations:
  - SELECT
  aggregation_defaults:
    total_expenditure: SUM(total_exp)
    unskilled_wage: SUM(exp_unskilled_wage)
    semi_skilled_wage: SUM(exp_semi_skilled_wage)
    material: SUM(exp_material)
    tax: SUM(exp_tax)
    employment_households: SUM(employment_provided_households)
    employment_persons: SUM(employment_provided_persons)
    person_days: SUM(employment_provided_total_person_days)
    completed_100_days: SUM(households_completed_100_days_work)
    job_cards: SUM(job_cards_issued_total)
    women_employment: SUM(women_employment_provided)
    benefit_to_households: SUM(benefit_to_households)
  comparison: Filter requested years and GROUP BY year; do not invent year semantics.
  ranking: ORDER BY requested aggregate and default top 5 when N is omitted, recording the assumption.
  entity_behavior: Resolve exact values and approved aliases before SQL generation.
  unknown_entity: Do not guess; return not-found/did-you-mean.
  cross_dataset_join: Only if a verified graph path exists.
